name: Russian RU02 OGE p21 4.1.6 exact object binding review

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_oge_p021_4_1_6_exact_object_binding_review.py'
      - '.github/workflows/russian-ru02-orthoepy-oge-p021-4-1-6-exact-object-binding-review.yml'
  pull_request:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_oge_p021_4_1_6_exact_object_binding_review.py'
      - '.github/workflows/russian-ru02-orthoepy-oge-p021-4-1-6-exact-object-binding-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru02-oge-p021-4-1-6-exact-object-binding-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact review
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_oge_p021_4_1_6_exact_object_binding_review.py

      - name: Build exact review A
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_oge_p021_4_1_6_exact_object_binding_review.py --output /tmp/ru02-oge-p021-review-a.json > /tmp/ru02-oge-p021-review-a.txt

      - name: Build exact review B
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_oge_p021_4_1_6_exact_object_binding_review.py --output /tmp/ru02-oge-p021-review-b.json > /tmp/ru02-oge-p021-review-b.txt

      - name: Verify deterministic exact review
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/ru02-oge-p021-review-a.json /tmp/ru02-oge-p021-review-b.json
          diff -u /tmp/ru02-oge-p021-review-a.txt /tmp/ru02-oge-p021-review-b.txt

      - name: Verify fail-closed review boundary and evidence provenance
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/ru02-oge-p021-review-a.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/ru02-oge-p021-review-a.json').read_text(encoding='utf-8'))
          assert data['status'] == 'CENTRAL_BRAIN_RU02_OGE_P021_4_1_6_EXACT_OBJECT_BINDING_REVIEW_READY_FOR_SEPARATE_ACCEPTANCE_NOT_ACCEPTED'
          assert data['current_v28_exact_head_gate'] == {
              'workflow': 'Russian RU02 EDSOO59 p190 5.1 current exact acceptance',
              'run_id': 34600017223,
              'head_sha': 'f050dfa7ecf69e371839c6693f68b18928a2fef2',
              'conclusion': 'SUCCESS',
              'normalized_sha256': 'be4b747386c4dadd52b152b65fed60a9a76e585c6501a6080fd214025748eb8a',
          }
          target = data['selected_object']
          assert target['admission_unit_id'] == 'RAU-475d1c2a36040b45e190'
          assert target['requirement_id'] == 'RSK-OGE_COD-4-1-6-P021'
          assert target['source_id'] == 'FIPI-OGE-RU-2026-FINAL'
          assert target['document_id'] == 'OGE_COD'
          assert target['page'] == 21
          assert target['code'] == '4.1.6'
          assert target['source_locator'] == 'FIPI-OGE-RU-2026-FINAL/OGE_COD p.21 4.1.6'
          assert target['normalized_meaning'] == 'Применять нормативное произношение и ударение.'
          assert 'RU-PROG-02' in target['modules']
          assert 'oge' in target['routes']

          reuse = data['reuse_first_owner_resolution']
          assert reuse['resolution'] == 'EXACT_CURRENT_BOUNDED_RU02_COMPONENT_OWNERS_EXIST'
          assert reuse['canonical_component_refs'] == [
              'ru-orthoepy-normative-pronunciation-selection',
              'ru-orthoepy-normative-stress-selection',
          ]
          assert reuse['independent_evidence_items'] == 9
          assert reuse['components'][0]['independent_evidence_refs'] == [
              'p02-u4-v1', 'p02-u4-v2', 'p02-u4-v3', 'p02-u4-v4', 'p02-u4-v5',
          ]
          assert reuse['components'][1]['candidate_ref'] == 'candidate-018'
          assert reuse['components'][1]['independent_evidence_refs'] == [
              'p02-u3-v1', 'p02-u3-v2', 'p02-u3-v3', 'p02-u3-v4',
          ]
          assert reuse['missing_source_components'] == []
          assert reuse['overlapping_component_boundaries'] == []

          sibling = data['sibling_reuse_boundary']
          assert len(sibling['prior_accepted_siblings']) == 3
          assert sibling['prior_sibling_acceptance_auto_closes_target'] is False
          assert sibling['shared_component_owner_evidence_is_object_acceptance'] is False
          assert sibling['separate_exact_object_acceptance_required'] is True

          readiness = data['acceptance_readiness']
          assert readiness['exact_source_identity_verified'] is True
          assert readiness['target_is_sole_remaining_object_in_current_v28_group'] is True
          assert readiness['exact_current_component_owners_verified'] is True
          assert readiness['all_components_have_component_specific_independent_evidence'] is True
          assert readiness['source_backed_two_component_decomposition_verified'] is True
          assert readiness['separate_object_acceptance_required'] is True
          assert readiness['object_accepted_by_this_review'] is False

          policy = data['policy']
          assert policy['review_is_acceptance'] is False
          assert policy['title_route_task_keyword_fuzzy_or_embedding_inference_allowed'] is False
          assert policy['shared_sibling_evidence_can_auto_close_target'] is False
          assert policy['component_specific_independent_evidence_required'] is True
          assert policy['registered_user_identity_required_for_future_canonical_learner_evidence'] is True
          assert policy['exact_versioned_item_and_action_required_for_future_canonical_learner_evidence'] is True
          assert policy['server_owned_received_at_required_for_future_canonical_learner_evidence'] is True
          assert policy['durable_evidence_event_required_for_future_canonical_learner_evidence'] is True
          assert policy['anonymous_or_device_only_canonical_progress_allowed'] is False

          provenance = data['validation_provenance']
          assert provenance['target_identity_source'] == 'current_v28_single_remaining_group_member_plus_deterministic_object_review_queue'
          assert provenance['canonical_authority_file_mutated'] is False
          assert provenance['sibling_acceptance_inherited_by_target'] is False

          summary = data['summary']
          assert summary['semantic_admissions'] == 0
          assert summary['object_level_admission_units_closed'] == 0
          assert summary['object_level_requirements_closed'] == 0
          assert summary['exact_mastery_admissions'] == 0
          assert summary['false_exact_mastery_admissions'] == 0
          assert summary['current_subject_review_units_remaining'] == 1271
          assert summary['current_subject_review_requirements_remaining'] == 1346
          print('RU02_OGE_P021_EXACT_REVIEW_BOUNDARY=PASS')
          PY

      - name: Protect public and production surfaces in bounded wave
        shell: bash
        run: |
          set -euo pipefail
          wave_base='f050dfa7ecf69e371839c6693f68b18928a2fef2'
          git merge-base --is-ancestor "$wave_base" HEAD
          recent=$(git diff --name-only "$wave_base"..HEAD)
          allowed=$(cat <<'EOF'
          .github/workflows/russian-ru02-orthoepy-oge-p021-4-1-6-exact-object-binding-review.yml
          eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_oge_p021_4_1_6_exact_object_binding_review.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "$recent" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed '/^$/d' | sort -u))
          if [[ -n "$unexpected" ]]; then
            echo 'RU02 OGE p21 review wave touched files outside exact bounded allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$recent" | grep -E 'russkiy-knigi|(^|/)tilda|demo|scor'; then
            echo 'RU02 OGE p21 review wave touched a protected public/production surface.' >&2
            exit 1
          fi

      - name: Diff hygiene for exact bounded wave
        run: git diff --check f050dfa7ecf69e371839c6693f68b18928a2fef2..HEAD

      - name: Upload exact review evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru02-oge-p021-4-1-6-exact-object-binding-review
          path: |
            /tmp/ru02-oge-p021-review-a.json
            /tmp/ru02-oge-p021-review-a.txt
