name: TMP Russian Semantic Phase 2 Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-russian-phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and validate Russian Phase 2
        run: python eksamio-learning-engine/russian-program/semantic-registry/materialize_russian_semantic_phase2_v0_1.py --write
      - name: Validate generated state
        run: python eksamio-learning-engine/russian-program/semantic-registry/materialize_russian_semantic_phase2_v0_1.py
      - name: Diff hygiene
        run: git diff --check
      - name: Persist generated Phase 2 artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            eksamio-learning-engine/russian-program/RUSSIAN-FULL-SUBJECT-GAP-REGISTER-v1.2.json \
            eksamio-learning-engine/russian-program/semantic-registry/RUSSIAN-SEMANTIC-CANDIDATE-ADMISSION-LEDGER-v0.1.json \
            eksamio-learning-engine/russian-program/semantic-registry/RUSSIAN-SEMANTIC-REGISTRY-PROPOSAL-v0.1.json \
            eksamio-learning-engine/russian-program/semantic-registry/RUSSIAN-SEMANTIC-CANDIDATE-CROSSWALK-PROPOSAL-v0.1.json \
            eksamio-learning-engine/russian-program/semantic-registry/RUSSIAN-SEMANTIC-PHASE2-VALIDATION.txt
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Russian semantic Phase 2 proposal"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
