name: Biology live production audit

on:
  pull_request:
    paths:
      - production-audits/biologiya-live-audit.mjs
      - .github/workflows/biologiya-live-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biology-live-production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Audit published biology page
        env:
          AUDIT_OUT: /tmp/biologiya-live-audit
        run: node production-audits/biologiya-live-audit.mjs

      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biologiya-live-production-audit
          path: /tmp/biologiya-live-audit/**
          if-no-files-found: warn
          retention-days: 30
