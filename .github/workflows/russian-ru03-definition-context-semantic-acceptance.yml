name: Russian RU03 definition-context semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU03-DEFINITION-CONTEXT-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU03-DEFINITION-CONTEXT-CONTENT-ADEQUACY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU03-LEXIS-CANDIDATE-BOUNDARY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru03_definition_context_bounded_subject_semantics.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-03-DEFINITION-CONTEXT-MATCHING-WAVE-004-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - ".github/workflows/russian-ru03-definition-context-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru03-definition-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU03 definition-context acceptance validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru03_definition_context_bounded_subject_semantics.py
      - name: Validate bounded candidate-010 acceptance twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru03_definition_context_bounded_subject_semantics.py > /tmp/ru03-dcm-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru03_definition_context_bounded_subject_semantics.py > /tmp/ru03-dcm-b.txt
          diff -u /tmp/ru03-dcm-a.txt /tmp/ru03-dcm-b.txt
          cat /tmp/ru03-dcm-a.txt
      - name: Require fail-closed candidate-010 boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('eksamio-learning-engine/russian-program/subject-admission/RU03-DEFINITION-CONTEXT-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'CENTRAL_BRAIN_ACCEPTED_RU03_DEFINITION_CONTEXT_BOUNDED_SUBJECT_SEMANTIC'
          assert len(d['decisions']) == 1
          row = d['decisions'][0]
          assert row['candidate_ref'] == 'candidate-010'
          assert row['source_taxonomy_id'] == 'definition_context_matching'
          assert row['accepted_semantic_id'] == 'ru-lexis-definition-context-matching'
          assert row['source_evidence_status'] == 'confirmed'
          assert set(row['excluded_adjacent_candidate_refs']) == {'candidate-008','candidate-009','candidate-011','candidate-012','candidate-013','candidate-014','candidate-015'}
          s = d['summary']
          assert s['accepted_bounded_subject_semantics'] == 1
          assert s['adjacent_candidates_admitted'] == 0
          assert s['object_level_admission_units_closed'] == 0
          assert s['object_level_requirements_closed'] == 0
          assert s['false_exact_mastery_admissions'] == 0
          assert d['policy']['generic_task2_result_can_emit_exact_component_mastery'] is False
          assert d['policy']['component_specific_independent_evidence_required'] is True
          print('RU03_DEFINITION_CONTEXT_FAIL_CLOSED_GUARD=PASS')
          PY
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda or audited trainer source changed in RU03 definition-context acceptance.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
