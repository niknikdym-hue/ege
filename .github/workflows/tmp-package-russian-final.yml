name: Temporary package Russian v4.2 final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-package-russian-final.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create exact current folder zip
        run: zip -r ege-russkiy-demoversiya-2026-v4.2.zip ege-russkiy-demoversiya-2026-v4.2
      - uses: actions/upload-artifact@v4
        with:
          name: ege-russkiy-demoversiya-2026-v4.2-final
          path: ege-russkiy-demoversiya-2026-v4.2.zip
