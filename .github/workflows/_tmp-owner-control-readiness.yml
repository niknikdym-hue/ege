name: TEMP Owner Control launch readiness signal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-owner-control-readiness.yml'
      - 'eksamio-learning-engine/project-control/_tmp_owner_control_readiness_patch.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply readiness patch
        run: python3 eksamio-learning-engine/project-control/_tmp_owner_control_readiness_patch.py
      - name: Free validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest eksamio-learning-engine/tests/test_owner_agent_console.py
          python3 -m py_compile \
            eksamio-learning-engine/project-control/owner_agent_console.py \
            eksamio-learning-engine/project-control/owner_control_checkpoint.py \
            eksamio-learning-engine/project-control/owner_control_build.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/owner-agent-console-control.yml', aliases: true); puts 'CONTROL_YAML_PARSE=PASS'"
          rm -rf /tmp/owner-control-site
          python3 eksamio-learning-engine/project-control/owner_control_build.py \
            --source eksamio-learning-engine/project-control/owner-control.html \
            --destination /tmp/owner-control-site/index.html \
            --main-sha "$GITHUB_SHA"
          grep -q 'МОЖНО ЗАПУСКАТЬ' /tmp/owner-control-site/index.html
          grep -q 'НЕ ЗАПУСКАТЬ' /tmp/owner-control-site/index.html
          grep -q 'actions/runs?branch=' /tmp/owner-control-site/index.html
          grep -q 'data-command="start" disabled' /tmp/owner-control-site/index.html
          git diff --check -- eksamio-learning-engine/project-control/owner-control.html eksamio-learning-engine/tests/test_owner_agent_console.py
          echo 'OWNER_CONTROL_AUTONOMOUS_READINESS=PASS'
      - name: Commit validated panel and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add eksamio-learning-engine/project-control/owner-control.html \
            eksamio-learning-engine/tests/test_owner_agent_console.py
          git commit -m 'feat: show autonomous Owner Control launch readiness'
          git push origin HEAD:main
