name: Temporary Russian trainer coverage probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build probe
        run: python eksamio-learning-engine/_tmp_russian_trainer_coverage_probe.py
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: russian-trainer-coverage-probe
          path: eksamio-learning-engine/267-RUSSIAN-SCHOOL-TRAINER-COVERAGE-PROBE-v0.1.json
