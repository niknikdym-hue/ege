name: PEIS Service Bridge 001 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/peis-service-bridge-reference/**'
      - 'eksamio-learning-engine/tasks/PEIS-SERVICE-BRIDGE-001.md'
      - 'eksamio-learning-engine/peis-integration-reference/**'
      - 'eksamio-learning-engine/peis-persistence-reference/**'
      - 'eksamio-learning-engine/peis-reference-kernel/**'
      - 'eksamio-learning-engine/russian-program/verified-slices/**'
      - 'eksamio-learning-engine/russkiy-knigi/ege-russkiy-trenazher/**'
      - 'eksamio-learning-engine/277-EKSAMIO-LEARNER-EVIDENCE-EVENT-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/285-EKSAMIO-NEXT-BEST-ACTION-CONTRACT-v0.1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate PEIS-SERVICE-BRIDGE-001
        run: python eksamio-learning-engine/peis-service-bridge-reference/validate_peis_service_bridge_001.py
