name: Russian OGE 6.12 proper names source-bound frontier

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/250-RUSSIAN-SCHOOL-CANONICAL-PRIMARY-COMPLETENESS-WAVE-A4-CAPITALIZATION-v0.1.json"
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/277-RUSSIAN-SCHOOL-CURRENT-LAUNCH-REFREEZE-v1.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_12_proper_names_source_bound_frontier_review.py"
      - ".github/workflows/russian-oge-6-12-proper-names-source-bound-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-12-proper-names-source-bound-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source-bound reviewer
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_12_proper_names_source_bound_frontier_review.py
      - name: Build deterministic 6.12 frontier twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/build_oge_6_12_proper_names_source_bound_frontier_review.py" --output /tmp/oge-6-12-a.json > /tmp/oge-6-12-a.txt
          python3 "$root/build_oge_6_12_proper_names_source_bound_frontier_review.py" --output /tmp/oge-6-12-b.json > /tmp/oge-6-12-b.txt
          cmp /tmp/oge-6-12-a.json /tmp/oge-6-12-b.json
          diff -u /tmp/oge-6-12-a.txt /tmp/oge-6-12-b.txt
          cat /tmp/oge-6-12-a.txt
          grep -Fx 'OGE_6_12_PROPER_NAMES_SOURCE_BOUND_FRONTIER=PASS' /tmp/oge-6-12-a.txt
          grep -Fx 'OFFICIAL_ATOMIC_SOURCE_OBJECTS=1' /tmp/oge-6-12-a.txt
          grep -Fx 'OFFICIAL_EXPLICIT_SUBBRANCHES=0' /tmp/oge-6-12-a.txt
          grep -Fx 'CURRENT_ROUTE_REFS=0' /tmp/oge-6-12-a.txt
          grep -Fx 'REUSE_FIRST_CANDIDATE_REFS=11' /tmp/oge-6-12-a.txt
          grep -Fx 'EXPLICIT_REJECTED_NEARBY_CANONICALS=2' /tmp/oge-6-12-a.txt
          grep -Fx 'UNRESOLVED_HISTORICAL_PLACEHOLDERS=1' /tmp/oge-6-12-a.txt
          grep -Fx 'SCHOOL_REOPEN_REQUIRED=0' /tmp/oge-6-12-a.txt
          grep -Fx 'CURRENT_ROUTE_SUPERSESSION_REQUIRED_NOW=0' /tmp/oge-6-12-a.txt
          grep -Fx 'EXACT_OWNER_RESOLUTION_REQUIRED=1' /tmp/oge-6-12-a.txt
          grep -Fx 'EXACT_ROUTE_READY_NOW=0' /tmp/oge-6-12-a.txt
          grep -Fx 'SEMANTIC_ADMISSIONS=0' /tmp/oge-6-12-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/oge-6-12-a.txt
          grep -Fx 'NEW_SCHOOL_IDENTITIES=0' /tmp/oge-6-12-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/oge-6-12-a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/oge-6-12-a.txt
      - name: Upload source-bound frontier review
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-12-proper-names-source-bound-frontier
          path: /tmp/oge-6-12-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
