name: Temporary run Russian student copy cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-run-copy-cleanup.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply copy changes from prepared workflow script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-copy-cleanup-russian.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(src) if "python3 <<'PY'" in l)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          body=src[start:end]
          ind=min(len(x)-len(x.lstrip()) for x in body if x.strip())
          Path('/tmp/apply-copy.py').write_text('\n'.join(x[ind:] for x in body)+'\n',encoding='utf-8')
          PY
          python3 /tmp/apply-copy.py
      - name: Install browser test dependency
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Full regression gate
        working-directory: ege-russkiy-demoversiya-2026-v4.2
        run: |
          node test-russian-data.js
          node test-russian-v4.js
          python3 visual-contract-audit.py
          node test-russian-task27-v4.2.js
          node test-russian-task27-reset-guard.js
          python3 test-russian-task27-browser.py
          python3 test-browser.py
      - name: Commit student-facing cleanup
        run: |
          git config user.name "niknikdym-hue"
          git config user.email "niknikdym@gmail.com"
          git add ege-russkiy-demoversiya-2026-v4.2
          git commit -m "Simplify Russian demo student-facing copy"
          git push origin main
