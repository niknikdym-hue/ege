name: Temporary OCR Grade 8 remaining evidence

on:
  push:
    paths:
      - '.github/workflows/tmp-extract-drabkina8.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OCR selected exact-source pages
        run: |
          set -euo pipefail
          SRC='eksamio-learning-engine/russkiy-knigi/1400_Russkiy_yaz._8kl._Prakt._po_orfogr._Drabkina_2018_120s.pdf'
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus
          mkdir -p /tmp/dr8
          for p in $(seq 94 105) 121; do
            pdftoppm -f "$p" -l "$p" -singlefile -jpeg -r 240 "$SRC" "/tmp/dr8/p$p" >/dev/null 2>&1
            tesseract "/tmp/dr8/p$p.jpg" stdout -l rus --psm 6 2>/dev/null | sed "s/^/[PDF-$p] /"
          done
