name: Repair history demo 1.0.1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.history-v101-trigger'
      - 'production-audits/fix-history-v101.py'
      - '.github/workflows/history-v101-repair.yml'

permissions:
  contents: write

jobs:
  repair-history-demo:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Export official source text
        if: ${{ !hashFiles('history-build/history-demo-source.txt') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history-build
          pdftotext -layout \
            istoriya-source-2026/ege-2026-istoriya-demoversiya.pdf \
            history-build/history-demo-source.txt
          pdfinfo istoriya-source-2026/ege-2026-istoriya-demoversiya.pdf \
            > history-build/history-demo-pdfinfo.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add history-build/history-demo-source.txt history-build/history-demo-pdfinfo.txt
          git commit -m "Export official history criteria for repair"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install browser test dependencies
        if: ${{ hashFiles('production-audits/fix-history-v101.py') != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Repair and rebuild package
        if: ${{ hashFiles('production-audits/fix-history-v101.py') != '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('production-audits/fix-history-v101.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('19:"содержится в определении"','19:"содержаться в определении"')
          text=text.replace('assert "— / 42" in preview','assert "Официальный итог до экспертной проверки" in preview')
          text=text.replace("assert 'Официальные критерии ФИПИ' in txt","assert page.locator('.eh-result-task').count()==21")
          path.write_text(text,encoding='utf-8')
          PY
          python production-audits/fix-history-v101.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('ege-istoriya-demoversiya-v1')
          contract=json.loads((root/'ege-istoriya-demoversiya-PACKAGE-CONTRACT.json').read_text(encoding='utf-8'))
          blocks=sorted(root.glob('ege-istoriya-demoversiya-T123-*.txt'))
          assert len(blocks)==contract['t123_blocks']==len(contract['load_order'])
          assert max(p.stat().st_size for p in blocks)==contract['t123_max_bytes']<55000
          assert contract['package_version']=='1.0.1'
          PY
          unzip -t ege-istoriya-demoversiya-v1.0.1.zip

      - name: Commit verified repair
        if: ${{ hashFiles('production-audits/fix-history-v101.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .history-v101-trigger
          rm -f production-audits/fix-history-v101.py
          rm -rf history-build
          rm -f .github/workflows/history-v101-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix and verify history demo 1.0.1"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
