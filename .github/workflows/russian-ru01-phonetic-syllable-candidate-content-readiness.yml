name: Russian RU01 phonetic syllable candidate content readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SYLLABLE-WAVE-005-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_broad_header_owner_resolution_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_broad_header_candidate_content_gap_review.py"
      - ".github/workflows/russian-ru01-phonetic-syllable-candidate-content-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru01-syllable-candidate-content-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile syllable readiness gate
        run: |
          python -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py
          python -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_broad_header_candidate_content_gap_review.py

      - name: Validate dedicated syllable content twice
        run: |
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py > /tmp/ru01-syllable-a.txt
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py > /tmp/ru01-syllable-b.txt
          cmp /tmp/ru01-syllable-a.txt /tmp/ru01-syllable-b.txt
          cat /tmp/ru01-syllable-a.txt

      - name: Rebuild candidate content gap twice
        run: |
          python eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_broad_header_candidate_content_gap_review.py --output /tmp/ru01-gap-a.json
          python eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_broad_header_candidate_content_gap_review.py --output /tmp/ru01-gap-b.json
          cmp /tmp/ru01-gap-a.json /tmp/ru01-gap-b.json

      - name: Fail closed on exact syllable-only delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path('/tmp/ru01-gap-a.json').read_text(encoding='utf-8'))
          rows = {row['candidate_semantic_id']: row for row in d['candidates']}
          assert len(rows) == 6
          assert rows['ru-phonetics-syllable']['content_evidence_status'] == 'CONTENT_AND_EVIDENCE_PRESENT_REQUIRES_SEPARATE_ADEQUACY_REVIEW'
          for semantic_id, row in rows.items():
              if semantic_id == 'ru-phonetics-syllable':
                  continue
              assert row['content_evidence_status'] == 'NO_DEDICATED_CANDIDATE_CONTENT_FOUND'

          s = d['summary']
          assert s['proposed_owner_candidates'] == 6
          assert s['candidates_missing_dedicated_content'] == 5
          assert s['candidates_with_content_but_no_component_evidence'] == 0
          assert s['candidates_with_content_and_evidence_requiring_review'] == 1
          assert s['semantic_admissions'] == 0
          assert s['object_level_closures'] == 0
          assert s['exact_mastery_admissions'] == 0
          assert s['false_exact_mastery_admissions'] == 0

          guard = d['current_aggregate_guard']
          assert guard['semantic_units_with_accepted_component_sets'] == 41
          assert guard['subject_disposed_units_total'] == 42
          assert guard['subject_review_units_remaining'] == 1274
          assert guard['subject_review_requirements_remaining'] == 1349
          assert guard['canonical_component_refs_reused_unique'] == 122
          assert guard['accepted_bounded_ru_subject_semantics'] == 69
          assert guard['accepted_bounded_ru_semantics_total'] == 78
          assert guard['false_exact_mastery_admissions'] == 0

          print('RU01_SYLLABLE_CONTENT_DELTA_FAIL_CLOSED=PASS')
          print('READY_FOR_SEPARATE_ADEQUACY_REVIEW=ru-phonetics-syllable')
          print('REMAINING_CONTENT_GAPS=5')
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          PY

      - name: Protect tracked repository hygiene
        run: |
          git diff --check
          git diff --exit-code
