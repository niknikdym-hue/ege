name: Russian RU01 phonetic syllable candidate content readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SYLLABLE-WAVE-005-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py"
      - ".github/workflows/russian-ru01-phonetic-syllable-candidate-content-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru01-syllable-candidate-content-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile bounded syllable readiness gate
        run: |
          python -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py

      - name: Validate dedicated syllable content deterministically
        run: |
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py > /tmp/ru01-syllable-a.txt
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py > /tmp/ru01-syllable-b.txt
          cmp /tmp/ru01-syllable-a.txt /tmp/ru01-syllable-b.txt
          cat /tmp/ru01-syllable-a.txt

      - name: Fail closed on exact post-gap syllable-only delta
        run: |
          python - <<'PY'
          import subprocess

          prior = "07a93daf82b66f5357d8b3bac8b03522b8afa135"
          expected = {
              ".github/workflows/russian-ru01-phonetic-syllable-candidate-content-readiness.yml",
              "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SYLLABLE-WAVE-005-v0.1.json",
              "eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{prior}..HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed == expected, (changed, expected)

          content = "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SYLLABLE-WAVE-005-v0.1.json"
          blob = subprocess.check_output(["git", "hash-object", content], text=True).strip()
          assert blob == "24281db6ee3d5cea24656c1e5e0be9b787392a08", blob

          print("POST_GAP_DELTA=SYLLABLE_CONTENT_VALIDATOR_WORKFLOW_ONLY")
          print("SYLLABLE_CONTENT_BLOB=24281db6ee3d5cea24656c1e5e0be9b787392a08")
          print("SEMANTIC_ADMISSIONS=0")
          print("OBJECT_LEVEL_CLOSURES=0")
          print("FALSE_EXACT_MASTERY_ADMISSIONS=0")
          PY

      - name: Protect tracked repository hygiene
        run: |
          git diff --check
          git diff --exit-code
