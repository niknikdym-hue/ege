name: Temporary fix Russian copy cleanup workflow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-fix-copy-cleanup.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove invalid condition
        run: |
          sed -i "/^[[:space:]]*if: github.event.head_commit.message == /d" .github/workflows/tmp-copy-cleanup-russian.yml
          git config user.name "niknikdym-hue"
          git config user.email "niknikdym@gmail.com"
          git add .github/workflows/tmp-copy-cleanup-russian.yml
          git commit -m "Fix temporary Russian copy cleanup workflow"
          git push origin main
