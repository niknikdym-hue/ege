name: Optimize Profile Math 2026 T123 Packing
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-profile-math-2026-t123.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install pymupdf pillow selenium
      - name: Pack sequential T123 payloads efficiently
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          r=Path('ege-matematika-profil-demoversiya-2026');p=r.name;target=42500
          fs=list(r.glob(f'{p}-T123-*.txt'))
          fs.sort(key=lambda x:int(re.search(r'T123-(\d+)\.txt$',x.name).group(1)))
          assert len(fs)==117,len(fs)
          texts=[x.read_text(encoding='utf-8') for x in fs]
          groups=[];cur=[];size=0
          for text in texts:
              b=len(text.encode('utf-8'))
              extra=b+(1 if cur else 0)
              if cur and size+extra>target:
                  groups.append('\n'.join(cur));cur=[text];size=b
              else:
                  cur.append(text);size+=extra
          if cur:groups.append('\n'.join(cur))
          assert len(groups)==82,len(groups)
          assert max(len(x.encode('utf-8')) for x in groups)<42500
          for x in fs:x.unlink()
          names=[];sizes={}
          for i,text in enumerate(groups,1):
              name=f'{p}-T123-{i:02d}.txt';(r/name).write_text(text,encoding='utf-8');names.append(name);sizes[name]=len(text.encode('utf-8'))
          head=(r/f'{p}-HEAD.txt').read_text(encoding='utf-8');body='\n'.join((r/n).read_text(encoding='utf-8') for n in names)
          (r/f'{p}-PREVIEW.html').write_text('<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+head+'</head><body>'+body+'</body></html>',encoding='utf-8')
          inst=r/f'{p}-INSTALLATION.txt';s=inst.read_text(encoding='utf-8');before=s.split('ПОРЯДОК T123:')[0];before=re.sub(r'Создать \d+ блоков T123',f'Создать {len(names)} блоков T123',before);inst.write_text(before+'ПОРЯДОК T123:\n'+'\n'.join(names)+'\n',encoding='utf-8')
          be=r/f'{p}-BUILD-EVIDENCE.json';d=json.loads(be.read_text(encoding='utf-8'));d['t123_blocks']=len(names);d['t123_max_bytes']=max(sizes.values());d['t123_sizes']=sizes;d['t123_packing']='PASS — sequential payload packing without content changes';be.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          ar=r/'AUDIT-REPORT-2026-profile.md';a=ar.read_text(encoding='utf-8');a+='\n- T123 packing: 82 блока, максимум '+str(max(sizes.values()))+' байт; порядок payload сохранён.\n';ar.write_text(a,encoding='utf-8')
          print('PACK PASS',len(names),max(sizes.values()))
          PY
      - name: Repack candidate
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('ege-matematika-profil-demoversiya-2026/scripts/build_profile_2026.py');s=importlib.util.spec_from_file_location('b',p);b=importlib.util.module_from_spec(s);s.loader.exec_module(b);print(b.manifest_zip())
          PY
      - name: Serve optimized source preview
        run: |
          cd ege-matematika-profil-demoversiya-2026
          python -m http.server 8765 >/tmp/profile-opt-http.log 2>&1 &
          sleep 2
      - name: Browser gate — optimized source
        env:
          EKSAMIO_PREVIEW_URL: http://127.0.0.1:8765/ege-matematika-profil-demoversiya-2026-PREVIEW.html
          EKSAMIO_EVIDENCE_OUT: ege-matematika-profil-demoversiya-2026/tests/evidence/profile-2026-optimized-browser-evidence.json
        run: python ege-matematika-profil-demoversiya-2026/tests/test_profile_2026.py
      - name: Extract optimized ZIP
        run: |
          rm -rf /tmp/profile-opt-final && mkdir -p /tmp/profile-opt-final
          unzip -q ege-matematika-profil-demoversiya-2026-v1.0.zip -d /tmp/profile-opt-final
          cd /tmp/profile-opt-final/ege-matematika-profil-demoversiya-2026
          python -m http.server 8766 >/tmp/profile-opt-final-http.log 2>&1 &
          sleep 2
      - name: Browser gate — optimized extracted ZIP
        env:
          EKSAMIO_PREVIEW_URL: http://127.0.0.1:8766/ege-matematika-profil-demoversiya-2026-PREVIEW.html
          EKSAMIO_EVIDENCE_OUT: ege-matematika-profil-demoversiya-2026/tests/evidence/profile-2026-optimized-final-zip-browser-evidence.json
        run: python ege-matematika-profil-demoversiya-2026/tests/test_profile_2026.py
      - name: Finalize optimized evidence and ZIP
        run: |
          python - <<'PY'
          import importlib.util,json,zipfile
          from pathlib import Path
          r=Path('ege-matematika-profil-demoversiya-2026');p=r.name
          st=r/f'{p}-PAGE-STATUS.txt';s=st.read_text(encoding='utf-8');s=s.replace('TILDA_SIZE_GATE: PASS — every T123 < 45000 bytes','TILDA_SIZE_GATE: PASS — 82 T123; every block < 42500 bytes');s=s.replace('CLEAN_ZIP_BROWSER_GATE: PASS — extracted ZIP repeated full 55/55 browser gate','CLEAN_ZIP_BROWSER_GATE: PASS — optimized extracted ZIP repeated full 55/55 browser gate');st.write_text(s,encoding='utf-8')
          be=r/f'{p}-BUILD-EVIDENCE.json';d=json.loads(be.read_text(encoding='utf-8'));d['optimized_source_browser_gate']='55/55 PASS';d['optimized_clean_zip_browser_gate']='55/55 PASS';be.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          script=r/'scripts/build_profile_2026.py';sp=importlib.util.spec_from_file_location('b',script);b=importlib.util.module_from_spec(sp);sp.loader.exec_module(b);out=b.manifest_zip()
          with zipfile.ZipFile(out) as z:
              base=r.name+'/';names=set(z.namelist())
              t=[n for n in names if n.startswith(base+p+'-T123-') and n.endswith('.txt')];assert len(t)==82,len(t)
              assert base+'tests/evidence/profile-2026-optimized-browser-evidence.json' in names
              assert base+'tests/evidence/profile-2026-optimized-final-zip-browser-evidence.json' in names
          print('OPTIMIZED FINAL ZIP PASS',out)
          PY
      - name: Commit optimized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize profile mathematics 2026 v1.0 T123 packing'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: ege-matematika-profil-demoversiya-2026-v1.0-optimized
          path: ege-matematika-profil-demoversiya-2026-v1.0.zip
          retention-days: 7
