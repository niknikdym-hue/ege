name: Build and validate base mathematics 2026 content maps

on:
  push:
    branches: [main]
    paths:
      - ege-matematika-baza-demoversiya-2026/content/**
      - ege-matematika-baza-demoversiya-2026/scripts/build_task_map.py
      - ege-matematika-baza-demoversiya-2026/scripts/build_acceptance_cases.py
      - .github/workflows/math-base-2026-build-task-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build task map
        id: build
        continue-on-error: true
        run: |
          python ege-matematika-baza-demoversiya-2026/scripts/build_task_map.py > math-base-content-build.log 2>&1
          python ege-matematika-baza-demoversiya-2026/scripts/build_acceptance_cases.py >> math-base-content-build.log 2>&1
      - name: Save build diagnostic on failure
        if: steps.build.outcome == 'failure'
        run: |
          cat math-base-content-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-base-content-build.log
          git commit -m 'Record base mathematics content-map build diagnostic' || true
          git push origin HEAD:main
          exit 1
      - name: Validate generated JSON
        if: steps.build.outcome == 'success'
        run: |
          python -m json.tool ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-TASK-MAP.json >/dev/null
          python -m json.tool ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-TASK-MAP-BUILD-EVIDENCE.json >/dev/null
          python -m json.tool ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-ACCEPTANCE-CASES.json >/dev/null
      - name: Commit generated maps and evidence
        if: steps.build.outcome == 'success'
        run: |
          rm -f math-base-task-map-build.log math-base-content-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || { git commit -m 'Build base mathematics 2026 content maps'; git push origin HEAD:main; }
