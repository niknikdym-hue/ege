name: Build and validate base mathematics 2026 task map

on:
  push:
    branches: [main]
    paths:
      - ege-matematika-baza-demoversiya-2026/content/**
      - ege-matematika-baza-demoversiya-2026/scripts/build_task_map.py
      - .github/workflows/math-base-2026-build-task-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build task map
        run: python ege-matematika-baza-demoversiya-2026/scripts/build_task_map.py
      - name: Validate generated JSON
        run: |
          python -m json.tool ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-TASK-MAP.json >/dev/null
          python -m json.tool ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-TASK-MAP-BUILD-EVIDENCE.json >/dev/null
      - name: Commit generated map and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-TASK-MAP.json \
                  ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-TASK-MAP-BUILD-EVIDENCE.json
          git diff --cached --quiet || { git commit -m 'Build base mathematics 2026 task map'; git push origin HEAD:main; }
