name: SEP1 Tutor multi-provider failover

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/ai-tutor-reference/**'
      - '.github/workflows/sep1-tutor-multi-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sep1-tutor-multi-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove provider secrets are absent in CI
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${QWEN_API_KEY:-}"
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DEEPSEEK_API_KEY:-}"
          test -z "${YANDEX_AI_STUDIO_API_KEY:-}"
          test -z "${YANDEX_SPEECHKIT_API_KEY:-}"
          echo 'LIVE_PROVIDER_SECRETS_IN_CI=0'

      - name: Compile Tutor provider boundaries and test surfaces
        run: |
          python -m py_compile \
            eksamio-learning-engine/ai-tutor-reference/accepted_russian_semantic_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/validate_accepted_russian_semantic_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/tutor_provider_prompt.py \
            eksamio-learning-engine/ai-tutor-reference/openai_live_adapter.py \
            eksamio-learning-engine/ai-tutor-reference/openai_compatible_chat_adapter.py \
            eksamio-learning-engine/ai-tutor-reference/qwen_secret_provider.py \
            eksamio-learning-engine/ai-tutor-reference/qwen_live_adapter.py \
            eksamio-learning-engine/ai-tutor-reference/deepseek_secret_provider.py \
            eksamio-learning-engine/ai-tutor-reference/deepseek_live_adapter.py \
            eksamio-learning-engine/ai-tutor-reference/yandex_ai_secret_provider.py \
            eksamio-learning-engine/ai-tutor-reference/yandex_alice_live_adapter.py \
            eksamio-learning-engine/ai-tutor-reference/yandex_live_adapters.py \
            eksamio-learning-engine/ai-tutor-reference/yandex_speechkit_v3_tts.py \
            eksamio-learning-engine/ai-tutor-reference/stdlib_speechkit_transport.py \
            eksamio-learning-engine/ai-tutor-reference/resilient_voice_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/private_provider_config.py \
            eksamio-learning-engine/ai-tutor-reference/configure_private_provider_config.py \
            eksamio-learning-engine/ai-tutor-reference/provider_live_preflight.py \
            eksamio-learning-engine/ai-tutor-reference/private_staging_multi_provider_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/private_staging_four_brain_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/private_multi_provider_tutor_test_ui.py \
            eksamio-learning-engine/ai-tutor-reference/private_four_brain_tutor_test_ui.py \
            eksamio-learning-engine/ai-tutor-reference/private_four_brain_blind_test_ui.py \
            eksamio-learning-engine/ai-tutor-reference/reveal_blind_tutor_mapping.py \
            eksamio-learning-engine/ai-tutor-reference/private_multi_provider_tutor_live_test_candidate.py \
            eksamio-learning-engine/ai-tutor-reference/live_brain_provider_smoke.py \
            eksamio-learning-engine/ai-tutor-reference/validate_private_live_test_launcher.py \
            eksamio-learning-engine/ai-tutor-reference/validate_private_live_test_evidence.py \
            eksamio-learning-engine/ai-tutor-reference/validate_provider_api_contracts.py \
            eksamio-learning-engine/ai-tutor-reference/validate_multi_provider_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/validate_four_brain_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/validate_brain_reasoning_contracts.py \
            eksamio-learning-engine/ai-tutor-reference/validate_four_brain_test_prep.py \
            eksamio-learning-engine/ai-tutor-reference/validate_blind_four_brain_test.py \
            eksamio-learning-engine/ai-tutor-reference/validate_private_tutor_runtime_gate.py

      - name: Validate canonical Russian Tutor semantic denominator
        run: python eksamio-learning-engine/ai-tutor-reference/validate_accepted_russian_semantic_tutor.py

      - name: Validate existing provider API contracts
        run: python eksamio-learning-engine/ai-tutor-reference/validate_provider_api_contracts.py

      - name: Preserve OpenAI Qwen Yandex baseline
        run: python eksamio-learning-engine/ai-tutor-reference/validate_multi_provider_tutor.py

      - name: Validate OpenAI Qwen DeepSeek Alice text voice and failover
        run: python eksamio-learning-engine/ai-tutor-reference/validate_four_brain_tutor.py

      - name: Validate explicit Qwen and DeepSeek reasoning contracts
        run: python eksamio-learning-engine/ai-tutor-reference/validate_brain_reasoning_contracts.py

      - name: Validate zero-call local provider preflight
        run: python eksamio-learning-engine/ai-tutor-reference/provider_live_preflight.py

      - name: Validate four-brain human-test launch preparation
        run: python eksamio-learning-engine/ai-tutor-reference/validate_four_brain_test_prep.py

      - name: Validate blind A-B-C-D comparison boundaries
        run: python eksamio-learning-engine/ai-tutor-reference/validate_blind_four_brain_test.py

      - name: Validate exact-build runtime gate for all live launchers
        run: python eksamio-learning-engine/ai-tutor-reference/validate_private_tutor_runtime_gate.py

      - name: Validate reliability gateway
        run: python eksamio-learning-engine/ai-tutor-reference/validate_ai_tutor_reliability_gateway_001.py

      - name: Validate transient circuit repair
        run: python eksamio-learning-engine/ai-tutor-reference/validate_ai_tutor_reliability_circuit_repair_001.py

      - name: Preserve existing OpenAI plus Yandex staging boundary
        run: python eksamio-learning-engine/ai-tutor-reference/validate_openai_yandex_private_staging_tutor.py

      - name: Validate metadata-only private live-test evidence
        run: python eksamio-learning-engine/ai-tutor-reference/validate_private_live_test_evidence.py

      - name: Validate original standalone macOS private live-test launcher
        run: python eksamio-learning-engine/ai-tutor-reference/validate_private_live_test_launcher.py

      - name: Prove four-brain UI cannot start without owner gate
        shell: bash
        run: |
          set -euo pipefail
          if python eksamio-learning-engine/ai-tutor-reference/private_four_brain_tutor_test_ui.py --max-turns 20 --no-browser; then
            echo 'ERROR: four-brain UI started without owner authorization'
            exit 1
          fi
          echo 'PRIVATE_FOUR_BRAIN_UI_OWNER_GATE=PASS'

      - name: Prove blind comparison cannot start without owner gate
        shell: bash
        run: |
          set -euo pipefail
          if python eksamio-learning-engine/ai-tutor-reference/private_four_brain_blind_test_ui.py --max-turns 20 --no-browser; then
            echo 'ERROR: blind UI started without owner authorization'
            exit 1
          fi
          echo 'PRIVATE_BLIND_FOUR_BRAIN_UI_OWNER_GATE=PASS'

      - name: Prove controlled failover requires locked AUTO route
        shell: bash
        run: |
          set -euo pipefail
          if python eksamio-learning-engine/ai-tutor-reference/private_four_brain_tutor_test_ui.py --owner-authorized --simulate-unavailable openai --default-provider openai --no-browser; then
            echo 'ERROR: simulated failover accepted a non-AUTO default'
            exit 1
          fi
          echo 'CONTROLLED_FAILOVER_AUTO_GATE=PASS'

      - name: Prove live provider smoke cannot start without owner gate
        shell: bash
        run: |
          set -euo pipefail
          if python eksamio-learning-engine/ai-tutor-reference/live_brain_provider_smoke.py --provider all; then
            echo 'ERROR: live smoke started without owner authorization'
            exit 1
          fi
          echo 'LIVE_PROVIDER_SMOKE_OWNER_GATE=PASS'

      - name: Whitespace gate across complete PR diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            git diff --check FETCH_HEAD...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
