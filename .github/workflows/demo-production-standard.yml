name: Demo production standard

on:
  pull_request:
    paths:
      - demo-production-standard/**
      - production-audits/**
      - ege-demoversii-T123.txt
      - .github/workflows/demo-production-standard.yml
  push:
    branches:
      - main
      - standard/new-demo-production-system
    paths:
      - demo-production-standard/**
      - production-audits/**
      - ege-demoversii-T123.txt
      - .github/workflows/demo-production-standard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-standard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile production scripts
        run: |
          python -m py_compile \
            demo-production-standard/scripts/validate_demo_package.py \
            demo-production-standard/scripts/build_demo_release.py
          rm -rf demo-production-standard/scripts/__pycache__

      - name: Validate JSON templates
        run: |
          for file in demo-production-standard/templates/*.json; do
            python -m json.tool "$file" >/dev/null
          done

      - name: Run validator self-test
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python demo-production-standard/scripts/validate_demo_package.py --self-test

      - name: Check builder command
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python demo-production-standard/scripts/build_demo_release.py --help >/dev/null

      - name: Reject temporary files
        run: |
          ! find demo-production-standard -type d -name __pycache__ | grep -q .
          ! find demo-production-standard -type f \( -name '*.pyc' -o -name '*.log' -o -name '*.tmp' \) | grep -q .

  chemistry-live-production-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Audit published chemistry page
        env:
          AUDIT_OUT: /tmp/khimiya-live-audit
        run: node production-audits/khimiya-live-audit.mjs

      - name: Upload audit report and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: khimiya-live-production-audit
          path: /tmp/khimiya-live-audit/**
          if-no-files-found: error
          retention-days: 30

  cleanup-ege-demoversii-copy:
    if: github.event_name == 'pull_request' && github.head_ref == 'edit/ege-demoversii-copy-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply copy cleanup
        run: |
          if [ -f production-audits/update-ege-demoversii-copy.py ]; then
            python production-audits/update-ege-demoversii-copy.py
          fi

      - name: Commit cleaned copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A ege-demoversii-T123.txt production-audits/update-ege-demoversii-copy.py
          if ! git diff --cached --quiet; then
            git commit -m "Clean up EGE demos page copy"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
