name: Canonical mathematics 2026 source preprocessing

on:
  push:
    branches: [main]
    paths:
      - matematika-source-2026/scripts/build_canonical_printed_pages.py
      - matematika-source-2026/scripts/validate_canonical_printed_pages.py
      - .github/workflows/math-2026-canonical-preprocessing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install --quiet pymupdf pillow
      - name: Build and validate canonical source pages
        id: run
        continue-on-error: true
        run: |
          python matematika-source-2026/scripts/build_canonical_printed_pages.py > math-2026-canonical-preprocessing.log 2>&1
          python matematika-source-2026/scripts/validate_canonical_printed_pages.py >> math-2026-canonical-preprocessing.log 2>&1
      - name: Save diagnostic on failure
        if: steps.run.outcome == 'failure'
        run: |
          cat math-2026-canonical-preprocessing.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-2026-canonical-preprocessing.log
          git commit -m 'Record mathematics 2026 canonical preprocessing diagnostic' || true
          git push origin HEAD:main
          exit 1
      - name: Commit canonical outputs
        if: steps.run.outcome == 'success'
        run: |
          rm -f math-2026-canonical-preprocessing.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matematika-source-2026/canonical-printed-pages \
                  ege-matematika-baza-demoversiya-2026/source-diagnostics/canonical-coordinates \
                  ege-matematika-baza-demoversiya-2026/source-evidence/printed-pages
          git diff --cached --quiet || { git commit -m 'Rebuild mathematics 2026 canonical printed-page sources'; git push origin HEAD:main; }
