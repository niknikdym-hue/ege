name: Russian RU03 phraseologism-identification content adequacy

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU03-PHRASEOLOGISM-IDENTIFICATION-CONTENT-ADEQUACY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU03-LEXIS-CANDIDATE-BOUNDARY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru03_phraseologism_identification_content_adequacy.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-03-PHRASEOLOGISM-IDENTIFICATION-WAVE-007-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-03-LEXIS-PARONYMS-PHRASEOLOGY-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - ".github/workflows/russian-ru03-phraseologism-identification-content-adequacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru03-phraseologism-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile candidate-014 content validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru03_phraseologism_identification_content_adequacy.py
      - name: Validate exact candidate-014 content twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_ru03_phraseologism_identification_content_adequacy.py" > /tmp/ru03-ph-content-a.txt
          python3 "$root/validate_ru03_phraseologism_identification_content_adequacy.py" > /tmp/ru03-ph-content-b.txt
          diff -u /tmp/ru03-ph-content-a.txt /tmp/ru03-ph-content-b.txt
          cat /tmp/ru03-ph-content-a.txt
      - name: Require fail-closed content review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('eksamio-learning-engine/russian-program/subject-admission/RU03-PHRASEOLOGISM-IDENTIFICATION-CONTENT-ADEQUACY-REVIEW-v0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'CENTRAL_BRAIN_RU03_PHRASEOLOGISM_IDENTIFICATION_CONTENT_ADEQUACY_REVIEW_COMPLETE_NO_ADMISSION'
          assert d['source_identity']['candidate_ref'] == 'candidate-014'
          assert d['source_identity']['source_taxonomy_id'] == 'phraseologism_identification'
          assert d['source_identity']['skill_graph_evidence_status'] == 'confirmed'
          assert d['reuse_first_result']['existing_content_reused_as_exact_candidate_unit'] is False
          r = d['review_decision']
          assert r['content_exact_for_candidate_014'] is True
          assert r['content_duplicate_of_existing_ru03_unit'] is False
          assert r['semantic_admission_by_this_review'] is False
          assert r['object_level_admission_units_closed'] == 0
          assert r['object_level_requirements_closed'] == 0
          assert r['false_exact_mastery_admissions'] == 0
          assert r['next_status'] == 'READY_FOR_SEPARATE_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE'
          print('RU03_PHRASEOLOGISM_CONTENT_FAIL_CLOSED_GUARD=PASS')
          PY
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda or audited trainer source changed in RU03 phraseologism content review.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
