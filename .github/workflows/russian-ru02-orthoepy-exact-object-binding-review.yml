name: Russian RU02 orthoepy exact object binding review

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_exact_object_binding_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/RU02-NORMATIVE-STRESS-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU02-NORMATIVE-PRONUNCIATION-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU02-NORMATIVE-PRONUNCIATION-OWNER-RESOLUTION-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-02-ORTHOEPY-NORMATIVE-STRESS-WAVE-003-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-02-ORTHOEPY-NORMATIVE-PRONUNCIATION-WAVE-004-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v2.py"
      - ".github/workflows/russian-ru02-orthoepy-exact-object-binding-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-object-binding-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild exact RU02 review deterministically
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          builder="$root/build_ru02_orthoepy_exact_object_binding_review.py"
          python3 -m py_compile "$builder"
          python3 "$builder" --output /tmp/ru02-review-a.json > /tmp/ru02-report-a.txt
          python3 "$builder" --output /tmp/ru02-review-b.json > /tmp/ru02-report-b.txt
          cmp /tmp/ru02-review-a.json /tmp/ru02-review-b.json
          diff -u /tmp/ru02-report-a.txt /tmp/ru02-report-b.txt
          cat /tmp/ru02-report-a.txt

      - name: Verify exact two-component decomposition and unchanged current-v2 aggregate
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current_v2.py" --output /tmp/current-v2.json >/tmp/current-v2.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          review=json.loads(Path('/tmp/ru02-review-a.json').read_text(encoding='utf-8'))
          current=json.loads(Path('/tmp/current-v2.json').read_text(encoding='utf-8'))
          s=review['summary']; cs=current['progress_summary']

          assert review['status']=='CENTRAL_BRAIN_RU02_ORTHOEPY_EXACT_OBJECT_BINDING_REVIEW_READY_FOR_SEPARATE_ACCEPTANCE_NOT_ACCEPTED'
          assert review['current_launch_progress_sha256']=='f25202c09baf0452fce2392726ddb02ce8a17dd111851f25f58e5334e873a4c7'
          obj=review['selected_object']
          assert obj=={
              'admission_unit_id':'RAU-a8f2ad0b357c9e369c51',
              'requirement_id':'RSK-EDSOO1011-2-2-4-P074',
              'packet_group':'RUS-SEM-REVIEW-047',
              'source_id':'EDSOO-RU-10-11-BASIC-2025',
              'document_id':'EDSOO1011',
              'page':74,
              'code':'2.2.4',
              'source_locator':'EDSOO-RU-10-11-BASIC-2025/EDSOO1011 p.74 2.2.4',
              'module_id':'RU-PROG-02',
              'normalized_meaning':'Применять нормативное произношение и ударение.',
          }

          decomposition=review['source_backed_exact_component_decomposition']
          assert decomposition['relation']=='EXPLICIT_COORDINATED_COMPONENTS'
          assert decomposition['exact_component_refs']==[
              'ru-orthoepy-normative-pronunciation-selection',
              'ru-orthoepy-normative-stress-selection',
          ]
          assert decomposition['component_count']==2
          assert decomposition['independent_evidence_items']==9
          assert decomposition['missing_source_components']==[]
          assert decomposition['overlapping_component_boundaries']==[]
          assert decomposition['components'][0]['independent_evidence_refs']==['p02-u4-v1','p02-u4-v2','p02-u4-v3','p02-u4-v4','p02-u4-v5']
          assert decomposition['components'][1]['independent_evidence_refs']==['p02-u3-v1','p02-u3-v2','p02-u3-v3','p02-u3-v4']

          readiness=review['acceptance_readiness']
          assert readiness['exact_source_identity_verified'] is True
          assert readiness['target_still_in_current_v2_remainder'] is True
          assert readiness['all_source_components_have_independently_accepted_semantic_owners'] is True
          assert readiness['all_components_have_component_specific_independent_evidence'] is True
          assert readiness['separate_object_acceptance_required'] is True
          assert readiness['object_accepted_by_this_review'] is False

          assert s['reviewed_admission_units']==1 and s['reviewed_requirements']==1
          assert s['exact_component_set_ready_units']==1 and s['exact_component_set_ready_requirements']==1
          assert s['exact_component_refs']==2 and s['independent_evidence_items']==9
          assert s['object_level_admission_units_closed']==0 and s['object_level_requirements_closed']==0
          assert s['new_school_canonical_identities']==0 and s['new_ru_semantic_identities']==0
          assert s['false_exact_mastery_admissions']==0
          assert s['current_subject_review_units_remaining']==1287
          assert s['current_subject_review_requirements_remaining']==1362

          policy=review['policy']
          assert policy['review_is_acceptance'] is False
          assert policy['review_can_reduce_object_counts'] is False
          assert policy['review_can_create_school_identity'] is False
          assert policy['review_can_create_ru_semantic_identity'] is False
          assert policy['task_module_route_title_keyword_fuzzy_or_embedding_inference_allowed'] is False
          assert policy['generic_orthoepy_attempt_can_emit_exact_component_mastery'] is False
          assert policy['stress_evidence_can_substitute_for_pronunciation'] is False
          assert policy['pronunciation_evidence_can_substitute_for_stress'] is False
          assert policy['component_specific_independent_evidence_required'] is True

          assert current['normalized_sha256']=='f25202c09baf0452fce2392726ddb02ce8a17dd111851f25f58e5334e873a4c7'
          assert len(current['accepted_authorities'])==49
          assert cs['semantic_units_with_accepted_component_sets']==28
          assert cs['semantic_requirements_with_accepted_component_sets']==28
          assert cs['subject_disposed_units_total']==29
          assert cs['subject_disposed_requirements_total']==29
          assert cs['subject_review_units_remaining']==1287
          assert cs['subject_review_requirements_remaining']==1362
          assert cs['false_exact_mastery_admissions']==0

          print('RU02_EXACT_COMPONENT_SET_READY_UNITS=1')
          print('RU02_EXACT_COMPONENT_SET_REFS=2')
          print('RU02_INDEPENDENT_COMPONENT_EVIDENCE_ITEMS=9')
          print('RU02_OBJECT_CLOSURES_BY_REVIEW=0')
          print('RUSSIAN_CURRENT_V2_AGGREGATE_UNCHANGED=PASS')
          print('RU02_ORTHOEPY_EXACT_OBJECT_BINDING_REVIEW_GATE=PASS')
          PY

      - name: Upload RU02 exact binding review
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru02-orthoepy-exact-object-binding-review
          path: /tmp/ru02-review-a.json
          if-no-files-found: error
          retention-days: 14

      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
