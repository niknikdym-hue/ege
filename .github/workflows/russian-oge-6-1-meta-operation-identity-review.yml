name: Russian OGE 6.1 meta-operation identity review

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_subject_accounting_complete.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_packet.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_1_meta_operation_identity_review.py"
      - ".github/workflows/russian-oge-6-1-meta-operation-identity-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta-operation-identity-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive exact OGE 6.1 source object and packet identity twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_oge_6_1_meta_operation_identity_review.py"
          python3 "$root/build_oge_6_1_meta_operation_identity_review.py" --output /tmp/oge61-a.json > /tmp/oge61-a.txt
          python3 "$root/build_oge_6_1_meta_operation_identity_review.py" --output /tmp/oge61-b.json > /tmp/oge61-b.txt
          cmp /tmp/oge61-a.json /tmp/oge61-b.json
          diff -u /tmp/oge61-a.txt /tmp/oge61-b.txt
          cat /tmp/oge61-a.txt
      - name: Verify ownerless meta-operation no-admission boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/oge61-a.json').read_text(encoding='utf-8'))
          o=d['official_object']
          route=d['official_route_authority']
          progress=d['current_progress_review']
          boundary=d['decision_boundary']
          safety=d['safety']
          assert d['schema_version']=='0.1.0'
          assert d['status']=='OGE_6_1_META_OPERATION_IDENTITY_BOUND_NO_SEMANTIC_ADMISSION'
          assert o['source_id']=='FIPI-OGE-RU-2026-FINAL'
          assert o['document_id']=='OGE_COD'
          assert o['content_code']=='6.1'
          assert o['accounting_disposition']=='PARTIAL_OR_COMPOSITE'
          assert o['admission_unit_id']
          assert o['requirement_id']
          assert o['packet_group'].startswith('RUS-SEM-REVIEW-')
          assert route['overlay_topic']=='concept of orthogram / orthographic analysis premise'
          assert route['overlay_classification']=='EXAM_ONLY_COMPOSITE'
          assert route['overlay_note']=='Meta-operation over rules; not a new spelling identity.'
          assert route['overlay_owner_refs']==[]
          assert route['inventory_audit_classification']=='EXAM_ROUTE_ONLY'
          assert route['inventory_current_semantic_refs']==[]
          assert route['inventory_candidate_canonical_owner'] is None
          assert progress['accepted_authorities_before_review']==48
          assert progress['accepted_units_before_review']==28
          assert progress['accepted_requirements_before_review']==28
          assert progress['target_object_bound_acceptance_rows']==0
          assert progress['target_already_object_bound'] is False
          assert progress['aggregate_delta_now']==0
          assert boundary['canonical_component_set_supported_by_current_inventory'] is False
          assert boundary['new_school_identity_supported'] is False
          assert boundary['new_school_identity_allowed_by_this_review'] is False
          assert boundary['bounded_meta_operation_or_route_disposition_requires_separate_decision'] is True
          assert boundary['object_closures_now']==0
          assert boundary['semantic_admissions_now']==0
          assert boundary['exact_component_mastery_admissions_now']==0
          assert safety['false_exact_mastery_admissions']==0
          assert safety['learner_audio_persistence']==0
          assert safety['school_denominator_effect']==0
          assert safety['accepted_demo_or_scorer_change'] is False
          assert safety['tilda_change'] is False
          assert safety['production_peis_write'] is False
          assert safety['provider_execution'] is False
          assert safety['public_traffic'] is False
          assert safety['real_payment_or_refund'] is False
          assert safety['real_message_delivery'] is False
          print('OGE_6_1_OBJECT_IDENTITY_UNIQUE=1')
          print('OGE_6_1_CURRENT_SEMANTIC_REFS=0')
          print('OGE_6_1_TARGET_ALREADY_OBJECT_BOUND=0')
          print('OGE_6_1_AGGREGATE_DELTA_NOW=0')
          print('OGE_6_1_NEW_SCHOOL_IDENTITY_SUPPORTED=0')
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          print('LEARNER_AUDIO_PERSISTENCE=0')
          print('RUSSIAN_OGE_6_1_META_OPERATION_IDENTITY_GUARD=PASS')
          print('NORMALIZED_SHA256='+d['normalized_sha256'])
          PY
      - name: Upload OGE 6.1 meta-operation review
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-1-meta-operation-identity-review
          path: /tmp/oge61-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          pr_head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "origin/${{ github.base_ref }}...$pr_head" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Exact PR-head diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          pr_head="${{ github.event.pull_request.head.sha }}"
          git diff --check "origin/${{ github.base_ref }}...$pr_head"
