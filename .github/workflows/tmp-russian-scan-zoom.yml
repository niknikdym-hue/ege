name: Temporary Russian essay scan zoom
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-russian-scan-zoom.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add scan image zoom
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib,re
          base=Path('ege-russkiy-demoversiya-2026-v4.2')
          p=base/'ege-russkiy-demoversiya-T123-06.txt'
          s=p.read_text(encoding='utf-8')
          old_css='''#ege-demo-2026 .edemo-scan-preview img{display:block;max-width:100%;max-height:420px;object-fit:contain}\\
#ege-demo-2026 .edemo-transfer-text'''
          new_css='''#ege-demo-2026 .edemo-scan-preview img{display:block;max-width:100%;max-height:420px;object-fit:contain}\\
#ege-demo-2026 .edemo-scan-open{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;font:inherit;cursor:zoom-in}\\
#ege-demo-2026 .edemo-scan-open img{margin:0 auto}\\
#ege-demo-2026 .edemo-scan-open span{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#315fb5}\\
#edemo-scan-lightbox{position:fixed;inset:0;z-index:100000;background:rgba(11,20,32,.88);display:flex;align-items:center;justify-content:center;padding:16px}\\
#edemo-scan-lightbox .edemo-scan-dialog{width:min(96vw,1400px);height:min(94vh,1000px);display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4)}\\
#edemo-scan-lightbox .edemo-scan-toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;border-bottom:1px solid #dfe4eb;background:#f7f9fc}\\
#edemo-scan-lightbox .edemo-scan-toolbar button{min-width:42px;min-height:38px;padding:7px 12px;border:1px solid #c9d3df;border-radius:9px;background:#fff;color:#17324d;font:inherit;font-weight:750;cursor:pointer}\\
#edemo-scan-lightbox .edemo-scan-toolbar button:hover{background:#eef3f8}\\
#edemo-scan-lightbox .edemo-scan-toolbar .edemo-scan-close{margin-left:auto}\\
#edemo-scan-lightbox .edemo-scan-viewport{flex:1;min-height:0;overflow:auto;padding:18px;background:#eef1f5;text-align:center}\\
#edemo-scan-lightbox .edemo-scan-viewport img{display:block;height:auto;max-width:none;max-height:none;margin:auto;box-shadow:0 4px 18px rgba(0,0,0,.16)}\\
@media(max-width:560px){#edemo-scan-lightbox{padding:0}#edemo-scan-lightbox .edemo-scan-dialog{width:100vw;height:100vh;border-radius:0}#edemo-scan-lightbox .edemo-scan-toolbar{flex-wrap:wrap}}\\
#ege-demo-2026 .edemo-transfer-text'''
          if old_css not in s: raise SystemExit('scan zoom css anchor missing')
          s=s.replace(old_css,new_css,1)
          anchor='''  function mountCompletedEssay(){\n'''
          funcs='''  var scanZoomReturnFocus=null,scanZoomKeyHandler=null;\n  function closeScanZoom(){\n    var overlay=byId("edemo-scan-lightbox");if(!overlay)return;\n    if(scanZoomKeyHandler)document.removeEventListener("keydown",scanZoomKeyHandler);scanZoomKeyHandler=null;overlay.remove();\n    if(scanZoomReturnFocus&&typeof scanZoomReturnFocus.focus==="function")scanZoomReturnFocus.focus();scanZoomReturnFocus=null;\n  }\n  function openScanZoom(src,alt,trigger){\n    closeScanZoom();scanZoomReturnFocus=trigger||document.activeElement;\n    var overlay=document.createElement("div");overlay.id="edemo-scan-lightbox";overlay.setAttribute("role","dialog");overlay.setAttribute("aria-modal","true");overlay.setAttribute("aria-label","Увеличенное фото сочинения");\n    overlay.innerHTML='<div class="edemo-scan-dialog"><div class="edemo-scan-toolbar"><button type="button" data-scan-zoom="out" aria-label="Уменьшить">−</button><button type="button" data-scan-zoom="reset">По размеру</button><button type="button" data-scan-zoom="in" aria-label="Увеличить">+</button><button type="button" class="edemo-scan-close" data-scan-close>Закрыть</button></div><div class="edemo-scan-viewport"><img alt="'+escapeHtml(alt||"Фото сочинения")+'" src="'+src+'"></div></div>';\n    document.body.appendChild(overlay);\n    var img=overlay.querySelector("img"),zoom=1,baseWidth=0;\n    function applyZoom(){if(baseWidth>0)img.style.width=Math.max(1,Math.round(baseWidth*zoom))+"px";overlay.setAttribute("data-zoom",zoom.toFixed(2));}\n    function fitImage(){var nw=img.naturalWidth||1,nh=img.naturalHeight||1,fit=Math.min((window.innerWidth*.88)/nw,(window.innerHeight*.72)/nh,1);baseWidth=Math.max(1,nw*fit);applyZoom();}\n    if(img.complete)fitImage();else img.addEventListener("load",fitImage,{once:true});\n    overlay.querySelector('[data-scan-zoom="in"]').addEventListener("click",function(){zoom=Math.min(4,zoom+.25);applyZoom();});\n    overlay.querySelector('[data-scan-zoom="out"]').addEventListener("click",function(){zoom=Math.max(.5,zoom-.25);applyZoom();});\n    overlay.querySelector('[data-scan-zoom="reset"]').addEventListener("click",function(){zoom=1;applyZoom();});\n    overlay.querySelector('[data-scan-close]').addEventListener("click",closeScanZoom);\n    overlay.addEventListener("click",function(e){if(e.target===overlay)closeScanZoom();});\n    scanZoomKeyHandler=function(e){if(e.key==="Escape")closeScanZoom();};document.addEventListener("keydown",scanZoomKeyHandler);\n    overlay.querySelector('[data-scan-close]').focus();\n  }\n\n'''
          if anchor not in s: raise SystemExit('mount anchor missing')
          s=s.replace(anchor,funcs+anchor,1)
          old='''    var scan=byId("edemo-essay-scan");if(scan)scan.addEventListener("change",function(e){var f=e.target.files&&e.target.files[0],preview=byId("edemo-scan-preview");if(!f)return;reviewState.sourceFileName=f.name;saveReviewState();if(/^image\\//.test(f.type)){var reader=new FileReader();reader.onload=function(){preview.innerHTML='<img alt="Предпросмотр рукописного сочинения" src="'+reader.result+'">';};reader.readAsDataURL(f);}else preview.textContent="Выбран файл: "+f.name;});'''
          new='''    var scan=byId("edemo-essay-scan");if(scan)scan.addEventListener("change",function(e){var f=e.target.files&&e.target.files[0],preview=byId("edemo-scan-preview");if(!f)return;reviewState.sourceFileName=f.name;saveReviewState();if(/^image\\//.test(f.type)){var reader=new FileReader();reader.onload=function(){preview.innerHTML='<button type="button" class="edemo-scan-open" aria-label="Увеличить фото сочинения"><img alt="Предпросмотр рукописного сочинения" src="'+reader.result+'"><span>Нажмите, чтобы увеличить</span></button>';var opener=preview.querySelector(".edemo-scan-open");if(opener)opener.addEventListener("click",function(){openScanZoom(reader.result,"Фото рукописного сочинения",opener);});};reader.readAsDataURL(f);}else preview.textContent="Выбран файл: "+f.name;});'''
          if old not in s: raise SystemExit('scan handler anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          bt=base/'test-russian-task27-browser.py';t=bt.read_text(encoding='utf-8')
          needle="""    check(page.locator('#edemo-transferred-essay').count()==1,'paper result has editable transferred text')\n    page.fill('#edemo-transferred-essay','Это пример , текста.')\n"""
          insert="""    check(page.locator('#edemo-transferred-essay').count()==1,'paper result has editable transferred text')\n    scan_svg=b'<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"800\" height=\"1200\"><rect width=\"800\" height=\"1200\" fill=\"white\"/><path d=\"M80 140h640M80 220h640M80 300h640\" stroke=\"black\" stroke-width=\"8\"/></svg>'\n    page.set_input_files('#edemo-essay-scan',files={'name':'essay-scan.svg','mimeType':'image/svg+xml','buffer':scan_svg})\n    check(page.locator('.edemo-scan-open').count()==1,'image preview has zoom opener')\n    check(page.get_by_text('Нажмите, чтобы увеличить',exact=True).count()==1,'zoom hint shown')\n    page.click('.edemo-scan-open')\n    check(page.locator('#edemo-scan-lightbox').count()==1,'scan lightbox opens')\n    check(page.locator('#edemo-scan-lightbox').get_attribute('data-zoom')=='1.00','scan lightbox starts fitted')\n    page.click('[data-scan-zoom=\"in\"]')\n    check(page.locator('#edemo-scan-lightbox').get_attribute('data-zoom')=='1.25','scan zoom in works')\n    page.click('[data-scan-zoom=\"reset\"]')\n    check(page.locator('#edemo-scan-lightbox').get_attribute('data-zoom')=='1.00','scan zoom reset works')\n    page.keyboard.press('Escape')\n    check(page.locator('#edemo-scan-lightbox').count()==0,'scan lightbox closes with Escape')\n    page.fill('#edemo-transferred-essay','Это пример , текста.')\n"""
          if needle not in t: raise SystemExit('browser test anchor missing')
          bt.write_text(t.replace(needle,insert,1),encoding='utf-8')

          cp=base/'CHANGELOG.txt';c=cp.read_text(encoding='utf-8')
          entry='''v4.2 — SCAN IMAGE ZOOM\n- Для фото/скана рукописного сочинения добавлен просмотр крупно по клику.\n- В окне просмотра доступны увеличение, уменьшение, возврат к размеру окна и закрытие по Esc.\n- Файл остаётся локальным и не сохраняется.\n\n'''
          marker='ЕГЭ РУССКИЙ ЯЗЫК 2026 — CHANGELOG\n\n'
          if 'v4.2 — SCAN IMAGE ZOOM' not in c:c=c.replace(marker,marker+entry,1)
          cp.write_text(c,encoding='utf-8')

          ap=base/'AFTER-PUBLISH-CHECKLIST.txt';a=ap.read_text(encoding='utf-8')
          oldline='16. В новой попытке выбрать «На бумаге», отметить сочинение как написанное, завершить: доступен редактируемый «Перенесённый текст» и локальный фото/скан-референс; блока frozen demo essay нет.\n'
          newline=oldline+'16а. Прикрепить изображение сочинения: по клику на превью открывается крупный просмотр; работают +, −, «По размеру», закрытие кнопкой и Esc.\n'
          if oldline not in a: raise SystemExit('post-publish anchor missing')
          ap.write_text(a.replace(oldline,newline,1),encoding='utf-8')

          mp=base/'MANIFEST-SHA256.txt';m=mp.read_text(encoding='utf-8');h=hashlib.sha256(p.read_bytes()).hexdigest()
          m=re.sub(r'^[0-9a-f]{64}  ege-russkiy-demoversiya-T123-06\\.txt$',h+'  ege-russkiy-demoversiya-T123-06.txt',m,flags=re.M)
          mp.write_text(m,encoding='utf-8')
          if p.stat().st_size>=42500: raise SystemExit('T123-06 size limit exceeded')
          print('T123-06 bytes',p.stat().st_size,'sha256',h)
          PY
      - name: Regression checks
        working-directory: ege-russkiy-demoversiya-2026-v4.2
        run: |
          node test-russian-data.js
          node test-russian-v4.js
          python3 visual-contract-audit.py
          node test-russian-task27-v4.2.js
          node test-russian-task27-reset-guard.js
          python3 -m py_compile test-russian-task27-browser.py
      - name: Commit feature
        run: |
          git config user.name "niknikdym-hue"
          git config user.email "niknikdym@gmail.com"
          git add ege-russkiy-demoversiya-2026-v4.2/ege-russkiy-demoversiya-T123-06.txt \
                  ege-russkiy-demoversiya-2026-v4.2/test-russian-task27-browser.py \
                  ege-russkiy-demoversiya-2026-v4.2/CHANGELOG.txt \
                  ege-russkiy-demoversiya-2026-v4.2/AFTER-PUBLISH-CHECKLIST.txt \
                  ege-russkiy-demoversiya-2026-v4.2/MANIFEST-SHA256.txt
          git commit -m "Add zoom for Russian essay scan preview"
          git push origin main
