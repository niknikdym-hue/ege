name: PROFILE Math 2022 — build source diagnostic v7b
on:
  pull_request:
    branches: [main]
    paths:
      - 'PROFILE-MATH-2022-PR-FINAL-VERIFY-TRIGGER.txt'
permissions:
  contents: read
jobs:
  diagnose-build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Decode and print delayed-preview builder
        shell: bash
        run: |
          set -euo pipefail
          cat .profile2022-bootstrap/build.part1.b64 .profile2022-bootstrap/build.part2.b64 | base64 -d | gzip -d > /tmp/build_profile_2022.py
          echo '===== DELAYED BUILDER MATCHES ====='
          grep -n -C 12 -E 'DELAYED|delayed|setTimeout|assetParts|PREVIEW' /tmp/build_profile_2022.py | head -n 260
