name: Russian OGE 6.9 component evidence materialization

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/281-RUSSIAN-FIPI-2026-OGE-6.9-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.9-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_exact_owner_resolution_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_9_component_evidence.py"
      - ".github/workflows/russian-oge-6-9-component-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-9-component-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_9_component_evidence.py
      - name: Validate exact component evidence twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_oge_6_9_component_evidence.py" --output /tmp/oge-6-9-component-a.json > /tmp/oge-6-9-component-a.txt
          python3 "$root/validate_oge_6_9_component_evidence.py" --output /tmp/oge-6-9-component-b.json > /tmp/oge-6-9-component-b.txt
          diff -u /tmp/oge-6-9-component-a.json /tmp/oge-6-9-component-b.json
          diff -u /tmp/oge-6-9-component-a.txt /tmp/oge-6-9-component-b.txt
          cat /tmp/oge-6-9-component-a.txt
          grep -Fx 'OGE_6_9_COMPONENT_EVIDENCE=PASS' /tmp/oge-6-9-component-a.txt
          grep -Fx 'EXACT_OWNER_FRONTIER=14' /tmp/oge-6-9-component-a.txt
          grep -Fx 'OWNERS_WITH_VALID_COMPONENT_EVIDENCE=14' /tmp/oge-6-9-component-a.txt
          grep -Fx 'INDEPENDENT_ITEMS_TOTAL=42' /tmp/oge-6-9-component-a.txt
          grep -Fx 'MINIMUM_ITEMS_PER_OWNER=3' /tmp/oge-6-9-component-a.txt
          grep -Fx 'SELECTED_RESPONSE_ITEMS=28' /tmp/oge-6-9-component-a.txt
          grep -Fx 'CONSTRUCTED_RESPONSE_ITEMS=14' /tmp/oge-6-9-component-a.txt
          grep -Fx 'SEMANTIC_ADMISSIONS=0' /tmp/oge-6-9-component-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/oge-6-9-component-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/oge-6-9-component-a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/oge-6-9-component-a.txt
      - name: Upload component evidence validation
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-9-component-evidence
          path: /tmp/oge-6-9-component-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
