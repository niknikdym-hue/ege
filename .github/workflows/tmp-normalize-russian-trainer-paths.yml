name: Normalize Russian trainer paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-normalize-russian-trainer-paths.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize stale Russian trainer paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('eksamio-learning-engine')
          old = 'tilda-ready/pages/ege-russkiy-trenazher'
          new = 'eksamio-learning-engine/russkiy-knigi/ege-russkiy-trenazher'
          changed = []

          text_exts = {'.txt', '.md', '.json', '.py', '.js', '.html', '.yml', '.yaml'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              t = s.replace(old, new)
              if p.as_posix() == 'eksamio-learning-engine/00-WORK-STATUS.txt':
                  t = t.replace('`russkiy-knigi/rozental.doc`', '`eksamio-learning-engine/russkiy-knigi/rozental.doc`')
                  t = t.replace('`russkiy-knigi/ege-russkiy-trenazher/`', '`eksamio-learning-engine/russkiy-knigi/ege-russkiy-trenazher/`')
              if t != s:
                  p.write_text(t, encoding='utf-8')
                  changed.append(p.as_posix())

          graph = root / '03-RUSSIAN-SKILL-GRAPH.json'
          if graph.exists():
              data = json.loads(graph.read_text(encoding='utf-8'))
              data['generated_from'] = [x for x in data.get('generated_from', []) if x != 'scripts/build_ege_russian_trainer.py']
              data['review_queue'] = [x for x in data.get('review_queue', []) if x.get('review_id') != 'rq-trainer-not-in-github']
              for item in data.get('review_queue', []):
                  if 'source_paths' in item:
                      item['source_paths'] = [x for x in item['source_paths'] if x != 'scripts/build_ege_russian_trainer.py']
              graph.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              if graph.as_posix() not in changed:
                  changed.append(graph.as_posix())

          provenance = root / '03A-RUSSIAN-SKILL-GRAPH-PROVENANCE.txt'
          if provenance.exists():
              s = provenance.read_text(encoding='utf-8')
              marker = 'CURRENT PATH NORMALIZATION — 2026-08-18\nCanonical tracked trainer path: eksamio-learning-engine/russkiy-knigi/ege-russkiy-trenazher/\nAny earlier statement that the trainer is absent from GitHub is historical and RESOLVED.\n\n'
              if marker not in s:
                  s = marker + s
              s = s.replace('12) Current trainer absent from GitHub', '12) Current trainer GitHub location — RESOLVED 2026-08-18')
              s = s.replace('Found: local current product has no matching tracked directory in the audited\nGitHub commit.', 'Resolved: the current tracked product is now at\neksamio-learning-engine/russkiy-knigi/ege-russkiy-trenazher/.')
              provenance.write_text(s, encoding='utf-8')
              if provenance.as_posix() not in changed:
                  changed.append(provenance.as_posix())

          validation = root / '03B-RUSSIAN-SKILL-GRAPH-VALIDATION.txt'
          if validation.exists():
              s = validation.read_text(encoding='utf-8')
              marker = 'CURRENT PATH NORMALIZATION — 2026-08-18\nCanonical tracked trainer path: eksamio-learning-engine/russkiy-knigi/ege-russkiy-trenazher/\nThe former review item “trainer not in GitHub” is RESOLVED and must not be treated as current.\n\n'
              if marker not in s:
                  s = marker + s
              s = s.replace('12. The current 174-card trainer/builder are not yet tracked in GitHub.', '12. RESOLVED 2026-08-18: the current 174-card trainer is tracked at eksamio-learning-engine/russkiy-knigi/ege-russkiy-trenazher/.')
              validation.write_text(s, encoding='utf-8')
              if validation.as_posix() not in changed:
                  changed.append(validation.as_posix())

          print('Changed files:')
          for x in changed:
              print(x)
          PY
      - name: Commit normalized paths and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-normalize-russian-trainer-paths.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Normalize Russian trainer source paths"
            git push origin HEAD:main
          fi
