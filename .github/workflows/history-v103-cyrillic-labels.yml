name: History 1.0.3 Cyrillic labels

on:
  pull_request:
    branches: [main]
    paths:
      - 'production-audits/history-v103-builder.py'
      - '.github/workflows/history-v103-cyrillic-labels.yml'
      - 'ege-istoriya-demoversiya-v1/**'

permissions:
  contents: write

jobs:
  fix-test-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright beautifulsoup4
          google-chrome --version

      - name: Apply verified fix
        run: python production-audits/history-v103-builder.py

      - name: Validate working package
        run: |
          python ege-istoriya-demoversiya-v1/tests/test_static.py
          python ege-istoriya-demoversiya-v1/tests/test_independent_v103.py
          python ege-istoriya-demoversiya-v1/tests/test_browser.py
          python ege-istoriya-demoversiya-v1/tests/test_cyrillic_labels.py

      - name: Build release ZIP
        run: |
          rm -f ege-istoriya-demoversiya-v1.0.2.zip ege-istoriya-demoversiya-v1.0.3.zip
          python ege-istoriya-demoversiya-v1/scripts/build_demo_release.py
          unzip -t ege-istoriya-demoversiya-v1.0.3.zip
          sha256sum ege-istoriya-demoversiya-v1.0.3.zip

      - name: Verify clean extracted ZIP
        run: |
          rm -rf /tmp/history-v103-clean
          mkdir -p /tmp/history-v103-clean
          unzip -q ege-istoriya-demoversiya-v1.0.3.zip -d /tmp/history-v103-clean
          python /tmp/history-v103-clean/ege-istoriya-demoversiya-v1/tests/test_static.py
          python /tmp/history-v103-clean/ege-istoriya-demoversiya-v1/tests/test_independent_v103.py
          python /tmp/history-v103-clean/ege-istoriya-demoversiya-v1/tests/test_browser.py
          python /tmp/history-v103-clean/ege-istoriya-demoversiya-v1/tests/test_cyrillic_labels.py

      - uses: actions/upload-artifact@v4
        with:
          name: ege-istoriya-demoversiya-v1.0.3
          path: ege-istoriya-demoversiya-v1.0.3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified release
        run: |
          rm -f .github/workflows/history-v103-cyrillic-labels.yml
          rm -f production-audits/history-v103-builder.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix history Cyrillic labels 1.0.3"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
