name: export-profile-reference-for-2024

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-profile-reference-for-2024.yml'
      - 'PROFILE-MATH-REFERENCE-EXPORT-TRIGGER.txt'

permissions:
  contents: write

jobs:
  export-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record export run
        shell: bash
        run: |
          cat > PROFILE-MATH-REFERENCE-EXPORT-STATUS.txt <<EOF
          GitHub Actions run: ${{ github.run_id }}
          Head SHA: ${{ github.sha }}
          Status: EXPORTED_REFERENCE_ARTIFACT
          Artifact name: profile-math-reference-for-2024
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROFILE-MATH-REFERENCE-EXPORT-STATUS.txt
          git commit -m 'Record PROFILE reference export run' || true
          git push origin HEAD:main
      - name: Upload accepted profile reference implementation
        uses: actions/upload-artifact@v4
        with:
          name: profile-math-reference-for-2024
          path: |
            ege-matematika-profil-demoversiya-2025
            ege-matematika-profil-demoversiya-2026/scripts/build_profile_2026.py
            eksamio-learning-engine/130-EXTENDED-ANSWER-INPUT-UX-STANDARD.txt
          retention-days: 7
