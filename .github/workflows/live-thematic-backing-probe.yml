name: Live thematic backing probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-thematic-backing-probe.yml'
      - 'eksamio-learning-engine/peis-integration-reference/probe_live_thematic_backing.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only probe of live thematic trainer backing literals
        env:
          PROBE_OUT: live-thematic-backing-probe.json
        run: node eksamio-learning-engine/peis-integration-reference/probe_live_thematic_backing.mjs
      - name: Upload exact live probe result
        uses: actions/upload-artifact@v4
        with:
          name: live-thematic-backing-probe
          path: live-thematic-backing-probe.json
          if-no-files-found: error
