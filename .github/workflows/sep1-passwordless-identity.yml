name: SEP1 Passwordless identity

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/identity-reference/**"
      - ".github/workflows/sep1-passwordless-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peis_app
          POSTGRES_PASSWORD: peis_ci
          POSTGRES_DB: peis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peis_app -d peis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEIS_DATABASE_DSN: postgresql://peis_app:peis_ci@localhost:5432/peis
      PEIS_TEST_POSTGRES_DSN: postgresql://peis_app:peis_ci@localhost:5432/peis
      EKSAMIO_PEIS_TRUSTED_HOST_TEST_SECRET: sep1-ci-only-trusted-host-fixture-key-0001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared PEIS dependencies
        run: python -m pip install -r eksamio-learning-engine/peis-production-substrate/requirements.txt
      - name: Compile bounded identity implementation
        run: |
          python -m py_compile \
            eksamio-learning-engine/identity-reference/passwordless_identity.py \
            eksamio-learning-engine/identity-reference/validate_passwordless_identity_001.py
      - name: Validate existing trusted-host boundary
        working-directory: eksamio-learning-engine
        run: python peis-trusted-host-reference/validate_peis_trusted_host_001.py
      - name: Validate existing PostgreSQL substrate
        working-directory: eksamio-learning-engine
        run: python peis-production-substrate/validate_postgres_integration.py
      - name: Revalidate merged Russian PEIS vertical slice
        working-directory: eksamio-learning-engine
        run: python peis-production-substrate/validate_russian_exceptions_peis_vertical_slice.py
      - name: Validate passwordless account continuity
        working-directory: eksamio-learning-engine
        run: python identity-reference/validate_passwordless_identity_001.py
      - name: Scope guard
        run: |
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(mathematics|physics|tilda-ready|ege-russkiy-demoversiya|payment|tutor)'; then
            echo "Forbidden unrelated launch lane changed" >&2
            exit 1
          fi
