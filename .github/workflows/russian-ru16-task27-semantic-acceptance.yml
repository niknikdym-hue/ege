name: Russian RU16 Task27 semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU16-ESSAY-COMPONENT-BOUNDARY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU16-TASK27-BOUNDED-ROUTE-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru16_task27_route_semantic_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru16_task27_route_semantic_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru16_essay_component_boundary_review.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-16-EGE-ESSAY-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/ege-task-code-relation/FIPI-EGE-2026-TASK-CODE-RELATION-v1.0.json"
      - "eksamio-learning-engine/53-RUSSIAN-ESSAY-27-CRITERIA-MAP-2026.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - ".github/workflows/russian-ru16-task27-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru16-task27-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU16 acceptance code
        run: |
          python3 -m py_compile \
            eksamio-learning-engine/russian-program/subject-admission/build_ru16_task27_route_semantic_acceptance.py \
            eksamio-learning-engine/russian-program/subject-admission/validate_ru16_task27_route_semantic_acceptance.py \
            eksamio-learning-engine/russian-program/subject-admission/validate_ru16_essay_component_boundary_review.py
      - name: Build bounded Task27 acceptance twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru16_task27_route_semantic_acceptance.py \
            --output /tmp/ru16-acceptance-a.json > /tmp/ru16-acceptance-report-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru16_task27_route_semantic_acceptance.py \
            --output /tmp/ru16-acceptance-b.json > /tmp/ru16-acceptance-report-b.txt
          cmp /tmp/ru16-acceptance-a.json /tmp/ru16-acceptance-b.json
          diff -u /tmp/ru16-acceptance-report-a.txt /tmp/ru16-acceptance-report-b.txt
          cat /tmp/ru16-acceptance-report-a.txt
          cp /tmp/ru16-acceptance-a.json eksamio-learning-engine/russian-program/subject-admission/RU16-TASK27-DERIVED-ACCEPTANCE.json
      - name: Validate tracked bounded acceptance twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru16_task27_route_semantic_acceptance.py > /tmp/ru16-validate-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru16_task27_route_semantic_acceptance.py > /tmp/ru16-validate-b.txt
          diff -u /tmp/ru16-validate-a.txt /tmp/ru16-validate-b.txt
          cat /tmp/ru16-validate-a.txt
      - name: Preserve RU16 learner content and boundary gates
        run: |
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru16_essay_content.py
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru16_essay_component_boundary_review.py
      - name: Upload RU16 acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru16-task27-semantic-acceptance
          path: eksamio-learning-engine/russian-program/subject-admission/RU16-TASK27-DERIVED-ACCEPTANCE.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed in RU16 semantic acceptance.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
