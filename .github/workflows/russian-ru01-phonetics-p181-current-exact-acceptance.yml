name: Russian RU01 phonetics P181 current exact acceptance

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-PHONETICS-P181-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v4.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v3.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_exact_object_binding_review.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-PHONETICS-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETICS-GRAPHICS-WAVE-001-v0.1.json'
      - '.github/workflows/russian-ru01-phonetics-p181-current-exact-acceptance.yml'
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-PHONETICS-P181-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v4.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v3.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_exact_object_binding_review.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-PHONETICS-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETICS-GRAPHICS-WAVE-001-v0.1.json'
      - '.github/workflows/russian-ru01-phonetics-p181-current-exact-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-ru01-p181-object-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild prerequisite RU01 exact binding review
        run: |
          set -euo pipefail
          root=eksamio-learning-engine/russian-program/subject-admission
          python "$root/build_ru01_phonetics_exact_object_binding_review.py" --output /tmp/ru01-review-a.json
          python "$root/build_ru01_phonetics_exact_object_binding_review.py" --output /tmp/ru01-review-b.json
          cmp /tmp/ru01-review-a.json /tmp/ru01-review-b.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ru01-review-a.json',encoding='utf-8'))
          assert d['normalized_sha256']=='9e903409896463f350eb06e7bf5874eaaf9f1e21037c76f7c9c4b9e53831613e'
          assert d['source_review_input_sha256']=='39f8c5974c3b2fff4e397595655146e78a52ce9119a939cf86bf925f618a51b2'
          assert d['summary']['false_exact_mastery_admissions']==0
          ready=d['exact_reuse_ready']
          assert ready['semantic_id']=='ru-phonetics-word-analysis-sequence'
          assert ready['separate_object_acceptance_required'] is True
          assert ready['object_closures_by_this_review']==0
          assert 'RAU-043ae3d307ad5fd95639' in ready['admission_unit_ids']
          assert 'RSK-EDSOO59-4-2-P181' in ready['requirement_ids']
          rows=[
              r for r in d['records']
              if r['admission_unit_id']=='RAU-043ae3d307ad5fd95639'
              and r['requirement_id']=='RSK-EDSOO59-4-2-P181'
          ]
          assert len(rows)==1
          row=rows[0]
          assert row['review_classification']=='READY'
          assert row['normalized_source_signature']=='PHONETIC_WORD_ANALYSIS'
          assert row['accepted_semantic_refs']==['ru-phonetics-word-analysis-sequence']
          PY

      - name: Rebuild accepted current-v4 progress deterministically
        run: |
          set -euo pipefail
          root=eksamio-learning-engine/russian-program/subject-admission
          python -m py_compile "$root/build_russian_semantic_acceptance_progress_launch_current_v4.py"
          python "$root/build_russian_semantic_acceptance_progress_launch_current_v4.py" --output /tmp/progress-v4-a.json
          python "$root/build_russian_semantic_acceptance_progress_launch_current_v4.py" --output /tmp/progress-v4-b.json
          cmp /tmp/progress-v4-a.json /tmp/progress-v4-b.json

      - name: Verify one-object RU01 acceptance and aggregate delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/progress-v4-a.json',encoding='utf-8'))
          s=d['progress_summary']
          expected={
              'semantic_units_with_accepted_component_sets':30,
              'semantic_requirements_with_accepted_component_sets':30,
              'semantic_units_remaining_without_accepted_component_set':1286,
              'semantic_requirements_remaining_without_accepted_component_set':1361,
              'subject_disposed_units_total':31,
              'subject_disposed_requirements_total':31,
              'subject_review_units_remaining':1285,
              'subject_review_requirements_remaining':1360,
              'canonical_component_refs_reused_unique':118,
              'review_groups_with_accepted_component_sets':14,
              'false_exact_mastery_admissions':0,
          }
          for k,v in expected.items():
              assert s[k]==v,(k,s[k],v)
          assert d['schema_version']=='0.7.0'
          assert len(d['accepted_authorities'])==51
          groups=[x for x in d['semantic_review_groups'] if x.get('group_id')=='RUS-SEM-REVIEW-001']
          assert len(groups)==1
          rows=[
              x for x in groups[0]['accepted_component_sets']
              if x.get('accepted_authority_id')=='RU01_PHONETICS_P181_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1'
          ]
          assert len(rows)==1
          row=rows[0]
          assert row['admission_unit_id']=='RAU-043ae3d307ad5fd95639'
          assert row['requirement_id']=='RSK-EDSOO59-4-2-P181'
          assert row['canonical_component_refs']==['ru-phonetics-word-analysis-sequence']
          assert row['mastery_boundary']['generic_ru01_attempt_can_emit_exact_component_mastery'] is False
          assert row['mastery_boundary']['spelling_or_morphemic_evidence_can_substitute_for_word_analysis'] is False
          assert row['mastery_boundary']['shared_evidence_can_close_sibling_source_objects_without_separate_acceptance'] is False
          siblings={
              'RAU-0985ee43535361c09cd9',
              'RAU-3e5308ed79e62fc16e94',
              'RAU-8e357e9bbe18a741725c',
              'RAU-cb307f6635d27f73fa88',
              'RAU-df45aa3b99e1baefca01',
              'RAU-f3896151ffac143c05da',
          }
          accepted_by_authority={
              x.get('admission_unit_id')
              for g in d['semantic_review_groups']
              for x in g.get('accepted_component_sets',[])
              if x.get('accepted_authority_id')=='RU01_PHONETICS_P181_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1'
          }
          assert accepted_by_authority=={'RAU-043ae3d307ad5fd95639'}
          assert not accepted_by_authority & siblings
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Upload exact current-v4 progress
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-phonetics-p181-current-exact-acceptance
          path: /tmp/progress-v4-a.json
          if-no-files-found: error
