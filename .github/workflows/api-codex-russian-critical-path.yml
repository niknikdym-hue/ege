name: API Codex Russian Critical Path bounded repair

on:
  push:
    branches: ['brain/sep1-russian-subject-closure']
    paths:
      - '.github/workflows/api-codex-russian-critical-path.yml'
      - 'docs/project-control/api-codex-russian-critical-path-trigger.json'
      - 'docs/project-control/tasks/TASK-RUSSIAN-CRITICAL-PATH-FINGERPRINT-DRIFT.md'

permissions:
  contents: write

jobs:
  astra-codex-astra:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            docs/project-control
            eksamio-learning-engine/AGENTS.md
            eksamio-learning-engine/00-PRODUCT-MASTERPLAN.md
            eksamio-learning-engine/00E-CURRENT-BRAIN-HANDOFF.md
            eksamio-learning-engine/LOCAL-WORKSPACE-POLICY.md
            eksamio-learning-engine/FULL-SUBJECT-SOURCE-AND-TEXTBOOK-INGESTION-POLICY-v0.1.md
            eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json
            eksamio-learning-engine/russian-program
      - uses: actions/checkout@v5
        with:
          repository: niknikdym-hue/ege
          ref: b1de558461d76440dde3f385c89c8af7d9da0e11
          path: _orchestrator
          persist-credentials: false
          sparse-checkout: agent-orchestration
      - name: Verify owner-bound one-shot trigger
        id: trigger
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path('docs/project-control/api-codex-russian-critical-path-trigger.json')
          ok=False
          if p.is_file():
              d=json.loads(p.read_text(encoding='utf-8'))
              parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
              ok=(d.get('enabled') is True and d.get('expected_parent_sha')==parent and
                  d.get('task_id')=='RUSSIAN-CRITICAL-PATH-FINGERPRINT-DRIFT' and
                  d.get('pr_number')==164 and d.get('baseline_subject_head')=='feb0b6ce6febcc33f766dc800bc010e778f80304')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('enabled='+('true' if ok else 'false')+'\n')
          print('Critical-path one-shot:', 'ENABLED' if ok else 'SKIPPED')
          PY
      - name: Astra Brain selects the bounded plan
        if: steps.trigger.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ASTRA_MODEL: gpt-6-astra
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('_orchestrator/agent-orchestration').resolve()))
          from eksamio_agent_runner import AstraResponsesAdapter
          context={
            'repository':'niknikdym-hue/ege',
            'current_main_sha':'85d2f2b3dd0cf56c428f57c8a5c7d1b636ecebbb',
            'pull_request':164,
            'target_branch':'brain/sep1-russian-subject-closure',
            'baseline_subject_head':'feb0b6ce6febcc33f766dc800bc010e778f80304',
            'observed_failure':{
              'gate':'Russian OGE 6.14 current exact acceptance',
              'exception':'ValueError: 6.2 reuse-exhaustion fingerprint drift',
              'secondary_gate':'validate_oge_6_14_gap_evidence_wave_002.py EXPECTED_EXHAUSTION_SHA assertion',
              'expected_historical_sha256':'9aae09034623cdd73c043bd5c515b9a8271e422d6cac70205300daceaa5a6773'
            },
            'root_cause_hypothesis':'Later unrelated accepted production-learning JSON files changed only the historical scanned-file-count denominator. The reuse proof already has an explicit set for later unrelated content: such files must remain scanned for 6.2 hits but must not rewrite the historical count fingerprint.',
            'fixed_scope':['eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_remaining_6_2_reuse_exhaustion.py'],
            'required_outcome':'Restore the accepted historical reuse-exhaustion fingerprint without changing semantic authority, learner content, runtime, demos, scorer, Tilda, or production state.',
            'acceptance':['reuse-exhaustion builds twice identically and normalized_sha256 remains 9aae0903...','wave-002 validator passes','6.14 exact acceptance rebuild is deterministic and byte-identical to tracked accepted JSON','false_exact_mastery_admissions remains 0','no learner or production surfaces change'],
            'owner_authorization':'One bounded Critical Path repair on existing draft PR #164; no merge, deploy, public traffic, learner state, Yandex, payment, or messaging.'
          }
          result=AstraResponsesAdapter().plan(context)
          Path('/tmp/astra-plan.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/task-plan.json').write_text(json.dumps(result['output'],ensure_ascii=False,indent=2),encoding='utf-8')
          print('ASTRA_PLAN=PASS')
          print('GOAL='+result['output']['goal'])
          PY
      - name: Compose fail-closed Codex prompt
        if: steps.trigger.outputs.enabled == 'true'
        shell: bash
        run: |
          {
            cat docs/project-control/tasks/TASK-RUSSIAN-CRITICAL-PATH-FINGERPRINT-DRIFT.md
            printf '\n\nASTRA BRAIN STRUCTURED PLAN:\n'
            cat /tmp/task-plan.json
          } > /tmp/codex-prompt.txt
      - name: API-Codex executes the bounded repair
        if: steps.trigger.outputs.enabled == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/codex-prompt.txt
          output-file: /tmp/codex-output.txt
          model: gpt-5.6-terra
          effort: medium
          sandbox: workspace-write
          codex-args: '["--ephemeral"]'
      - name: Validate exact path and acceptance evidence
        if: steps.trigger.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          allowed='eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_remaining_6_2_reuse_exhaustion.py'
          changed=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard | grep -v '^_orchestrator/' || true)
          actual=$(printf '%s\n%s\n' "$changed" "$untracked" | sed '/^$/d' | sort -u)
          test "$actual" = "$allowed"
          root='eksamio-learning-engine/russian-program/subject-admission'
          python3 "$root/build_oge_6_14_remaining_6_2_reuse_exhaustion.py" --output /tmp/exhaustion-a.json > /tmp/exhaustion-a.txt
          python3 "$root/build_oge_6_14_remaining_6_2_reuse_exhaustion.py" --output /tmp/exhaustion-b.json > /tmp/exhaustion-b.txt
          cmp /tmp/exhaustion-a.json /tmp/exhaustion-b.json
          diff -u /tmp/exhaustion-a.txt /tmp/exhaustion-b.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/exhaustion-a.json',encoding='utf-8'))
          assert d['normalized_sha256']=='9aae09034623cdd73c043bd5c515b9a8271e422d6cac70205300daceaa5a6773'
          assert d['summary']['reuse_exhausted_for_all_remaining_owners'] is True
          assert d['reuse_search']['reusable_exact_items_found']==0
          assert d['reuse_search']['reusable_mixed_items_found']==0
          assert d['summary']['false_exact_mastery_admissions']==0
          print('REUSE_EXHAUSTION=PASS')
          PY
          python3 "$root/validate_oge_6_14_gap_evidence_wave_002.py"
          python3 "$root/build_oge_6_14_current_exact_acceptance.py" --output /tmp/acceptance-a.json > /tmp/acceptance-a.txt
          python3 "$root/build_oge_6_14_current_exact_acceptance.py" --output /tmp/acceptance-b.json > /tmp/acceptance-b.txt
          cmp /tmp/acceptance-a.json /tmp/acceptance-b.json
          diff -u /tmp/acceptance-a.txt /tmp/acceptance-b.txt
          cmp /tmp/acceptance-a.json "$root/RUSSIAN-OGE-6.14-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current_v2.py" --output /tmp/progress.json > /tmp/progress.txt
          git diff --check
          {
            echo 'PATH_SCOPE=PASS'
            echo 'REUSE_EXHAUSTION=PASS'
            echo 'WAVE_002_VALIDATOR=PASS'
            echo 'OGE_6_14_ACCEPTANCE_DETERMINISTIC=PASS'
            echo 'OGE_6_14_TRACKED_ARTIFACT_BYTE_IDENTICAL=PASS'
            echo 'CURRENT_PROGRESS_BUILD=PASS'
            echo 'FALSE_EXACT_MASTERY_ADMISSIONS=0'
          } | tee /tmp/acceptance-evidence.txt
      - name: Prepare exact reviewed commit
        if: steps.trigger.outputs.enabled == 'true'
        shell: bash
        run: |
          rm -rf _orchestrator
          git rm .github/workflows/api-codex-russian-critical-path.yml
          git rm docs/project-control/api-codex-russian-critical-path-trigger.json
          git rm docs/project-control/tasks/TASK-RUSSIAN-CRITICAL-PATH-FINGERPRINT-DRIFT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_remaining_6_2_reuse_exhaustion.py
          git commit -m 'fix(russian): preserve accepted 6.2 reuse fingerprint'
          git show --stat --oneline HEAD > /tmp/commit-summary.txt
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/commit-paths.txt
      - name: Astra Brain reviews exact commit and evidence
        if: steps.trigger.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ASTRA_MODEL: gpt-6-astra
        shell: bash
        run: |
          git archive b1de558461d76440dde3f385c89c8af7d9da0e11 agent-orchestration | tar -x -C /tmp
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,'/tmp/agent-orchestration')
          from eksamio_agent_runner import AstraResponsesAdapter
          reviewed=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          context={
            'repository':'niknikdym-hue/ege','pull_request':164,'reviewed_sha':reviewed,
            'plan':json.load(open('/tmp/task-plan.json',encoding='utf-8')),
            'changed_paths':Path('/tmp/commit-paths.txt').read_text(encoding='utf-8').splitlines(),
            'acceptance_evidence':Path('/tmp/acceptance-evidence.txt').read_text(encoding='utf-8'),
            'commit_summary':Path('/tmp/commit-summary.txt').read_text(encoding='utf-8'),
            'codex_report':Path('/tmp/codex-output.txt').read_text(encoding='utf-8')[-12000:],
            'hard_invariants':{'false_exact_mastery_zero':True,'server_owned_truth_preserved':True,'owner_gates_preserved':True},
            'forbidden_actions_confirmed':['no merge','no deploy','no learner/runtime/demo/scorer/Tilda change','no Yandex','no production write']
          }
          result=AstraResponsesAdapter().review(context)
          Path('/tmp/astra-review.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          decision=result['output']
          assert decision['reviewed_sha']==reviewed
          assert decision['decision']=='PASS', decision
          assert all(decision['invariants'].values()), decision
          print('ASTRA_REVIEW=PASS')
          PY
      - name: Push accepted bounded commit
        if: steps.trigger.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          git push origin HEAD:brain/sep1-russian-subject-closure
      - name: Upload sanitized orchestration evidence
        if: steps.trigger.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-critical-path-astra-codex-astra-${{ github.sha }}
          path: |
            /tmp/astra-plan.json
            /tmp/codex-output.txt
            /tmp/acceptance-evidence.txt
            /tmp/commit-summary.txt
            /tmp/astra-review.json
          if-no-files-found: warn
          retention-days: 14
