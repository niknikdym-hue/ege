name: Independent Audit Profile Math 2026 Render

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/independent-audit-profile-math-2026-render.yml

permissions:
  contents: read

jobs:
  render-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - name: Render complete official PDFs
        run: |
          mkdir -p /tmp/profile-render/demo /tmp/profile-render/spec
          python - <<'PY'
          import fitz, pathlib
          pairs=[
            ('matematika-source-2026/original/МА-11 ЕГЭ 2026 ДЕМО_профильный.pdf','/tmp/profile-render/demo'),
            ('matematika-source-2026/original/МА-11 ЕГЭ 2026 СПЕЦ_профильный.pdf','/tmp/profile-render/spec'),
          ]
          for src,out in pairs:
              doc=fitz.open(src); out=pathlib.Path(out)
              for i,p in enumerate(doc):
                  pix=p.get_pixmap(matrix=fitz.Matrix(1.8,1.8),alpha=False)
                  pix.save(out/f'page-{i+1:02d}.png')
              print(src, len(doc))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independent-profile-math-2026-rendered-source
          path: /tmp/profile-render
          retention-days: 2
