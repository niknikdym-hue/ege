name: tmp-count-russian-school-canonical

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-count-russian-school-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect canonicalization JSON snapshot
        run: |
          mkdir -p canonical-json-snapshot
          python - <<'PY'
          import pathlib,re,shutil,json
          src=pathlib.Path('eksamio-learning-engine')
          dst=pathlib.Path('canonical-json-snapshot')
          manifest=[]
          for p in sorted(src.glob('*.json')):
              m=re.match(r'^(\d+)-',p.name)
              if not m: continue
              n=int(m.group(1))
              if 159 <= n <= 215:
                  shutil.copy2(p,dst/p.name)
                  manifest.append(p.name)
          (dst/'MANIFEST.json').write_text(json.dumps({'files':manifest,'count':len(manifest)},ensure_ascii=False,indent=2),encoding='utf-8')
          print('snapshot_files',len(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: russian-school-canonical-json-snapshot
          path: canonical-json-snapshot
          retention-days: 3
