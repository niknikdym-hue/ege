name: Chemistry demo release

on:
  pull_request:
    paths:
      - khimiya-build/**
      - khimiya-source/**
      - .github/workflows/khimiya-build-release.yml
  push:
    branches:
      - feature/khimiya-demo-v1
    paths:
      - khimiya-build/**
      - khimiya-source/**
      - .github/workflows/khimiya-build-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out chemistry branch
        uses: actions/checkout@v4
        with:
          ref: feature/khimiya-demo-v1
          fetch-depth: 0

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install rendering and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Decode audited build inputs
        run: |
          set -euo pipefail
          cat \
            khimiya-build/generator.gz.b64.part01 \
            khimiya-build/generator.gz.b64.part02 \
            khimiya-build/generator.tail.part03a \
            khimiya-build/generator.tail.part03b \
            khimiya-build/generator.tail.part04a \
            khimiya-build/generator.tail.part04b \
            | base64 -d | gzip -d > khimiya-build/generate_package.py
          cat \
            khimiya-build/source-data.gz.b64.part01 \
            khimiya-build/source-data.gz.b64.part02 \
            khimiya-build/source-data.tail.part03a \
            khimiya-build/source-data.tail.part03b \
            | base64 -d | gzip -d > khimiya-build/source-data.json
          base64 -d khimiya-build/apply-fixes.gz.b64 | gzip -d > khimiya-build/apply_fixes.py
          python khimiya-build/apply_fixes.py khimiya-build/generate_package.py khimiya-build/source-data.json
          python khimiya-build/fix_reference_loading.py khimiya-build/generate_package.py
          python -m py_compile khimiya-build/generate_package.py khimiya-build/apply_fixes.py khimiya-build/fix_reference_loading.py
          rm -rf khimiya-build/__pycache__

      - name: Generate deterministic package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          rm -rf ege-khimiya-demoversiya-v1
          python khimiya-build/generate_package.py

      - name: Run package tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CHEM_SCREENSHOT_DIR: /tmp/chem-screenshots
        run: |
          mkdir -p "$CHEM_SCREENSHOT_DIR"
          cd ege-khimiya-demoversiya-v1
          python -m unittest discover tests
          node tests/browser_test.mjs
          python scripts/validate_demo_package.py ege-khimiya-demoversiya-PACKAGE-CONTRACT.json
          unzip -t ege-khimiya-demoversiya-v1-fixed.zip

      - name: Recheck clean extracted ZIP
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CHEM_SCREENSHOT_DIR: /tmp/chem-screenshots-extracted
        run: |
          rm -rf /tmp/chem-release "$CHEM_SCREENSHOT_DIR"
          mkdir -p /tmp/chem-release "$CHEM_SCREENSHOT_DIR"
          unzip -q ege-khimiya-demoversiya-v1/ege-khimiya-demoversiya-v1-fixed.zip -d /tmp/chem-release
          cd /tmp/chem-release
          python -m unittest discover tests
          python scripts/validate_demo_package.py ege-khimiya-demoversiya-PACKAGE-CONTRACT.json
          cp -a "$GITHUB_WORKSPACE/node_modules" ./node_modules
          node tests/browser_test.mjs
          rm -rf node_modules tests/__pycache__ scripts/__pycache__
          ! find . -type d -name __pycache__ | grep -q .
          ! find . -type f \( -name '*.pyc' -o -name '*.log' -o -name '*.tmp' \) | grep -q .

      - name: Commit verified package
        if: github.event_name != 'pull_request'
        run: |
          rm -rf node_modules khimiya-build/__pycache__ ege-khimiya-demoversiya-v1/tests/__pycache__ ege-khimiya-demoversiya-v1/scripts/__pycache__
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f ege-khimiya-demoversiya-v1
          if ! git diff --cached --quiet; then
            git commit -m "Build verified chemistry demo package"
            git push origin HEAD:feature/khimiya-demo-v1
          fi

      - name: Upload verified release and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ege-khimiya-demoversiya-v1-verified
          path: |
            ege-khimiya-demoversiya-v1/ege-khimiya-demoversiya-v1-fixed.zip
            ege-khimiya-demoversiya-v1/ege-khimiya-demoversiya-TEST-REPORT.txt
            ege-khimiya-demoversiya-v1/ege-khimiya-demoversiya-INDEPENDENT-TEST-EVIDENCE.json
            /tmp/chem-screenshots/*.png
            /tmp/chem-screenshots-extracted/*.png
          if-no-files-found: error
          retention-days: 30
