name: SEP1 Russian 121 Full Current Gate

on:
  push:
    branches:
      - sep1/ru-121-reviewed-checkpoint-import
  pull_request:
    paths:
      - 'eksamio-learning-engine/**'
      - '.github/workflows/sep1-russian-121-full-current-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            BROWSER="$(command -v chromium)"
          fi
          test -n "$BROWSER"
          echo "CHROMIUM_PATH=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version

      - name: Build current canonical exception bank
        working-directory: eksamio-learning-engine
        run: python build/build_russian_exceptions_bank_current_v2.py

      - name: Build reviewed current 121-card practice bank
        working-directory: eksamio-learning-engine
        run: python build/build_russian_exceptions_practice_course_grade.py

      - name: Build launch priority
        working-directory: eksamio-learning-engine
        run: python build/build_russian_exceptions_launch_priority.py

      - name: Audit current practice coverage
        working-directory: eksamio-learning-engine
        run: python build/audit_russian_exceptions_practice_coverage.py

      - name: Verify 121-card checkpoint, coverage and PEIS mapping parity
        working-directory: eksamio-learning-engine
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          manifest = json.loads(Path('119-RUSSIAN-EXCEPTIONS-PRACTICE-CURRENT-CORRECTED-MANIFEST.json').read_text(encoding='utf-8'))
          expected = manifest['expected_active_items']
          assert expected == 121, expected

          practice_path = Path('build/RUSSIAN-EXCEPTIONS-PRACTICE-CANONICAL.json')
          data = json.loads(practice_path.read_text(encoding='utf-8'))
          items = data.get('practice_items', data.get('items', []))
          rows = list(items.values()) if isinstance(items, dict) else list(items)
          assert len(rows) == expected, f'expected {expected} active cards, got {len(rows)}'
          ids = [r.get('practice_item_id') for r in rows]
          assert len(ids) == len(set(ids)) == 121
          id_set = set(ids)

          assert 'ex-practice-zorevat-001' not in id_set
          assert 'ex-practice-end-finally-001' not in id_set
          assert 'ex-practice-zarevat-current-001' in id_set
          assert 'ex-practice-v-kontse-kontsov-context-002' in id_set
          assert 'ex-practice-priznatelnyi-context-001' in id_set
          assert 'ex-practice-priznannyi-context-002' in id_set
          assert 'ex-practice-skachu-transfer-002' in id_set
          assert 'ex-practice-po-okonchanii-transfer-002' in id_set

          wave6_rows = [r for r in rows if '-w6-' in r.get('practice_item_id', '')]
          assert len(wave6_rows) == 28
          assert all(r.get('status') == 'reviewed' for r in wave6_rows)
          assert len({r.get('context_signature') for r in wave6_rows}) == 28
          wave6_targets = [
              'chtoby_vs_chto_by', 'tozhe_vs_to_zhe', 'takzhe_vs_tak_zhe',
              'prichem_vs_pri_chem', 'pritom_vs_pri_tom', 'zato_vs_za_to', 'itak_vs_i_tak',
              'vvidu_vs_v_vidu', 'vsledstvie_vs_v_sledstvie', 'naschet_vs_na_schet', 'vrode_vs_v_rode',
              'vnachale_vs_v_nachale', 'snachala_vs_s_nachala', 'nazavtra_vs_na_zavtra',
          ]
          counts = Counter(r['exception_id'] for r in wave6_rows)
          assert set(counts) == set(wave6_targets)
          assert all(counts[eid] == 2 for eid in wave6_targets)

          coverage = json.loads(Path('audits/RUSSIAN-EXCEPTIONS-PRACTICE-COVERAGE.json').read_text(encoding='utf-8'))
          assert coverage['practice_items_total'] == 121
          assert coverage['exceptions_total'] == 127
          assert coverage['exceptions_covered'] == 88
          assert coverage['exceptions_uncovered'] == 39
          assert coverage['p0_p1_uncovered_count'] == 0
          assert coverage['priority_uncovered'] == {'P2': 39}, coverage['priority_uncovered']

          mapping = json.loads(Path('russian-program/RUSSIAN-EXCEPTIONS-121-SEMANTIC-MAPPING-v1.0.json').read_text(encoding='utf-8'))
          mapping_rows = mapping.get('rows') or mapping.get('mappings') or mapping.get('items')
          assert isinstance(mapping_rows, list) and len(mapping_rows) == 121
          mapped_ids = [r.get('practice_item_id') for r in mapping_rows]
          assert len(mapped_ids) == len(set(mapped_ids)) == 121
          assert set(mapped_ids) == id_set
          statuses = Counter(r.get('mapping_resolution') for r in mapping_rows)
          assert statuses == Counter({'EXACT': 116, 'PARTIAL_COMPOSITE': 5}), statuses
          assert mapping.get('counts', {}).get('exact') == 116, mapping.get('counts')
          assert mapping.get('counts', {}).get('partial_composite') == 5, mapping.get('counts')
          assert mapping.get('counts', {}).get('active_cards') == 121, mapping.get('counts')

          print('PASS: 121 unique active cards; 88/127 covered; P0/P1 uncovered=0; Wave6=28 reviewed; PEIS mapping parity=121 with 116 EXACT + 5 PARTIAL_COMPOSITE')
          PY

      - name: Build runtime
        working-directory: eksamio-learning-engine
        run: python build/build_russian_exceptions_runtime.py

      - name: Audit learner payload and provenance boundary
        working-directory: eksamio-learning-engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('build/RUSSIAN-EXCEPTIONS-RUNTIME.json')
          text = path.read_text(encoding='utf-8')
          low = text.lower()
          forbidden = [
              'розентал', 'rosenthal', 'gramota.ru', 'драбкин', 'drabkina',
              'source_refs', 'source_path', 'provenance', 'rule_ref',
              'russkiy-knigi/', '130-russian-exceptions-80-card',
          ]
          hits = [x for x in forbidden if x in low]
          assert not hits, f'forbidden internal provenance leaked: {hits}'
          runtime = json.loads(text)
          assert len(runtime['practice_items']) == 121
          wave6 = [v for k, v in runtime['practice_items'].items() if '-w6-' in k]
          assert len(wave6) == 28
          assert 'за то предложение' in low
          assert 'в роде существительного' in low
          assert 'ошибка в роде существительного' in low
          assert 'в его роде было несколько художников' not in low
          assert 'в роде этого мастера было несколько известных художников' not in low
          assert 'ученика похвалили за то точное объяснение правила' not in low
          print('PASS: learner runtime 121; reviewed Wave6 wording; no forbidden internal provenance')
          PY

      - name: Prove deterministic semantic materialization twice
        working-directory: eksamio-learning-engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/sep1-first.semantic.sha256
          import hashlib, json
          from pathlib import Path
          paths = [
              Path('build/RUSSIAN-EXCEPTIONS-BANK-CANONICAL.json'),
              Path('build/RUSSIAN-EXCEPTIONS-PRACTICE-CANONICAL.json'),
              Path('build/RUSSIAN-EXCEPTIONS-LAUNCH-PRIORITY.json'),
              Path('build/RUSSIAN-EXCEPTIONS-RUNTIME.json'),
          ]
          volatile = {'generated_at_utc', 'generated_at', 'generatedAt'}
          def normalize(value):
              if isinstance(value, dict):
                  return {k: normalize(v) for k, v in sorted(value.items()) if k not in volatile}
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              return value
          for path in paths:
              payload = normalize(json.loads(path.read_text(encoding='utf-8')))
              blob = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              print(hashlib.sha256(blob).hexdigest(), path)
          PY
          python build/build_russian_exceptions_bank_current_v2.py
          python build/build_russian_exceptions_practice_course_grade.py
          python build/build_russian_exceptions_launch_priority.py
          python build/audit_russian_exceptions_practice_coverage.py
          python build/build_russian_exceptions_runtime.py
          python - <<'PY' > /tmp/sep1-second.semantic.sha256
          import hashlib, json
          from pathlib import Path
          paths = [
              Path('build/RUSSIAN-EXCEPTIONS-BANK-CANONICAL.json'),
              Path('build/RUSSIAN-EXCEPTIONS-PRACTICE-CANONICAL.json'),
              Path('build/RUSSIAN-EXCEPTIONS-LAUNCH-PRIORITY.json'),
              Path('build/RUSSIAN-EXCEPTIONS-RUNTIME.json'),
          ]
          volatile = {'generated_at_utc', 'generated_at', 'generatedAt'}
          def normalize(value):
              if isinstance(value, dict):
                  return {k: normalize(v) for k, v in sorted(value.items()) if k not in volatile}
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              return value
          for path in paths:
              payload = normalize(json.loads(path.read_text(encoding='utf-8')))
              blob = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              print(hashlib.sha256(blob).hexdigest(), path)
          PY
          diff -u /tmp/sep1-first.semantic.sha256 /tmp/sep1-second.semantic.sha256
          cat /tmp/sep1-second.semantic.sha256
          echo 'PASS: semantic materialization is deterministic; only explicit generated-at metadata is excluded from the comparison.'

      - name: Run aggregate and browser core validation
        working-directory: eksamio-learning-engine
        run: python build/run_russian_exceptions_standalone_validation.py

      - name: Run standalone Chromium preview validation
        working-directory: eksamio-learning-engine
        run: python build/run_russian_exceptions_standalone_preview_validation.py

      - name: Runtime size audit
        working-directory: eksamio-learning-engine
        run: python build/audit_russian_runtime_sizes.py

      - name: Git diff syntax guard
        run: git diff --check

      - name: Verify SEP1 changed-file scope
        run: |
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          forbidden = [p for p in changed if ('WAVE7' in p.upper() or 'WAVE8' in p.upper())]
          forbidden += [p for p in changed if p.startswith('ege-') and 'russ' not in p.lower()]
          assert not forbidden, f'forbidden/out-of-scope changed paths: {forbidden}'
          print('Changed files:')
          print('\n'.join(changed))
          PY

      - name: Upload generated gate outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep1-russian-121-full-current-gate
          if-no-files-found: warn
          path: |
            eksamio-learning-engine/build/RUSSIAN-EXCEPTIONS-BANK-CANONICAL.json
            eksamio-learning-engine/build/RUSSIAN-EXCEPTIONS-PRACTICE-CANONICAL.json
            eksamio-learning-engine/build/RUSSIAN-EXCEPTIONS-LAUNCH-PRIORITY.json
            eksamio-learning-engine/build/RUSSIAN-EXCEPTIONS-RUNTIME.json
            eksamio-learning-engine/build/standalone-exceptions-tilda/**
            eksamio-learning-engine/audits/**
