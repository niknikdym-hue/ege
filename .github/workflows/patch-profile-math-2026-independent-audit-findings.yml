name: Patch Profile Math 2026 Independent Audit Findings

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-profile-math-2026-independent-audit-findings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ege-matematika-profil-demoversiya-2026/scripts/build_profile_2026.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'14-1':[(22,95,1100)],'14-2':[(23,95,1100),(24,95,780)],", "'14-1':[(22,95,1100)],'14-2':[(23,95,1100),(24,95,950)],")
          s=s.replace("'19-1':[(35,95,1100),(36,95,330)],'19-2':[(36,335,1100),(37,95,900)]}", "'19-1':[(35,95,1100),(36,95,380)],'19-2':[(36,385,1100),(37,95,900)]}")
          old="""def build_blocks(data):
              blocks=[shell(data)]
              for p in sorted((ROOT/'assets').glob('*.webp')):
                  b64=base64.b64encode(p.read_bytes()).decode('ascii'); parts=[b64[i:i+PART_CHARS] for i in range(0,len(b64),PART_CHARS)]
                  for part in parts: blocks.append(f'<script>window.EKSAMIO_MATH_PROFILE.assetParts[{json.dumps(p.name)}]=window.EKSAMIO_MATH_PROFILE.assetParts[{json.dumps(p.name)}]||[];window.EKSAMIO_MATH_PROFILE.assetParts[{json.dumps(p.name)}].push({json.dumps(part)});</script>')
              blocks.append('<script>'+runtime()+'</script>')
          """.replace('              ','    ')
          new="""def build_blocks(data):
              # Tilda-safe packing: shell/runtime stay isolated; sequential asset payloads are combined
              # without exceeding the conservative 42.5 kB gate.
              blocks=[shell(data)]
              asset_scripts=[]
              for p in sorted((ROOT/'assets').glob('*.webp')):
                  b64=base64.b64encode(p.read_bytes()).decode('ascii'); parts=[b64[i:i+PART_CHARS] for i in range(0,len(b64),PART_CHARS)]
                  for part in parts:
                      asset_scripts.append(f'<script>window.EKSAMIO_MATH_PROFILE.assetParts[{json.dumps(p.name)}]=window.EKSAMIO_MATH_PROFILE.assetParts[{json.dumps(p.name)}]||[];window.EKSAMIO_MATH_PROFILE.assetParts[{json.dumps(p.name)}].push({json.dumps(part)});</script>')
              packed=''; safe_limit=42500
              for script in asset_scripts:
                  candidate=packed+script
                  if packed and len(candidate.encode('utf-8'))>=safe_limit:
                      blocks.append(packed); packed=script
                  else:
                      packed=candidate
              if packed: blocks.append(packed)
              blocks.append('<script>'+runtime()+'</script>')
          """.replace('              ','    ')
          assert old in s, 'old build_blocks not found'
          s=s.replace(old,new)
          s=s.replace('TILDA_SIZE_GATE: PENDING\\nFINAL_STATUS: BUILT_PENDING_TESTS','TILDA_SIZE_GATE: PENDING\\nINDEPENDENT_AUDIT_GATE: PENDING\\nFINAL_STATUS: BUILT_PENDING_TESTS')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-matematika-profil-demoversiya-2026/scripts/build_profile_2026.py
          git commit -m 'Fix profile math 2026 extended criteria crops'
          git pull --rebase origin main
          git push origin main
