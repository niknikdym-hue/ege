name: SEP1 Russian Tutor vertical slice

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/ai-tutor-reference/**'
      - '.github/workflows/sep1-russian-tutor.yml'
  push:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/ai-tutor-reference/**'
      - '.github/workflows/sep1-russian-tutor.yml'

permissions:
  contents: read

jobs:
  validate-russian-tutor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eksamio_tutor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eksamio_tutor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEIS_DATABASE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/eksamio_tutor_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared PEIS validation dependencies
        run: pip install -r eksamio-learning-engine/peis-production-substrate/requirements.txt
      - name: Compile Tutor slice
        run: python -m py_compile eksamio-learning-engine/ai-tutor-reference/sep1_russian_tutor.py eksamio-learning-engine/ai-tutor-reference/validate_sep1_russian_tutor.py
      - name: Preserve merged Tutor boundary gate
        run: python eksamio-learning-engine/ai-tutor-reference/validate_ai_tutor_provider_neutral_boundary_001.py
      - name: Preserve reliability circuit gate
        run: python eksamio-learning-engine/ai-tutor-reference/validate_ai_tutor_reliability_circuit_repair_001.py
      - name: Validate grounded text voice PEIS slice
        run: python eksamio-learning-engine/ai-tutor-reference/validate_sep1_russian_tutor.py
      - name: Reject whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
