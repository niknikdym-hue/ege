name: Russian RU08 RU09 reuse boundary review

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/**"
      - "eksamio-learning-engine/russian-program/object-review/**"
      - "eksamio-learning-engine/russian-program/production-learning-content/**"
      - "eksamio-learning-engine/russian-program/RUSSIAN-FULL-SUBJECT-PROGRAM-v1.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/119-RUSSIAN-EXCEPTIONS-PRACTICE-CURRENT-CORRECTED-MANIFEST.json"
      - "eksamio-learning-engine/russian-program/semantic-registry/RUSSIAN-RU1-121-CARD-ADMISSION-DECISION-v1.0.json"
      - ".github/workflows/russian-ru08-orthography-boundary-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru08-ru09-reuse-boundary-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU08 and RU09 review builders
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru08_orthography_reuse_first_boundary_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru09_syntax_reuse_first_boundary_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru09_candidate_content_gap_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru09_syntax_production_content.py
      - name: Build deterministic RU08 boundary review twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru08_orthography_reuse_first_boundary_review.py --output /tmp/ru08-a.json > /tmp/ru08-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru08_orthography_reuse_first_boundary_review.py --output /tmp/ru08-b.json > /tmp/ru08-b.txt
          cmp /tmp/ru08-a.json /tmp/ru08-b.json
          diff -u /tmp/ru08-a.txt /tmp/ru08-b.txt
          cat /tmp/ru08-a.txt
          cp /tmp/ru08-a.json eksamio-learning-engine/russian-program/subject-admission/RU08-ORTHOGRAPHY-REUSE-FIRST-BOUNDARY-REVIEW.json
      - name: Validate fail-closed RU08 review contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('eksamio-learning-engine/russian-program/subject-admission/RU08-ORTHOGRAPHY-REUSE-FIRST-BOUNDARY-REVIEW.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          s = data['summary']
          assert data['schema_version'] == '0.1.0'
          assert data['status'] == 'CENTRAL_BRAIN_RU08_ORTHOGRAPHY_REUSE_FIRST_OBJECT_REVIEW_IN_PROGRESS_NO_NEW_ADMISSION'
          assert data['module_id'] == 'RU-PROG-08'
          assert data['module_binding_mode'] == 'CANONICAL_185_SCHOOL_SET_CROSSWALK_BINDING'
          assert data['reuse_pool']['canonical_school_identities'] == 185
          assert data['reuse_pool']['reviewed_active_exception_practice_cards'] == 121
          assert data['reuse_pool']['asset_presence_is_coverage'] is False
          assert s['official_admission_units_in_module_slice'] > 0
          assert s['official_unique_requirements_in_module_slice'] > 0
          assert s['pending_exact_reuse_units'] + s['exact_object_bound_units_already_accepted'] == s['official_admission_units_in_module_slice']
          assert s['pending_exact_reuse_requirements'] + s['exact_object_bound_requirements_already_accepted'] == s['official_unique_requirements_in_module_slice']
          assert s['new_semantic_admissions'] == 0
          assert s['new_object_level_closures'] == 0
          assert s['false_exact_mastery_admissions'] == 0
          assert data['policy']['reuse_first'] is True
          assert data['policy']['module_membership_implies_exact_mapping'] is False
          assert data['policy']['keyword_or_fuzzy_inference_allowed'] is False
          print('RU08_ORTHOGRAPHY_FAIL_CLOSED_CONTRACT=PASS')
          PY
      - name: Build deterministic RU09 boundary review twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru09_syntax_reuse_first_boundary_review.py --output /tmp/ru09-a.json > /tmp/ru09-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru09_syntax_reuse_first_boundary_review.py --output /tmp/ru09-b.json > /tmp/ru09-b.txt
          cmp /tmp/ru09-a.json /tmp/ru09-b.json
          diff -u /tmp/ru09-a.txt /tmp/ru09-b.txt
          cat /tmp/ru09-a.txt
          cp /tmp/ru09-a.json eksamio-learning-engine/russian-program/subject-admission/RU09-SYNTAX-REUSE-FIRST-BOUNDARY-REVIEW.json
      - name: Validate fail-closed RU09 review contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('eksamio-learning-engine/russian-program/subject-admission/RU09-SYNTAX-REUSE-FIRST-BOUNDARY-REVIEW.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          s = data['summary']
          assert data['schema_version'] == '0.1.0'
          assert data['status'] == 'CENTRAL_BRAIN_RU09_SYNTAX_REUSE_FIRST_BOUNDARY_REVIEW_IN_PROGRESS_NO_NEW_ADMISSION'
          assert data['module_id'] == 'RU-PROG-09'
          assert data['module_binding_mode'] == 'MIXED_CANONICAL_AND_DRAFT_CANDIDATE_BINDING'
          assert data['domains'] == ['syntactic_norms', 'syntax']
          assert data['reuse_pool']['canonical_school_identities'] == 185
          assert data['reuse_pool']['ru1_admitted_identities'] == 12
          assert data['reuse_pool']['reviewed_active_exception_practice_cards'] == 121
          assert s['official_admission_units_in_module_slice'] > 0
          assert s['official_unique_requirements_in_module_slice'] > 0
          assert s['draft_subject_candidates'] == 5
          assert s['source_verified_taxonomy_backings'] == 5
          assert len(data['candidate_boundary']) == 5
          assert {row['candidate_ref'] for row in data['candidate_boundary']} == {
              'candidate-028', 'candidate-029', 'candidate-030', 'candidate-031', 'candidate-032'
          }
          assert all(row['candidate_review_status'] == 'draft' for row in data['candidate_boundary'])
          assert all(row['taxonomy_source_status'] == 'current_source_verified' for row in data['candidate_boundary'])
          assert all(row['review_disposition'] == 'REUSE_FIRST_EXACT_BOUNDARY_REVIEW_REQUIRED_NOT_ADMITTED' for row in data['candidate_boundary'])
          assert s['pending_exact_review_units'] + s['exact_object_bound_units_already_accepted'] == s['official_admission_units_in_module_slice']
          assert s['pending_exact_review_requirements'] + s['exact_object_bound_requirements_already_accepted'] == s['official_unique_requirements_in_module_slice']
          assert s['new_semantic_admissions'] == 0
          assert s['new_object_level_closures'] == 0
          assert s['false_exact_mastery_admissions'] == 0
          assert data['policy']['reuse_first'] is True
          assert data['policy']['draft_candidate_is_canonical'] is False
          assert data['policy']['ege_taxonomy_node_is_universal_semantic_identity'] is False
          assert data['policy']['exact_taxonomy_backing_can_support_subject_review_but_not_self_admission'] is True
          assert data['policy']['module_membership_implies_exact_mapping'] is False
          assert data['policy']['keyword_or_fuzzy_inference_allowed'] is False
          assert data['policy']['semantic_acceptance_can_reduce_object_counts_without_exact_binding'] is False
          print('RU09_SYNTAX_FAIL_CLOSED_CONTRACT=PASS')
          PY
      - name: Validate RU09 production learner content twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru09_syntax_production_content.py > /tmp/ru09-content-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru09_syntax_production_content.py > /tmp/ru09-content-b.txt
          diff -u /tmp/ru09-content-a.txt /tmp/ru09-content-b.txt
          cat /tmp/ru09-content-a.txt
      - name: Prove RU09 production content-gap closure twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru09_candidate_content_gap_review.py --output /tmp/ru09-gap-a.json > /tmp/ru09-gap-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru09_candidate_content_gap_review.py --output /tmp/ru09-gap-b.json > /tmp/ru09-gap-b.txt
          cmp /tmp/ru09-gap-a.json /tmp/ru09-gap-b.json
          diff -u /tmp/ru09-gap-a.txt /tmp/ru09-gap-b.txt
          cat /tmp/ru09-gap-a.txt
          cp /tmp/ru09-gap-a.json eksamio-learning-engine/russian-program/subject-admission/RU09-CANDIDATE-CONTENT-GAP-REVIEW.json
      - name: Validate RU09 content-gap closure boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('eksamio-learning-engine/russian-program/subject-admission/RU09-CANDIDATE-CONTENT-GAP-REVIEW.json').read_text(encoding='utf-8'))
          s = data['summary']
          assert data['schema_version'] == '0.1.0'
          assert data['status'] == 'CENTRAL_BRAIN_RU09_CONTENT_GAP_REVIEW_COMPLETE_NO_ADMISSION'
          assert data['module_id'] == 'RU-PROG-09'
          assert s['draft_candidates_reviewed'] == 5
          assert s['candidates_with_source_verified_taxonomy_backing'] == 5
          assert s['candidates_with_existing_production_bundle'] == 5
          assert s['confirmed_production_content_gaps'] == 0
          assert s['candidates_with_supporting_current_exception_practice_or_trainer_assets'] == 5
          assert s['new_semantic_admissions'] == 0
          assert s['new_object_level_closures'] == 0
          assert s['false_exact_mastery_admissions'] == 0
          assert len(data['candidates']) == 5
          assert {row['candidate_ref'] for row in data['candidates']} == {
              'candidate-028', 'candidate-029', 'candidate-030', 'candidate-031', 'candidate-032'
          }
          assert all(row['candidate_status'] == 'draft_not_admitted' for row in data['candidates'])
          assert all(row['content_gap_status'] == 'PRODUCTION_LEARNER_CONTENT_PRESENT_REQUIRES_EXACT_SCOPE_REVIEW' for row in data['candidates'])
          assert all(row['admission_effect'] == 'NONE' for row in data['candidates'])
          assert data['policy']['reuse_check_precedes_new_content'] is True
          assert data['policy']['supporting_exception_or_practice_item_is_full_production_bundle'] is False
          assert data['policy']['trainer_item_semantic_ref_is_subject_admission'] is False
          assert data['policy']['content_presence_is_semantic_admission'] is False
          assert data['policy']['content_gap_proves_semantic_uniqueness'] is False
          assert data['policy']['new_content_may_self_admit_candidate'] is False
          assert data['policy']['keyword_or_fuzzy_semantic_inference_allowed'] is False
          print('RU09_CONTENT_GAP_CLOSURE_FAIL_CLOSED_CONTRACT=PASS')
          PY
      - name: Upload RU08 and RU09 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru08-ru09-reuse-boundary-review
          path: |
            eksamio-learning-engine/russian-program/subject-admission/RU08-ORTHOGRAPHY-REUSE-FIRST-BOUNDARY-REVIEW.json
            eksamio-learning-engine/russian-program/subject-admission/RU09-SYNTAX-REUSE-FIRST-BOUNDARY-REVIEW.json
            eksamio-learning-engine/russian-program/subject-admission/RU09-CANDIDATE-CONTENT-GAP-REVIEW.json
            eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-09-SYNTAX-NORMS-WAVE-001-v0.1.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
