name: Russian OGE 6.4 soft-sign owner resolution

on:
  pull_request:
    paths:
      - ".github/workflows/russian-oge-6-4-soft-sign-owner-resolution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-semantic-candidate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'brain/sep1-russian-subject-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exact OGE 6.4 semantic authority candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor b3ca7e0552f4d4a7342998d16a0cd9f2f5348d83 HEAD
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/brain_oge64_atomic_sync_once.py')
          text = p.read_text(encoding='utf-8')
          old_assert = 'assert s["canonical_component_refs_reused_unique"] == 56'
          old_print = 'print("unique_school_refs=56")'
          assert text.count(old_assert) == 1
          assert text.count(old_print) == 1
          text = text.replace(old_assert, 'assert s["canonical_component_refs_reused_unique"] == 55', 1)
          text = text.replace(old_print, 'print("unique_school_refs=55")', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python3 .github/scripts/brain_oge64_atomic_sync_once.py
          git diff --check
          if git diff --name-only | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Protected accepted Russian surface changed.' >&2
            exit 1
          fi
      - name: Reduce candidate to semantic authority only
        shell: bash
        run: |
          set -euo pipefail
          git restore -- .github
          find eksamio-learning-engine -type d -name __pycache__ -prune -exec rm -rf {} +
          find eksamio-learning-engine -type f -name '*.pyc' -delete
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json
          eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/build_oge_6_4_soft_sign_owner_frontier_proof.py
          eksamio-learning-engine/russian-program/subject-admission/build_oge_6_4_soft_sign_owner_resolution_review.py
          eksamio-learning-engine/russian-program/subject-admission/build_russian_oge_exact_component_acceptance.py
          eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_base.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          cat /tmp/actual.txt
      - name: Publish semantic-only isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Eksamio Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json \
            eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json \
            eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json \
            eksamio-learning-engine/russian-program/subject-admission/build_oge_6_4_soft_sign_owner_frontier_proof.py \
            eksamio-learning-engine/russian-program/subject-admission/build_oge_6_4_soft_sign_owner_resolution_review.py \
            eksamio-learning-engine/russian-program/subject-admission/build_russian_oge_exact_component_acceptance.py \
            eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_base.py
          git diff --cached --check
          git commit -m "russian: exact-accept OGE 6.4 semantic authority candidate"
          git push origin HEAD:refs/heads/brain/tmp-oge64-sync-candidate
