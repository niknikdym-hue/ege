name: physics-2026-tools-runner
on:
  push:
    branches:
      - chatgpt/physics-2026-source-visual-tools-fix-20260819
permissions:
  contents: write
jobs:
  tools:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Physics 2026 exam tools') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - shell: bash
        run: |
          set -euo pipefail
          python tmp-physics-2026-tools-patch.py
          node --check /tmp/physics-runtime-with-tools.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-fizika-demoversiya-v3-1-fixed/ege-fizika-demoversiya-T123-06.txt ege-fizika-demoversiya-v3-1-fixed/PHYSICS-2026-EXAM-TOOLS-CONTRACT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Physics 2026 exam tools'
          git push origin HEAD:chatgpt/physics-2026-source-visual-tools-fix-20260819
