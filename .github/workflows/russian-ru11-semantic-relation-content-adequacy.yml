name: Russian RU11 semantic-relation content adequacy

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU11-SEMANTIC-RELATION-CONTENT-ADEQUACY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru11_semantic_relation_content_adequacy.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-SEMANTIC-RELATION-WAVE-005-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-TEXT-COHESION-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - ".github/workflows/russian-ru11-semantic-relation-content-adequacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru11-semantic-relation-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU11 semantic-relation content validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru11_semantic_relation_content_adequacy.py
      - name: Validate candidate-047 content adequacy twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru11_semantic_relation_content_adequacy.py > /tmp/ru11-rel-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru11_semantic_relation_content_adequacy.py > /tmp/ru11-rel-b.txt
          diff -u /tmp/ru11-rel-a.txt /tmp/ru11-rel-b.txt
          cat /tmp/ru11-rel-a.txt
      - name: Require fail-closed candidate-047 content boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('eksamio-learning-engine/russian-program/subject-admission/RU11-SEMANTIC-RELATION-CONTENT-ADEQUACY-REVIEW-v0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'CENTRAL_BRAIN_RU11_SEMANTIC_RELATION_CONTENT_ADEQUACY_REVIEW_COMPLETE_NO_ADMISSION'
          s = d['source_identity']
          assert s['candidate_ref'] == 'candidate-047'
          assert s['source_taxonomy_id'] == 'semantic_relation_between_sentences'
          assert s['inventory_review_status'] == 'draft'
          assert s['skill_graph_evidence_status'] == 'confirmed'
          assert s['taxonomy_backing_review_status'] == 'source_verified'
          r = d['review_decision']
          assert r['content_exact_for_current_candidate_047_source_meaning'] is True
          assert r['source_candidate_inventory_status_preserved_as_draft'] is True
          assert r['semantic_admission_by_this_review'] is False
          assert r['object_level_admission_units_closed'] == 0
          assert r['object_level_requirements_closed'] == 0
          assert r['false_exact_mastery_admissions'] == 0
          assert r['next_status'] == 'READY_FOR_SEPARATE_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_WITH_DRAFT_CANDIDATE_GUARD'
          print('RU11_SEMANTIC_RELATION_FAIL_CLOSED_CONTENT_GUARD=PASS')
          PY
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda or audited trainer source changed in RU11 semantic-relation content review.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
