name: physics-2026-crop-preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'chatgpt/physics-2026-source-visual-tools-fix-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact-source crop preview
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pymupdf pillow >/dev/null
          python - <<'PY'
          from pathlib import Path
          import fitz, json
          from PIL import Image,ImageOps,ImageDraw
          from io import BytesIO
          pdf=Path('ege-fizika-demoversiya-v3-1-fixed/source/ege-2026-fizika-demoversiya.pdf')
          out=Path('/tmp/physics-crops'); out.mkdir(parents=True,exist_ok=True)
          # rects are on unrotated logical half-pages, measured from the half-page origin.
          C=[
          ('t01-prompt',6,1,(318.61,142.07,408.40,307.93),12),
          ('t02-prompt',6,1,(190.04,265.29,222.12,379.13),12),
          ('t06-prompt-main',8,2,(148.53,78.19,364.81,163.47),10),
          ('t06-prompt-trajectory',8,2,(445.28,302.55,530.59,380.45),10),
          ('t07-prompt',9,1,(449.67,296.97,527.24,385.89),10),
          ('t08-prompt',9,1,(317.99,296.64,396.52,376.29),10),
          ('t10-prompt',10,2,(448.59,343.11,525.92,386.37),9),
          ('t19-prompt',13,1,(114.33,147.17,301.35,295.03),8),
          ('t21-prompt',15,1,(309.88,134.38,409.52,316.72),10),
          ('t22-prompt',15,1,(143.77,302.11,209.91,403.40),9),
          ('t23-prompt',16,2,(477.77,325.07,529.10,383.68),8),
          ('t25-prompt',16,2,(193.48,298.99,280.08,356.94),9),
          ('t26v2-prompt',17,1,(326.69,247.30,376.32,365.19),9),
          ('t26v3-prompt',18,2,(204.99,93.63,397.35,356.53),5),
          ('t21-solution',22,2,(448.88,193.35,509.77,271.75),9),
          ('t22-solution',23,1,(328.42,296.11,394.53,397.44),8),
          ('t24-solution-a',27,1,(391.72,281.37,421.27,382.62),7),
          ('t24-solution-b',27,1,(272.67,310.34,380.62,353.64),7),
          ('t25-solution',29,1,(109.53,143.57,173.12,332.09),9),
          ('t26v2-solution',35,1,(46.74,245.19,117.03,382.62),8),
          ('t26v3-solution',39,1,(361.98,68.07,409.89,242.13),8),
          ]
          doc=fitz.open(pdf)
          rows=[]; images=[]
          for name,logical,slot,b,pad in C:
              physical=(logical+1)//2; page=doc[physical-1]; rot=page.rotation; page.set_rotation(0); r=page.rect
              yoff=0 if slot==1 else r.height/2
              x0,y0,x1,y1=b
              rect=fitz.Rect(max(0,x0-pad),max(yoff,yoff+y0-pad),min(r.width,x1+pad),min(yoff+r.height/2,yoff+y1+pad))
              pix=page.get_pixmap(matrix=fitz.Matrix(3,3),clip=rect,alpha=False)
              im=Image.open(BytesIO(pix.tobytes('png'))).convert('RGB').rotate(-90,expand=True)
              p=out/(name+'.webp'); im.save(p,'WEBP',quality=92,method=6)
              rows.append({'name':name,'logical_page':logical,'physical_page':physical,'slot':slot,'rect_unrotated':[round(v,2) for v in rect],'pixels':[im.width,im.height]})
              thumb=ImageOps.contain(im,(430,280)); card=Image.new('RGB',(460,330),'white'); card.paste(thumb,((460-thumb.width)//2,8)); d=ImageDraw.Draw(card); d.text((10,300),f'{name}  {im.width}x{im.height}',fill='black'); images.append(card)
              page.set_rotation(rot)
          cols=2; rowsn=(len(images)+1)//2; sheet=Image.new('RGB',(cols*460,rowsn*330),(235,235,235))
          for i,im in enumerate(images): sheet.paste(im,((i%2)*460,(i//2)*330))
          sheet.save(out/'CONTACT-SHEET.jpg',quality=91)
          (out/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: physics-2026-crop-preview
          path: /tmp/physics-crops
          if-no-files-found: error
