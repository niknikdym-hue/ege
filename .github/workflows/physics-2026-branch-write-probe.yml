name: physics-2026-branch-write-probe
on:
  push:
    branches:
      - chatgpt/physics-2026-source-visual-tools-fix-20260819
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          printf 'branch-write-pass\n' > .physics-2026-branch-write-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .physics-2026-branch-write-result
          git commit -m 'Record Physics branch write probe'
          git push origin HEAD:chatgpt/physics-2026-source-visual-tools-fix-20260819
