name: Russian RU11 content-statement semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU11-CONTENT-STATEMENT-VERIFICATION-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru11_content_statement_verification_bounded_subject_semantics.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-CONTENT-STATEMENT-VERIFICATION-WAVE-003-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-TEXT-COHESION-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/RUSSIAN-FULL-SUBJECT-PROGRAM-v1.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - ".github/workflows/russian-ru11-content-statement-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru11-content-statement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU11 content-statement acceptance validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru11_content_statement_verification_bounded_subject_semantics.py
      - name: Validate bounded candidate-043 acceptance twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_ru11_content_statement_verification_bounded_subject_semantics.py" > /tmp/ru11-statement-a.txt
          python3 "$root/validate_ru11_content_statement_verification_bounded_subject_semantics.py" > /tmp/ru11-statement-b.txt
          diff -u /tmp/ru11-statement-a.txt /tmp/ru11-statement-b.txt
          cat /tmp/ru11-statement-a.txt
      - name: Require fail-closed candidate-043 boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('eksamio-learning-engine/russian-program/subject-admission/RU11-CONTENT-STATEMENT-VERIFICATION-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'CENTRAL_BRAIN_ACCEPTED_RU11_CONTENT_STATEMENT_VERIFICATION_BOUNDED_SUBJECT_SEMANTIC'
          assert len(d['decisions']) == 1
          row = d['decisions'][0]
          assert row['candidate_ref'] == 'candidate-043'
          assert row['source_taxonomy_id'] == 'content_statement_verification'
          assert row['accepted_semantic_id'] == 'ru-text-content-statement-verification'
          assert row['source_evidence_status'] == 'confirmed'
          assert row['excluded_adjacent_candidate_refs'] == [
              'candidate-001','candidate-002','candidate-003','candidate-004','candidate-005',
              'candidate-006','candidate-007','candidate-044','candidate-045','candidate-046','candidate-047'
          ]
          s = d['summary']
          assert s['accepted_bounded_subject_semantics'] == 1
          assert s['adjacent_candidates_admitted'] == 0
          assert s['object_level_admission_units_closed'] == 0
          assert s['object_level_requirements_closed'] == 0
          assert s['false_exact_mastery_admissions'] == 0
          assert d['reuse_first_decision']['existing_explanation_object_is_exact_candidate_043_mastery_evidence'] is False
          assert d['reuse_first_decision']['related_existing_unit_is_exact_candidate_043_mastery_evidence'] is False
          assert d['policy']['generic_task23_result_can_emit_exact_component_mastery'] is False
          assert d['policy']['component_specific_independent_evidence_required'] is True
          print('RU11_CONTENT_STATEMENT_FAIL_CLOSED_GUARD=PASS')
          PY
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda or audited trainer source changed in RU11 candidate-043 acceptance slice.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
