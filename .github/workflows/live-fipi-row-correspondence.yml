name: Live FIPI row correspondence probe

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/peis-integration-reference/probe_live_fipi_row_correspondence.mjs'
      - '.github/workflows/live-fipi-row-correspondence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Probe live trainer rows against official FIPI 2026 rows
        shell: bash
        run: |
          set -euo pipefail
          node eksamio-learning-engine/peis-integration-reference/probe_live_fipi_row_correspondence.mjs
          python - <<'PY'
          import json
          p=json.load(open('live-fipi-row-correspondence.json', encoding='utf-8'))
          assert p['dictionary_words']['live_count'] == 308
          assert p['dictionary_words']['source_count'] == 308
          assert p['phraseology']['live_count'] == 285
          assert p['phraseology']['source_count'] == 285
          assert p['dictionary_words']['exact_index_status'] in {'EXACT_ROW_BY_ROW','MISMATCH_BLOCKER'}
          assert p['phraseology']['exact_index_status'] in {'EXACT_ROW_BY_ROW','MISMATCH_BLOCKER'}
          assert p['semantic_admissions'] == 0
          assert p['object_closures'] == 0
          assert p['mastery_admissions'] == 0
          assert p['false_exact_mastery'] == 0
          assert p['registered_user_identity_required_for_future_canonical_evidence'] is True
          print('Live/FIPI row correspondence fail-closed probe PASS')
          print('dictionary', p['dictionary_words']['exact_index_status'], p['dictionary_words']['exact_index_match_count'], '/', p['dictionary_words']['live_count'])
          print('phraseology', p['phraseology']['exact_index_status'], p['phraseology']['exact_index_match_count'], '/', p['phraseology']['live_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-fipi-row-correspondence
          path: live-fipi-row-correspondence.json
          if-no-files-found: warn
