name: Russian RU01 sound changes P187 4.1.3 exact acceptance

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-P187-4-1-3-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v15.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v14.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-IN-SPEECH-FLOW-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-CHANGES-WAVE-003-v0.1.json'
      - '.github/workflows/russian-ru01-sound-changes-p187-4-1-3-exact-acceptance.yml'
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-P187-4-1-3-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v15.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v14.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-IN-SPEECH-FLOW-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-CHANGES-WAVE-003-v0.1.json'
      - '.github/workflows/russian-ru01-sound-changes-p187-4-1-3-exact-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-ru01-sound-changes-p187-4-1-3-object-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild accepted current-v15 progress deterministically
        run: |
          set -euo pipefail
          root=eksamio-learning-engine/russian-program/subject-admission
          python -m py_compile "$root/build_russian_semantic_acceptance_progress_launch_current_v15.py"
          python "$root/build_russian_semantic_acceptance_progress_launch_current_v15.py" --output /tmp/progress-v15-a.json
          python "$root/build_russian_semantic_acceptance_progress_launch_current_v15.py" --output /tmp/progress-v15-b.json
          cmp /tmp/progress-v15-a.json /tmp/progress-v15-b.json

      - name: Verify exact P187 4.1.3 sound-changes acceptance and bounded aggregate delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/progress-v15-a.json',encoding='utf-8'))
          s=d['progress_summary']
          expected={
              'semantic_units_with_accepted_component_sets':39,
              'semantic_requirements_with_accepted_component_sets':39,
              'semantic_units_remaining_without_accepted_component_set':1277,
              'semantic_requirements_remaining_without_accepted_component_set':1352,
              'subject_disposed_units_total':40,
              'subject_disposed_requirements_total':40,
              'subject_review_units_remaining':1276,
              'subject_review_requirements_remaining':1351,
              'canonical_component_refs_reused_unique':120,
              'review_groups_with_accepted_component_sets':14,
              'accepted_bounded_ru_route_semantics':9,
              'accepted_bounded_ru_subject_semantics':68,
              'accepted_bounded_ru_semantics_total':77,
              'false_exact_mastery_admissions':0,
          }
          for k,v in expected.items():
              assert s[k]==v,(k,s[k],v)
          assert d['schema_version']=='0.18.0'
          assert len(d['accepted_authorities'])==62
          assert d['base_current_launch_progress_v14_head_sha']=='7a02c9f3a1a3516981b289a2c106ae3e07437e4c'
          assert d['base_current_launch_progress_v14_builder_git_blob_sha1']=='fbad60c5a754ca8bfc526b04e093ff717e888f8e'
          assert d['base_current_launch_progress_v14_normalized_sha256']=='8fdbddca8834effcddd3fa5b5095537e397d973d49bae5941361aaf1399e5d40'
          groups=[x for x in d['semantic_review_groups'] if x.get('group_id')=='RUS-SEM-REVIEW-001']
          assert len(groups)==1
          g=groups[0]
          assert g['accepted_component_set_count']==10
          aid='RU01_SOUND_CHANGES_P187_4_1_3_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1'
          rows=[x for x in g['accepted_component_sets'] if x.get('accepted_authority_id')==aid]
          assert len(rows)==1
          row=rows[0]
          assert row['admission_unit_id']=='RAU-b1ba48cb81e96255122a'
          assert row['requirement_id']=='RSK-EDSOO59-4-1-3-P187'
          assert row['canonical_component_refs']==['ru-phonetics-sound-changes-in-speech-flow']
          assert row['authority']['component_specific_independent_evidence_items']==6
          assert row['mastery_boundary']['accepted_bounded_subject_semantic_required'] is True
          assert row['mastery_boundary']['component_specific_independent_evidence_required'] is True
          assert row['mastery_boundary']['generic_ru01_attempt_can_emit_exact_component_mastery'] is False
          assert row['mastery_boundary']['sound_letter_relation_evidence_can_substitute_for_sound_changes'] is False
          assert row['mastery_boundary']['vowel_consonant_features_evidence_can_substitute_for_sound_changes'] is False
          assert row['mastery_boundary']['word_analysis_evidence_can_substitute_for_sound_changes'] is False
          assert row['mastery_boundary']['phonetic_transcription_evidence_can_substitute_for_sound_changes'] is False
          assert row['mastery_boundary']['normative_pronunciation_or_stress_evidence_can_substitute_for_sound_changes'] is False
          assert row['mastery_boundary']['shared_evidence_can_close_sibling_source_objects_without_separate_acceptance'] is False
          new=d['newly_accepted_exact_object']
          assert new['admission_unit_id']=='RAU-b1ba48cb81e96255122a'
          assert new['requirement_id']=='RSK-EDSOO59-4-1-3-P187'
          assert new['component_specific_independent_evidence_ids']==['p01-u5-v1', 'p01-u5-v2', 'p01-u5-v3', 'p01-u5-v4', 'p01-u5-v5', 'p01-u5-v6']
          assert new['sibling_source_objects_accepted']==0
          assert new['remaining_same_signature_target']=={
              'admission_unit_id':'RAU-f709f1855bb0b8d104bc',
              'requirement_id':'RSK-OGE_COD-4-1-3-P021',
              'status':'PENDING_SEPARATE_EXACT_OBJECT_ACCEPTANCE',
          }
          all_sets=[
              item for group in d['semantic_review_groups']
              for item in group.get('accepted_component_sets',[])
          ]
          assert not any(
              item.get('admission_unit_id')=='RAU-f709f1855bb0b8d104bc'
              or item.get('requirement_id')=='RSK-OGE_COD-4-1-3-P021'
              for item in all_sets
          )
          PY

      - name: Protect public/production surfaces in this bounded wave
        shell: bash
        run: |
          set -euo pipefail
          wave_base='7a02c9f3a1a3516981b289a2c106ae3e07437e4c'
          git merge-base --is-ancestor "$wave_base" HEAD
          recent=$(git diff --name-only "$wave_base"..HEAD)
          allowed=$(cat <<'EOF'
          .github/workflows/russian-ru01-sound-changes-p187-4-1-3-exact-acceptance.yml
          eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-P187-4-1-3-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v15.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "$recent" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed '/^$/d' | sort -u))
          if [[ -n "$unexpected" ]]; then
            echo 'Current sound-changes P187 object wave touched files outside the exact bounded allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$recent" | grep -E 'russkiy-knigi|(^|/)tilda|demo|scor'; then
            echo 'Current sound-changes P187 object wave touched a protected public/production surface.' >&2
            exit 1
          fi

      - name: Diff hygiene for current bounded wave
        run: git diff --check 7a02c9f3a1a3516981b289a2c106ae3e07437e4c..HEAD

      - name: Upload exact current-v15 progress
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-sound-changes-p187-4-1-3-current-exact-acceptance
          path: /tmp/progress-v15-a.json
          if-no-files-found: error
          retention-days: 14
