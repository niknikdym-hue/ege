name: Apply demo catalog update

on:
  pull_request:
    paths:
      - .github/scripts/update_demo_catalog.py
      - .github/workflows/apply-demo-catalog-update.yml
      - site-footer-T123.txt
      - ege-demoversii-T123.txt

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Apply exact updates
        run: python .github/scripts/update_demo_catalog.py

      - name: Validate links and HTML fragments
        run: |
          python - <<'PY'
          from pathlib import Path
          footer = Path('site-footer-T123.txt').read_text(encoding='utf-8')
          catalog = Path('ege-demoversii-T123.txt').read_text(encoding='utf-8')
          urls = [
              'https://eksamio.ru/ege/russkiy/demoversiya/',
              'https://eksamio.ru/ege/fizika/demoversiya/',
              'https://eksamio.ru/ege/khimiya/demoversiya/',
              'https://eksamio.ru/ege/matematika-baza/demoversiya/',
              'https://eksamio.ru/ege/matematika-profil/demoversiya/',
              'https://eksamio.ru/ege/obshchestvoznaniye/demoversiya/',
          ]
          assert all(url in footer for url in urls)
          assert all(url in catalog for url in urls)
          assert catalog.count('<article class="ed-subject ') == 6
          assert 'Для нового предмета скопируйте' not in catalog
          assert catalog.count('<style>') == catalog.count('</style>')
          assert catalog.count('<article') == catalog.count('</article>')
          print('Validation PASS')
          PY

      - name: Upload updated T123 files
        uses: actions/upload-artifact@v4
        with:
          name: updated-demo-navigation-t123
          path: |
            site-footer-T123.txt
            ege-demoversii-T123.txt
          if-no-files-found: error
          retention-days: 7
