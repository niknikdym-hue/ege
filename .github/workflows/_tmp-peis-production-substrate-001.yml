name: Temporary PEIS production substrate validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: peis, POSTGRES_USER: peis_app, POSTGRES_PASSWORD: integration-only-not-a-secret}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peis_app -d peis" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PEIS_TEST_POSTGRES_DSN: postgresql://peis_app:integration-only-not-a-secret@localhost:5432/peis?sslmode=disable
      PEIS_DATABASE_DSN: postgresql://peis_app:integration-only-not-a-secret@localhost:5432/peis?sslmode=disable
      EKSAMIO_PEIS_TRUSTED_HOST_TEST_SECRET: integration-only-runtime-secret-at-least-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r eksamio-learning-engine/peis-production-substrate/requirements.txt
      - run: python eksamio-learning-engine/peis-persistence-reference/validate_peis_persistence_001.py
      - run: python eksamio-learning-engine/peis-service-bridge-reference/validate_peis_service_bridge_001.py
      - run: python eksamio-learning-engine/peis-trusted-host-reference/validate_peis_trusted_host_001.py
      - run: node eksamio-learning-engine/peis-browser-hook-reference/validate_peis_browser_hook_001.mjs
      - run: python eksamio-learning-engine/peis-production-substrate/validate_postgres_integration.py
      - run: docker build -f eksamio-learning-engine/peis-production-substrate/Dockerfile -t peis-substrate:ci eksamio-learning-engine
      - name: container health readiness and kill switch
        run: |
          docker run -d --name peis-substrate --network host -e PEIS_DATABASE_DSN -e PEIS_NETWORK_WRITES_ENABLED=false peis-substrate:ci
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v0/checked-card -d '{}')" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v0/checked-card -H 'Content-Length: 262145')" = 413
          docker stop peis-substrate
      - name: readiness fails when database is unavailable
        run: |
          docker run -d --name peis-unready -p 18081:8080 -e PEIS_DATABASE_DSN=postgresql://bad:bad@127.0.0.1:6543/bad peis-substrate:ci || true
          sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/readyz || true)" != 200
