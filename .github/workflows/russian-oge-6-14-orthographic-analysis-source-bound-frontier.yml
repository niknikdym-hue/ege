name: Russian OGE 6.14 orthographic analysis source-bound composite frontier

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_orthographic_analysis_source_bound_frontier_review.py"
      - ".github/workflows/russian-oge-6-14-orthographic-analysis-source-bound-frontier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bound-composite-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic OGE 6.14 source frontier twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_oge_6_14_orthographic_analysis_source_bound_frontier_review.py"
          python3 "$root/build_oge_6_14_orthographic_analysis_source_bound_frontier_review.py" --output /tmp/oge-6-14-a.json > /tmp/oge-6-14-a.txt
          python3 "$root/build_oge_6_14_orthographic_analysis_source_bound_frontier_review.py" --output /tmp/oge-6-14-b.json > /tmp/oge-6-14-b.txt
          cmp /tmp/oge-6-14-a.json /tmp/oge-6-14-b.json
          diff -u /tmp/oge-6-14-a.txt /tmp/oge-6-14-b.txt
          cat /tmp/oge-6-14-a.txt
      - name: Verify fail-closed composite frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/oge-6-14-a.json').read_text(encoding='utf-8'))
          src=d['official_source']
          hist=d['historical_overlay']
          frontier=d['composite_frontier']
          safety=d['safety']
          assert d['status']=='SOURCE_BOUND_COMPOSITE_FRONTIER_ONLY_COMPONENT_DERIVATION_REQUIRED'
          assert src['source_system']=='OGE_COD'
          assert src['cycle']==2026
          assert src['code']=='6.14'
          assert src['label']=='Орфографический анализ'
          assert src['explicit_subbranches']==[]
          assert src['fabricated_subcodes']==0
          assert hist['classification']=='EXAM_ONLY_COMPOSITE'
          assert hist['topic']=='orthographic analysis'
          assert hist['placeholder_owner']=='all applicable active orthography identities'
          assert hist['placeholder_is_canonical_identity'] is False
          assert hist['school_count_effect']==0
          assert frontier['new_canonical_identity_required'] is False
          assert frontier['exact_component_refs_accepted_now']==[]
          assert frontier['exact_component_acceptance_count']==0
          assert frontier['applicable_component_refs']==[]
          assert frontier['applicable_component_count']==0
          assert frontier['component_set_status']=='UNRESOLVED_DETERMINISTIC_DERIVATION_REQUIRED'
          assert safety['semantic_admissions']==0
          assert safety['object_closures']==0
          assert safety['new_school_identities']==0
          assert safety['school_reopen']==0
          assert safety['false_exact_mastery_admissions']==0
          assert safety['learner_audio_persistence']==0
          assert safety['accepted_demo_or_scorer_change'] is False
          assert safety['production_peis_write'] is False
          assert safety['provider_execution'] is False
          assert safety['public_traffic'] is False
          print('OGE_6_14_COMPOSITE_PLACEHOLDER_CANONICAL_IDENTITY=0')
          print('OGE_6_14_EXACT_COMPONENT_ADMISSIONS=0')
          print('OGE_6_14_OBJECT_CLOSURES=0')
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          print('LEARNER_AUDIO_PERSISTENCE=0')
          print('RUSSIAN_OGE_6_14_SOURCE_BOUND_COMPOSITE_FRONTIER_GUARD=PASS')
          PY
      - name: Upload source-bound composite frontier
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-14-source-bound-composite-frontier
          path: /tmp/oge-6-14-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
