name: Locate old mathematics package references

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/math-base-old-marker-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate exact old-package marker
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('ege-matematika-baza-demoversiya-2026')
          marker='v2.6-'+'literal-'+'audited'
          hits=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.txt','.json','.py','.js','.html','.yml','.md'}:
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              if marker in text:
                  hits.append(p.relative_to(root).as_posix())
          Path('math-base-old-marker-hits.txt').write_text('\n'.join(hits)+'\n',encoding='utf-8')
          print(hits)
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-base-old-marker-hits.txt
          git commit -m 'Record old mathematics package reference locations' || true
          git push origin HEAD:main
