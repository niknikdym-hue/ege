name: Temporary Russian v4.2 multifile spellcheck
on:
  push:
    branches: [main]
    paths:
      - tmp-russian-v42-multifile-spellcheck.py
      - .github/workflows/tmp-russian-v42-multifile-spellcheck.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tmp-russian-v42-multifile-spellcheck.py
      - name: Fix addon observer loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ege-russkiy-demoversiya-2026-v4.2/ege-russkiy-demoversiya-T123-07.txt')
          s=p.read_text(encoding='utf-8')
          old='if(btn){btn.disabled=state.status==="checking";btn.textContent=state.status==="checking"?"Проверяю…":(state.status==="complete"?"Проверить ещё раз":"Проверить текст");}if(st)st.textContent=state.message||(api&&essayText().trim()?"Быстрая проверка выполнена. Дополнительная проверка орфографии ещё не запускалась.":"Сначала введите текст сочинения.");'
          new='var wantText=state.status==="checking"?"Проверяю…":(state.status==="complete"?"Проверить ещё раз":"Проверить текст");if(btn){btn.disabled=state.status==="checking";if(btn.textContent!==wantText)btn.textContent=wantText;}var wantStatus=state.message||(api&&essayText().trim()?"Быстрая проверка выполнена. Дополнительная проверка орфографии ещё не запускалась.":"Сначала введите текст сочинения.");if(st&&st.textContent!==wantStatus)st.textContent=wantStatus;'
          if old not in s: raise SystemExit('observer-loop anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Refresh manifest after addon fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('ege-russkiy-demoversiya-2026-v4.2')
          p=b/'MANIFEST-SHA256.txt';s=p.read_text(encoding='utf-8')
          f='ege-russkiy-demoversiya-T123-07.txt';h=hashlib.sha256((b/f).read_bytes()).hexdigest()
          import re
          s=re.sub(r'^[0-9a-f]{64}  '+re.escape(f)+r'$',h+'  '+f,s,flags=re.M)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
          PW_CHROMIUM=$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          p=sync_playwright().start();print(p.chromium.executable_path);p.stop()
          PY
          )
          sudo ln -sf "$PW_CHROMIUM" /usr/bin/chromium
      - name: Full regression
        working-directory: ege-russkiy-demoversiya-2026-v4.2
        run: |
          node test-russian-data.js
          node test-russian-v4.js
          python3 visual-contract-audit.py
          node test-russian-task27-v4.2.js
          node test-russian-task27-reset-guard.js
          python3 test-russian-task27-browser.py
          python3 test-browser.py
      - name: Commit changes
        run: |
          git config user.name "niknikdym-hue"
          git config user.email "niknikdym@gmail.com"
          git add ege-russkiy-demoversiya-2026-v4.2
          git commit -m "Add multipage essay scans and explicit spelling check"
          git push origin main
