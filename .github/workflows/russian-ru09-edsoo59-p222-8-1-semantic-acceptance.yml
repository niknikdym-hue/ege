name: Russian RU09 EDSOO59 p222 8.1 bounded semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU09-EDSOO59-P222-8-1-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru09_edsoo59_p222_8_1_semantic_acceptance.py"
      - ".github/workflows/russian-ru09-edsoo59-p222-8-1-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-semantic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile exact validators
        run: |
          python -m py_compile \
            eksamio-learning-engine/russian-program/subject-admission/validate_ru09_edsoo59_p222_8_1_candidate_content.py \
            eksamio-learning-engine/russian-program/subject-admission/validate_ru09_edsoo59_p222_8_1_semantic_acceptance.py

      - name: Re-prove bounded content and component evidence inputs
        run: |
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru09_edsoo59_p222_8_1_candidate_content.py

      - name: Validate semantic-only acceptance
        run: |
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru09_edsoo59_p222_8_1_semantic_acceptance.py

      - name: Prove bounded diff and immutable upstream inputs
        env:
          BASE_EXACT: e4085a3f556abb0a077358b2e968b5b4fd320847
        run: |
          git diff --name-only "$BASE_EXACT...HEAD" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/russian-ru09-edsoo59-p222-8-1-semantic-acceptance.yml
          eksamio-learning-engine/russian-program/subject-admission/RU09-EDSOO59-P222-8-1-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/validate_ru09_edsoo59_p222_8_1_semantic_acceptance.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          test -z "$(git diff --name-only "$BASE_EXACT...HEAD" -- \
            eksamio-learning-engine/russian-program/subject-admission/RU09-EDSOO59-P222-8-1-SOURCE-BACKED-OWNER-RESOLUTION-v0.1.json \
            eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-09-EDSOO59-P222-8-1-WAVE-002-v0.1.json \
            eksamio-learning-engine/russian-program/source-knowledge/RUSSIAN-OFFICIAL-SOURCE-MANIFEST-v1.0.json)"

          if grep -E '(^|/)(tilda-ready|site|public|payments|scorer|demo|production-runtime)/' /tmp/actual.txt; then
            echo "Forbidden production/public surface changed"
            exit 1
          fi

      - name: Prove semantic-only effect and object-binding boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("eksamio-learning-engine/russian-program")
          path = root / "subject-admission/RU09-EDSOO59-P222-8-1-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          progress = data["progress_effect"]

          assert progress["semantic_admissions"] == 2
          assert progress["object_level_closures"] == 0
          assert progress["requirement_disposals"] == 0
          assert progress["mastery_admissions"] == 0
          assert progress["false_exact_mastery"] == 0
          assert progress["aggregate_mutated"] is False
          assert progress["current_v30_created"] is False
          assert data["next_required_state"] == "SEMANTIC_CANDIDATES_ACCEPTED_OBJECT_BINDING_STILL_REQUIRED"
          assert data["next_required_gate"]["kind"] == "SEPARATE_EXACT_OBJECT_BINDING_REVIEW"
          assert data["next_required_gate"]["aggregate_or_current_v30_allowed_before_gate_green"] is False

          print("SEMANTIC_ADMISSIONS=2")
          print("OBJECT_LEVEL_CLOSURES=0")
          print("REQUIREMENT_DISPOSALS=0")
          print("MASTERY_ADMISSIONS=0")
          print("FALSE_EXACT_MASTERY=0")
          print("CURRENT_V30_CREATED=0")
          print("OBJECT_BINDING_REQUIRED=1")
          PY

      - name: Diff hygiene
        run: |
          git diff --check e4085a3f556abb0a077358b2e968b5b4fd320847...HEAD
