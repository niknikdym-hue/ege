name: Russian OGE direct-speech exact component acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_oge_direct_speech_exact_component_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-DIRECT-SPEECH-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_subject_accounting_complete.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_packet.py"
      - "eksamio-learning-engine/russian-program/source-knowledge/**"
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/266-RUSSIAN-SCHOOL-FINAL-REFREEZE-AND-FIPI-2026-OVERLAY-CLOSURE-v1.0.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - ".github/workflows/russian-oge-direct-speech-exact-component-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-direct-speech-exact-component:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exact direct-speech acceptance twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_oge_direct_speech_exact_component_acceptance.py --output /tmp/direct-a.json > /tmp/direct-report-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_oge_direct_speech_exact_component_acceptance.py --output /tmp/direct-b.json > /tmp/direct-report-b.txt
          cmp /tmp/direct-a.json /tmp/direct-b.json
          diff -u /tmp/direct-report-a.txt /tmp/direct-report-b.txt
          cmp /tmp/direct-a.json eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-DIRECT-SPEECH-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json
          cat /tmp/direct-report-a.txt
      - name: Verify exact source and mastery boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/direct-a.json').read_text(encoding='utf-8'))
          assert data['status'] == 'CENTRAL_BRAIN_ACCEPTED_EXACT_OGE_DIRECT_SPEECH_CANONICAL_COMPONENT_SLICE'
          assert data['official_oge_codifier_sha256'] == '2d83e987ddad08d405827f98dfa490721f2d67b787b2803d8c499eea7b84858a'
          assert data['object_accounting_sha256'] == 'f3aef83dab99b554a4cdec9ef8d8fbc8036d557182259ae69db182efa11b925c'
          assert data['semantic_packet_sha256'] == 'b35fb420f7a6e96ea11f47e321cae0affe363dc5ed8d6fb79ea8640ac5ac94c4'
          assert data['normalized_sha256'] == 'c7a553c9b95906cf47f045378d260c6719c6a4d8eb1d8fa87229f6ce034e47c7'
          s = data['summary']
          assert s['accepted_admission_units'] == 1
          assert s['accepted_requirements'] == 1
          assert s['accepted_content_codes'] == 1
          assert s['canonical_component_refs_unique'] == 6
          assert s['new_semantic_identities_created'] == 0
          assert s['ru_proposal_identities_admitted'] == 0
          assert s['false_exact_mastery_admissions'] == 0
          assert len(data['decisions']) == 1
          row = data['decisions'][0]
          assert row['content_code'] == '7.24'
          assert row['requirement_id'] == 'RSK-OGE_COD-7-24-P026'
          assert row['admission_unit_id'] == 'RAU-c44b98adfa9351970445'
          assert row['source_id'] == 'FIPI-OGE-RU-2026-FINAL'
          assert row['document_id'] == 'OGE_COD'
          assert row['authority']['packet_group'] == 'RUS-SEM-REVIEW-013'
          assert row['subject_semantic_status'] == 'CENTRAL_BRAIN_ACCEPTED_CANONICAL_COMPONENT_SET'
          assert row['disposition'] == 'PARTIAL_OR_COMPOSITE'
          assert row['mapping_mode'] == 'COMPLETE_EXACT_OVERLAY_FAMILY'
          assert row['canonical_component_refs'] == [
              'school-direct-speech-base-formatting',
              'school-direct-speech-adjacent-author-words-system',
              'school-direct-speech-author-words-middle-system',
              'school-direct-speech-inside-author-words',
              'school-citation-punctuation-formatting',
              'school-dialogue-replica-punctuation',
          ]
          b = row['mastery_boundary']
          assert b['route_or_broad_composite_attempt_can_emit_exact_component_mastery'] is False
          assert b['component_specific_independent_evidence_required'] is True
          assert data['policy']['adjacent_7_25_indirect_speech_expansion_allowed'] is False
          assert data['policy']['broad_punctuation_analysis_route_allowed'] is False
          print('RUSSIAN_OGE_DIRECT_SPEECH_EXACT_COMPONENT_GUARD=PASS')
          PY
      - name: Upload exact direct-speech authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-direct-speech-exact-component-acceptance
          path: /tmp/direct-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
