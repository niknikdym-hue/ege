name: Temporary package Russian v4.2
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create exact folder zip
        run: zip -r ege-russkiy-demoversiya-2026-v4.2.zip ege-russkiy-demoversiya-2026-v4.2
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ege-russkiy-demoversiya-2026-v4.2
          path: ege-russkiy-demoversiya-2026-v4.2.zip
          if-no-files-found: error
