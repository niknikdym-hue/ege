name: Russian RU07 grammar norms reuse-first boundary review

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru07_grammar_norms_candidate_boundary_review.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-07-GRAMMAR-NORMS-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/RUSSIAN-FULL-SUBJECT-PROGRAM-v1.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - ".github/workflows/russian-ru07-grammar-norms-boundary-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru07-grammar-norms-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU07 review builder
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru07_grammar_norms_candidate_boundary_review.py
      - name: Build RU07 reuse-first review twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru07_grammar_norms_candidate_boundary_review.py --output /tmp/ru07-a.json > /tmp/ru07-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru07_grammar_norms_candidate_boundary_review.py --output /tmp/ru07-b.json > /tmp/ru07-b.txt
          cmp /tmp/ru07-a.json /tmp/ru07-b.json
          diff -u /tmp/ru07-a.txt /tmp/ru07-b.txt
          cat /tmp/ru07-a.txt
          cp /tmp/ru07-a.json RU07-GRAMMAR-NORMS-CANDIDATE-BOUNDARY-REVIEW.json
      - name: Verify fail-closed RU07 outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('RU07-GRAMMAR-NORMS-CANDIDATE-BOUNDARY-REVIEW.json').read_text(encoding='utf-8'))
          assert data['status'] == 'CENTRAL_BRAIN_RU07_GRAMMAR_NORMS_REUSE_FIRST_BOUNDARY_REVIEW_ACCEPTANCE_NOT_ADMITTED'
          assert data['module_id'] == 'RU-PROG-07'
          assert data['module_binding_mode'] == 'DRAFT_CANDIDATE_BINDING'
          assert set(data['program_candidate_refs']) == {'candidate-025', 'candidate-026', 'candidate-027', 'candidate-053'}
          assert set(data['proposed_subject_semantic_ids']) == {
              'ru-grammar-numeral-oblique-case',
              'ru-grammar-comparative-degree-norm',
              'ru-grammar-form-selection-common-norms',
          }
          assert len(data['candidate_inventory_snapshot']) == 4
          relations = {row['relation'] for row in data['candidate_relation_decisions']}
          assert relations == {
              'CONTENT_IS_BOUNDED_SUBSET_OF_DRAFT_CANDIDATE',
              'MEANING_ALIGNMENT_CANDIDATE_EXACT_ACCEPTANCE_REVIEW_REQUIRED',
              'COMPOSITE_CROSS_CANDIDATE_CONTENT_NO_SINGLE_EXACT_OWNER',
          }
          reuse = data['reuse_review']
          assert reuse['current_proposed_id_collisions'] == 0
          assert reuse['exact_existing_owner_reuses_admitted'] == 0
          assert reuse['meaning_alignment_candidates_requiring_separate_acceptance'] == 1
          assert reuse['bounded_subset_relations'] == 1
          assert reuse['composite_no_single_owner_relations'] == 1
          assert reuse['school_registry_mutation_required'] is False
          assert reuse['new_parallel_registry_required'] is False
          policy = data['policy']
          assert policy['reuse_first'] is True
          assert policy['candidate_ref_is_canonical_id'] is False
          assert policy['content_presence_implies_acceptance'] is False
          assert policy['module_membership_implies_exact_owner'] is False
          assert policy['subset_evidence_can_admit_broader_candidate'] is False
          assert policy['composite_content_can_emit_single_candidate_mastery'] is False
          assert policy['candidate_alignment_requires_explicit_acceptance_authority'] is True
          assert policy['component_specific_independent_evidence_required'] is True
          assert policy['semantic_acceptance_can_reduce_object_counts_without_exact_binding'] is False
          assert policy['keyword_or_fuzzy_inference_allowed'] is False
          summary = data['summary']
          assert summary == {
              'draft_candidates_reviewed': 4,
              'content_semantics_reviewed': 3,
              'semantic_admissions': 0,
              'object_level_admission_units_closed': 0,
              'object_level_requirements_closed': 0,
              'false_exact_mastery_admissions': 0,
          }
          print('RU07_GRAMMAR_NORMS_FAIL_CLOSED_GUARD=PASS')
          PY
      - name: Upload RU07 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru07-grammar-norms-boundary-review
          path: RU07-GRAMMAR-NORMS-CANDIDATE-BOUNDARY-REVIEW.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
