name: SEP1 Russian 121 Candidate Gate

on:
  push:
    branches:
      - sep1/ru-121-reviewed-checkpoint-import
  pull_request:
    paths:
      - 'eksamio-learning-engine/**'
      - '.github/workflows/sep1-russian-121-candidate-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile bounded builders
        working-directory: eksamio-learning-engine
        run: |
          python -m py_compile \
            build/build_russian_exceptions_practice.py \
            build/build_russian_exceptions_practice_current_corrected_v2.py \
            build/build_russian_exceptions_practice_course_grade.py \
            build/build_russian_exceptions_practice_wave6_candidate.py

      - name: Build isolated reviewed 121 candidate
        working-directory: eksamio-learning-engine
        shell: bash
        run: |
          set +e
          python build/build_russian_exceptions_practice_wave6_candidate.py
          rc=$?
          audit='audits/candidate-wave6/RUSSIAN-EXCEPTIONS-PRACTICE-WAVE6-VALIDATION.txt'
          if [ -f "$audit" ]; then
            echo '--- candidate audit ---'
            cat "$audit"
            echo '--- end candidate audit ---'
          fi
          exit "$rc"

      - name: Verify isolated candidate invariants
        working-directory: eksamio-learning-engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidate_path = Path('build/candidate-wave6/RUSSIAN-EXCEPTIONS-PRACTICE-WAVE6-CANDIDATE.json')
          assert candidate_path.is_file(), candidate_path
          payload = json.loads(candidate_path.read_text(encoding='utf-8'))
          items = payload.get('practice_items', payload.get('items', []))
          rows = list(items.values()) if isinstance(items, dict) else list(items)
          assert len(rows) == 121, f'expected 121 cards, got {len(rows)}'
          ids = [row.get('practice_item_id') for row in rows]
          assert all(isinstance(x, str) and x for x in ids)
          assert len(ids) == len(set(ids)) == 121
          wave6 = [row for row in rows if '-w6-' in row.get('practice_item_id', '')]
          assert len(wave6) == 28, len(wave6)
          assert all(row.get('status') == 'reviewed' for row in wave6)
          represented = {row.get('exception_id') for row in rows if row.get('exception_id')}
          assert len(represented) == 88, len(represented)

          current_manifest = json.loads(Path('119-RUSSIAN-EXCEPTIONS-PRACTICE-CURRENT-CORRECTED-MANIFEST.json').read_text(encoding='utf-8'))
          assert current_manifest['expected_active_items'] == 80, 'candidate gate must not promote current runtime manifest'

          mapping = json.loads(Path('russian-program/RUSSIAN-EXCEPTIONS-121-SEMANTIC-MAPPING-v1.0.json').read_text(encoding='utf-8'))
          mapping_rows = mapping.get('rows') or mapping.get('mappings') or mapping.get('items')
          assert isinstance(mapping_rows, list) and len(mapping_rows) == 121, f'mapping rows={None if mapping_rows is None else len(mapping_rows)}'
          mapped_ids = [row.get('practice_item_id') for row in mapping_rows]
          assert len(mapped_ids) == len(set(mapped_ids)) == 121
          missing = sorted(set(mapped_ids) - set(ids))
          extra = sorted(set(ids) - set(mapped_ids))
          assert not missing and not extra, f'mapping/candidate mismatch missing={missing} extra={extra}'
          print('PASS: isolated 121-card candidate, 88 exception IDs, 28 reviewed Wave6 cards, exact mapping ID coverage; current manifest remains 80')
          PY

      - name: Diff guard
        run: git diff --exit-code
