name: Russian RU01 phonetic transcription semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU01-PHONETIC-TRANSCRIPTION-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru01_phonetic_transcription_bounded_subject_semantics.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_transcription_content_readiness.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_transcription_owner_resolution.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v10.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v11.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETIC-TRANSCRIPTION-WAVE-002-v0.1.json"
      - ".github/workflows/russian-ru01-phonetic-transcription-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru01-phonetic-transcription-semantic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact semantic gate
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru01_phonetic_transcription_bounded_subject_semantics.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v11.py
      - name: Validate bounded transcription semantic acceptance
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru01_phonetic_transcription_bounded_subject_semantics.py
      - name: Build current-v11 twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v11.py --output /tmp/ru-current-v11-a.json > /tmp/ru-current-v11-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v11.py --output /tmp/ru-current-v11-b.json > /tmp/ru-current-v11-b.txt
          cmp /tmp/ru-current-v11-a.json /tmp/ru-current-v11-b.json
          diff -u /tmp/ru-current-v11-a.txt /tmp/ru-current-v11-b.txt
          cat /tmp/ru-current-v11-a.txt
          cp /tmp/ru-current-v11-a.json RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS-LAUNCH-CURRENT-v11.json
      - name: Verify bounded aggregate delta only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS-LAUNCH-CURRENT-v11.json").read_text(encoding="utf-8"))
          assert data["schema_version"] == "0.14.0"
          summary = data["progress_summary"]
          assert len(data["accepted_authorities"]) == 58
          assert summary["accepted_bounded_ru_route_semantics"] == 9
          assert summary["accepted_bounded_ru_subject_semantics"] == 67
          assert summary["accepted_bounded_ru_semantics_total"] == 76
          assert summary["semantic_units_with_accepted_component_sets"] == 36
          assert summary["semantic_requirements_with_accepted_component_sets"] == 36
          assert summary["semantic_units_remaining_without_accepted_component_set"] == 1280
          assert summary["semantic_requirements_remaining_without_accepted_component_set"] == 1355
          assert summary["subject_disposed_units_total"] == 37
          assert summary["subject_disposed_requirements_total"] == 37
          assert summary["subject_review_units_remaining"] == 1279
          assert summary["subject_review_requirements_remaining"] == 1354
          assert summary["canonical_component_refs_reused_unique"] == 118
          assert summary["false_exact_mastery_admissions"] == 0
          new = data["newly_accepted_bounded_subject_semantic"]
          assert new["semantic_id"] == "ru-phonetics-phonetic-transcription-elements"
          assert new["independent_verification_item_ids"] == [
              "p01-u4-v1", "p01-u4-v2", "p01-u4-v3", "p01-u4-v4", "p01-u4-v5"
          ]
          assert new["target_admission_unit_id"] == "RAU-2725ee5b709b70502748"
          assert new["target_requirement_id"] == "RSK-EDSOO59-4-1-4-P187"
          assert new["object_acceptance_effect"] == "NONE_UNTIL_SEPARATE_EXACT_OBJECT_ACCEPTANCE"
          print("RU01_TRANSCRIPTION_SEMANTIC_AGGREGATE_DELTA=PASS")
          PY
      - name: Upload exact semantic acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-phonetic-transcription-semantic-acceptance
          path: RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS-LAUNCH-CURRENT-v11.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
