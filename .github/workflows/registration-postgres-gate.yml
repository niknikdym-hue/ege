name: Registration Postgres gate

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/identity-reference/**'
      - 'eksamio-learning-engine/peis-production-substrate/**'
      - '.github/workflows/registration-postgres-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eksamio
          POSTGRES_PASSWORD: eksamio-ci-only
          POSTGRES_DB: eksamio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eksamio -d eksamio"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      EKSAMIO_TEST_POSTGRES_DSN: postgresql://eksamio:eksamio-ci-only@127.0.0.1:5432/eksamio
      PEIS_DATABASE_DSN: postgresql://eksamio:eksamio-ci-only@127.0.0.1:5432/eksamio
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Postgres runtime dependencies
        run: python3 -m pip install -r eksamio-learning-engine/peis-production-substrate/requirements.txt
      - name: Validate existing registration consent contract
        run: python3 eksamio-learning-engine/identity-reference/validate_registration_consent_001.py
      - name: Validate existing registration HTTP contract
        run: python3 eksamio-learning-engine/identity-reference/validate_registration_http_001.py
      - name: Validate passwordless identity regression
        run: python3 eksamio-learning-engine/identity-reference/validate_passwordless_identity_001.py
      - name: Validate durable delivery concurrency and ambiguity on PostgreSQL
        run: python3 eksamio-learning-engine/identity-reference/validate_registration_delivery_postgres_001.py
      - name: Validate real registration on PostgreSQL
        run: python3 eksamio-learning-engine/identity-reference/validate_registration_postgres_001.py
