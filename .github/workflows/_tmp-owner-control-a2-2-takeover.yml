name: Temporary A2.2 Owner Control takeover

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/_tmp-owner-control-a2-2-takeover.yml"

permissions:
  contents: write

concurrency:
  group: temporary-a2-2-owner-control-takeover
  cancel-in-progress: false

jobs:
  takeover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move only A2.2 to takeover branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("eksamio-learning-engine/project-control/operational-board-v1.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("version") == "operational-board-v1"
          assert len(data.get("tasks", [])) == 115, len(data.get("tasks", []))
          matches = [task for task in data["tasks"] if task.get("task_id") == "A2.2"]
          assert len(matches) == 1
          task = matches[0]

          assert task.get("branch") == "brain/sep1-russian-subject-closure", task.get("branch")
          assert task.get("pr") == 164, task.get("pr")
          assert task.get("head_sha") == "cb90377c4ebe00e88e22c39824b7c484651ebcc4", task.get("head_sha")
          assert task.get("status") == "BLOCKED_SUBJECT"
          assert task.get("blocker_type") == "SUBJECT"
          assert task.get("executor") == "Codex"

          task["branch"] = "brain/owner-control-russian-takeover-20260912"
          task["pr"] = None
          task["head_sha"] = "8ac4b15bc7c5989c79cc83a2e6d6afc91f96b192"
          task["ci_evidence"] = (
              "Owner Control takeover from legacy PR #164 at exact HEAD 8ac4b15b; "
              "PR #164 and temporary PR #195 closed without merge; takeover branch preserves inherited state; "
              "free CI may still be draining; russian_content remains BLOCKED_SUBJECT / NO-GO."
          )
          task["current_action"] = (
              "Continue A2.2 only on Owner Control takeover branch; preserve false_exact_mastery=0; "
              "legacy branch is archive-only."
          )
          task["next_action"] = (
              "Drain and verify free exact-head CI on takeover branch, then continue the current exact object under Owner Control; "
              "no paid execution until explicit owner authorization from the green panel."
          )
          task["last_evidence_timestamp"] = "2026-09-12"
          task["evidence"] = [
              "Legacy PR #164 closed without merge at exact HEAD 8ac4b15b",
              "Temporary takeover PR #195 closed without merge",
              "Takeover branch brain/owner-control-russian-takeover-20260912 preserves exact HEAD 8ac4b15b",
              "No paid Owner Control execution authorized or started"
          ]

          assert len(data["tasks"]) == 115
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Self-remove temporary workflow and verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_tmp-owner-control-a2-2-takeover.yml
          git diff --check
          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/_tmp-owner-control-a2-2-takeover.yml"
          test "${changed[1]}" = "eksamio-learning-engine/project-control/operational-board-v1.json"

      - name: Commit takeover authority to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "control: move A2.2 to Owner Control takeover branch"
          git push origin HEAD:main
