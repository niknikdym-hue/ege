name: Owner Control Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: owner-control-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build exact-main Owner Control page
        run: |
          set -euo pipefail
          rm -rf _site
          python3 eksamio-learning-engine/project-control/owner_control_build.py \
            --source eksamio-learning-engine/project-control/owner-control.html \
            --destination _site/index.html \
            --main-sha "$GITHUB_SHA"
          cp eksamio-learning-engine/project-control/operational-board-v1.json _site/operational-board-v1.json
          test -s _site/index.html
          test -s _site/operational-board-v1.json
          ! grep -q 'codex/owner-agent-control-page-v1-api' _site/index.html
          ! grep -q 'OPENAI_API_KEY\|GITHUB_TOKEN' _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Owner Control
        id: deployment
        uses: actions/deploy-pages@v4
