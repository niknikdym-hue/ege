name: Brain OGE 6.4 atomic sync once

on:
  push:
    branches:
      - "brain/sep1-russian-subject-closure"
    paths:
      - ".github/workflows/brain-oge64-atomic-sync-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: brain/sep1-russian-subject-closure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exact OGE 6.4 synchronized candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor b3ca7e0552f4d4a7342998d16a0cd9f2f5348d83 HEAD
          python3 .github/scripts/brain_oge64_atomic_sync_once.py
          git diff --check
          if git diff --name-only | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Protected accepted Russian surface changed.' >&2
            exit 1
          fi
      - name: Publish candidate to isolated ref
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/brain-oge64-atomic-sync-once.yml
          rm .github/scripts/brain_oge64_atomic_sync_once.py
          git config user.name "Eksamio Central Brain"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Protected accepted Russian surface changed.' >&2
            exit 1
          fi
          git status --short
          git commit -m "russian: exact-accept OGE 6.4 owner set"
          git push origin HEAD:refs/heads/brain/tmp-oge64-sync-candidate
