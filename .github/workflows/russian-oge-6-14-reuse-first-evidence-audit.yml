name: Russian OGE 6.14 reuse-first evidence audit

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.6-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.7-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.7-COMPONENT-EVIDENCE-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.7-COMPONENT-EVIDENCE-WAVE-003-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.8-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.9-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.11-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.12-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.13-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_current_evidence_audit_v3.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_current_exact_component_derivation.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_reuse_first_evidence_audit.py"
      - ".github/workflows/russian-oge-6-14-reuse-first-evidence-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-first-evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic OGE 6.14 reuse-first evidence audit twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_oge_6_14_reuse_first_evidence_audit.py"
          python3 "$root/build_oge_6_14_reuse_first_evidence_audit.py" --output /tmp/oge-6-14-evidence-a.json > /tmp/oge-6-14-evidence-a.txt
          python3 "$root/build_oge_6_14_reuse_first_evidence_audit.py" --output /tmp/oge-6-14-evidence-b.json > /tmp/oge-6-14-evidence-b.txt
          cmp /tmp/oge-6-14-evidence-a.json /tmp/oge-6-14-evidence-b.json
          diff -u /tmp/oge-6-14-evidence-a.txt /tmp/oge-6-14-evidence-b.txt
          cat /tmp/oge-6-14-evidence-a.txt
      - name: Verify reuse-first accounting and no object acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path('/tmp/oge-6-14-evidence-a.json').read_text(encoding='utf-8'))
          s=d['summary']
          safety=d['safety']
          allowed={
              'CENTRAL_BRAIN_OGE_6_14_REUSE_EVIDENCE_READY_NO_OBJECT_ACCEPTANCE',
              'CENTRAL_BRAIN_OGE_6_14_REUSE_EVIDENCE_GAPS_PROVEN_NO_OBJECT_ACCEPTANCE',
          }
          assert d['status'] in allowed
          assert len(d['exact_owner_refs'])==83
          assert len(set(d['exact_owner_refs']))==83
          assert all(ref.startswith('school-') for ref in d['exact_owner_refs'])
          assert len(d['owner_reviews'])==83
          assert s['exact_owner_frontier']==83
          classified=(
              s['owners_with_explicit_component_specific_independent_evidence']
              + s['owners_with_insufficient_exact_evidence']
              + s['owners_with_mixed_semantic_evidence_only']
              + s['owners_with_no_independent_evidence']
          )
          assert classified==83
          missing=(
              s['owners_with_insufficient_exact_evidence']
              + s['owners_with_mixed_semantic_evidence_only']
              + s['owners_with_no_independent_evidence']
          )
          assert len(d['missing_owner_refs'])==missing
          assert len(set(d['missing_owner_refs']))==missing
          assert s['ready_without_new_materialization'] is (missing==0)
          assert (d['status']=='CENTRAL_BRAIN_OGE_6_14_REUSE_EVIDENCE_READY_NO_OBJECT_ACCEPTANCE') is (missing==0)
          assert s['materialized_new_items_this_audit']==0
          assert s['semantic_admissions']==0
          assert s['object_closures']==0
          assert s['false_exact_mastery_admissions']==0
          assert safety['accepted_demo_or_scorer_change'] is False
          assert safety['tilda_change'] is False
          assert safety['learner_audio_persistence']==0
          assert safety['production_peis_write'] is False
          assert safety['provider_execution'] is False
          assert safety['public_traffic'] is False
          assert safety['real_payment_or_refund'] is False
          assert safety['real_message_delivery'] is False
          print(f"OGE_6_14_EXACT_OWNER_FRONTIER={s['exact_owner_frontier']}")
          print(f"OGE_6_14_OWNERS_EVIDENCE_READY={s['owners_with_explicit_component_specific_independent_evidence']}")
          print(f"OGE_6_14_OWNERS_EVIDENCE_GAPS={missing}")
          print(f"OGE_6_14_READY_WITHOUT_NEW_MATERIALIZATION={int(s['ready_without_new_materialization'])}")
          print('OGE_6_14_NEW_ITEMS_MATERIALIZED_BY_AUDIT=0')
          print('OGE_6_14_OBJECT_CLOSURES=0')
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          print('LEARNER_AUDIO_PERSISTENCE=0')
          print('RUSSIAN_OGE_6_14_REUSE_FIRST_EVIDENCE_AUDIT_GUARD=PASS')
          PY
      - name: Upload reuse-first evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-14-reuse-first-evidence-audit
          path: /tmp/oge-6-14-evidence-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
