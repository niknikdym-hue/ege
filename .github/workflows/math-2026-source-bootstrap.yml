name: Bootstrap official FIPI mathematics 2026 sources

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/math-2026-source-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved FIPI 2026 mathematics package
        run: |
          set -euo pipefail
          rm -rf .math-2026-bootstrap matematika-source-2026
          mkdir -p .math-2026-bootstrap matematika-source-2026/original
          curl --fail --location --retry 3 \
            'https://doc.fipi.ru/ege/demoversii-specifikacii-kodifikatory/2026/ma_11_2026.zip' \
            -o .math-2026-bootstrap/ma_11_2026.zip
          unzip -t .math-2026-bootstrap/ma_11_2026.zip
          unzip -o .math-2026-bootstrap/ma_11_2026.zip -d .math-2026-bootstrap/unpacked
          cp .math-2026-bootstrap/ma_11_2026.zip matematika-source-2026/ma_11_2026-official-fipi.zip
          find .math-2026-bootstrap/unpacked -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" matematika-source-2026/original/
          done

      - name: Record source inventory and hashes
        run: |
          set -euo pipefail
          {
            echo 'OFFICIAL_SOURCE_URL=https://doc.fipi.ru/ege/demoversii-specifikacii-kodifikatory/2026/ma_11_2026.zip'
            echo 'SOURCE_STATUS=APPROVED_FIPI_2026'
            echo
            echo 'ZIP_LIST:'
            unzip -l matematika-source-2026/ma_11_2026-official-fipi.zip
            echo
            echo 'SHA256:'
            find matematika-source-2026 -type f -print0 | sort -z | xargs -0 sha256sum
          } > matematika-source-2026/SOURCE-INVENTORY.txt

      - name: Extract PDF text for source gate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p matematika-source-2026/extracted-text
          for pdf in matematika-source-2026/original/*.pdf; do
            base="$(basename "$pdf" .pdf)"
            pdftotext -layout "$pdf" "matematika-source-2026/extracted-text/${base}.txt"
            pdfinfo "$pdf" > "matematika-source-2026/extracted-text/${base}.pdfinfo.txt"
          done

      - name: Commit official sources
        run: |
          set -euo pipefail
          rm -rf .math-2026-bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matematika-source-2026
          if git diff --cached --quiet; then
            echo 'Official FIPI 2026 mathematics sources already match repository.'
          else
            git commit -m 'Add official FIPI mathematics 2026 source package'
            git push origin HEAD:main
          fi
