name: Russian RU01 sound system content readiness

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-SYSTEM-INTEGRATION-WAVE-010-v0.1.json
      - eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_system_content_readiness.py
      - .github/workflows/russian-ru01-sound-system-content-readiness.yml
  pull_request:
    paths:
      - eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-SYSTEM-INTEGRATION-WAVE-010-v0.1.json
      - eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_system_content_readiness.py
      - .github/workflows/russian-ru01-sound-system-content-readiness.yml

permissions:
  contents: read

jobs:
  sound-system-content-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile readiness validator
        run: >-
          python -m py_compile
          eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_system_content_readiness.py

      - name: Pin integrated candidate Git blob
        shell: bash
        run: |
          set -euo pipefail
          candidate="eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-SYSTEM-INTEGRATION-WAVE-010-v0.1.json"
          actual="$(git hash-object "$candidate")"
          expected="aeba08fe00dbe5626748427e2792e196976b8256"
          test "$actual" = "$expected"
          printf 'candidate_blob=%s\n' "$actual"

      - name: Validate sound-system content readiness A
        run: >-
          python
          eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_system_content_readiness.py
          > /tmp/ru01-sound-system-readiness-a.json

      - name: Validate sound-system content readiness B
        run: >-
          python
          eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_system_content_readiness.py
          > /tmp/ru01-sound-system-readiness-b.json

      - name: Require deterministic readiness output
        run: cmp /tmp/ru01-sound-system-readiness-a.json /tmp/ru01-sound-system-readiness-b.json

      - name: Require fail-closed readiness boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/ru01-sound-system-readiness-a.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'READY_FOR_CONTENT_ADEQUACY_REVIEW'
          assert data['candidate_git_blob_sha'] == 'aeba08fe00dbe5626748427e2792e196976b8256'
          assert data['source_clause_id'] == 'EDSOO59-P181-4.1-C'
          assert data['proposed_semantic_id'] == 'ru-phonetics-sound-system'
          assert data['independent_evidence_refs'] == [f'p01-u12-v{i}' for i in range(1, 6)]
          assert data['independent_evidence_count'] == 5
          assert data['prerequisite']['run_id'] == 34510774242
          assert data['prerequisite']['head_sha'] == '03397a71a723bed3df27aa27a9e60b2b386e120a'
          assert data['prerequisite']['conclusion'] == 'SUCCESS'
          assert data['semantic_admissions'] == 0
          assert data['object_level_closures'] == 0
          assert data['exact_mastery_admissions'] == 0
          assert data['false_exact_mastery_admissions'] == 0
          print(path.read_text(encoding='utf-8'))
          PY
