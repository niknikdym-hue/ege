name: API Codex remote Owner Console bootstrap

on:
  push:
    branches: ['codex/owner-agent-control-page-v1-api']

permissions:
  contents: write
  issues: write

jobs:
  build-owner-console:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-shot trigger
        id: trigger
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path('docs/project-control/api-codex-owner-console-trigger.json')
          ok=False
          if p.is_file():
              d=json.loads(p.read_text())
              parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
              ok=d.get('enabled') is True and d.get('expected_parent_sha')==parent and d.get('task_id')=='OWNER-AGENT-CONSOLE-REMOTE-SLICE-1'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('enabled='+('true' if ok else 'false')+'\n')
          print('API-Codex one-shot:', 'ENABLED' if ok else 'SKIPPED')
          PY
      - name: API-Codex implements the console
        if: steps.trigger.outputs.enabled == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: docs/project-control/tasks/TASK-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md
          output-file: ${{ runner.temp }}/codex-final.txt
          model: gpt-5.6-terra
          effort: high
          sandbox: workspace-write
          codex-args: '["--ephemeral"]'
      - name: Validate bounded result
        if: steps.trigger.outputs.enabled == 'true'
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          exact={'.github/workflows/owner-agent-console-sync.yml','eksamio-learning-engine/tests/test_owner_agent_console.py','eksamio-learning-engine/results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md'}
          bad=sorted(p for p in changed if p not in exact and not p.startswith('eksamio-learning-engine/project-control/'))
          if bad: raise SystemExit('Out of scope: '+', '.join(bad))
          if not changed: raise SystemExit('No implementation produced')
          print('\n'.join(sorted(changed)))
          PY
          python3 -m py_compile eksamio-learning-engine/project-control/owner_agent_console.py
          python3 -m unittest discover -s eksamio-learning-engine/tests -p 'test_owner_agent_console.py' -v
          python3 -m json.tool eksamio-learning-engine/project-control/operational-board-v1.json >/dev/null
          python3 eksamio-learning-engine/project-control/owner_agent_console.py render --board eksamio-learning-engine/project-control/operational-board-v1.json --github-fixture eksamio-learning-engine/project-control/github-fixture-v1.json --output /tmp/owner-console.md
          test -s /tmp/owner-console.md
      - name: Commit bounded implementation
        if: steps.trigger.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm docs/project-control/api-codex-owner-console-trigger.json
          git add -A eksamio-learning-engine/project-control eksamio-learning-engine/tests/test_owner_agent_console.py eksamio-learning-engine/results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md .github/workflows/owner-agent-console-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add remote Owner Agent Console page'
          gh auth setup-git
          git push origin HEAD:codex/owner-agent-control-page-v1-api
      - name: Publish Owner Control issue page
        if: steps.trigger.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 eksamio-learning-engine/project-control/owner_agent_console.py sync --board eksamio-learning-engine/project-control/operational-board-v1.json --repository niknikdym-hue/ege --issue-title 'Eksamio — Owner Control'
      - name: Upload evidence
        if: steps.trigger.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-agent-console-bootstrap-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-final.txt
            /tmp/owner-console.md
          if-no-files-found: warn
          retention-days: 7
