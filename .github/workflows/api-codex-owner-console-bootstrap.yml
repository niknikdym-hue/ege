name: API Codex remote Owner Console bootstrap

on:
  push:
    branches: ['codex/owner-agent-control-page-v1-api']

permissions:
  contents: write
  issues: write

jobs:
  build-owner-console:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github
            docs/project-control
            eksamio-learning-engine/AGENTS.md
            eksamio-learning-engine/00-PRODUCT-MASTERPLAN.md
            eksamio-learning-engine/00B-PROJECT-PRIORITIES-CURRENT.md
            eksamio-learning-engine/project-control
            eksamio-learning-engine/tests
            eksamio-learning-engine/results
      - name: Verify one-shot trigger
        id: trigger
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path('docs/project-control/api-codex-owner-console-trigger.json')
          ok=False
          if p.is_file():
              d=json.loads(p.read_text())
              parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
              ok=d.get('enabled') is True and d.get('expected_parent_sha')==parent and d.get('task_id')=='OWNER-AGENT-CONSOLE-REMOTE-SLICE-4'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('enabled='+('true' if ok else 'false')+'\n')
          print('API-Codex one-shot:', 'ENABLED' if ok else 'SKIPPED')
          PY
      - name: API-Codex implements the console
        if: steps.trigger.outputs.enabled == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: docs/project-control/tasks/TASK-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md
          output-file: ${{ runner.temp }}/codex-final.txt
          model: gpt-5.6-terra
          effort: medium
          sandbox: workspace-write
          codex-args: '["--ephemeral"]'
      - name: Normalize bounded generated paths
        if: steps.trigger.outputs.enabled == 'true'
        run: |
          if [ -f results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md ]; then
            mkdir -p eksamio-learning-engine/results
            mv results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md eksamio-learning-engine/results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md
          fi
          if [ -f eksamio-learning-engine/project-control/github-fixture-v1.json ] && [ ! -f eksamio-learning-engine/project-control/github-fixture.json ]; then
            mv eksamio-learning-engine/project-control/github-fixture-v1.json eksamio-learning-engine/project-control/github-fixture.json
          fi
      - name: Validate bounded result
        if: steps.trigger.outputs.enabled == 'true'
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          changed={p for p in changed if '/__pycache__/' not in p and not p.endswith('.pyc')}
          exact={'.github/workflows/owner-agent-console-sync.yml','eksamio-learning-engine/tests/test_owner_agent_console.py','eksamio-learning-engine/results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md'}
          bad=sorted(p for p in changed if p not in exact and not p.startswith('eksamio-learning-engine/project-control/'))
          if bad: raise SystemExit('Out of scope: '+', '.join(bad))
          if not changed: raise SystemExit('No implementation produced')
          print('\n'.join(sorted(changed)))
          PY
          python3 -m unittest discover -s eksamio-learning-engine/tests -p 'test_owner_agent_console.py' -v
          python3 -m json.tool eksamio-learning-engine/project-control/operational-board-v1.json >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          path='eksamio-learning-engine/project-control/operational-board-v1.json'
          data=json.load(open(path, encoding='utf-8'))
          tasks=data.get('tasks')
          assert isinstance(tasks,list), 'board JSON must contain tasks array'
          assert len(tasks)==115, f'expected 115 tasks, got {len(tasks)}'
          assert Counter(t.get('stage') for t in tasks)==Counter({'A':74,'B':15,'C':11,'D':8,'E':7})
          ids=[t.get('task_id') for t in tasks]
          assert len(ids)==len(set(ids)), 'duplicate task ids'
          required={'task_id','title','user_visible_outcome','stage','workstream','priority','status','source_status','target_state','dependencies','blocker_type','blocker_detail','branch','pr','head_sha','ci_evidence','visible_to_learner','production_state','executor','owner_gate_required','current_action','next_action','last_evidence_timestamp','evidence'}
          assert all(required <= set(t) for t in tasks), 'incomplete task-card fields'
          by_id={t['task_id']:t for t in tasks}
          assert by_id['A6.1']['status']=='VISIBLE_TO_LEARNER'
          assert by_id['A2.1']['status']!='NOT_STARTED'
          assert by_id['B1']['status']=='BLOCKED_SUBJECT'
          assert by_id['C11']['status']=='NOT_STARTED'
          assert by_id['D6']['status']=='NOT_STARTED' and by_id['D8']['status']=='NOT_STARTED'
          assert all(by_id[f'E{i}']['status']=='NOT_STARTED' for i in range(1,8))
          assert all(not t['title'].startswith(t['task_id']) for t in tasks)
          assert not by_id['A12.4']['owner_gate_required'] and not by_id['A12.5']['owner_gate_required']
          assert all(not t['visible_to_learner'] for t in tasks if t['status']=='CODE_READY')
          cp=data.get('critical_path')
          assert isinstance(cp,list) and len(cp)==12, 'critical path must contain ordered 12 steps'
          PY
          python3 eksamio-learning-engine/project-control/owner_agent_console.py render --board eksamio-learning-engine/project-control/operational-board-v1.json --github-fixture eksamio-learning-engine/project-control/github-fixture.json --output /tmp/owner-console.md
          test -s /tmp/owner-console.md
          ! grep -q '__typename' /tmp/owner-console.md
      - name: Commit bounded implementation
        if: steps.trigger.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv .github/workflows/owner-agent-console-sync.yml eksamio-learning-engine/project-control/owner-agent-console-sync.workflow.yml
          git rm docs/project-control/api-codex-owner-console-trigger.json
          git add -A eksamio-learning-engine/project-control eksamio-learning-engine/tests/test_owner_agent_console.py eksamio-learning-engine/results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add remote Owner Agent Console page'
          gh auth setup-git
          git push origin HEAD:codex/owner-agent-control-page-v1-api
      - name: Publish Owner Control issue page
        if: steps.trigger.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 eksamio-learning-engine/project-control/owner_agent_console.py sync --board eksamio-learning-engine/project-control/operational-board-v1.json --repository niknikdym-hue/ege --issue-title 'Eksamio — Owner Control'
      - name: Upload evidence
        if: steps.trigger.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-agent-console-bootstrap-${{ github.sha }}
          path: |
            ${{ runner.temp }}/codex-final.txt
            /tmp/owner-console.md
          if-no-files-found: warn
          retention-days: 7
