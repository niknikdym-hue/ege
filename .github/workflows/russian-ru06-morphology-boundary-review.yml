name: Russian RU06 morphology reuse-first boundary review

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru06_morphology_subject_boundary_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/RU06-MORPHOLOGY-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru06_morphology_bounded_subject_semantics.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-06-MORPHOLOGY-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/RUSSIAN-FULL-SUBJECT-PROGRAM-v1.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - "eksamio-learning-engine/russian-program/object-review/**"
      - "eksamio-learning-engine/russian-program/source-knowledge/**"
      - ".github/workflows/russian-ru06-morphology-boundary-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru06-morphology-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU06 review and acceptance validator
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru06_morphology_subject_boundary_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru06_morphology_bounded_subject_semantics.py
      - name: Build RU06 reuse-first boundary review twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru06_morphology_subject_boundary_review.py --output /tmp/ru06-a.json > /tmp/ru06-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru06_morphology_subject_boundary_review.py --output /tmp/ru06-b.json > /tmp/ru06-b.txt
          cmp /tmp/ru06-a.json /tmp/ru06-b.json
          diff -u /tmp/ru06-a.txt /tmp/ru06-b.txt
          cat /tmp/ru06-a.txt
          cp /tmp/ru06-a.json RU06-MORPHOLOGY-SUBJECT-BOUNDARY-REVIEW.json
      - name: Verify fail-closed review outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('RU06-MORPHOLOGY-SUBJECT-BOUNDARY-REVIEW.json').read_text(encoding='utf-8'))
          assert data['status'] == 'CENTRAL_BRAIN_RU06_MORPHOLOGY_REUSE_FIRST_BOUNDARY_READY_ACCEPTANCE_NOT_ADMITTED'
          assert data['module_id'] == 'RU-PROG-06'
          assert data['module_binding_mode'] == 'MIXED_EXISTING_AND_EXPANSION_BINDING'
          assert len(data['exact_broad_domain_admission_unit_ids']) == 172
          assert len(data['exact_broad_domain_requirement_ids']) == 178
          assert set(data['proposed_subject_semantic_ids']) == {
              'ru-morphology-part-of-speech-identification',
              'ru-morphology-permanent-variable-features',
              'ru-morphology-analysis-sequence',
          }
          reuse = data['reuse_review']
          assert reuse['program_candidate_refs'] == []
          assert reuse['current_inventory_id_collisions'] == 0
          assert set(reuse['related_existing_semantic_refs_reviewed']) == {
              'morphological_norms',
              'noun_form_norms',
              'numeral_form_norms',
              'verb_form_norms',
              'orthographic_norms',
              'suffix_spelling_by_part_of_speech',
              'ne_contextual_spelling',
          }
          assert reuse['school_registry_mutation_required'] is False
          assert reuse['new_parallel_registry_required'] is False
          assert data['policy']['reuse_first'] is True
          assert data['policy']['content_presence_implies_acceptance'] is False
          assert data['policy']['module_membership_implies_object_binding'] is False
          assert data['policy']['broad_domain_attempt_can_emit_exact_component_mastery'] is False
          assert data['policy']['component_specific_independent_evidence_required'] is True
          assert data['policy']['subject_semantic_acceptance_can_reduce_object_counts_without_exact_binding'] is False
          assert data['policy']['morphology_mastery_implies_morphological_norm_mastery'] is False
          assert data['policy']['morphology_mastery_implies_orthography_mastery'] is False
          assert data['summary']['bounded_semantics_reviewed'] == 3
          assert data['summary']['exact_existing_owner_reuses_for_proposed_ids'] == 0
          assert data['summary']['semantic_admissions'] == 0
          assert data['summary']['object_level_admission_units_closed'] == 0
          assert data['summary']['object_level_requirements_closed'] == 0
          assert data['summary']['false_exact_mastery_admissions'] == 0
          print('RU06_MORPHOLOGY_BOUNDARY_FAIL_CLOSED_GUARD=PASS')
          PY
      - name: Validate bounded RU06 semantics twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru06_morphology_bounded_subject_semantics.py > /tmp/ru06-accept-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru06_morphology_bounded_subject_semantics.py > /tmp/ru06-accept-b.txt
          diff -u /tmp/ru06-accept-a.txt /tmp/ru06-accept-b.txt
          cat /tmp/ru06-accept-a.txt
      - name: Upload RU06 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru06-morphology-boundary-review
          path: RU06-MORPHOLOGY-SUBJECT-BOUNDARY-REVIEW.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
