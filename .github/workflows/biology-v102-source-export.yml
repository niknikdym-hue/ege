name: Biology 1.0.2 source export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/biology-v102-source-export.yml'
      - '.biology-v102-export-trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser package
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null
          google-chrome --version
      - name: Export repository and published page inputs
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/biology-v102-source
          mkdir -p "$OUT/repo" "$OUT/live" "$OUT/build"
          find . -maxdepth 4 -type f | sort > "$OUT/repo/all-files.txt"
          find . -maxdepth 6 -type f \( -iname '*biolog*' -o -path '*biologiya*' \) -print | sort > "$OUT/repo/biology-files.txt"
          git ls-tree -r --name-only origin/build/biology-demo-2026 | sort > "$OUT/repo/build-branch-files.txt" || true
          while IFS= read -r f; do
            case "$f" in
              *.txt|*.json|*.js|*.mjs|*.html|*.css|*.py|*.yml|*.yaml)
                mkdir -p "$OUT/build/$(dirname "$f")"
                git show "origin/build/biology-demo-2026:$f" > "$OUT/build/$f" 2>/dev/null || true
                ;;
            esac
          done < "$OUT/repo/build-branch-files.txt"
          if [ -d biologiya ]; then cp -a biologiya "$OUT/repo/"; fi
          if [ -d demo-production-standard ]; then cp -a demo-production-standard "$OUT/repo/"; fi
          cat > /tmp/export-page.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/biology-v102-source/live';
          const browser=await chromium.launch({headless:true,channel:'chrome'});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          const responses=[];
          page.on('response',async r=>{
            const u=r.url();
            if (/eksamio\.ru/.test(u) && /\.(?:js|css)(?:\?|$)/.test(u)) {
              try { const b=await r.body(); responses.push({u,b}); } catch {}
            }
          });
          await page.goto('https://eksamio.ru/ege/biologiya/demoversiya/',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#eksamio-bio-demo',{timeout:60000});
          fs.writeFileSync(out+'/page-content.html',await page.content());
          fs.writeFileSync(out+'/body-inner.html',await page.locator('body').innerHTML());
          fs.writeFileSync(out+'/globals.json',JSON.stringify(await page.evaluate(()=>({
            taskApi:Boolean(window.BiologyDemoTestApi),
            scripts:[...document.scripts].map(s=>({src:s.src,text:s.src?'':s.textContent})),
            localStorage:Object.keys(localStorage),
            title:document.title,
            url:location.href
          })),null,2));
          let i=0;
          for(const x of responses){i++; const ext=x.u.includes('.css')?'.css':'.js'; fs.writeFileSync(`${out}/network-${String(i).padStart(2,'0')}${ext}`,x.b);}
          await page.screenshot({path:out+'/published-page.png',fullPage:true});
          await browser.close();
          JS
          node /tmp/export-page.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: biology-v102-source
          path: /tmp/biology-v102-source/**
          if-no-files-found: error
          retention-days: 30
