name: Russian OGE 6.12 component evidence materialization

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/250-RUSSIAN-SCHOOL-CANONICAL-PRIMARY-COMPLETENESS-WAVE-A4-CAPITALIZATION-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/282-RUSSIAN-FIPI-2026-OGE-6.12-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.12-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_12_proper_names_source_bound_frontier_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_12_proper_names_exact_owner_resolution.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_packet.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_12_component_evidence.py"
      - ".github/workflows/russian-oge-6-12-component-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-12-component-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile 6.12 component evidence chain
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_12_proper_names_source_bound_frontier_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_12_proper_names_exact_owner_resolution.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_12_component_evidence.py
      - name: Validate deterministic 6.12 component evidence twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_oge_6_12_component_evidence.py" --output /tmp/oge-6-12-component-a.json > /tmp/oge-6-12-component-a.txt
          python3 "$root/validate_oge_6_12_component_evidence.py" --output /tmp/oge-6-12-component-b.json > /tmp/oge-6-12-component-b.txt
          cmp /tmp/oge-6-12-component-a.json /tmp/oge-6-12-component-b.json
          diff -u /tmp/oge-6-12-component-a.txt /tmp/oge-6-12-component-b.txt
          cat /tmp/oge-6-12-component-a.txt
          grep -Fx 'OGE_6_12_COMPONENT_EVIDENCE=PASS' /tmp/oge-6-12-component-a.txt
          grep -Fx 'EXACT_OWNER_FRONTIER=9' /tmp/oge-6-12-component-a.txt
          grep -Fx 'OWNERS_WITH_VALID_COMPONENT_EVIDENCE=9' /tmp/oge-6-12-component-a.txt
          grep -Fx 'INDEPENDENT_ITEMS_TOTAL=27' /tmp/oge-6-12-component-a.txt
          grep -Fx 'MINIMUM_ITEMS_PER_OWNER=3' /tmp/oge-6-12-component-a.txt
          grep -Fx 'SELECTED_RESPONSE_ITEMS=18' /tmp/oge-6-12-component-a.txt
          grep -Fx 'CONSTRUCTED_RESPONSE_ITEMS=9' /tmp/oge-6-12-component-a.txt
          grep -Fx 'EXISTING_EXACT_INVENTORY_ITEMS=0' /tmp/oge-6-12-component-a.txt
          grep -Fx 'MATERIALIZED_NEW_ITEMS=27' /tmp/oge-6-12-component-a.txt
          grep -Fx 'SEMANTIC_ADMISSIONS=0' /tmp/oge-6-12-component-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/oge-6-12-component-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/oge-6-12-component-a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/oge-6-12-component-a.txt
      - name: Upload 6.12 component evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-12-component-evidence
          path: /tmp/oge-6-12-component-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
