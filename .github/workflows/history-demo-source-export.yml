name: History demo source export

on:
  pull_request:
    branches:
      - main
    paths:
      - istoriya-source-2026/**
      - .history-source-export-trigger
      - .github/workflows/history-demo-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils rsync

      - name: Export official history source package and text references
        shell: bash
        run: |
          set -euo pipefail
          SRC="istoriya-source-2026"
          OUT="/tmp/history-source-export"
          test -d "$SRC"
          mkdir -p "$OUT/original" "$OUT/text" "$OUT/renders" "$OUT/meta" "$OUT/repo-text"
          cp -a "$SRC"/. "$OUT/original/"
          find "$SRC" -type f -printf '%P\t%s bytes\n' | sort > "$OUT/meta/file-list.txt"
          find "$SRC" -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' pdf; do
            rel="${pdf#$SRC/}"
            stem="${rel%.pdf}"
            safe="${stem//\//__}"
            pdfinfo "$pdf" > "$OUT/meta/${safe}.pdfinfo.txt"
            pdftotext -layout "$pdf" "$OUT/text/${safe}.txt"
            mkdir -p "$OUT/renders/$safe"
            pdftoppm -png -r 180 "$pdf" "$OUT/renders/$safe/page" >/dev/null
          done
          find . -path './.git' -prune -o -type f -printf '%P\t%s bytes\n' | sort > "$OUT/meta/repository-file-list.txt"
          rsync -a --prune-empty-dirs \
            --exclude='.git/' \
            --include='*/' \
            --include='*.txt' --include='*.html' --include='*.htm' \
            --include='*.js' --include='*.css' --include='*.json' \
            --include='*.md' --include='*.py' --include='*.yml' --include='*.yaml' \
            --exclude='*' ./ "$OUT/repo-text/"
          find "$OUT" -type f -printf '%P\t%s bytes\n' | sort > "$OUT/meta/export-file-list.txt"

      - name: Upload history source export
        uses: actions/upload-artifact@v4
        with:
          name: history-source-export
          path: /tmp/history-source-export/**
          if-no-files-found: error
          retention-days: 30
