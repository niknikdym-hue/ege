name: Build mathematics 2026 printed-page source map

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/math-2026-page-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-page-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PyMuPDF
        run: pip install --quiet pymupdf

      - name: Split rotated two-up PDFs into printed-page text maps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz

          root = Path('matematika-source-2026')
          jobs = [
              ('base-demo', root/'original'/'МА-11 ЕГЭ 2026 ДЕМО_базовый.pdf', 29),
              ('base-spec', root/'original'/'МА-11 ЕГЭ 2026 СПЕЦ_базовый.pdf', 12),
              ('profile-demo', root/'original'/'МА-11 ЕГЭ 2026 ДЕМО_профильный.pdf', None),
              ('profile-spec', root/'original'/'МА-11 ЕГЭ 2026 СПЕЦ_профильный.pdf', None),
              ('codifier', root/'original'/'МА-11 ЕГЭ 2026_КОДИФ.pdf', 18),
          ]

          for name, pdf_path, expected_printed in jobs:
              out = root/'printed-pages'/name
              out.mkdir(parents=True, exist_ok=True)
              for p in out.glob('page-*.txt'):
                  p.unlink()

              doc = fitz.open(pdf_path)
              printed = []
              printed_no = 0

              for physical_index, page in enumerate(doc, start=1):
                  # FIPI mathematics PDFs are A4 pages rotated 270° with two
                  # printed pages imposed side by side. In the original PDF
                  # coordinate system those visual left/right halves correspond
                  # to top/bottom halves along Y. Classify in raw coordinates,
                  # then use rotated coordinates only to restore reading order.
                  raw = page.rect
                  mid_y = (raw.y0 + raw.y1) / 2
                  buckets = {'left': [], 'right': []}

                  for b in page.get_text('blocks', sort=False):
                      text = b[4].strip()
                      if not text:
                          continue
                      raw_rect = fitz.Rect(b[:4])
                      cy = (raw_rect.y0 + raw_rect.y1) / 2
                      visual_rect = raw_rect * page.rotation_matrix
                      half = 'left' if cy < mid_y else 'right'
                      buckets[half].append((visual_rect.y0, visual_rect.x0, text))

                  for half_name in ('left', 'right'):
                      printed_no += 1
                      if expected_printed is not None and printed_no > expected_printed:
                          break
                      selected = buckets[half_name]
                      selected.sort(key=lambda item: (round(item[0], 1), item[1]))
                      page_text = '\n'.join(item[2] for item in selected).strip()
                      path = out / f'page-{printed_no:02d}.txt'
                      path.write_text(page_text + '\n', encoding='utf-8')
                      printed.append({
                          'printed_page': printed_no,
                          'physical_pdf_page': physical_index,
                          'half': half_name,
                          'chars': len(page_text),
                          'file': str(path),
                      })

                  if expected_printed is not None and printed_no >= expected_printed:
                      break

              (out/'PAGE-MAP.json').write_text(json.dumps({
                  'source_pdf': str(pdf_path),
                  'physical_pdf_pages': len(doc),
                  'expected_printed_pages': expected_printed,
                  'generated_printed_pages': len(printed),
                  'pages': printed,
              }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate base page split semantically
        run: |
          set -euo pipefail
          test "$(find matematika-source-2026/printed-pages/base-demo -name 'page-*.txt' | wc -l)" -eq 29
          test "$(find matematika-source-2026/printed-pages/base-spec -name 'page-*.txt' | wc -l)" -eq 12
          test "$(find matematika-source-2026/printed-pages/codifier -name 'page-*.txt' | wc -l)" -eq 18
          grep -q 'Тригонометрические функции' matematika-source-2026/printed-pages/base-demo/page-07.txt
          grep -q 'Ответом к каждому заданию' matematika-source-2026/printed-pages/base-demo/page-08.txt
          grep -q 'Экзаменационная работа включает в себя 21 задание' matematika-source-2026/printed-pages/base-demo/page-03.txt
          grep -q 'Максимальный первичный балл' matematika-source-2026/printed-pages/base-spec/page-09.txt
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path('matematika-source-2026/printed-pages/base-demo/PAGE-MAP.json'),
              Path('matematika-source-2026/printed-pages/base-spec/PAGE-MAP.json'),
              Path('matematika-source-2026/printed-pages/codifier/PAGE-MAP.json'),
          ]:
              data=json.loads(p.read_text(encoding='utf-8'))
              assert data['generated_printed_pages'] == data['expected_printed_pages']
          print('Printed-page source map: PASS')
          PY

      - name: Commit printed-page maps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matematika-source-2026/printed-pages
          if git diff --cached --quiet; then
            echo 'Page maps unchanged.'
          else
            git commit -m 'Correct mathematics 2026 printed-page source maps'
            git push origin HEAD:main
          fi
