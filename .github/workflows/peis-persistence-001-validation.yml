name: PEIS Persistence 001 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/peis-persistence-reference/**'
      - 'eksamio-learning-engine/tasks/PEIS-PERSISTENCE-001.md'
      - 'eksamio-learning-engine/peis-reference-kernel/**'
      - 'eksamio-learning-engine/277-EKSAMIO-LEARNER-EVIDENCE-EVENT-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/278-EKSAMIO-LEARNER-STATE-MATERIALIZED-VIEW-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/282-EKSAMIO-MASTERY-INFERENCE-CONTRACT-v0.1.json'
      - 'eksamio-learning-engine/283-EKSAMIO-PREREQUISITE-READINESS-CONTRACT-v0.1.json'
      - 'eksamio-learning-engine/284-EKSAMIO-RETENTION-SCHEDULE-STATE-CONTRACT-v0.1.json'
      - 'eksamio-learning-engine/285-EKSAMIO-NEXT-BEST-ACTION-CONTRACT-v0.1.json'
      - 'eksamio-learning-engine/russian-program/verified-slices/**'
      - 'eksamio-learning-engine/mathematics-identity/verified-slices/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate PEIS-PERSISTENCE-001
        run: python eksamio-learning-engine/peis-persistence-reference/validate_peis_persistence_001.py
