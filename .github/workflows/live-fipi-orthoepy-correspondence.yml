name: Live FIPI orthoepy correspondence probe

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/peis-integration-reference/probe_live_fipi_orthoepy_correspondence.mjs'
      - 'eksamio-learning-engine/peis-integration-reference/LIVE-FIPI-ORTHOEPY-STRESS-CORRESPONDENCE-v0.1.json'
      - '.github/workflows/live-fipi-orthoepy-correspondence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Probe live orthoepy against official FIPI 2026 source
        shell: bash
        run: |
          set -euo pipefail
          node eksamio-learning-engine/peis-integration-reference/probe_live_fipi_orthoepy_correspondence.mjs
          python - <<'PY'
          import json
          observed=json.load(open('live-fipi-orthoepy-correspondence-probe.json', encoding='utf-8'))
          pinned=json.load(open('eksamio-learning-engine/peis-integration-reference/LIVE-FIPI-ORTHOEPY-STRESS-CORRESPONDENCE-v0.1.json', encoding='utf-8'))
          assert observed == pinned, 'live/FIPI orthoepy stress correspondence drifted from pinned exact snapshot'
          assert observed['live']['row_count'] == observed['live']['unique_id_count'] == 291
          assert observed['correspondence']['exact_live_stressed_token_match_count'] == 291
          assert observed['correspondence']['exact_live_stressed_token_mismatch_count'] == 0
          assert observed['correspondence']['mismatches'] == []
          b=observed['admission_boundary']
          assert b['forensic_provenance_probe_only'] is True
          assert b['semantic_admissions'] == 0
          assert b['object_closures'] == 0
          assert b['mastery_admissions'] == 0
          assert b['false_exact_mastery'] == 0
          assert b['normative_pronunciation_evidence_status'] == 'MISSING_BLOCKER'
          assert b['stress_correspondence_alone_can_close_pronunciation_component'] is False
          assert b['registered_user_identity_ref_required_for_future_canonical_evidence'] is True
          print('LIVE FIPI ORTHOEPY exact stress provenance drift gate PASS')
          PY
      - name: Exact-base diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-fipi-orthoepy-correspondence-probe
          path: live-fipi-orthoepy-correspondence-probe.json
          if-no-files-found: warn
