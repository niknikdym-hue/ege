name: Russian RU11 semantic-relation semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU11-SEMANTIC-RELATION-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU11-SEMANTIC-RELATION-CONTENT-ADEQUACY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru11_semantic_relation_bounded_subject_semantics.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-SEMANTIC-RELATION-WAVE-005-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-TEXT-COHESION-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/RUSSIAN-FULL-SUBJECT-PROGRAM-v1.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - ".github/workflows/russian-ru11-semantic-relation-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru11-semantic-relation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru11_semantic_relation_bounded_subject_semantics.py
      - name: Validate source truth, draft guard, reuse gap, exact content and mastery boundary twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_ru11_semantic_relation_bounded_subject_semantics.py" > /tmp/ru11-rel-a.txt
          python3 "$root/validate_ru11_semantic_relation_bounded_subject_semantics.py" > /tmp/ru11-rel-b.txt
          diff -u /tmp/ru11-rel-a.txt /tmp/ru11-rel-b.txt
          grep -Fx 'RU11_SEMANTIC_RELATION_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE=PASS' /tmp/ru11-rel-a.txt
          grep -Fx 'SOURCE_CANDIDATE_REVIEW_STATUS=draft' /tmp/ru11-rel-a.txt
          grep -Fx 'ACCEPTED_SEMANTIC=ru-text-semantic-relation-between-sentences' /tmp/ru11-rel-a.txt
          grep -Fx 'BROADER_DIRECT_RELATION_CHECKS=1' /tmp/ru11-rel-a.txt
          grep -Fx 'EXACT_COMPONENT_CHECKS=4' /tmp/ru11-rel-a.txt
          grep -Fx 'OBJECT_CLOSURES=0/0' /tmp/ru11-rel-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/ru11-rel-a.txt
          cat /tmp/ru11-rel-a.txt
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'RU11 semantic-relation acceptance changed accepted Russian production surfaces.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
