name: SEP1 production E2E harness

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/payments-reference/**'
      - 'eksamio-learning-engine/identity-reference/**'
      - 'eksamio-learning-engine/peis-*/**'
      - 'eksamio-learning-engine/ai-tutor-reference/**'
      - 'eksamio-learning-engine/launch-preflight/**'
      - '.github/workflows/sep1-production-e2e-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-e2e-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eksamio_e2e_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eksamio_e2e_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared PEIS validation dependencies
        run: pip install -r eksamio-learning-engine/peis-production-substrate/requirements.txt
      - name: Create isolated deterministic PEIS databases
        shell: bash
        run: |
          python - <<'PY'
          import psycopg
          conn = psycopg.connect(
              'postgresql://postgres:postgres@127.0.0.1:5432/postgres',
              autocommit=True,
          )
          with conn.cursor() as cur:
              for name in ('eksamio_e2e_a', 'eksamio_e2e_b'):
                  cur.execute(f'DROP DATABASE IF EXISTS {name} WITH (FORCE)')
                  cur.execute(f'CREATE DATABASE {name}')
          conn.close()
          PY
      - name: Compile bounded E2E code
        run: |
          python -m py_compile \
            eksamio-learning-engine/payments-reference/payments.py \
            eksamio-learning-engine/payments-reference/robokassa_production.py \
            eksamio-learning-engine/payments-reference/production_e2e_boundary.py \
            eksamio-learning-engine/payments-reference/validate_production_e2e_boundary.py \
            eksamio-learning-engine/launch-preflight/validate_full_production_candidate_smoke.py
      - name: Validate existing Robokassa production admission
        working-directory: eksamio-learning-engine/payments-reference
        run: python validate_robokassa_production_admission.py
      - name: Validate exact-candidate payment boundary
        working-directory: eksamio-learning-engine/payments-reference
        run: python validate_production_e2e_boundary.py --candidate-sha '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Prove deterministic payment evidence x2
        working-directory: eksamio-learning-engine/payments-reference
        shell: bash
        run: |
          python validate_production_e2e_boundary.py --candidate-sha '${{ github.event.pull_request.head.sha || github.sha }}' --emit > /tmp/payment-e2e-a.json
          python validate_production_e2e_boundary.py --candidate-sha '${{ github.event.pull_request.head.sha || github.sha }}' --emit > /tmp/payment-e2e-b.json
          cmp /tmp/payment-e2e-a.json /tmp/payment-e2e-b.json
          sha256sum /tmp/payment-e2e-a.json /tmp/payment-e2e-b.json
          cp /tmp/payment-e2e-a.json sep1-production-payment-e2e-evidence.json
      - name: Prove deterministic full-candidate evidence x2
        working-directory: eksamio-learning-engine/launch-preflight
        shell: bash
        run: |
          python validate_full_production_candidate_smoke.py \
            --candidate-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            --peis-dsn 'postgresql://postgres:postgres@127.0.0.1:5432/eksamio_e2e_a' \
            --emit > /tmp/full-e2e-a.json
          python validate_full_production_candidate_smoke.py \
            --candidate-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            --peis-dsn 'postgresql://postgres:postgres@127.0.0.1:5432/eksamio_e2e_b' \
            --emit > /tmp/full-e2e-b.json
          cmp /tmp/full-e2e-a.json /tmp/full-e2e-b.json
          sha256sum /tmp/full-e2e-a.json /tmp/full-e2e-b.json
          cp /tmp/full-e2e-a.json sep1-full-candidate-e2e-evidence.json
      - name: Reject provider-network code in CI E2E boundary
        shell: bash
        run: |
          if grep -En '(requests\.|urlopen\(|httpx\.|aiohttp\.|socket\.)' \
            eksamio-learning-engine/payments-reference/production_e2e_boundary.py \
            eksamio-learning-engine/payments-reference/validate_production_e2e_boundary.py \
            eksamio-learning-engine/launch-preflight/validate_full_production_candidate_smoke.py; then
            echo 'Provider-network-capable code is forbidden in CI simulated acceptance boundary.' >&2
            exit 1
          fi
      - name: Validate launch preflight stays fail-closed
        working-directory: eksamio-learning-engine/launch-preflight
        run: python validate_sep1_production_preflight.py
      - name: Upload simulated exact-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: sep1-production-e2e-evidence
          path: |
            eksamio-learning-engine/payments-reference/sep1-production-payment-e2e-evidence.json
            eksamio-learning-engine/launch-preflight/sep1-full-candidate-e2e-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Reject whitespace errors
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
          else
            git diff --check
          fi
