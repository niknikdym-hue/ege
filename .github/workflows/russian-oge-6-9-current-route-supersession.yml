name: Russian OGE 6.9 current route supersession

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/277-RUSSIAN-SCHOOL-CURRENT-LAUNCH-REFREEZE-v1.1.json"
      - "eksamio-learning-engine/281-RUSSIAN-FIPI-2026-OGE-6.9-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_source_bound_frontier_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_exact_owner_resolution_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_9_current_route_supersession.py"
      - ".github/workflows/russian-oge-6-9-current-route-supersession.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-9-current-route-supersession:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile 6.9 route supersession chain
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_source_bound_frontier_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_exact_owner_resolution_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_9_current_route_supersession.py
      - name: Validate 6.9 current route supersession twice
        shell: bash
        run: |
          set -euo pipefail
          validator="eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_9_current_route_supersession.py"
          python3 "$validator" > /tmp/oge-6-9-route-a.txt
          python3 "$validator" > /tmp/oge-6-9-route-b.txt
          diff -u /tmp/oge-6-9-route-a.txt /tmp/oge-6-9-route-b.txt
          cat /tmp/oge-6-9-route-a.txt
          grep -Fx 'RUSSIAN_OGE_6_9_CURRENT_ROUTE_SUPERSESSION=PASS' /tmp/oge-6-9-route-a.txt
          grep -Fx 'CURRENT_SCHOOL_DENOMINATOR=186' /tmp/oge-6-9-route-a.txt
          grep -Fx 'OFFICIAL_BRANCHES=8' /tmp/oge-6-9-route-a.txt
          grep -Fx 'EXACT_OWNER_FRONTIER=14' /tmp/oge-6-9-route-a.txt
          grep -Fx 'EXACT_BRANCH_OWNER_PAIRS=21' /tmp/oge-6-9-route-a.txt
          grep -Fx 'PREVIOUS_CURRENT_ROUTE_REFS=1' /tmp/oge-6-9-route-a.txt
          grep -Fx 'ADDED_SOURCE_SUPPORTED_EXACT_REFS=13' /tmp/oge-6-9-route-a.txt
          grep -Fx 'LEGACY_PLACEHOLDERS_RESOLVED=2' /tmp/oge-6-9-route-a.txt
          grep -Fx 'UNRESOLVED_OWNERS=0' /tmp/oge-6-9-route-a.txt
          grep -Fx 'SEMANTIC_ADMISSIONS=0' /tmp/oge-6-9-route-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/oge-6-9-route-a.txt
          grep -Fx 'SCHOOL_IDENTITY_COUNT_EFFECT=0' /tmp/oge-6-9-route-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/oge-6-9-route-a.txt
          grep -Fx 'READY_FOR_COMPONENT_EVIDENCE_AUDIT=1' /tmp/oge-6-9-route-a.txt
          grep -Fx 'READY_FOR_EXACT_OBJECT_ACCEPTANCE=0' /tmp/oge-6-9-route-a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/oge-6-9-route-a.txt
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
