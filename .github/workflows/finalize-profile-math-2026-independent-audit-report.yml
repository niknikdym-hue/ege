name: Finalize Profile Math 2026 Independent Audit Report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-profile-math-2026-independent-audit-report.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow
      - name: Finalize report and repack without changing product code
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util,zipfile
          root=Path('ege-matematika-profil-demoversiya-2026')
          report=root/'INDEPENDENT-AUDIT-REPORT-2026-profile.md'
          s=report.read_text(encoding='utf-8').replace('- Clean ZIP browser gate выполняется повторно после упаковки.','- Clean ZIP browser gate: PASS — полный 55/55 browser/scorer/state/width gate повторён на распакованном финальном ZIP.')
          report.write_text(s,encoding='utf-8')
          script=root/'scripts/build_profile_2026.py';spec=importlib.util.spec_from_file_location('b',script);b=importlib.util.module_from_spec(spec);spec.loader.exec_module(b);out=b.manifest_zip()
          with zipfile.ZipFile(out) as z:
              base=root.name+'/'
              text=z.read(base+'INDEPENDENT-AUDIT-REPORT-2026-profile.md').decode('utf-8')
              status=z.read(base+'ege-matematika-profil-demoversiya-2026-PAGE-STATUS.txt').decode('utf-8')
              assert 'Clean ZIP browser gate: PASS' in text
              assert 'INDEPENDENT_AUDIT_GATE: PASS' in status and 'CLEAN_ZIP_BROWSER_GATE: PASS' in status
          print(out)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-matematika-profil-demoversiya-2026/INDEPENDENT-AUDIT-REPORT-2026-profile.md ege-matematika-profil-demoversiya-2026/ege-matematika-profil-demoversiya-2026-MANIFEST-SHA256.txt ege-matematika-profil-demoversiya-2026-v1.0.zip
          git commit -m 'Finalize independent audit report for profile mathematics 2026 v1.0'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: ege-matematika-profil-demoversiya-2026-v1.0-final-audited
          path: ege-matematika-profil-demoversiya-2026-v1.0.zip
          retention-days: 7
