name: PROFILE Math 2022 — expose prepare bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'PROFILE-MATH-2022-EXPOSE-PREPARE-TRIGGER.txt'

permissions:
  contents: write

jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode prepare bootstrap to tracked audit source
        shell: bash
        run: |
          set -euo pipefail
          cat .profile2022-bootstrap/prepare.part1.b64 .profile2022-bootstrap/prepare.part2.b64 | base64 -d | gzip -d > matematika-source-2022/profile-source-lock/prepare_profile_2022.bootstrap-source.py
          python -m py_compile matematika-source-2022/profile-source-lock/prepare_profile_2022.bootstrap-source.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matematika-source-2022/profile-source-lock/prepare_profile_2022.bootstrap-source.py
          git commit -m 'Expose PROFILE 2022 prepare bootstrap source for audit' || true
          git pull --rebase origin main
          git push origin HEAD:main
