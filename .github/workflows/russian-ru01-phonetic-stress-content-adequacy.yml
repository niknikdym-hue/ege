name: Russian RU01 phonetic stress content adequacy

on:
  pull_request:
    branches: [main]
    paths:
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETIC-STRESS-WAVE-006-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru01_phonetic_stress_candidate_content.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_stress_content_adequacy_review.py"
      - ".github/workflows/russian-ru01-phonetic-stress-content-adequacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru01-phonetic-stress-content-adequacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile bounded stress adequacy gate
        run: |
          python -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru01_phonetic_stress_candidate_content.py
          python -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_stress_content_adequacy_review.py

      - name: Recheck stress readiness boundary
        run: |
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru01_phonetic_stress_candidate_content.py

      - name: Build content adequacy review twice
        shell: bash
        run: |
          set -euo pipefail
          python eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_stress_content_adequacy_review.py --output /tmp/ru01-stress-adequacy-a.json > /tmp/ru01-stress-adequacy-a.txt
          python eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_stress_content_adequacy_review.py --output /tmp/ru01-stress-adequacy-b.json > /tmp/ru01-stress-adequacy-b.txt
          cmp /tmp/ru01-stress-adequacy-a.json /tmp/ru01-stress-adequacy-b.json
          diff -u /tmp/ru01-stress-adequacy-a.txt /tmp/ru01-stress-adequacy-b.txt
          cat /tmp/ru01-stress-adequacy-a.txt

      - name: Verify adequacy review remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/ru01-stress-adequacy-a.json").read_text(encoding="utf-8"))
          assert data["status"] == "CENTRAL_BRAIN_RU01_PHONETIC_STRESS_CONTENT_ADEQUACY_REVIEW_COMPLETE_NO_ADMISSION"
          assert data["authority_pr"] == 164
          assert data["module_id"] == "RU-PROG-01"
          assert data["candidate"]["semantic_id"] == "ru-phonetics-stress"
          assert data["candidate"]["source_taxonomy_id"] == "phonetic_stress"
          assert data["candidate"]["source_clause_ids"] == ["EDSOO59-P187-4.1.6", "OGE-COD-P020-4.1.6"]
          assert data["candidate"]["semantic_ref_status"] == "PROPOSED_NOT_CANONICAL"

          gate = data["prerequisite_remote_gate"]
          assert gate == {
              "workflow": "Russian RU01 phonetic stress candidate content readiness",
              "run_id": 34361525841,
              "head_sha": "5277f4522c9c1b5f993b7542354492b742e1fd2c",
              "conclusion": "SUCCESS",
          }

          learner = data["learner_content"]
          assert learner["git_blob_sha1"] == "d3deae35b2ccdd58f18e01a0bf3256a0f9446a06"
          assert learner["component_specific_verification_ids"] == [
              "p01-u8-v1", "p01-u8-v2", "p01-u8-v3", "p01-u8-v4", "p01-u8-v5"
          ]
          assert learner["registered_user_identity_required"] is True
          assert learner["exact_item_identity_required"] is True
          assert learner["server_owned_received_at_required"] is True
          assert learner["durable_evidence_event_required_before_future_canonical_write"] is True

          decision = data["adequacy_decision"]
          assert decision["content_exact_for_bounded_generic_phonetic_stress_candidate"] is True
          assert decision["official_clause_scope_covered"] is True
          assert decision["explicit_stress_recognition_covered"] is True
          assert decision["syllable_count_does_not_determine_stress"] is True
          assert decision["spelling_does_not_determine_unmarked_normative_stress"] is True
          assert decision["normative_orthoepy_stress_selection_separated"] is True
          assert decision["normative_pronunciation_separated"] is True
          assert decision["transcription_and_full_phonetic_analysis_separated"] is True
          assert decision["adjacent_ru01_semantics_do_not_substitute"] is True
          assert decision["semantic_admission_by_this_review"] is False
          assert decision["object_level_admission_units_closed"] == 0
          assert decision["object_level_requirements_closed"] == 0
          assert decision["exact_mastery_admissions"] == 0
          assert decision["false_exact_mastery_admissions"] == 0
          assert decision["next_status"] == "READY_FOR_SEPARATE_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE"

          policy = data["policy"]
          assert policy["title_route_task_or_fuzzy_inference_allowed"] is False
          assert policy["content_adequacy_review_is_semantic_admission"] is False
          assert policy["content_adequacy_review_is_object_closure"] is False
          assert policy["component_specific_independent_verification_required"] is True
          assert policy["generic_ru01_attempt_can_emit_exact_component_mastery"] is False
          assert policy["anonymous_or_device_only_canonical_progress_allowed"] is False
          assert policy["accepted_demo_scorer_tilda_surfaces_may_change"] is False

          assert data["summary"]["semantic_admissions"] == 0
          assert data["summary"]["object_level_admission_units_closed"] == 0
          assert data["summary"]["object_level_requirements_closed"] == 0
          assert data["summary"]["exact_mastery_admissions"] == 0
          assert data["summary"]["false_exact_mastery_admissions"] == 0
          print("RU01_PHONETIC_STRESS_CONTENT_ADEQUACY_FAIL_CLOSED_GUARD=PASS")
          PY

      - name: Prove adequacy-only exact delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          prior = "5277f4522c9c1b5f993b7542354492b742e1fd2c"
          expected = {
              ".github/workflows/russian-ru01-phonetic-stress-content-adequacy.yml",
              "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_stress_content_adequacy_review.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only", f"{prior}..HEAD"], text=True).splitlines()
          )
          assert changed == expected, (changed, expected)

          content = "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETIC-STRESS-WAVE-006-v0.1.json"
          blob = subprocess.check_output(["git", "hash-object", content], text=True).strip()
          assert blob == "d3deae35b2ccdd58f18e01a0bf3256a0f9446a06", blob

          print("POST_READINESS_DELTA=PHONETIC_STRESS_ADEQUACY_BUILDER_WORKFLOW_ONLY")
          print("PHONETIC_STRESS_CONTENT_BLOB=d3deae35b2ccdd58f18e01a0bf3256a0f9446a06")
          print("SEMANTIC_ADMISSIONS=0")
          print("OBJECT_LEVEL_CLOSURES=0")
          print("EXACT_MASTERY_ADMISSIONS=0")
          print("FALSE_EXACT_MASTERY_ADMISSIONS=0")
          PY

      - name: Upload stress adequacy evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-phonetic-stress-content-adequacy
          path: /tmp/ru01-stress-adequacy-a.json
          if-no-files-found: error
          retention-days: 14

      - name: Protect tracked repository hygiene
        run: |
          git diff --check 5277f4522c9c1b5f993b7542354492b742e1fd2c..HEAD
          git diff --exit-code
