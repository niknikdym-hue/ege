name: Pack Base Math 2026 v1.1 Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pack-base-math-v1-1-final.yml

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install latex2mathml selenium
      - name: Pack fresh v1.1 ZIP
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('ege-matematika-baza-demoversiya-2026/scripts/build_demo_release.py').resolve()
          s=importlib.util.spec_from_file_location('b',p);b=importlib.util.module_from_spec(s);s.loader.exec_module(b)
          print(b.manifest_and_zip())
          PY
      - name: Extract and validate final ZIP
        run: |
          rm -rf /tmp/base-v11-final && mkdir -p /tmp/base-v11-final
          unzip -q ege-matematika-baza-demoversiya-2026-v1.1.zip -d /tmp/base-v11-final
          CLEAN=/tmp/base-v11-final/ege-matematika-baza-demoversiya-2026
          DEMO_ROOT="$CLEAN" python ege-matematika-baza-demoversiya-2026/tests/test_static.py
          DEMO_ROOT="$CLEAN" python ege-matematika-baza-demoversiya-2026/tests/test_source_fidelity.py
      - name: Serve final ZIP preview
        run: |
          cd /tmp/base-v11-final/ege-matematika-baza-demoversiya-2026
          python -m http.server 8769 --bind 127.0.0.1 >/tmp/base-v11-final-http.log 2>&1 &
          echo $! >/tmp/base-v11-final-http.pid
          sleep 2
      - name: Browser audit final ZIP
        run: |
          cd ege-matematika-baza-demoversiya-2026
          EKSAMIO_PREVIEW_URL=http://127.0.0.1:8769/ege-matematika-baza-demoversiya-2026-PREVIEW.html EKSAMIO_EVIDENCE_OUT=tests/evidence/v1.1-final-zip-selenium-evidence.json python tests/test_v1_1_selenium.py
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/base-v11-final-http.pid ]; then kill $(cat /tmp/base-v11-final-http.pid) || true; fi
      - name: Repack browser evidence and verify
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          root=Path('ege-matematika-baza-demoversiya-2026')
          ev=json.loads((root/'tests/evidence/v1.1-final-zip-selenium-evidence.json').read_text(encoding='utf-8'))
          assert ev['status']=='PASS'
          assert ev['checks']['official_examples_real_controls']=='70/70'
          assert ev['checks']['full_correct_attempt']=='21/21'
          assert ev['checks']['javascript_errors']==0
          p=(root/'scripts/build_demo_release.py').resolve();s=importlib.util.spec_from_file_location('b',p);b=importlib.util.module_from_spec(s);s.loader.exec_module(b);b.manifest_and_zip()
          PY
          unzip -t ege-matematika-baza-demoversiya-2026-v1.1.zip >/tmp/base-v11-unzip.txt
          grep -q 'No errors detected' /tmp/base-v11-unzip.txt
          grep -q 'FINAL_STATUS: READY_FOR_TILDA_TEST' ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-PAGE-STATUS.txt
      - name: Commit final audited ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-matematika-baza-demoversiya-2026-v1.1.zip ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-MANIFEST-SHA256.txt ege-matematika-baza-demoversiya-2026/tests/evidence/v1.1-final-zip-selenium-evidence.json
          git commit -m 'Release audited base mathematics 2026 v1.1'
          git pull --rebase origin main
          git push origin main
