name: PEIS fresh evidence

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/peis-reference-kernel/**'
      - 'eksamio-learning-engine/277-EKSAMIO-LEARNER-EVIDENCE-EVENT-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/278-EKSAMIO-LEARNER-STATE-MATERIALIZED-VIEW-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/28[2-5]-*.json'
      - 'eksamio-learning-engine/russian-program/verified-slices/RU-SLICE-001-*'
      - '.github/workflows/peis-fresh-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/peis-reference-kernel/**'
      - 'eksamio-learning-engine/277-EKSAMIO-LEARNER-EVIDENCE-EVENT-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/278-EKSAMIO-LEARNER-STATE-MATERIALIZED-VIEW-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/28[2-5]-*.json'
      - 'eksamio-learning-engine/russian-program/verified-slices/RU-SLICE-001-*'
      - '.github/workflows/peis-fresh-evidence.yml'

permissions:
  contents: read

jobs:
  validate-fresh-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing schema validation dependency
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate fresh evidence regressions
        run: python -m unittest discover -s eksamio-learning-engine/peis-reference-kernel -p 'test_fresh_evidence.py' -v
      - name: Preserve reference kernel contracts and golden scenarios
        run: python eksamio-learning-engine/peis-reference-kernel/run_reference_kernel_validation.py
