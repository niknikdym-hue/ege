name: Temporary package Russian v4.2 final
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-package-russian-v42-final.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: zip -qr ege-russkiy-demoversiya-2026-v4.2.zip ege-russkiy-demoversiya-2026-v4.2
      - uses: actions/upload-artifact@v4
        with:
          name: ege-russkiy-demoversiya-2026-v4.2-final
          path: ege-russkiy-demoversiya-2026-v4.2.zip
          if-no-files-found: error
