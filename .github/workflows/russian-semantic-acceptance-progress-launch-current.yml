name: Russian semantic acceptance progress current launch

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/275-RUSSIAN-SCHOOL-OGE-6.2-REOPEN-MATERIALIZATION-v0.1.json"
      - "eksamio-learning-engine/276-RUSSIAN-FIPI-2026-OGE-6.2-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/277-RUSSIAN-SCHOOL-CURRENT-LAUNCH-REFREEZE-v1.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-CANONICAL-INVENTORY-SUPPLEMENT-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_batch_wave_001_exact_component_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_prebatch.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress.py"
      - ".github/workflows/russian-semantic-acceptance-progress-launch-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-progress-current-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OGE 6.2 current exact authority
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_2_current_acceptance.py
      - name: Build current launch progress twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_russian_batch_wave_001_exact_component_acceptance.py"
          python3 -m py_compile "$root/build_russian_semantic_acceptance_progress_launch_current.py"
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current.py" --output /tmp/progress-a.json > /tmp/report-a.txt
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current.py" --output /tmp/progress-b.json > /tmp/report-b.txt
          cmp /tmp/progress-a.json /tmp/progress-b.json
          diff -u /tmp/report-a.txt /tmp/report-b.txt
          cat /tmp/report-a.txt
      - name: Verify current launch progress summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/progress-a.json').read_text(encoding='utf-8'))
          s=d['progress_summary']
          wave=d.get('batch_wave_001') or {}
          batch_units=int(wave.get('accepted_admission_units',0))
          batch_requirements=int(wave.get('accepted_requirements',0))
          assert d['status']=='CENTRAL_BRAIN_SUBJECT_ACCEPTANCE_IN_PROGRESS'
          assert d['russian_content_ready'] is False
          assert d['schema_version']=='0.5.0'
          assert len(d['accepted_authorities']) == 41 + (1 if batch_units else 0)
          by_id={a['id']:a for a in d['accepted_authorities']}
          new=by_id['RUSSIAN_OGE_6_2_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1']
          assert new['authority_kind']=='OBJECT_BOUND_CANONICAL_COMPONENT_SET'
          assert new['accepted_admission_units']==1 and new['accepted_requirements']==1
          assert batch_units==batch_requirements
          assert s['semantic_units_with_accepted_component_sets']==21+batch_units
          assert s['semantic_requirements_with_accepted_component_sets']==21+batch_requirements
          assert s['semantic_units_remaining_without_accepted_component_set']==1295-batch_units
          assert s['semantic_requirements_remaining_without_accepted_component_set']==1370-batch_requirements
          assert s['accepted_bounded_ru_route_semantics']==9
          assert s['accepted_bounded_ru_subject_semantics']==66
          assert s['accepted_bounded_ru_semantics_total']==75
          assert s['false_exact_mastery_admissions']==0
          assert s['new_semantic_identities_created']==0
          assert d['policy']['batch_reuse_requires_exact_normalized_meaning'] is True
          assert d['policy']['batch_reuse_requires_same_pinned_source_document_as_accepted_anchor'] is True
          assert d['policy']['batch_cross_document_reuse_allowed'] is False
          assert d['policy']['batch_keyword_fuzzy_module_only_inference_allowed'] is False
          print('RUSSIAN_SEMANTIC_ACCEPTANCE_PROGRESS_CURRENT_LAUNCH_GUARD=PASS')
          print(f'BATCH_ACCEPTED_UNITS={batch_units}')
          print(f'BATCH_ACCEPTED_REQUIREMENTS={batch_requirements}')
          print(f"POST_REMAINING_UNITS={s['semantic_units_remaining_without_accepted_component_set']}")
          print(f"POST_REMAINING_REQUIREMENTS={s['semantic_requirements_remaining_without_accepted_component_set']}")
          PY
      - name: Upload current launch progress
        uses: actions/upload-artifact@v4
        with:
          name: russian-semantic-acceptance-progress-current-launch
          path: /tmp/progress-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
