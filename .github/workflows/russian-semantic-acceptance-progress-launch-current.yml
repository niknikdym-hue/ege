      - "eksamio-learning-engine/279-RUSSIAN-FIPI-2026-OGE-6.7-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/280-RUSSIAN-FIPI-2026-OGE-6.8-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/281-RUSSIAN-FIPI-2026-OGE-6.9-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.6-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.7-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.7-COMPONENT-EVIDENCE-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.7-COMPONENT-EVIDENCE-WAVE-003-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.8-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.9-COMPONENT-EVIDENCE-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-CANONICAL-INVENTORY-SUPPLEMENT-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.6-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.7-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.8-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.9-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_6_component_evidence.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_7_component_evidence_wave_001.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_7_component_evidence_wave_002.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_7_component_evidence_wave_003.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_8_component_evidence.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_9_component_evidence.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_7_current_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_8_current_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_9_current_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_6_object_evidence_audit.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_object_evidence_audit.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_current_evidence_audit.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_current_evidence_audit_v2.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_current_evidence_audit_v3.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_8_object_evidence_audit.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_object_evidence_audit.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress.py"
      - ".github/workflows/russian-semantic-acceptance-progress-launch-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-progress-current-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OGE 6.2 current exact authority
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_2_current_acceptance.py
      - name: Validate OGE 6.6 component evidence
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_6_component_evidence.py
      - name: Validate OGE 6.7 current exact authority
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_7_current_acceptance.py
      - name: Validate OGE 6.8 current exact authority
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_8_current_acceptance.py
      - name: Validate OGE 6.9 current exact authority
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_9_current_acceptance.py
      - name: Build current launch progress twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_russian_semantic_acceptance_progress_launch_current.py"
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current.py" --output /tmp/progress-a.json > /tmp/report-a.txt
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current.py" --output /tmp/progress-b.json > /tmp/report-b.txt
          cmp /tmp/progress-a.json /tmp/progress-b.json
          diff -u /tmp/report-a.txt /tmp/report-b.txt
          cat /tmp/report-a.txt
      - name: Verify current launch progress summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/progress-a.json').read_text(encoding='utf-8'))
          s=d['progress_summary']
          assert d['status']=='CENTRAL_BRAIN_SUBJECT_ACCEPTANCE_IN_PROGRESS'
          assert d['russian_content_ready'] is False
          assert len(d['accepted_authorities'])==45
          by_id={a['id']:a for a in d['accepted_authorities']}
          for aid in (
              'RUSSIAN_OGE_6_2_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_6_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_7_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_8_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_9_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
          ):
              authority=by_id[aid]
              assert authority['authority_kind']=='OBJECT_BOUND_CANONICAL_COMPONENT_SET'
              assert authority['accepted_admission_units']==1 and authority['accepted_requirements']==1
          assert s['review_groups_with_accepted_component_sets']==12
          assert s['semantic_units_with_accepted_component_sets']==25
          assert s['semantic_requirements_with_accepted_component_sets']==25
          assert s['semantic_units_remaining_without_accepted_component_set']==1291
          assert s['semantic_requirements_remaining_without_accepted_component_set']==1366
          assert 92 <= s['canonical_component_refs_reused_unique'] <= 106
          assert s['accepted_bounded_ru_route_semantics']==9
          assert s['accepted_bounded_ru_subject_semantics']==66
          assert s['accepted_bounded_ru_semantics_total']==75
          assert s['false_exact_mastery_admissions']==0
          # OGE 6.9 creates no new school identity; the validator above proves that
          # directly. Do not assert a nonexistent aggregate field here: the current
          # launch chain also intentionally contains the separately accepted 6.2
          # school-reopen materialization.
          print('CANONICAL_COMPONENT_REFS_REUSED_UNIQUE='+str(s['canonical_component_refs_reused_unique']))
          print('PROGRESS_NORMALIZED_SHA256='+str(d['normalized_sha256']))
          print('RUSSIAN_SEMANTIC_ACCEPTANCE_PROGRESS_CURRENT_LAUNCH_GUARD=PASS')
          PY
      - name: Upload current launch progress
        uses: actions/upload-artifact@v4
        with:
          name: russian-semantic-acceptance-progress-current-launch
          path: /tmp/progress-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
