  pull_request:
    paths:
      - "eksamio-learning-engine/275-RUSSIAN-SCHOOL-OGE-6.2-REOPEN-MATERIALIZATION-v0.1.json"
      - "eksamio-learning-engine/276-RUSSIAN-FIPI-2026-OGE-6.2-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/277-RUSSIAN-SCHOOL-CURRENT-LAUNCH-REFREEZE-v1.1.json"
