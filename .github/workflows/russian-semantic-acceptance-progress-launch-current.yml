name: Russian semantic acceptance progress current launch

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-*-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress*.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_current_exact_acceptance.py"
      - ".github/workflows/russian-semantic-acceptance-progress-launch-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-progress-current-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current exact OGE authorities through 6.14
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_russian_oge_6_2_current_acceptance.py"
          python3 "$root/validate_oge_6_6_component_evidence.py"
          python3 "$root/validate_russian_oge_6_7_current_acceptance.py"
          python3 "$root/validate_russian_oge_6_8_current_acceptance.py"
          python3 "$root/validate_russian_oge_6_9_current_acceptance.py"
          python3 "$root/validate_russian_oge_6_11_current_acceptance.py"
          python3 "$root/validate_russian_oge_6_12_current_acceptance.py"
          python3 "$root/validate_russian_oge_6_13_current_acceptance.py"
          python3 "$root/build_oge_6_14_current_exact_acceptance.py" --output /tmp/oge-6-14-regenerated.json
          cmp /tmp/oge-6-14-regenerated.json "$root/RUSSIAN-OGE-6.14-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"

      - name: Build current and legacy progress deterministically
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_russian_semantic_acceptance_progress_launch_current.py"
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current.py" --output /tmp/progress-a.json > /tmp/report-a.txt
          python3 "$root/build_russian_semantic_acceptance_progress_launch_current.py" --output /tmp/progress-b.json > /tmp/report-b.txt
          cmp /tmp/progress-a.json /tmp/progress-b.json
          diff -u /tmp/report-a.txt /tmp/report-b.txt
          python3 "$root/build_russian_semantic_acceptance_progress.py" --output /tmp/progress-legacy.json > /tmp/report-legacy.txt
          cat /tmp/report-a.txt

      - name: Verify exact 6.14 aggregate delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/progress-a.json').read_text(encoding='utf-8'))
          legacy=json.loads(Path('/tmp/progress-legacy.json').read_text(encoding='utf-8'))
          s=d['progress_summary']; ls=legacy['progress_summary']
          assert d['status']=='CENTRAL_BRAIN_SUBJECT_ACCEPTANCE_IN_PROGRESS'
          assert d['russian_content_ready'] is False
          current_ids={a['id'] for a in d['accepted_authorities']}
          legacy_ids={a['id'] for a in legacy['accepted_authorities']}
          expected_current_ids={
              'RUSSIAN_OGE_6_2_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_6_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_7_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_8_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_9_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_11_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_12_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_6_14_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
          }
          assert 'RUSSIAN_OGE_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1' in legacy_ids
          assert expected_current_ids.isdisjoint(legacy_ids)
          assert current_ids == legacy_ids | expected_current_ids
          by_id={a['id']:a for a in d['accepted_authorities']}
          for aid in expected_current_ids:
              authority=by_id[aid]
              assert authority['authority_kind']=='OBJECT_BOUND_CANONICAL_COMPONENT_SET'
              assert authority['accepted_admission_units']==1
              assert authority['accepted_requirements']==1
          assert len(d['accepted_authorities']) == 48
          assert s['semantic_units_with_accepted_component_sets'] == ls['semantic_units_with_accepted_component_sets'] + 8 == 28
          assert s['semantic_requirements_with_accepted_component_sets'] == ls['semantic_requirements_with_accepted_component_sets'] + 8 == 28
          assert s['semantic_units_remaining_without_accepted_component_set'] == ls['semantic_units_remaining_without_accepted_component_set'] - 8 == 1288
          assert s['semantic_requirements_remaining_without_accepted_component_set'] == ls['semantic_requirements_remaining_without_accepted_component_set'] - 8 == 1363
          assert s['canonical_component_refs_reused_unique'] == 115
          assert s['accepted_bounded_ru_route_semantics'] == ls['accepted_bounded_ru_route_semantics'] == 9
          assert s['accepted_bounded_ru_subject_semantics'] == ls['accepted_bounded_ru_subject_semantics'] == 66
          assert s['accepted_bounded_ru_semantics_total'] == ls['accepted_bounded_ru_semantics_total'] == 75
          assert s['false_exact_mastery_admissions']==0
          assert ls['false_exact_mastery_admissions']==0
          print('OGE_6_13_ACCEPTANCE=LEGACY_OBJECT_RECONFIRMED_NO_COUNT_DELTA')
          print('OGE_6_14_ACCEPTANCE=CURRENT_OBJECT_ACCEPTED_COUNT_DELTA_1')
          print('ACCEPTED_AUTHORITIES=48')
          print('SEMANTIC_UNITS_WITH_ACCEPTED_COMPONENT_SETS=28')
          print('SEMANTIC_REQUIREMENTS_WITH_ACCEPTED_COMPONENT_SETS=28')
          print('SEMANTIC_UNITS_REMAINING=1288')
          print('SEMANTIC_REQUIREMENTS_REMAINING=1363')
          print('CANONICAL_COMPONENT_REFS_REUSED_UNIQUE=115')
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          print('PROGRESS_NORMALIZED_SHA256='+str(d['normalized_sha256']))
          print('RUSSIAN_SEMANTIC_ACCEPTANCE_PROGRESS_CURRENT_LAUNCH_GUARD=PASS')
          PY

      - name: Upload current launch progress
        uses: actions/upload-artifact@v4
        with:
          name: russian-semantic-acceptance-progress-current-launch
          path: /tmp/progress-a.json
          if-no-files-found: error
          retention-days: 14

      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
