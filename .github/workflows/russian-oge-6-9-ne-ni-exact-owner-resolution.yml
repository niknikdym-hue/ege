name: Russian OGE 6.9 NE-NI exact owner resolution

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/277-RUSSIAN-SCHOOL-CURRENT-LAUNCH-REFREEZE-v1.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_source_bound_frontier_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_exact_owner_resolution_review.py"
      - ".github/workflows/russian-oge-6-9-ne-ni-exact-owner-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-9-ne-ni-exact-owner-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact-owner reviewer
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_source_bound_frontier_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_9_ne_ni_exact_owner_resolution_review.py
      - name: Build deterministic 6.9 exact-owner resolution twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/build_oge_6_9_ne_ni_exact_owner_resolution_review.py" --output /tmp/oge-6-9-owner-a.json > /tmp/oge-6-9-owner-a.txt
          python3 "$root/build_oge_6_9_ne_ni_exact_owner_resolution_review.py" --output /tmp/oge-6-9-owner-b.json > /tmp/oge-6-9-owner-b.txt
          cmp /tmp/oge-6-9-owner-a.json /tmp/oge-6-9-owner-b.json
          diff -u /tmp/oge-6-9-owner-a.txt /tmp/oge-6-9-owner-b.txt
          cat /tmp/oge-6-9-owner-a.txt
          grep -Fx 'OGE_6_9_NE_NI_EXACT_OWNER_RESOLUTION=PASS' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'OFFICIAL_BRANCHES=8' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'SOURCE_BOUND_CANDIDATES=14' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'EXACT_OWNERS=14' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'EXACT_BRANCH_OWNER_PAIRS=21' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'REJECTED_CANDIDATES=0' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'UNRESOLVED_CANDIDATES=0' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'PRIMARY_AUTHORITIES_PRESENT=1' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'CURRENT_ROUTE_REFS=1' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'MISSING_EXACT_OWNER_REFS=13' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'ROUTE_SUPERSESSION_READY=1' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'OBJECT_ACCEPTANCE_READY=0' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'SEMANTIC_ADMISSIONS=0' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'NEW_SCHOOL_IDENTITIES=0' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/oge-6-9-owner-a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/oge-6-9-owner-a.txt
      - name: Upload exact-owner resolution review
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-9-ne-ni-exact-owner-resolution
          path: /tmp/oge-6-9-owner-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
