name: Extract base mathematics 2026 coordinate diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/math-base-2026-coordinate-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install --quiet pymupdf
      - name: Extract word and drawing coordinates for key printed pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz

          pdf=Path('matematika-source-2026/original/МА-11 ЕГЭ 2026 ДЕМО_базовый.pdf')
          out=Path('ege-matematika-baza-demoversiya-2026/source-diagnostics')
          out.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(pdf)

          for printed_page in [9,10,11,12,14,15,16,18,19,20,21,22,23,24,25,26,28]:
              phys=(printed_page+1)//2
              half='left' if printed_page%2==1 else 'right'
              page=doc[phys-1]
              visual=page.rect * page.rotation_matrix
              mid=(visual.x0+visual.x1)/2
              x0,x1=(visual.x0,mid) if half=='left' else (mid,visual.x1)
              words=[]
              for w in page.get_text('words', sort=False):
                  rr=fitz.Rect(w[0],w[1],w[2],w[3]) * page.rotation_matrix
                  cx=(rr.x0+rr.x1)/2
                  if x0 <= cx < x1:
                      words.append({
                          'text':w[4],
                          'x0':round(rr.x0-x0,2),'y0':round(rr.y0,2),
                          'x1':round(rr.x1-x0,2),'y1':round(rr.y1,2),
                          'block':w[5],'line':w[6],'word':w[7]
                      })
              words.sort(key=lambda z:(z['y0'],z['x0']))

              drawings=[]
              for d in page.get_drawings():
                  rr=d['rect'] * page.rotation_matrix
                  if rr.x1 <= x0 or rr.x0 >= x1:
                      continue
                  drawings.append({
                      'x0':round(max(rr.x0,x0)-x0,2),'y0':round(rr.y0,2),
                      'x1':round(min(rr.x1,x1)-x0,2),'y1':round(rr.y1,2),
                      'items':len(d.get('items',[])),
                      'fill':str(d.get('fill')),'color':str(d.get('color'))
                  })
              data={'printed_page':printed_page,'physical_pdf_page':phys,'half':half,
                    'visual_width':round(x1-x0,2),'visual_height':round(visual.height,2),
                    'words':words,'drawings':drawings}
              (out/f'page-{printed_page:02d}-coords.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-matematika-baza-demoversiya-2026/source-diagnostics
          git diff --cached --quiet || { git commit -m 'Add base mathematics 2026 source coordinate diagnostics'; git push origin HEAD:main; }
