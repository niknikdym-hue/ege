name: physics-2026-page-preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'chatgpt/physics-2026-source-visual-tools-fix-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render selected logical pages
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pymupdf pillow >/dev/null
          python - <<'PY'
          from pathlib import Path
          import fitz
          from PIL import Image
          from io import BytesIO
          pdf=Path('ege-fizika-demoversiya-v3-1-fixed/source/ege-2026-fizika-demoversiya.pdf')
          out=Path('/tmp/physics-pages'); out.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(pdf)
          for logical in [6,15,16]:
              physical=(logical+1)//2; slot=1 if logical%2 else 2
              page=doc[physical-1]; rot=page.rotation; page.set_rotation(0); r=page.rect
              clip=fitz.Rect(0,0,r.width,r.height/2) if slot==1 else fitz.Rect(0,r.height/2,r.width,r.height)
              pix=page.get_pixmap(matrix=fitz.Matrix(2.2,2.2),clip=clip,alpha=False)
              im=Image.open(BytesIO(pix.tobytes('png'))).convert('RGB').rotate(90,expand=True)
              im.save(out/f'logical-{logical:02d}.jpg',quality=94)
              page.set_rotation(rot)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: physics-2026-page-preview
          path: /tmp/physics-pages
          if-no-files-found: error
