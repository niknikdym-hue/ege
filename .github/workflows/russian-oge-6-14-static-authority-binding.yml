name: Russian OGE 6.14 static authority binding

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_current_exact_acceptance.py"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.14-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_current_exact_component_derivation.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_reuse_first_evidence_audit_v5.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_object_identity_binding_review.py"
      - ".github/workflows/russian-oge-6-14-static-authority-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-authority-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild exact acceptance and bind static authority
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          static="$root/RUSSIAN-OGE-6.14-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
          python3 -m py_compile "$root/build_oge_6_14_current_exact_acceptance.py"
          python3 "$root/build_oge_6_14_current_exact_acceptance.py" --output /tmp/oge-6-14-acceptance-a.json > /tmp/oge-6-14-acceptance-a.txt
          python3 "$root/build_oge_6_14_current_exact_acceptance.py" --output /tmp/oge-6-14-acceptance-b.json > /tmp/oge-6-14-acceptance-b.txt
          cmp /tmp/oge-6-14-acceptance-a.json /tmp/oge-6-14-acceptance-b.json
          diff -u /tmp/oge-6-14-acceptance-a.txt /tmp/oge-6-14-acceptance-b.txt
          cmp /tmp/oge-6-14-acceptance-a.json "$static"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p=Path('eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.14-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema_version']=='0.2.0'
          assert d['status']=='CENTRAL_BRAIN_ACCEPTED_EXACT_OGE_6_14_CANONICAL_COMPONENT_SET'
          assert d['semantic_packet_sha256']=='b35fb420f7a6e96ea11f47e321cae0affe363dc5ed8d6fb79ea8640ac5ac94c4'
          assert d['object_accounting_sha256']=='f3aef83dab99b554a4cdec9ef8d8fbc8036d557182259ae69db182efa11b925c'
          assert len(d['decisions'])==1
          x=d['decisions'][0]
          assert x['admission_unit_id']=='RAU-af3fa30939d38a3ea03d'
          assert x['requirement_id']=='RSK-OGE_COD-6-14-P025'
          assert x['content_code']=='6.14'
          assert x['component_count']==83
          assert len(x['canonical_component_refs'])==83
          assert len(set(x['canonical_component_refs']))==83
          assert x['exact_semantic_boundary']['operation_scope']=='ORTHOGRAPHY_RULE_IDENTIFICATION_AND_APPLICATION_OVER_EXISTING_SKILLS'
          assert x['exact_semantic_boundary']['punctuation_in_scope'] is False
          assert x['review_group_contamination_guard']['punctuation_boundary_excluded_from_6_14_exact_scope'] is True
          assert x['review_group_contamination_guard']['accounting_group_normalized_meaning_used_as_exact_scope'] is False
          assert x['evidence_readiness']['owners_with_valid_component_evidence']==83
          assert x['evidence_readiness']['independent_items_total']==262
          assert x['mastery_boundary']['route_or_broad_composite_attempt_can_emit_exact_component_mastery'] is False
          assert d['summary']['false_exact_mastery_admissions']==0
          assert d['summary']['punctuation_boundaries_admitted']==0
          assert d['safety']['learner_audio_persistence']==0
          assert d['safety']['accepted_demo_or_scorer_change'] is False
          assert d['safety']['tilda_change'] is False
          digest=d.pop('normalized_sha256')
          actual=hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest()
          assert digest==actual=='320e6bc8cc30e168357ccfb29ac2b92541d0d4c84ae86e4f926fcd295b02aa92'
          print('RUSSIAN_OGE_6_14_STATIC_AUTHORITY_BINDING=PASS')
          print('OGE_6_14_STATIC_AUTHORITY_NORMALIZED_SHA256='+digest)
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          print('LEARNER_AUDIO_PERSISTENCE=0')
          PY
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          pr_head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "origin/${{ github.base_ref }}...$pr_head" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Exact PR-head diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          pr_head="${{ github.event.pull_request.head.sha }}"
          git diff --check "origin/${{ github.base_ref }}...$pr_head"
