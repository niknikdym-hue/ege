name: Apply Base Math 2026 v1.1 Source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-base-math-v1-1-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: pip install latex2mathml
      - name: Apply source corrections
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('ege-matematika-baza-demoversiya-2026');prefix='ege-matematika-baza-demoversiya-2026'
          task=root/f'{prefix}-TASK-MAP.json'
          text=task.read_text(encoding='utf-8').replace('ꞏ','·')
          task.write_text(text,encoding='utf-8')
          assert 'ꞏ' not in text
          shell=root/'templates'/'T123-shell.html'
          text=shell.read_text(encoding='utf-8')
          text=re.sub(r'packageVersion:"[^"]+"','packageVersion:"1.1"',text)
          text=re.sub(r'contentVersion:"[^"]+"','contentVersion:"2026.2"',text)
          text=re.sub(r'storageKey:"[^"]+"','storageKey:"eksamio_ege_math_base_demo_2026_v1_1"',text)
          shell.write_text(text,encoding='utf-8')
          exam=root/f'{prefix}-EXAM-MAP.json'
          data=json.loads(exam.read_text(encoding='utf-8'))
          data['package_version']='1.1'
          data['storage_key']='eksamio_ege_math_base_demo_2026_v1_1'
          exam.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Build v1.1
        run: python ege-matematika-baza-demoversiya-2026/scripts/build_demo_release.py
      - name: Static and source fidelity gates
        run: |
          cd ege-matematika-baza-demoversiya-2026
          python tests/test_static.py
          python tests/test_source_fidelity.py
      - name: Commit source and built v1.1
        run: |
          rm -f .github/workflows/apply-base-math-v1-1-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply base mathematics 2026 v1.1 source fixes and build'
          git pull --rebase origin main
          git push origin main
