name: PROFILE Math 2022 — live run locator

on:
  push:
    branches: [main]
    paths:
      - 'PROFILE-MATH-2022-LIVE-LOCATOR-TRIGGER.txt'

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate original PROFILE 2022 workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow profile-math-2022-full-build.yml --limit 5 --json databaseId,status,conclusion,url,headSha,createdAt > PROFILE-MATH-2022-LIVE-RUN.json
          cat PROFILE-MATH-2022-LIVE-RUN.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROFILE-MATH-2022-LIVE-RUN.json
          git commit -m 'Record live PROFILE 2022 workflow state' || true
          git pull --rebase origin main
          git push origin HEAD:main
