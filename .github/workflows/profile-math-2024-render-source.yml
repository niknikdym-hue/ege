name: profile-math-2024-render-source

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-math-2024-render-source.yml'
      - 'PROFILE-MATH-2024-RENDER-TRIGGER.txt'

permissions:
  contents: write

jobs:
  render-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record render run
        shell: bash
        run: |
          cat > PROFILE-MATH-2024-LATEST-RENDER-RUN.txt <<EOF
          GitHub Actions run: ${{ github.run_id }}
          Head SHA: ${{ github.sha }}
          Status: STARTED
          Source: matematika-source-2024/ege-2024-matematika-profil-demoversiya.pdf
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROFILE-MATH-2024-LATEST-RENDER-RUN.txt
          git commit -m 'Record PROFILE 2024 source render run' || true
          git push origin HEAD:main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Render exact FIPI demo into official printed-page images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import pymupdf as fitz
          from PIL import Image

          src=Path('matematika-source-2024/ege-2024-matematika-profil-demoversiya.pdf')
          expected='89698a59be7da5c5f6c628f752a6810534888c423cae31a181ef743c910c1ae3'
          actual=hashlib.sha256(src.read_bytes()).hexdigest()
          assert actual==expected, (actual, expected)
          out=Path('profile-2024-rendered-source')
          out.mkdir(exist_ok=True)
          doc=fitz.open(src)
          printed=0
          scale=2.5
          for physical,page in enumerate(doc,1):
              pix=page.get_pixmap(matrix=fitz.Matrix(scale,scale), alpha=False)
              png=out/f'physical-{physical:02d}.png'
              pix.save(png)
              im=Image.open(png)
              if im.width > im.height*1.18:
                  halves=[im.crop((0,0,im.width//2,im.height)), im.crop((im.width//2,0,im.width,im.height))]
              else:
                  halves=[im]
              for half in halves:
                  gray=half.convert('L')
                  bbox=gray.point(lambda p: 255 if p < 248 else 0).getbbox()
                  if bbox is None:
                      continue
                  printed += 1
                  half.save(out/f'printed-{printed:02d}.png')
          assert printed==23, printed
          print('RENDER PASS printed pages:', printed)
          PY

      - name: Upload exact-source page renders
        uses: actions/upload-artifact@v4
        with:
          name: profile-math-2024-rendered-source
          path: profile-2024-rendered-source
          retention-days: 30

      - name: Record successful render
        if: success()
        shell: bash
        run: |
          cat > PROFILE-MATH-2024-LATEST-RENDER-RUN.txt <<EOF
          GitHub Actions run: ${{ github.run_id }}
          Head SHA: ${{ github.sha }}
          Status: RENDER_PASS
          Source SHA256: 89698a59be7da5c5f6c628f752a6810534888c423cae31a181ef743c910c1ae3
          Official printed pages rendered: 23
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROFILE-MATH-2024-LATEST-RENDER-RUN.txt
          git commit -m 'Record PROFILE 2024 source render PASS' || true
          git push origin HEAD:main
