name: Russian RU03 contextual synonym source identity resolution

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_source_identity_resolution.py"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - "eksamio-learning-engine/48-RUSSIAN-EXCEPTIONS-WAVE2-NORMS-v0.1.json"
      - ".github/workflows/russian-ru03-contextual-synonym-source-identity-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru03-contextual-synonym-source-identity-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU03 contextual synonym source resolver
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_source_identity_resolution.py
      - name: Build source identity resolution twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_source_identity_resolution.py --output /tmp/ru03-synonym-a.json > /tmp/ru03-synonym-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_source_identity_resolution.py --output /tmp/ru03-synonym-b.json > /tmp/ru03-synonym-b.txt
          cmp /tmp/ru03-synonym-a.json /tmp/ru03-synonym-b.json
          diff -u /tmp/ru03-synonym-a.txt /tmp/ru03-synonym-b.txt
          cat /tmp/ru03-synonym-a.txt
          cp /tmp/ru03-synonym-a.json RU03-CONTEXTUAL-SYNONYM-SOURCE-IDENTITY-RESOLUTION.json
      - name: Verify current-source resolution remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('RU03-CONTEXTUAL-SYNONYM-SOURCE-IDENTITY-RESOLUTION.json').read_text(encoding='utf-8'))
          assert data['schema_version'] == '0.1.0'
          assert data['status'] == 'CENTRAL_BRAIN_RU03_CONTEXTUAL_SYNONYM_CURRENT_2026_SOURCE_IDENTITY_RESOLVED_NO_ADMISSION'
          assert data['authority_issue'] == 161
          assert data['module_id'] == 'RU-PROG-03'
          assert data['candidate_ref'] == 'candidate-015'
          assert data['source_taxonomy_id'] == 'contextual_synonym_selection'
          assert data['repository_prerequisite_truth']['candidate_review_status'] == 'needs_review'
          assert data['repository_prerequisite_truth']['skill_graph_evidence_status'] == 'needs_review'
          assert data['repository_prerequisite_truth']['base_graph_or_inventory_mutated'] is False
          official = data['current_official_source_resolution']
          assert official['authority'] == 'FGBNU FIPI'
          assert official['url'].startswith('https://doc.fipi.ru/')
          assert 'p.12' in official['locator']
          assert official['checked_on'] == '2026-08-30'
          assert official['source_identity_evidence_status'] == 'confirmed'
          assert len(official['evidence']) == 3
          resolution = data['resolution']
          assert resolution['source_identity_status'] == 'EXACT_CURRENT_2026_OFFICIAL_SOURCE_CONFIRMED'
          assert resolution['prior_needs_review_state'] == 'RESOLVED_BY_NEWER_EXPLICIT_CURRENT_OFFICIAL_FIPI_AUTHORITY'
          assert resolution['historical_only_negative_inference'] == 'SUPERSEDED_FOR_CURRENT_2026_SCOPE_ONLY'
          assert resolution['semantic_admission_effect'] == 'NONE'
          assert resolution['object_binding_effect'] == 'NONE'
          policy = data['policy']
          assert policy['source_resolution_is_subject_semantic_admission'] is False
          assert policy['content_presence_alone_is_semantic_admission'] is False
          assert policy['exact_original_learner_content_required_before_semantic_acceptance'] is True
          assert policy['generic_task25_result_can_emit_exact_component_mastery'] is False
          assert policy['component_specific_independent_evidence_required'] is True
          assert policy['accepted_demos_or_scorers_may_change'] is False
          assert data['summary'] == {
              'candidate_records_resolved': 1,
              'current_official_source_identities_confirmed': 1,
              'remaining_ru03_source_identity_needs_review_candidates': 0,
              'semantic_admissions': 0,
              'new_school_canonical_identities': 0,
              'object_level_admission_units_closed': 0,
              'object_level_requirements_closed': 0,
              'false_exact_mastery_admissions': 0,
          }
          assert data['next_exact_work']['candidate_ref'] == 'candidate-015'
          assert data['next_exact_work']['semantic_admission_allowed_from_this_resolution_alone'] is False
          print('RU03_CONTEXTUAL_SYNONYM_SOURCE_IDENTITY_FAIL_CLOSED_GUARD=PASS')
          PY
      - name: Upload RU03 contextual synonym source evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru03-contextual-synonym-source-identity-resolution
          path: RU03-CONTEXTUAL-SYNONYM-SOURCE-IDENTITY-RESOLUTION.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="main"
          fi
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          if git diff --name-only "origin/${base_ref}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="main"
          fi
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          git diff --check "origin/${base_ref}...HEAD"
