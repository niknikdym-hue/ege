name: SEP1 Russian PEIS vertical slice

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/peis-service-bridge-reference/russian_exceptions_practice_adapter.py"
      - "eksamio-learning-engine/peis-production-substrate/**"
      - "eksamio-learning-engine/russian-program/RUSSIAN-EXCEPTIONS-121-SEMANTIC-MAPPING-v1.0.json"
      - "eksamio-learning-engine/119-RUSSIAN-EXCEPTIONS-PRACTICE-CURRENT-CORRECTED-MANIFEST.json"
      - "eksamio-learning-engine/92-RUSSIAN-EXCEPTIONS-PRACTICE-PILOT-v0.1.json"
      - ".github/workflows/sep1-russian-peis-vertical-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peis_app
          POSTGRES_PASSWORD: peis_ci
          POSTGRES_DB: peis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peis_app -d peis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PEIS_DATABASE_DSN: postgresql://peis_app:peis_ci@localhost:5432/peis
      PEIS_TEST_POSTGRES_DSN: postgresql://peis_app:peis_ci@localhost:5432/peis
      # Synthetic CI-only fixture required by the existing trusted-host validator.
      # It is not a production credential and is never used outside the ephemeral runner.
      EKSAMIO_PEIS_TRUSTED_HOST_TEST_SECRET: sep1-ci-only-trusted-host-fixture-key-0001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared PEIS dependencies
        run: python -m pip install -r eksamio-learning-engine/peis-production-substrate/requirements.txt
      - name: Compile bounded implementation
        run: |
          python -m py_compile \
            eksamio-learning-engine/peis-service-bridge-reference/russian_exceptions_practice_adapter.py \
            eksamio-learning-engine/peis-production-substrate/runtime.py \
            eksamio-learning-engine/peis-production-substrate/validate_russian_exceptions_peis_vertical_slice.py
      - name: Validate existing shared service bridge
        working-directory: eksamio-learning-engine
        run: python peis-service-bridge-reference/validate_peis_service_bridge_001.py
      - name: Validate existing trusted-host boundary
        working-directory: eksamio-learning-engine
        run: python peis-trusted-host-reference/validate_peis_trusted_host_001.py
      - name: Validate existing fail-open browser hook
        working-directory: eksamio-learning-engine
        run: node peis-browser-hook-reference/validate_peis_browser_hook_001.mjs
      - name: Validate production PostgreSQL substrate
        working-directory: eksamio-learning-engine
        run: python peis-production-substrate/validate_postgres_integration.py
      - name: Validate Russian Exceptions mapped attempt end to end
        working-directory: eksamio-learning-engine
        run: python peis-production-substrate/validate_russian_exceptions_peis_vertical_slice.py
      - name: Build production substrate image with admitted Russian adapter
        working-directory: eksamio-learning-engine
        run: docker build -f peis-production-substrate/Dockerfile -t peis-sep1-ru:ci .
      - name: Scope guard
        run: |
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '(^|/)(mathematics|physics|tilda-ready|ege-russkiy-demoversiya|ege-source-)'; then
            echo "Forbidden launch-deferred/frozen path changed" >&2
            exit 1
          fi
