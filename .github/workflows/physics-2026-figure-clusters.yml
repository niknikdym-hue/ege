name: physics-2026-figure-clusters
on:
  push:
    branches:
      - chatgpt/physics-2026-source-visual-tools-fix-20260819
permissions:
  contents: write
jobs:
  clusters:
    if: ${{ !contains(github.event.head_commit.message, 'Map Physics 2026 official figure clusters') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pymupdf >/dev/null
          python tmp-physics-2026-figure-clusters.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-physics-2026-visual-audit/official-figure-clusters.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Map Physics 2026 official figure clusters'
          git push origin HEAD:chatgpt/physics-2026-source-visual-tools-fix-20260819
