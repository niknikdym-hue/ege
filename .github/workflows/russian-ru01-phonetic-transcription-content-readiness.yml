name: Russian RU01 phonetic transcription content readiness

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETIC-TRANSCRIPTION-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETICS-GRAPHICS-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_transcription_content_readiness.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_transcription_owner_resolution.py"
      - ".github/workflows/russian-ru01-phonetic-transcription-content-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru01-phonetic-transcription-content-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU01 transcription content readiness
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_transcription_content_readiness.py
      - name: Build RU01 transcription content readiness twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_transcription_content_readiness.py --output /tmp/ru01-transcription-content-a.json > /tmp/ru01-transcription-content-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_transcription_content_readiness.py --output /tmp/ru01-transcription-content-b.json > /tmp/ru01-transcription-content-b.txt
          cmp /tmp/ru01-transcription-content-a.json /tmp/ru01-transcription-content-b.json
          diff -u /tmp/ru01-transcription-content-a.txt /tmp/ru01-transcription-content-b.txt
          cat /tmp/ru01-transcription-content-a.txt
          cp /tmp/ru01-transcription-content-a.json RU01-PHONETIC-TRANSCRIPTION-CONTENT-READINESS.json
      - name: Verify component-specific evidence is ready but not accepted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("RU01-PHONETIC-TRANSCRIPTION-CONTENT-READINESS.json").read_text(encoding="utf-8"))
          assert data["schema_version"] == "0.1.0"
          assert data["status"] == "CENTRAL_BRAIN_RU01_PHONETIC_TRANSCRIPTION_CONTENT_AND_EVIDENCE_READY_NOT_ACCEPTED"
          assert data["module_id"] == "RU-PROG-01"
          assert data["candidate_semantic_id"] == "ru-phonetics-phonetic-transcription-elements"
          assert data["target"] == {
              "admission_unit_id": "RAU-2725ee5b709b70502748",
              "requirement_id": "RSK-EDSOO59-4-1-4-P187",
              "source_locator": "EDSOO-RU-5-9-2025/EDSOO59 p.187 4.1.4",
          }

          learner = data["learner_content"]
          assert learner["dedicated_candidate_content_unit_present"] is True
          assert learner["original_eksamio_content"] is True
          assert learner["independent_verification_ids"] == [
              "p01-u4-v1", "p01-u4-v2", "p01-u4-v3", "p01-u4-v4", "p01-u4-v5"
          ]
          assert learner["independent_verification_count"] == 5
          assert learner["covered_skills"] == [
              "explain_spelling_pronunciation_relation",
              "iotated_fragment",
              "softness_marker",
              "sound_not_letter",
          ]

          evidence = data["evidence_independence"]
          assert evidence["word_analysis_evidence_ids_checked"] == ["p01-u3-v1", "p01-u3-v2"]
          assert evidence["overlap"] == []
          assert evidence["word_analysis_evidence_reused"] is False
          assert evidence["generic_ru01_evidence_can_substitute"] is False

          policy = data["policy"]
          assert policy["content_readiness_is_semantic_acceptance"] is False
          assert policy["content_readiness_is_object_acceptance"] is False
          assert policy["candidate_is_canonical_before_separate_acceptance"] is False
          assert policy["shared_word_analysis_evidence_can_close_transcription"] is False
          assert policy["normative_pronunciation_or_stress_inferred"] is False
          assert policy["sibling_source_objects_auto_closed"] is False
          assert policy["false_exact_mastery_admissions"] == 0

          assert data["current_launch_aggregate_unchanged"] == {
              "accepted_authorities": 57,
              "subject_disposed_units_total": 37,
              "subject_review_units_remaining": 1279,
              "subject_review_requirements_remaining": 1354,
              "false_exact_mastery_admissions": 0,
          }
          assert data["summary"] == {
              "dedicated_candidate_content_units": 1,
              "component_specific_independent_verification_items": 5,
              "word_analysis_evidence_reused": 0,
              "semantic_admissions": 0,
              "object_level_admission_units_closed": 0,
              "object_level_requirements_closed": 0,
              "new_school_canonical_identities": 0,
              "false_exact_mastery_admissions": 0,
          }
          nxt = data["next_exact_work"]
          assert nxt["separate_semantic_acceptance_required"] is True
          assert nxt["semantic_acceptance_must_bind_only_component_specific_evidence"] is True
          assert nxt["separate_object_acceptance_required_after_semantic_acceptance"] is True
          assert nxt["target_remains_pending_until_both_acceptance_gates_pass"] is True
          print("RU01_PHONETIC_TRANSCRIPTION_CONTENT_READINESS_FAIL_CLOSED=PASS")
          PY
      - name: Upload RU01 transcription content-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-phonetic-transcription-content-readiness
          path: RU01-PHONETIC-TRANSCRIPTION-CONTENT-READINESS.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
