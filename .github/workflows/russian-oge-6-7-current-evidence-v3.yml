name: Russian OGE 6.7 current evidence v3

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/252-RUSSIAN-SCHOOL-CANONICAL-PRIMARY-COMPLETENESS-WAVE-B-O17-O25-v0.1.json"
      - "eksamio-learning-engine/263-RUSSIAN-SCHOOL-FIPI-REOPEN-MATERIALIZATION-v0.1.json"
      - "eksamio-learning-engine/279-RUSSIAN-FIPI-2026-OGE-6.7-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.7-COMPONENT-EVIDENCE-WAVE-003-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_7_component_evidence_wave_003.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_current_evidence_audit_v2.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_current_evidence_audit_v3.py"
      - ".github/workflows/russian-oge-6-7-current-evidence-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-7-current-evidence-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded evidence chain
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_7_component_evidence_wave_003.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_7_current_evidence_audit_v3.py
      - name: Validate wave 003
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_7_component_evidence_wave_003.py
      - name: Build deterministic current v3 audit twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/build_oge_6_7_current_evidence_audit_v3.py" --output /tmp/oge-6-7-v3-a.json > /tmp/oge-6-7-v3-a.txt
          python3 "$root/build_oge_6_7_current_evidence_audit_v3.py" --output /tmp/oge-6-7-v3-b.json > /tmp/oge-6-7-v3-b.txt
          diff -u /tmp/oge-6-7-v3-a.json /tmp/oge-6-7-v3-b.json
          diff -u /tmp/oge-6-7-v3-a.txt /tmp/oge-6-7-v3-b.txt
          cat /tmp/oge-6-7-v3-a.txt
          grep -Fx 'OGE_6_7_CURRENT_EVIDENCE_AUDIT_V3=PASS' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'REQUIREMENT_ID=RSK-OGE_COD-6-7-P025' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'ADMISSION_UNIT_ID=RAU-2668e140328e4edee952' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'EXACT_OWNER_FRONTIER=12' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'OWNERS_WITH_EXACT_COMPONENT_EVIDENCE=12' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'OWNERS_WITH_INSUFFICIENT_EXACT=0' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'OWNERS_WITH_MIXED_ONLY=0' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'OWNERS_WITH_NO_INDEPENDENT_EVIDENCE=0' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'WAVE_003_NEW_ITEMS=15' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'READY_FOR_EXACT_OBJECT_ACCEPTANCE=1' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/oge-6-7-v3-a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/oge-6-7-v3-a.txt
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Upload current OGE 6.7 v3 evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-7-current-evidence-v3
          path: /tmp/oge-6-7-v3-a.json
          retention-days: 30
