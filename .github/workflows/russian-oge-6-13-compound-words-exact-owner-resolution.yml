name: Russian OGE 6.13 compound words exact owner resolution

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/250-RUSSIAN-SCHOOL-CANONICAL-PRIMARY-COMPLETENESS-WAVE-A4-CAPITALIZATION-v0.1.json"
      - "eksamio-learning-engine/252-RUSSIAN-SCHOOL-CANONICAL-PRIMARY-COMPLETENESS-WAVE-B-O17-O25-v0.1.json"
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_13_compound_words_source_bound_frontier_review.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_13_compound_words_exact_owner_resolution.py"
      - ".github/workflows/russian-oge-6-13-compound-words-source-bound-frontier.yml"
      - ".github/workflows/russian-oge-6-13-compound-words-exact-owner-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-owner-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact-owner resolver
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_oge_6_13_compound_words_exact_owner_resolution.py
      - name: Build deterministic OGE 6.13 exact-owner resolution twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/build_oge_6_13_compound_words_exact_owner_resolution.py" --output /tmp/oge-6-13-owner-a.json > /tmp/oge-6-13-owner-a.txt
          python3 "$root/build_oge_6_13_compound_words_exact_owner_resolution.py" --output /tmp/oge-6-13-owner-b.json > /tmp/oge-6-13-owner-b.txt
          cmp /tmp/oge-6-13-owner-a.json /tmp/oge-6-13-owner-b.json
          diff -u /tmp/oge-6-13-owner-a.txt /tmp/oge-6-13-owner-b.txt
          cat /tmp/oge-6-13-owner-a.txt
          grep -Fx 'OGE_6_13_COMPOUND_WORDS_EXACT_OWNER_RESOLUTION=PASS' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'FRONTIER_CANDIDATES_REVIEWED=5' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'EXACT_CURRENT_CANONICAL_OWNERS=5' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'UNRESOLVED_OWNER_CANDIDATES=0' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'NEW_SCHOOL_IDENTITIES_REQUIRED=0' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'CURRENT_ROUTE_ALREADY_EXACT=1' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'CURRENT_ROUTE_SUPERSESSION_REQUIRED=0' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'EVIDENCE_GATE_REQUIRED=1' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'SEMANTIC_ADMISSIONS=0' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/oge-6-13-owner-a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/oge-6-13-owner-a.txt
      - name: Upload exact-owner resolution
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-13-compound-words-exact-owner-resolution
          path: /tmp/oge-6-13-owner-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
