name: Export Current Base Math 2026 v1.2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-current-base-math-v1-2.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        run: |
          echo "${{ github.run_id }}" > current-base-math-v1.2-artifact-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-base-math-v1.2-artifact-run.txt
          git commit -m 'Record current base math v1.2 artifact run id'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: ege-matematika-baza-demoversiya-2026-v1.2-current
          path: ege-matematika-baza-demoversiya-2026-v1.2.zip
          if-no-files-found: error
          retention-days: 7
