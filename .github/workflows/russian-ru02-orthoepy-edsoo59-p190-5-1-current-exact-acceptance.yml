name: Russian RU02 EDSOO59 p190 5.1 current exact acceptance

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU02-EDSOO59-P190-5-1-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v28.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p190_5_1_exact_object_binding_review_v2.py'
      - '.github/workflows/russian-ru02-orthoepy-edsoo59-p190-5-1-current-exact-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU02-EDSOO59-P190-5-1-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v28.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p190_5_1_exact_object_binding_review_v2.py'
      - '.github/workflows/russian-ru02-orthoepy-edsoo59-p190-5-1-current-exact-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru02-edsoo59-p190-5-1-current-exact-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact acceptance chain
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p190_5_1_exact_object_binding_review.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p190_5_1_exact_object_binding_review_v2.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v28.py

      - name: Build accepted current-v28 A
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v28.py --output /tmp/progress-v28-a.json > /tmp/progress-v28-a.txt

      - name: Build accepted current-v28 B
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v28.py --output /tmp/progress-v28-b.json > /tmp/progress-v28-b.txt

      - name: Verify deterministic current-v28 and exact aggregate delta
        run: |
          set -euo pipefail
          cmp /tmp/progress-v28-a.json /tmp/progress-v28-b.json
          diff -u /tmp/progress-v28-a.txt /tmp/progress-v28-b.txt
          cat /tmp/progress-v28-a.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/progress-v28-a.json',encoding='utf-8'))
          assert d['schema_version']=='0.30.0'
          assert d['base_current_launch_progress_v27_head_sha']=='bb6e31986c2f7adf07c2d5e46ca4ba71270d33ba'
          assert d['base_current_launch_progress_v27_normalized_sha256']=='4e5e6018b8fa832a6115074291c722cd7862388aecbd78ef633e0e2b61864b82'
          s=d['progress_summary']
          expected={
              'semantic_units_with_accepted_component_sets':44,
              'semantic_requirements_with_accepted_component_sets':44,
              'semantic_units_remaining_without_accepted_component_set':1272,
              'semantic_requirements_remaining_without_accepted_component_set':1347,
              'subject_disposed_units_total':45,
              'subject_disposed_requirements_total':45,
              'subject_review_units_remaining':1271,
              'subject_review_requirements_remaining':1346,
              'canonical_component_refs_reused_unique':125,
              'review_groups_with_accepted_component_sets':14,
              'accepted_bounded_ru_route_semantics':9,
              'accepted_bounded_ru_subject_semantics':75,
              'accepted_bounded_ru_semantics_total':84,
              'false_exact_mastery_admissions':0,
          }
          for k,v in expected.items():
              assert s[k]==v,(k,s[k],v)
          assert len(d['accepted_authorities'])==74
          new=d['newly_accepted_exact_object']
          assert new['admission_unit_id']=='RAU-f875ecae572d08cef520'
          assert new['requirement_id']=='RSK-EDSOO59-5-1-P190'
          assert new['accepted_component_refs']==[
              'ru-orthoepy-normative-pronunciation-selection',
              'ru-orthoepy-normative-stress-selection',
          ]
          assert new['component_specific_independent_evidence']=={
              'ru-orthoepy-normative-pronunciation-selection':['p02-u4-v1','p02-u4-v2','p02-u4-v3','p02-u4-v4','p02-u4-v5'],
              'ru-orthoepy-normative-stress-selection':['p02-u3-v1','p02-u3-v2','p02-u3-v3','p02-u3-v4'],
          }
          assert new['independent_evidence_items']==9
          assert new['exact_mastery_admissions']==0
          groups=[g for g in d['semantic_review_groups'] if g.get('group_id')=='RUS-SEM-REVIEW-047']
          assert len(groups)==1
          g=groups[0]
          assert g['accepted_component_set_count']==3
          rows=[r for r in g['accepted_component_sets'] if r.get('admission_unit_id')=='RAU-f875ecae572d08cef520']
          assert len(rows)==1
          row=rows[0]
          assert row['requirement_id']=='RSK-EDSOO59-5-1-P190'
          assert row['canonical_component_refs']==new['accepted_component_refs']
          assert row['authority']['exact_object_binding_review_v2_run_id']==34569660342
          m=row['mastery_boundary']
          assert m['registered_user_identity_required_for_future_canonical_learner_evidence'] is True
          assert m['exact_versioned_item_and_action_required_for_future_canonical_learner_evidence'] is True
          assert m['server_owned_received_at_required_for_future_canonical_learner_evidence'] is True
          assert m['durable_evidence_event_required_for_future_canonical_learner_evidence'] is True
          assert m['anonymous_or_device_only_canonical_progress_allowed'] is False
          assert m['object_acceptance_itself_emits_mastery'] is False
          assert m['generic_orthoepy_attempt_can_emit_exact_component_mastery'] is False
          assert m['shared_sibling_object_acceptance_can_close_target'] is False
          siblings={
              r.get('admission_unit_id'):r.get('requirement_id')
              for r in g['accepted_component_sets']
              if r.get('admission_unit_id') in {
                  'RAU-a8f2ad0b357c9e369c51',
                  'RAU-da83bb720dea792b3afb',
              }
          }
          assert siblings=={
              'RAU-a8f2ad0b357c9e369c51':'RSK-EDSOO1011-2-2-4-P074',
              'RAU-da83bb720dea792b3afb':'RSK-EDSOO59-4-1-6-P187',
          }
          assert d['policy']['shared_ru02_sibling_acceptance_can_auto_close_target'] is False
          assert d['policy']['anonymous_or_device_only_progress_can_be_canonical_for_edsoo59_p190_5_1'] is False
          print('RU02_EDSOO59_P190_5_1_CURRENT_V28_ACCEPTANCE=PASS')
          print('NORMALIZED_SHA256='+d['normalized_sha256'])
          PY

      - name: Protect public and production surfaces in bounded wave
        shell: bash
        run: |
          set -euo pipefail
          wave_base='78e0806768880875fe323f32993e6eb68b6642c5'
          git merge-base --is-ancestor "$wave_base" HEAD
          recent=$(git diff --name-only "$wave_base"..HEAD)
          allowed=$(cat <<'EOF'
          .github/workflows/russian-ru02-orthoepy-edsoo59-p190-5-1-current-exact-acceptance.yml
          eksamio-learning-engine/russian-program/subject-admission/RU02-EDSOO59-P190-5-1-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v28.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "$recent" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed '/^$/d' | sort -u))
          if [[ -n "$unexpected" ]]; then
            echo 'RU02 p190 exact-acceptance wave touched files outside bounded allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$recent" | grep -E 'russkiy-knigi|(^|/)tilda|demo|scor'; then
            echo 'RU02 p190 exact-acceptance wave touched a protected public/production surface.' >&2
            exit 1
          fi

      - name: Diff hygiene for exact bounded wave
        run: git diff --check 78e0806768880875fe323f32993e6eb68b6642c5..HEAD

      - name: Upload exact current-v28 evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru02-edsoo59-p190-5-1-current-exact-acceptance
          path: |
            /tmp/progress-v28-a.json
            /tmp/progress-v28-a.txt
          if-no-files-found: error
