name: TEMP Owner Control first-run safety repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-owner-control-first-run-safety.yml'
      - 'eksamio-learning-engine/project-control/_tmp_owner_control_first_run_patch.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply free first-run safety patch
        run: python3 eksamio-learning-engine/project-control/_tmp_owner_control_first_run_patch.py
      - name: Free validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest eksamio-learning-engine/tests/test_owner_agent_console.py
          python3 -m py_compile \
            eksamio-learning-engine/project-control/owner_agent_console.py \
            eksamio-learning-engine/project-control/owner_control_checkpoint.py \
            eksamio-learning-engine/project-control/owner_control_build.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/owner-agent-console-control.yml', aliases: true); puts 'CONTROL_YAML_PARSE=PASS'"
          rm -rf /tmp/owner-control-site
          python3 eksamio-learning-engine/project-control/owner_control_build.py \
            --source eksamio-learning-engine/project-control/owner-control.html \
            --destination /tmp/owner-control-site/index.html \
            --main-sha "$GITHUB_SHA"
          grep -q "t.executor==='Codex'" /tmp/owner-control-site/index.html
          grep -q 'NON_CODEX_EXECUTOR task' .github/workflows/owner-agent-console-control.yml
          grep -q '/tmp/owner-control-authority' .github/workflows/owner-agent-console-control.yml
          git diff --check -- .github/workflows/owner-agent-console-control.yml eksamio-learning-engine/project-control/owner-control.html eksamio-learning-engine/project-control/operational-board-v1.json eksamio-learning-engine/tests/test_owner_agent_console.py
          echo 'OWNER_CONTROL_FIRST_RUN_SAFETY=PASS'
      - name: Commit repaired control plane and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/owner-agent-console-control.yml \
            eksamio-learning-engine/project-control/owner-control.html \
            eksamio-learning-engine/project-control/operational-board-v1.json \
            eksamio-learning-engine/tests/test_owner_agent_console.py
          git rm .github/workflows/_tmp-owner-control-first-run-safety.yml \
            eksamio-learning-engine/project-control/_tmp_owner_control_first_run_patch.py
          git commit -m 'fix: harden Owner Control first paid run'
          git push origin HEAD:main
