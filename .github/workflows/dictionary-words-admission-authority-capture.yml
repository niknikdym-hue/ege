name: Dictionary words admission authority capture

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/peis-production-substrate/admissions/capture_dictionary_words_authority.mjs'
      - '.github/workflows/dictionary-words-admission-authority-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture exact dictionary answer authority read-only
        env:
          PROBE_OUT: dictionary-words-admission-authority-capture.json
        run: node eksamio-learning-engine/peis-production-substrate/admissions/capture_dictionary_words_authority.mjs
      - name: Upload exact capture
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-words-admission-authority-capture
          path: dictionary-words-admission-authority-capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Diff hygiene
        run: git diff --check
