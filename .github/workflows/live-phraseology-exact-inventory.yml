name: Live phraseology exact inventory

on:
  push:
    branches:
      - 'brain/issue-185-live-asset-reconciliation'
    paths:
      - '.github/workflows/live-phraseology-exact-inventory.yml'
      - 'eksamio-learning-engine/peis-integration-reference/probe_live_phraseology_exact_inventory.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-phraseology-exact-inventory.yml'
      - 'eksamio-learning-engine/peis-integration-reference/probe_live_phraseology_exact_inventory.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract phraseology exact live inventory read-only
        env:
          PROBE_OUT: live-phraseology-exact-inventory.json
        run: node eksamio-learning-engine/peis-integration-reference/probe_live_phraseology_exact_inventory.mjs
      - name: Assert explicit live identity discovery and fail-closed canonical boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('live-phraseology-exact-inventory.json', 'utf8'));
          if (x.live_item_identity_discovery_status !== 'COMPLETE_EXPLICIT_UNIQUE_ID_CANDIDATES') throw new Error('live phraseology identity discovery incomplete');
          if (!(x.live_row_count > 0 && x.live_row_count === x.explicit_id_count && x.explicit_id_count === x.unique_explicit_id_count)) throw new Error('phraseology ids must be complete and unique');
          if (x.canonical_item_identity_status !== 'UNKNOWN_BLOCKER' || x.provenance_binding_status !== 'UNKNOWN_BLOCKER') throw new Error('canonical/provenance admission must remain blocked');
          for (const key of ['semantic_admissions','object_closures','mastery_admissions','false_exact_mastery']) {
            if (x[key] !== 0) throw new Error(`${key} must stay 0`);
          }
          if (x.registered_user_identity_required_for_future_canonical_evidence !== true) throw new Error('registered identity invariant lost');
          NODE
      - name: Upload exact phraseology inventory
        uses: actions/upload-artifact@v4
        with:
          name: live-phraseology-exact-inventory
          path: live-phraseology-exact-inventory.json
          if-no-files-found: error
