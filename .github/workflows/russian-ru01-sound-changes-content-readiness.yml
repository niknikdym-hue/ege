name: Russian RU01 sound changes content readiness

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-CHANGES-WAVE-003-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETICS-GRAPHICS-WAVE-001-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETIC-TRANSCRIPTION-WAVE-002-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-EXACT-SOURCE-BINDING-REVIEW-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_content_readiness.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v13.py'
      - '.github/workflows/russian-ru01-sound-changes-content-readiness.yml'
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-CHANGES-WAVE-003-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETICS-GRAPHICS-WAVE-001-v0.1.json'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-PHONETIC-TRANSCRIPTION-WAVE-002-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-EXACT-SOURCE-BINDING-REVIEW-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_content_readiness.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v13.py'
      - '.github/workflows/russian-ru01-sound-changes-content-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sound-changes-content-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile readiness builder
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_content_readiness.py

      - name: Build sound-changes readiness twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_content_readiness.py --output /tmp/ru01-sound-changes-a.json > /tmp/ru01-sound-changes-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_content_readiness.py --output /tmp/ru01-sound-changes-b.json > /tmp/ru01-sound-changes-b.txt
          cmp /tmp/ru01-sound-changes-a.json /tmp/ru01-sound-changes-b.json
          diff -u /tmp/ru01-sound-changes-a.txt /tmp/ru01-sound-changes-b.txt
          cat /tmp/ru01-sound-changes-a.txt
          cp /tmp/ru01-sound-changes-a.json RU01-SOUND-CHANGES-CONTENT-READINESS.json

      - name: Verify fail-closed component-specific evidence readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('RU01-SOUND-CHANGES-CONTENT-READINESS.json').read_text(encoding='utf-8'))
          assert data['schema_version']=='0.1.0'
          assert data['status']=='CENTRAL_BRAIN_RU01_SOUND_CHANGES_CONTENT_AND_EVIDENCE_READY_NOT_ACCEPTED'
          assert data['module_id']=='RU-PROG-01'
          assert data['candidate_semantic_id']=='ru-phonetics-sound-changes-in-speech-flow'
          assert data['targets']==[
              {
                  'admission_unit_id':'RAU-b1ba48cb81e96255122a',
                  'requirement_id':'RSK-EDSOO59-4-1-3-P187',
                  'source_locator':'EDSOO-RU-5-9-2025/EDSOO59 p.187 4.1.3',
              },
              {
                  'admission_unit_id':'RAU-f709f1855bb0b8d104bc',
                  'requirement_id':'RSK-OGE_COD-4-1-3-P021',
                  'source_locator':'FIPI-OGE-RU-2026-FINAL/OGE_COD p.21 4.1.3',
              },
          ]

          learner=data['learner_content']
          assert learner['dedicated_candidate_content_unit_present'] is True
          assert learner['original_eksamio_content'] is True
          assert learner['independent_verification_ids']==[
              'p01-u5-v1','p01-u5-v2','p01-u5-v3','p01-u5-v4','p01-u5-v5','p01-u5-v6'
          ]
          assert learner['independent_verification_count']==6
          assert learner['covered_skills']==[
              'compare_base_and_realized_sound',
              'distinguish_change_from_static_feature',
              'distinguish_sound_change_from_adjacent_semantics',
              'explain_trigger_and_result',
              'identify_contextual_sound_change',
              'recognize_fail_closed_normative_boundary',
          ]

          evidence=data['evidence_independence']
          assert evidence['overlap']==[]
          assert evidence['adjacent_semantic_evidence_reused'] is False
          assert evidence['generic_ru01_evidence_can_substitute'] is False
          assert set(evidence['adjacent_existing_evidence_ids_checked'])=={
              'p01-u1-v1','p01-u1-v2','p01-u2-v1','p01-u2-v2','p01-u3-v1','p01-u3-v2',
              'p01-u4-v1','p01-u4-v2','p01-u4-v3','p01-u4-v4','p01-u4-v5',
          }

          policy=data['policy']
          assert policy['content_readiness_is_semantic_acceptance'] is False
          assert policy['content_readiness_is_object_acceptance'] is False
          assert policy['candidate_is_canonical_before_separate_acceptance'] is False
          assert policy['shared_future_evidence_can_close_both_source_objects_without_separate_object_acceptance'] is False
          assert policy['normative_pronunciation_or_stress_inferred'] is False
          assert policy['sibling_source_objects_auto_closed'] is False
          assert policy['false_exact_mastery_admissions']==0

          assert data['current_launch_aggregate_unchanged']=={
              'accepted_authorities':60,
              'subject_disposed_units_total':39,
              'subject_disposed_requirements_total':39,
              'subject_review_units_remaining':1277,
              'subject_review_requirements_remaining':1352,
              'accepted_bounded_ru_subject_semantics':67,
              'accepted_bounded_ru_semantics_total':76,
              'false_exact_mastery_admissions':0,
          }
          assert data['summary']=={
              'dedicated_candidate_content_units':1,
              'component_specific_independent_verification_items':6,
              'adjacent_semantic_evidence_reused':0,
              'semantic_admissions':0,
              'object_level_admission_units_closed':0,
              'object_level_requirements_closed':0,
              'new_school_canonical_identities':0,
              'false_exact_mastery_admissions':0,
          }
          nxt=data['next_exact_work']
          assert nxt['separate_semantic_acceptance_required'] is True
          assert nxt['semantic_acceptance_must_bind_only_component_specific_evidence'] is True
          assert nxt['separate_object_acceptance_required_after_semantic_acceptance_for_each_target'] is True
          assert nxt['target_count_requiring_separate_object_acceptance']==2
          assert nxt['targets_remain_pending_until_their_own_acceptance_gates_pass'] is True
          print('RUSSIAN_RU01_SOUND_CHANGES_CONTENT_READINESS_FAIL_CLOSED=PASS')
          PY

      - name: Protect public/production surfaces in this bounded wave
        shell: bash
        run: |
          set -euo pipefail
          wave_base='dbd8904fec85c14c00099b6fc9f34b315b033d39'
          git merge-base --is-ancestor "$wave_base" HEAD
          recent=$(git diff --name-only "$wave_base"..HEAD)
          allowed=$(cat <<'EOF'
          .github/workflows/russian-ru01-sound-changes-content-readiness.yml
          eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-CHANGES-WAVE-003-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_content_readiness.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "$recent" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed '/^$/d' | sort -u))
          if [[ -n "$unexpected" ]]; then
            echo 'Current sound-changes wave touched files outside the exact bounded allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$recent" | grep -E 'russkiy-knigi|(^|/)tilda|demo|scor'; then
            echo 'Current sound-changes wave touched a protected public/production surface.' >&2
            exit 1
          fi

      - name: Diff hygiene for current bounded wave
        run: git diff --check dbd8904fec85c14c00099b6fc9f34b315b033d39..HEAD

      - name: Upload durable readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-sound-changes-content-readiness
          path: RU01-SOUND-CHANGES-CONTENT-READINESS.json
          if-no-files-found: error
          retention-days: 14
