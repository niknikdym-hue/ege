name: Russian RU01 phonetic syllable content adequacy

on:
  pull_request:
    branches: [main]
    paths:
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SYLLABLE-WAVE-005-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_syllable_content_adequacy_review.py"
      - ".github/workflows/russian-ru01-phonetic-syllable-content-adequacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru01-phonetic-syllable-content-adequacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile bounded syllable adequacy gate
        run: |
          python -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py
          python -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_syllable_content_adequacy_review.py

      - name: Recheck syllable readiness boundary
        run: |
          python eksamio-learning-engine/russian-program/subject-admission/validate_ru01_syllable_candidate_content.py

      - name: Build content adequacy review twice
        shell: bash
        run: |
          set -euo pipefail
          python eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_syllable_content_adequacy_review.py --output /tmp/ru01-syllable-adequacy-a.json > /tmp/ru01-syllable-adequacy-a.txt
          python eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_syllable_content_adequacy_review.py --output /tmp/ru01-syllable-adequacy-b.json > /tmp/ru01-syllable-adequacy-b.txt
          cmp /tmp/ru01-syllable-adequacy-a.json /tmp/ru01-syllable-adequacy-b.json
          diff -u /tmp/ru01-syllable-adequacy-a.txt /tmp/ru01-syllable-adequacy-b.txt
          cat /tmp/ru01-syllable-adequacy-a.txt

      - name: Verify adequacy review remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/ru01-syllable-adequacy-a.json").read_text(encoding="utf-8"))
          assert data["status"] == "CENTRAL_BRAIN_RU01_PHONETIC_SYLLABLE_CONTENT_ADEQUACY_REVIEW_COMPLETE_NO_ADMISSION"
          assert data["authority_pr"] == 164
          assert data["module_id"] == "RU-PROG-01"
          assert data["candidate"]["semantic_id"] == "ru-phonetics-syllable"
          assert data["candidate"]["source_taxonomy_id"] == "phonetic_syllable"
          assert data["candidate"]["source_clause_ids"] == ["EDSOO59-P187-4.1.5", "OGE-COD-P020-4.1.5"]
          assert data["candidate"]["semantic_ref_status"] == "PROPOSED_NOT_CANONICAL"

          gate = data["prerequisite_remote_gate"]
          assert gate == {
              "workflow": "Russian RU01 phonetic syllable candidate content readiness",
              "run_id": 34323472320,
              "head_sha": "e4ad473e0750bf3ff8b917ab541f41317fc1dd38",
              "conclusion": "SUCCESS",
          }

          learner = data["learner_content"]
          assert learner["git_blob_sha1"] == "24281db6ee3d5cea24656c1e5e0be9b787392a08"
          assert learner["component_specific_verification_ids"] == [
              "p01-u7-v1", "p01-u7-v2", "p01-u7-v3", "p01-u7-v4", "p01-u7-v5"
          ]
          assert learner["registered_user_identity_required"] is True
          assert learner["exact_item_identity_required"] is True
          assert learner["server_owned_received_at_required"] is True

          decision = data["adequacy_decision"]
          assert decision["content_exact_for_bounded_phonetic_syllable_candidate"] is True
          assert decision["official_clause_scope_covered"] is True
          assert decision["word_transfer_separated"] is True
          assert decision["normative_stress_separated"] is True
          assert decision["disputed_pronunciation_fail_closed"] is True
          assert decision["ambiguous_consonant_cluster_boundary_fail_closed"] is True
          assert decision["adjacent_ru01_semantics_do_not_substitute"] is True
          assert decision["semantic_admission_by_this_review"] is False
          assert decision["object_level_admission_units_closed"] == 0
          assert decision["object_level_requirements_closed"] == 0
          assert decision["exact_mastery_admissions"] == 0
          assert decision["false_exact_mastery_admissions"] == 0
          assert decision["next_status"] == "READY_FOR_SEPARATE_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE"

          policy = data["policy"]
          assert policy["title_route_task_or_fuzzy_inference_allowed"] is False
          assert policy["content_adequacy_review_is_semantic_admission"] is False
          assert policy["content_adequacy_review_is_object_closure"] is False
          assert policy["component_specific_independent_verification_required"] is True
          assert policy["generic_ru01_attempt_can_emit_exact_component_mastery"] is False
          assert policy["accepted_demo_scorer_tilda_surfaces_may_change"] is False

          assert data["summary"]["semantic_admissions"] == 0
          assert data["summary"]["object_level_admission_units_closed"] == 0
          assert data["summary"]["object_level_requirements_closed"] == 0
          assert data["summary"]["exact_mastery_admissions"] == 0
          assert data["summary"]["false_exact_mastery_admissions"] == 0
          print("RU01_PHONETIC_SYLLABLE_CONTENT_ADEQUACY_FAIL_CLOSED_GUARD=PASS")
          PY

      - name: Prove adequacy-only exact delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          prior = "e4ad473e0750bf3ff8b917ab541f41317fc1dd38"
          expected = {
              ".github/workflows/russian-ru01-phonetic-syllable-content-adequacy.yml",
              "eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetic_syllable_content_adequacy_review.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only", f"{prior}..HEAD"], text=True).splitlines()
          )
          assert changed == expected, (changed, expected)

          content = "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SYLLABLE-WAVE-005-v0.1.json"
          blob = subprocess.check_output(["git", "hash-object", content], text=True).strip()
          assert blob == "24281db6ee3d5cea24656c1e5e0be9b787392a08", blob

          print("POST_READINESS_DELTA=SYLLABLE_ADEQUACY_BUILDER_WORKFLOW_ONLY")
          print("SYLLABLE_CONTENT_BLOB=24281db6ee3d5cea24656c1e5e0be9b787392a08")
          print("SEMANTIC_ADMISSIONS=0")
          print("OBJECT_LEVEL_CLOSURES=0")
          print("EXACT_MASTERY_ADMISSIONS=0")
          print("FALSE_EXACT_MASTERY_ADMISSIONS=0")
          PY

      - name: Upload syllable adequacy evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-phonetic-syllable-content-adequacy
          path: /tmp/ru01-syllable-adequacy-a.json
          if-no-files-found: error
          retention-days: 14

      - name: Protect tracked repository hygiene
        run: |
          git diff --check e4ad473e0750bf3ff8b917ab541f41317fc1dd38..HEAD
          git diff --exit-code
