name: Russian RU13 existing-candidate semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU13-EXPRESSIVE-EXISTING-CANDIDATES-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU13-EXPRESSIVE-COMPONENT-BOUNDARY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru13_existing_candidate_bounded_subject_semantics.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-13-EXPRESSIVE-MEANS-WAVE-003-v0.1.json"
      - "eksamio-learning-engine/272-RUSSIAN-UNIFIED-SEMANTIC-IDENTITY-REGISTRY-CONTRACT-v1.0.txt"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - ".github/workflows/russian-ru13-existing-candidate-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru13-existing-candidate-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RU13 existing-candidate validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru13_existing_candidate_bounded_subject_semantics.py
      - name: Validate accepted RU13 existing candidates twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru13_existing_candidate_bounded_subject_semantics.py > /tmp/ru13-existing-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru13_existing_candidate_bounded_subject_semantics.py > /tmp/ru13-existing-b.txt
          diff -u /tmp/ru13-existing-a.txt /tmp/ru13-existing-b.txt
          cat /tmp/ru13-existing-a.txt
      - name: Preserve full RU13 content and component boundary gates
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru13_expressive_content.py
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru13_expressive_component_boundary_review.py
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed in RU13 candidate acceptance.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
