name: analyze-base-math-2022-sources

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'matematika-source-2022/ege-2022-matematika-baza-demoversiya.pdf'
      - 'matematika-source-2022/ege-2022-matematika-baza-specifikatsiya.pdf'
      - 'matematika-source-2022/ege-2022-matematika-kodifikator.pdf'
      - 'matematika-source-2022/scripts/analyze_base_2022_sources.py'
      - 'matematika-source-2022/scripts/inspect_base_2022_visual_geometry.py'
      - 'matematika-source-2022/scripts/validate_base_2022_source_lock.py'
      - 'matematika-source-2022/source-lock/EXAM-LOCK.json'
      - 'matematika-source-2022/source-lock/ANSWER-LOCK.json'
      - 'matematika-source-2022/source-lock/VISUAL-INVENTORY.json'
      - '.github/workflows/analyze-base-math-2022-sources.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF analysis dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Analyze official BASE 2022 sources
        run: python matematika-source-2022/scripts/analyze_base_2022_sources.py
      - name: Inspect visual geometry
        run: python matematika-source-2022/scripts/inspect_base_2022_visual_geometry.py
      - name: Strict source/exam/answer/visual lock gate
        run: python matematika-source-2022/scripts/validate_base_2022_source_lock.py --analysis-dir /tmp/base2022-source-analysis
      - name: Add locked PDFs to artifact
        shell: bash
        run: |
          mkdir -p /tmp/base2022-source-analysis/official-pdf
          cp matematika-source-2022/ege-2022-matematika-baza-demoversiya.pdf /tmp/base2022-source-analysis/official-pdf/
          cp matematika-source-2022/ege-2022-matematika-baza-specifikatsiya.pdf /tmp/base2022-source-analysis/official-pdf/
          cp matematika-source-2022/ege-2022-matematika-kodifikator.pdf /tmp/base2022-source-analysis/official-pdf/
      - name: Persist source lock metadata in repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=matematika-source-2022/source-lock
          cp "$DEST/EXAM-LOCK.json" /tmp/EXAM-LOCK.json
          cp "$DEST/ANSWER-LOCK.json" /tmp/ANSWER-LOCK.json
          cp "$DEST/VISUAL-INVENTORY.json" /tmp/VISUAL-INVENTORY.json
          rm -rf "$DEST"
          mkdir -p "$DEST/demo" "$DEST/spec" "$DEST/cod"
          cp /tmp/EXAM-LOCK.json "$DEST/EXAM-LOCK.json"
          cp /tmp/ANSWER-LOCK.json "$DEST/ANSWER-LOCK.json"
          cp /tmp/VISUAL-INVENTORY.json "$DEST/VISUAL-INVENTORY.json"
          cp /tmp/base2022-source-analysis/SOURCE-LOCK.txt "$DEST/"
          cp /tmp/base2022-source-analysis/SOURCE-LOCK.json "$DEST/"
          cp /tmp/base2022-source-analysis/VISUAL-GEOMETRY.json "$DEST/"
          cp /tmp/base2022-source-analysis/VISUAL-GEOMETRY-SUMMARY.json "$DEST/"
          printf '%s\n' '${{ github.run_id }}' > "$DEST/LATEST-SOURCE-RUN.txt"
          for section in demo spec cod; do
            cp "/tmp/base2022-source-analysis/$section/PAGE-MAP.json" "$DEST/$section/"
            for f in /tmp/base2022-source-analysis/$section/page-*.txt; do cp "$f" "$DEST/$section/"; done
            for f in /tmp/base2022-source-analysis/$section/page-*.json; do cp "$f" "$DEST/$section/"; done
            cat /tmp/base2022-source-analysis/$section/page-*.txt > "$DEST/$section/ALL-TEXT.txt"
          done
          python matematika-source-2022/scripts/validate_base_2022_source_lock.py --analysis-dir /tmp/base2022-source-analysis | tee "$DEST/VALIDATION.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "Source lock metadata unchanged"
          else
            git commit -m "Persist BASE 2022 source lock metadata"
            git push origin HEAD:main
          fi
      - name: Upload source analysis
        uses: actions/upload-artifact@v4
        with:
          name: base-math-2022-source-analysis
          path: /tmp/base2022-source-analysis
          retention-days: 30
