name: TMP Mathematics Semantic Slice 001 Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate-math-slice-001:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate corrected Mathematics inventory
        run: python eksamio-learning-engine/mathematics-identity/validate_mathematics_identity_inventory_v0_1.py
      - name: Validate and execute Mathematics semantic slice 001
        run: python eksamio-learning-engine/mathematics-identity/semantic-slices/validate_mathematics_semantic_slice_001.py
