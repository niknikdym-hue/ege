name: physics-2026-pr-browser-acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  browser-acceptance:
    if: github.head_ref == 'chatgpt/physics-2026-acceptance-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-acceptance-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build current preview and static gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed')
          head=(pkg/'ege-fizika-demoversiya-HEAD.txt').read_text(encoding='utf-8')
          assert '2026' not in head
          blocks='\n'.join((pkg/f'ege-fizika-demoversiya-T123-{i:02d}.txt').read_text(encoding='utf-8') for i in range(1,7))
          preview='<!doctype html>\n<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics acceptance preview</title>\n'+head+'\n</head><body>\n'+blocks+'\n</body></html>\n'
          (pkg/'ege-fizika-demoversiya-PREVIEW.html').write_text(preview,encoding='utf-8')
          runtime=(pkg/'ege-fizika-demoversiya-T123-06.txt').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>\s*$',runtime,re.S); assert m
          Path('/tmp/physics-runtime.js').write_text(m.group(1),encoding='utf-8')
          for token in ('ephys-unordered-check','ephys-ordered-select','Ориентировочная сумма','неофициальная самооценка'):
              assert token.lower() in runtime.lower()
          for name in ('ege-fizika-demoversiya-T123-04.txt','ege-fizika-demoversiya-T123-05.txt'):
              assert 'пунктам о рисунке и/или' not in (pkg/name).read_text(encoding='utf-8')
          source=json.loads(Path('ege-source-fizika/source-fizika-2026/SOURCE-REGISTER.json').read_text(encoding='utf-8'))
          assert source['source_gate']=='CLOSED' and source['external_archive_sha256_locked'] is True and source['package_source_byte_identity_with_official_archive'] is True
          PY
          node --check /tmp/physics-runtime.js
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Full UI scorer state responsive gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/physics-browser.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const key='eksamio_ege_physics_demo_2026_v2';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(baseDir,port,full){
            const server=spawn('python',['-m','http.server',String(port),'--directory',baseDir],{stdio:'ignore'});
            await sleep(900);
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('dialog',d=>d.accept());
            await page.goto(`http://127.0.0.1:${port}/ege-fizika-demoversiya-PREVIEW.html`);
            await page.locator('#ephys-start').click();
            const nav=n=>page.locator('#ephys-nav button').nth(n-1);
            if(full){
              await page.locator('#ephys-answer-input').fill(' -1');
              if(await nav(1).getAttribute('data-filled')!=='false') throw new Error('invalid non-empty answer counted as filled');
              await page.locator('#ephys-answer-input').fill('-1');
              const ans={2:'16',3:'10',4:'2.25',5:'35',6:'43',7:'4',8:'0.75',9:'35',10:'33',11:'100',12:'2',13:'4',14:'13',15:'12',16:'4',17:'12',18:'234',20:'25'};
              for(let n=2;n<=20;n++){
                await nav(n).click();
                if([5,9,14,18,20].includes(n)) for(const d of ans[n]) await page.locator(`.ephys-unordered-check[value="${d}"]`).check();
                else if([6,10,15,17].includes(n)){ const sels=page.locator('.ephys-ordered-select'); for(let i=0;i<ans[n].length;i++) await sels.nth(i).selectOption(ans[n][i]); }
                else if(n===19){ await page.locator('#ephys-value').fill('136'); await page.locator('#ephys-error').fill('3'); }
                else await page.locator('#ephys-answer-input').fill(ans[n]);
                if(await nav(n).getAttribute('data-filled')!=='true') throw new Error(`task ${n} not filled through required control`);
              }
              await nav(6).click();
              const before=await page.evaluate(k=>JSON.parse(localStorage.getItem(k)).endsAt,key);
              await sleep(1100); await page.reload();
              const after=await page.evaluate(k=>JSON.parse(localStorage.getItem(k)).endsAt,key);
              if(before!==after) throw new Error('absolute timer changed on reload');
              if((await page.locator('.ephys-ordered-select').nth(0).inputValue())!=='4'||(await page.locator('.ephys-ordered-select').nth(1).inputValue())!=='3') throw new Error('ordered restore failed');
              for(const width of [320,360,390,768,1280]){
                await page.setViewportSize({width,height:900});
                for(let n=1;n<=26;n++){
                  await nav(n).click();
                  const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)>window.innerWidth+1);
                  if(overflow) throw new Error(`horizontal overflow task ${n} width ${width}`);
                }
              }
              await page.setViewportSize({width:1280,height:900});
              await page.locator('#ephys-finish-top').click();
              if((await page.locator('#ephys-short-score').textContent()).trim()!=='28') throw new Error('full correct part1 is not 28/28');
              let rt=(await page.locator('#ephys-results').innerText()).toLowerCase();
              if(!rt.includes('неофициальная самооценка')||!rt.includes('ориентировочная сумма')) throw new Error('extended score semantics wrong');
              const expected={22:'пунктам II или III',23:'пункту II',24:'пункту II',25:'пунктам II и III'};
              for(const [n,phrase] of Object.entries(expected)){
                const text=await page.locator('.ephys-review-item').nth(Number(n)-1).textContent();
                if(!text.includes(phrase)) throw new Error(`rendered criterion mismatch task ${n}`);
              }
              // explicit partial scorer gate through actual controls
              await page.locator('#ephys-reset-result').click(); await page.locator('#ephys-start').click();
              await nav(5).click(); await page.locator('.ephys-unordered-check[value="3"]').check();
              await nav(6).click(); let s=page.locator('.ephys-ordered-select'); await s.nth(0).selectOption('4'); await s.nth(1).selectOption('2');
              await page.locator('#ephys-finish-top').click();
              if((await page.locator('#ephys-short-score').textContent()).trim()!=='2') throw new Error('partial scorer total expected 2');
              if(!(await page.locator('.ephys-review-item').nth(4).textContent()).includes('1/2')) throw new Error('task5 partial scorer failed');
              if(!(await page.locator('.ephys-review-item').nth(5).textContent()).includes('1/2')) throw new Error('task6 partial scorer failed');
              // legacy V3.1 string state must restore into structured controls
              await page.evaluate(({k,now})=>localStorage.setItem(k,JSON.stringify({version:2,status:'running',current:6,answers:{5:'35',6:'43'},drafts:{6:'legacy draft'},flagged:{6:true},startedAt:now-1000,endsAt:now+600000,completedAt:null,variant26:1,selfScores:{},shortScore:0})),{k:key,now:Date.now()});
              await page.reload();
              if((await page.locator('.ephys-ordered-select').nth(0).inputValue())!=='4'||(await page.locator('.ephys-ordered-select').nth(1).inputValue())!=='3') throw new Error('legacy ordered restore failed');
              if((await page.locator('#ephys-draft-input').inputValue())!=='legacy draft') throw new Error('legacy draft restore failed');
              if(await nav(6).getAttribute('data-flagged')!=='true') throw new Error('legacy flag restore failed');
              await nav(5).click();
              if(!await page.locator('.ephys-unordered-check[value="3"]').isChecked()||!await page.locator('.ephys-unordered-check[value="5"]').isChecked()) throw new Error('legacy unordered restore failed');
              // render and inspect all three official task-26 alternatives
              for(const v of [1,2,3]){
                await page.evaluate(({k,v,now})=>localStorage.setItem(k,JSON.stringify({version:2,status:'finished',current:26,answers:{26:'test'},drafts:{},flagged:{},startedAt:now-1000,endsAt:now+1000,completedAt:now,variant26:v,selfScores:{},shortScore:0})),{k:key,v,now:Date.now()});
                await page.reload();
                const text=await page.locator('.ephys-review-item').nth(25).textContent();
                const phrase=v===1?'пункту II':v===2?'пунктам II или III':'пунктам II и III';
                if(!text.includes(phrase)) throw new Error(`task26 variant ${v} K2 criterion mismatch`);
              }
            }else{
              // clean-unpack smoke: current controls load, persist, and score one deterministic answer
              await page.locator('#ephys-answer-input').fill('-1');
              await page.locator('#ephys-finish-top').click();
              if((await page.locator('#ephys-short-score').textContent()).trim()!=='1') throw new Error('clean package scorer smoke failed');
            }
            if(errors.length) throw new Error('page errors: '+errors.join(' | '));
            await browser.close(); server.kill('SIGTERM');
          }
          await run('ege-fizika-demoversiya-v3-1-fixed',8765,true);
          console.log('FULL_BROWSER_ACCEPTANCE_PASS');
          JS
          node /tmp/physics-browser.mjs
          rm -rf /tmp/physics-clean /tmp/physics-package.zip
          zip -qr /tmp/physics-package.zip ege-fizika-demoversiya-v3-1-fixed
          mkdir -p /tmp/physics-clean && unzip -q /tmp/physics-package.zip -d /tmp/physics-clean
          node - <<'JS'
          import { chromium } from 'playwright'; import { spawn } from 'node:child_process';
          const server=spawn('python',['-m','http.server','8766','--directory','/tmp/physics-clean/ege-fizika-demoversiya-v3-1-fixed'],{stdio:'ignore'}); await new Promise(r=>setTimeout(r,900));
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage({viewport:{width:390,height:900}}); const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('dialog',d=>d.accept());
          await page.goto('http://127.0.0.1:8766/ege-fizika-demoversiya-PREVIEW.html'); await page.locator('#ephys-start').click(); await page.locator('#ephys-answer-input').fill('-1'); await page.locator('#ephys-finish-top').click();
          if((await page.locator('#ephys-short-score').textContent()).trim()!=='1'||errors.length) throw new Error('clean-unpack browser smoke failed');
          await browser.close(); server.kill('SIGTERM'); console.log('CLEAN_UNPACK_BROWSER_PASS');
          JS
      - name: Write final acceptance evidence and freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed')
          cases=pkg/'ege-fizika-demoversiya-ACCEPTANCE-CASES.json'; d=json.loads(cases.read_text(encoding='utf-8'))
          d.update({'browser_acceptance_status':'PASS','responsive_positions_checked':130,'severe_javascript_errors':0,'content_fidelity_rendered_recheck':'PASS','source_byte_lock_status':'PASS','clean_unpack_browser_status':'PASS','freeze_status':'PASS'})
          cases.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          defects=pkg/'PHYSICS-2026-CONTENT-FIDELITY-DEFECTS.json'; f=json.loads(defects.read_text(encoding='utf-8')); f['status']='RESOLVED_AND_RENDERED_RECHECK_PASS'; f['rendered_recheck']='PASS'; f['freeze_effect']='CLOSED'; defects.write_text(json.dumps(f,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          evidence={'candidate':'V3.2','source_year':2026,'source_byte_lock':'PASS','package_source_byte_identity':'PASS','content_fidelity':'PASS','input_contracts':'PASS','browser_interaction':'PASS','scorer_full_28':'PASS','scorer_partial':'PASS','state_restore':'PASS','legacy_v31_state_restore':'PASS','task26_three_variants':'PASS','responsive_320_360_390_768_1280':'PASS','responsive_states_checked':130,'severe_js_errors':0,'extended_self_evaluation_semantics':'PASS','clean_unpack_browser':'PASS','technical_freeze_ready':True}
          (pkg/'PHYSICS-2026-CURRENT-ACCEPTANCE-EVIDENCE.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          freeze='''EKSAMIO PHYSICS 2026 — ACCEPTED TECHNICAL REFERENCE\nDATE=2026-08-19\nSUBJECT=physics\nSOURCE_YEAR=2026\nCURRENT_PACKAGE=ege-fizika-demoversiya-v3-1-fixed\nACCEPTANCE_CANDIDATE=V3.2\nTECHNICAL_ACCEPTANCE=YES\nTECHNICAL_REFERENCE_FROZEN=YES\nDO_NOT_REBUILD_WITHOUT_CAUSE=YES\nSOURCE_BYTE_LOCK=PASS\nPACKAGE_SOURCE_BYTE_IDENTITY=PASS\nCONTENT_FIDELITY=PASS\nINPUT_CONTRACTS=PASS\nBROWSER_INTERACTION=PASS\nSCORER_FULL_AND_PARTIAL=PASS\nSTATE_RESTORE=PASS\nLEGACY_V3_1_STATE_RESTORE=PASS\nTASK26_ALL_THREE_DEMO_VARIANTS=PASS\nRESPONSIVE_320_360_390_768_1280=PASS\nCLEAN_UNPACK_BROWSER=PASS\nSEVERE_JAVASCRIPT_ERRORS=0\nAUTOMATIC_PART1_MAX=28\nEXPERT_PART2_MAX=17\nTOTAL_OFFICIAL_MAX=45\nPART2_SELF_EVALUATION_IS_OFFICIAL_SCORE=NO\nARCHIVE_REFERENCE_ONLY=YES\nARCHIVE_YEARS_MUST_USE_EXACT_YEAR_FIPI_CONTENT_AUTHORITY=YES\n\nThis accepted 2026 build is a technical reference for archive-year implementation only. It is never content authority for 2025, 2024, 2023 or 2022. Each archive year starts with exact-year FIPI source prelock and proves its own tasks, answers, alternatives, criteria, scoring, visuals and input contracts.\n\nReopen 2026 only for a confirmed defect, confirmed FIPI mismatch, platform compatibility requirement, or direct project instruction.\n'''
          (pkg/'ACCEPTED-TECHNICAL-REFERENCE-2026-08-19.txt').write_text(freeze,encoding='utf-8')
          gate=(pkg/'ege-fizika-demoversiya-SOURCE-GATE.txt')
          gate.write_text('''EKSAMIO PHYSICS 2026 — ACCEPTANCE GATE\nEXAM=ЕГЭ\nSUBJECT=физика\nSOURCE_YEAR=2026\nCURRENT_PACKAGE=ege-fizika-demoversiya-v3-1-fixed\nCURRENT_ACCEPTANCE_CANDIDATE=V3.2\nSTATUS=ACCEPTED_TECHNICAL_REFERENCE\nSOURCE_GATE=CLOSED\nSOURCE_BYTE_LOCK=PASS\nPACKAGE_SOURCE_BYTE_IDENTITY=PASS\nCONTENT_FIDELITY=PASS\nINPUT_CONTRACTS=PASS\nBROWSER_INTERACTION=PASS\nSCORER=PASS\nSTATE_RESTORE=PASS\nRESPONSIVE=PASS\nCLEAN_UNPACK_BROWSER=PASS\nTECHNICAL_REFERENCE_FROZEN=YES\n\nAuthority: exact approved FIPI 2026 archive preserved in ege-source-fizika/source-fizika-2026/.\nPart 1 is automatically scored up to 28. Part 2 self-evaluation is explicitly unofficial and orientational; official expert-only maximum is 17.\nArchive years 2025–2022 must not inherit 2026 content; they use 2026 only as a technical implementation reference.\n''',encoding='utf-8')
          readme=pkg/'00-README-CODEX.txt'; r=readme.read_text(encoding='utf-8').replace('СТАТУС\nNOT_FROZEN.','СТАТУС\nACCEPTED_TECHNICAL_REFERENCE.').replace('До freeze обязательны: внешний source byte-lock, синхронизация PREVIEW, новый manifest, текущий browser/scorer/state/responsive regression и clean-package gate.','Freeze закрыт 2026-08-19. Доказательства: PHYSICS-2026-CURRENT-ACCEPTANCE-EVIDENCE.json и ACCEPTED-TECHNICAL-REFERENCE-2026-08-19.txt.')
          readme.write_text(r,encoding='utf-8')
          # final manifest after all evidence/freeze files exist
          rows=[]
          for p in sorted(pkg.rglob('*')):
              if p.is_file() and p.name!='ege-fizika-demoversiya-MANIFEST.txt': rows.append((str(p.relative_to(pkg)),p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()))
          lines=['EGE ФИЗИКА — ИНТЕРАКТИВНАЯ ДЕМОВЕРСИЯ — ACCEPTED V3.2','PACKAGE_STATUS=ACCEPTED_TECHNICAL_REFERENCE','SOURCE_YEAR=2026','PACKAGE_LAYOUT=FLAT_WITH_SOURCE','','FILENAME\tSIZE_BYTES\tSHA256']+[f'{n}\t{s}\t{h}' for n,s,h in rows]
          (pkg/'ege-fizika-demoversiya-MANIFEST.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit freeze and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/physics-2026-pr-browser-acceptance.yml .physics-2026-browser-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Accept Physics 2026 technical reference'
          git push origin HEAD:chatgpt/physics-2026-acceptance-20260819
