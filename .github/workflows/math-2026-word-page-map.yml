name: Rebuild mathematics 2026 page maps from word coordinates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/math-2026-word-page-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install --quiet pymupdf
      - name: Build word-level printed pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz

          root=Path('matematika-source-2026')
          jobs=[
            ('base-demo',root/'original'/'МА-11 ЕГЭ 2026 ДЕМО_базовый.pdf',29),
            ('base-spec',root/'original'/'МА-11 ЕГЭ 2026 СПЕЦ_базовый.pdf',12),
            ('profile-demo',root/'original'/'МА-11 ЕГЭ 2026 ДЕМО_профильный.pdf',None),
            ('profile-spec',root/'original'/'МА-11 ЕГЭ 2026 СПЕЦ_профильный.pdf',None),
            ('codifier',root/'original'/'МА-11 ЕГЭ 2026_КОДИФ.pdf',18),
          ]

          def rebuild_lines(words):
              # words: (visual_y, visual_x, visual_height, token)
              words=sorted(words,key=lambda w:(w[0],w[1]))
              lines=[]
              for y,x,h,t in words:
                  tol=max(2.5,min(7.0,h*0.55))
                  if not lines or abs(y-lines[-1]['anchor'])>tol:
                      lines.append({'anchor':y,'items':[(x,t)]})
                  else:
                      lines[-1]['items'].append((x,t))
                      # stable running anchor prevents small baseline jitter from splitting a line
                      lines[-1]['anchor']=(lines[-1]['anchor']*3+y)/4
              out=[]
              for line in lines:
                  items=sorted(line['items'])
                  out.append(' '.join(t for _,t in items))
              return '\n'.join(out).strip()

          for name,pdf_path,expected in jobs:
              out=root/'printed-pages'/name
              out.mkdir(parents=True,exist_ok=True)
              for p in out.glob('page-*.txt'): p.unlink()
              doc=fitz.open(pdf_path)
              printed=[]
              pno=0
              for phys,page in enumerate(doc,start=1):
                  visual=page.rect * page.rotation_matrix
                  mid=(visual.x0+visual.x1)/2
                  halves={'left':[],'right':[]}
                  for w in page.get_text('words', sort=False):
                      raw_rect=fitz.Rect(w[0],w[1],w[2],w[3])
                      vr=raw_rect * page.rotation_matrix
                      cx=(vr.x0+vr.x1)/2
                      cy=(vr.y0+vr.y1)/2
                      h=max(1.0,vr.height)
                      half='left' if cx<mid else 'right'
                      halves[half].append((cy,vr.x0,h,w[4]))
                  for half in ('left','right'):
                      pno+=1
                      if expected is not None and pno>expected: break
                      text=rebuild_lines(halves[half])
                      path=out/f'page-{pno:02d}.txt'
                      path.write_text(text+'\n',encoding='utf-8')
                      printed.append({'printed_page':pno,'physical_pdf_page':phys,'half':half,'chars':len(text),'file':str(path)})
                  if expected is not None and pno>=expected: break
              (out/'PAGE-MAP.json').write_text(json.dumps({
                  'source_pdf':str(pdf_path),'physical_pdf_pages':len(doc),
                  'expected_printed_pages':expected,'generated_printed_pages':len(printed),'pages':printed
              },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate known cross-page cases
        run: |
          set -euo pipefail
          test "$(find matematika-source-2026/printed-pages/base-demo -name 'page-*.txt' | wc -l)" -eq 29
          grep -q 'Шоколадка стоит 25 рублей' matematika-source-2026/printed-pages/base-demo/page-08.txt
          grep -q '365 суток' matematika-source-2026/printed-pages/base-demo/page-09.txt
          grep -q '15,8 секунды' matematika-source-2026/printed-pages/base-demo/page-09.txt
          ! grep -q '365 суток' matematika-source-2026/printed-pages/base-demo/page-10.txt
          ! grep -q '15,8 секунды' matematika-source-2026/printed-pages/base-demo/page-10.txt
          grep -q 'среднемесячная температура воздуха' matematika-source-2026/printed-pages/base-demo/page-10.txt
          grep -q 'Максимальный первичный балл' matematika-source-2026/printed-pages/base-spec/page-09.txt
      - name: Commit corrected maps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matematika-source-2026/printed-pages
          git diff --cached --quiet || { git commit -m 'Rebuild mathematics 2026 page maps at word level'; git push origin HEAD:main; }
