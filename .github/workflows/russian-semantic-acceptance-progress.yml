name: Russian semantic acceptance progress

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/**"
      - "eksamio-learning-engine/russian-program/object-review/**"
      - "eksamio-learning-engine/russian-program/source-knowledge/**"
      - "eksamio-learning-engine/russian-program/ege-task-code-relation/**"
      - "eksamio-learning-engine/264-RUSSIAN-FIPI-2026-EGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/266-RUSSIAN-SCHOOL-FINAL-REFREEZE-AND-FIPI-2026-OVERLAY-CLOSURE-v1.0.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - ".github/workflows/russian-semantic-acceptance-progress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review RU01 phonetics subject boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_subject_boundary_review.py --output /tmp/ru01-a.json > /tmp/ru01-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_phonetics_subject_boundary_review.py --output /tmp/ru01-b.json > /tmp/ru01-b.txt
          cmp /tmp/ru01-a.json /tmp/ru01-b.json
          diff -u /tmp/ru01-a.txt /tmp/ru01-b.txt
          cat /tmp/ru01-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru01_phonetics_bounded_subject_semantics.py
      - name: Build semantic acceptance progress twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress.py \
            --output /tmp/progress-a.json > /tmp/progress-report-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress.py \
            --output /tmp/progress-b.json > /tmp/progress-report-b.txt
          cmp /tmp/progress-a.json /tmp/progress-b.json
          diff -u /tmp/progress-report-a.txt /tmp/progress-report-b.txt
          cat /tmp/progress-report-a.txt
          cp /tmp/progress-a.json eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS.json
      - name: Verify fail-closed progress summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS.json').read_text(encoding='utf-8'))
          s = data['progress_summary']
          assert data['schema_version'] == '0.4.0'
          assert data['status'] == 'CENTRAL_BRAIN_SUBJECT_ACCEPTANCE_IN_PROGRESS'
          assert data['russian_content_ready'] is False

          expected_authorities = {
              'RUSSIAN_EGE_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_PUNCTUATION_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_DIRECT_SPEECH_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RUSSIAN_OGE_INDIRECT_SPEECH_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1',
              'RU16_TASK27_BOUNDED_ROUTE_SEMANTIC_ACCEPTANCE_v0.1',
              'RU16_TASK27_K5_BOUNDED_ROUTE_SEMANTIC_ACCEPTANCE_v0.1',
              'RU13_EXPRESSIVE_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_v0.1',
              'RU13_EXPRESSIVE_EXISTING_CANDIDATES_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_v0.1',
              'RU01_PHONETICS_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_v0.1',
          }
          assert len(data['accepted_authorities']) == 10
          assert {a['id'] for a in data['accepted_authorities']} == expected_authorities

          for authority_id, count in (
              ('RU13_EXPRESSIVE_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_v0.1', 14),
              ('RU13_EXPRESSIVE_EXISTING_CANDIDATES_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_v0.1', 10),
              ('RU01_PHONETICS_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_v0.1', 3),
          ):
              authority = next(a for a in data['accepted_authorities'] if a['id'] == authority_id)
              assert authority['authority_kind'] == 'BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE_WITHOUT_OBJECT_BINDING'
              assert authority['accepted_admission_units'] == 0
              assert authority['accepted_requirements'] == 0
              assert authority['accepted_subject_semantics'] == count
              assert authority['accepted_route_semantics'] == 0

          indirect = next(a for a in data['accepted_authorities'] if a['id'] == 'RUSSIAN_OGE_INDIRECT_SPEECH_EXACT_CANONICAL_COMPONENT_ACCEPTANCE_v0.1')
          assert indirect['authority_kind'] == 'OBJECT_BOUND_CANONICAL_COMPONENT_SET'
          assert indirect['accepted_admission_units'] == 1
          assert indirect['accepted_requirements'] == 1

          assert s['finite_semantic_review_groups'] == 74
          assert s['fully_accepted_semantic_groups'] == 0
          assert s['review_groups_with_accepted_component_sets'] == 10
          assert s['semantic_units_with_accepted_component_sets'] == 19
          assert s['semantic_requirements_with_accepted_component_sets'] == 19
          assert s['semantic_units_remaining_without_accepted_component_set'] == 1297
          assert s['semantic_requirements_remaining_without_accepted_component_set'] == 1372
          assert s['canonical_component_refs_reused_unique'] == 52
          assert s['accepted_bounded_ru_route_semantics'] == 5
          assert s['accepted_bounded_ru_subject_semantics'] == 27
          assert s['accepted_bounded_ru_semantics_total'] == 32
          assert s['accepted_route_semantics_without_object_binding'] == 5
          assert s['accepted_subject_semantics_without_object_binding'] == 27
          assert s['new_semantic_identities_created'] == 0
          assert s['ru_proposal_identities_admitted'] == 32
          assert s['false_exact_mastery_admissions'] == 0

          expected_route = {
              'ru-ege-essay-author-position',
              'ru-ege-essay-example-semantic-relation',
              'ru-ege-essay-logical-composition-cohesion',
              'ru-ege-essay-own-relation-justification',
              'ru-ege-essay-source-examples-explanation',
          }
          expected_subject = {
              'ru-expressive-alliteration',
              'ru-expressive-personification',
              'ru-expressive-syntactic-parallelism',
              'ru-expressive-question-answer-form',
              'ru-expressive-gradation',
              'ru-expressive-inversion',
              'ru-expressive-lexical-repetition',
              'ru-expressive-epiphora',
              'ru-expressive-antithesis',
              'ru-expressive-rhetorical-question',
              'ru-expressive-rhetorical-exclamation',
              'ru-expressive-polysyndeton',
              'ru-expressive-asyndeton',
              'ru-expressive-litotes',
              'ru-expressive-assonance',
              'ru-expressive-hyperbole',
              'ru-expressive-metonymy',
              'ru-expressive-anaphora',
              'ru-expressive-parcellation',
              'ru-expressive-homogeneous-rows',
              'ru-expressive-address',
              'ru-expressive-epithet',
              'ru-expressive-metaphor',
              'ru-expressive-comparison',
              'ru-phonetics-sound-letter-relation',
              'ru-phonetics-vowel-consonant-features',
              'ru-phonetics-word-analysis-sequence',
          }
          assert set(data['accepted_route_semantic_refs']) == expected_route
          assert set(data['accepted_subject_semantic_refs']) == expected_subject
          assert set(data['accepted_bounded_ru_semantic_refs']) == expected_route | expected_subject
          assert 'ru-expressive-rhetorical-address' not in data['accepted_bounded_ru_semantic_refs']
          assert data['policy']['route_semantic_acceptance_can_reduce_object_counts_without_exact_binding'] is False
          assert data['policy']['subject_semantic_acceptance_can_reduce_object_counts_without_exact_binding'] is False

          touched = [g for g in data['semantic_review_groups'] if g['accepted_component_set_count']]
          assert len(touched) == 10
          assert sum(g['accepted_component_set_count'] for g in touched) == 19
          assert all(g['status'] == 'SUBJECT_ACCEPTANCE_REQUIRED_WITH_ACCEPTED_COMPONENT_SET' for g in touched)
          assert all(g['remaining_group_action'].startswith('CONTINUE_EXACT_COMPONENT_REVIEW') for g in touched)
          print('RUSSIAN_SEMANTIC_ACCEPTANCE_PROGRESS_GUARD=PASS')
          PY
      - name: Upload semantic progress artifact
        uses: actions/upload-artifact@v4
        with:
          name: russian-semantic-acceptance-progress
          path: eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
