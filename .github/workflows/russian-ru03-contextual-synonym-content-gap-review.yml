name: Russian RU03 contextual synonym content gap review

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_source_identity_resolution.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_content_gap_review.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-03-*.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - "eksamio-learning-engine/48-RUSSIAN-EXCEPTIONS-WAVE2-NORMS-v0.1.json"
      - ".github/workflows/russian-ru03-contextual-synonym-content-gap-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru03-contextual-synonym-content-gap-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile contextual synonym gap reviewer
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_content_gap_review.py
      - name: Build content gap review twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_content_gap_review.py --output /tmp/ru03-syn-gap-a.json > /tmp/ru03-syn-gap-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru03_contextual_synonym_content_gap_review.py --output /tmp/ru03-syn-gap-b.json > /tmp/ru03-syn-gap-b.txt
          cmp /tmp/ru03-syn-gap-a.json /tmp/ru03-syn-gap-b.json
          diff -u /tmp/ru03-syn-gap-a.txt /tmp/ru03-syn-gap-b.txt
          cat /tmp/ru03-syn-gap-a.txt
          cp /tmp/ru03-syn-gap-a.json RU03-CONTEXTUAL-SYNONYM-CONTENT-GAP-REVIEW.json
      - name: Verify reuse-first gap remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('RU03-CONTEXTUAL-SYNONYM-CONTENT-GAP-REVIEW.json').read_text(encoding='utf-8'))
          assert data['status'] == 'CENTRAL_BRAIN_RU03_CONTEXTUAL_SYNONYM_CONTENT_GAP_REVIEW_COMPLETE_NO_ADMISSION'
          assert data['authority_issue'] == 161
          assert data['candidate_ref'] == 'candidate-015'
          assert data['source_taxonomy_id'] == 'contextual_synonym_selection'
          assert data['source_identity_prerequisite']['source_identity_status'] == 'EXACT_CURRENT_2026_OFFICIAL_SOURCE_CONFIRMED'
          reuse = data['reuse_first_inventory']
          assert reuse['exact_candidate_or_taxonomy_crosswalk_matches'] == 0
          assert reuse['proposed_semantic_id_collisions'] == 0
          assert reuse['broader_neighbor']['semantic_id'] == 'ru-lexis-contextual-meaning-polysemy'
          assert reuse['broader_neighbor']['relation'] == 'ADJACENT_BUT_NOT_EXACT'
          decision = data['decision']
          assert decision['exact_preexisting_learner_content_reusable'] is False
          assert decision['candidate_specific_content_gap_proven'] is True
          assert decision['new_original_learner_content_required'] is True
          assert decision['proposed_bounded_semantic_id'] == 'ru-lexis-contextual-synonym-text-fit'
          assert decision['semantic_admission_by_this_review'] is False
          assert decision['object_level_admission_units_closed'] == 0
          assert decision['object_level_requirements_closed'] == 0
          assert decision['false_exact_mastery_admissions'] == 0
          policy = data['policy']
          assert policy['adjacent_contextual_meaning_unit_can_emit_contextual_synonym_mastery'] is False
          assert policy['historical_task25_product_card_is_sufficient_new_content'] is False
          assert policy['official_fipi_wording_may_be_copied_into_learner_content'] is False
          assert policy['learner_examples_must_be_original_eksamio'] is True
          assert policy['generic_task25_result_can_emit_exact_component_mastery'] is False
          assert policy['component_specific_independent_verification_required'] is True
          assert data['summary']['exact_candidate_content_matches'] == 0
          assert data['summary']['candidate_specific_content_gaps'] == 1
          assert data['summary']['semantic_admissions'] == 0
          assert data['summary']['false_exact_mastery_admissions'] == 0
          assert data['next_exact_work']['semantic_admission_allowed_from_gap_review_alone'] is False
          print('RU03_CONTEXTUAL_SYNONYM_CONTENT_GAP_FAIL_CLOSED_GUARD=PASS')
          PY
      - name: Upload contextual synonym gap evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru03-contextual-synonym-content-gap-review
          path: RU03-CONTEXTUAL-SYNONYM-CONTENT-GAP-REVIEW.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="main"
          fi
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          if git diff --name-only "origin/${base_ref}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          if [[ -z "$base_ref" ]]; then
            base_ref="main"
          fi
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          git diff --check "origin/${base_ref}...HEAD"
