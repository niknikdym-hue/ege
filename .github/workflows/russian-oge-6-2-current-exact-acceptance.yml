name: Russian OGE 6.2 current exact acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/275-RUSSIAN-SCHOOL-OGE-6.2-REOPEN-MATERIALIZATION-v0.1.json"
      - "eksamio-learning-engine/276-RUSSIAN-FIPI-2026-OGE-6.2-CURRENT-ROUTE-SUPERSESSION-v0.1.json"
      - "eksamio-learning-engine/277-RUSSIAN-SCHOOL-CURRENT-LAUNCH-REFREEZE-v1.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-CANONICAL-INVENTORY-SUPPLEMENT-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_2_current_acceptance.py"
      - ".github/workflows/russian-oge-6-2-current-exact-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-2-current-exact-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile current acceptance validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_russian_oge_6_2_current_acceptance.py
      - name: Validate current 6.2 authority twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_russian_oge_6_2_current_acceptance.py" > /tmp/a.txt
          python3 "$root/validate_russian_oge_6_2_current_acceptance.py" > /tmp/b.txt
          diff -u /tmp/a.txt /tmp/b.txt
          cat /tmp/a.txt
          grep -Fx 'CURRENT_SCHOOL_DENOMINATOR=186' /tmp/a.txt
          grep -Fx 'EXACT_OWNER_FRONTIER=16' /tmp/a.txt
          grep -Fx 'REUSED_CURRENT_CANONICAL_OWNERS=15' /tmp/a.txt
          grep -Fx 'NEW_SCHOOL_CANONICAL_IDENTITIES=1' /tmp/a.txt
          grep -Fx 'ACCEPTED_OBJECT_UNITS=1' /tmp/a.txt
          grep -Fx 'ACCEPTED_REQUIREMENTS=1' /tmp/a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/a.txt
          grep -Fx 'LEARNER_AUDIO_PERSISTENCE=0' /tmp/a.txt
      - name: Upload current 6.2 acceptance authority
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-2-current-exact-acceptance
          path: eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
