name: SEP1 Tutor private staging allowlist

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/ai-tutor-reference/accepted_russian_semantic_tutor.py"
      - "eksamio-learning-engine/ai-tutor-reference/validate_accepted_russian_semantic_tutor.py"
      - "eksamio-learning-engine/russian-program/subject-admission/RU13-EXPRESSIVE-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU16-TASK27-BOUNDED-ROUTE-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU16-TASK27-K5-BOUNDED-ROUTE-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-13-EXPRESSIVE-MEANS-WAVE-001-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-13-EXPRESSIVE-MEANS-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-16-EGE-ESSAY-WAVE-001-v0.1.json"
      - ".github/workflows/sep1-tutor-private-staging-allowlist.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-semantic-tutor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile accepted-semantic Tutor boundary
        run: |
          python3 -m py_compile \
            eksamio-learning-engine/ai-tutor-reference/accepted_russian_semantic_tutor.py \
            eksamio-learning-engine/ai-tutor-reference/validate_accepted_russian_semantic_tutor.py
      - name: Validate accepted-semantic Tutor twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/ai-tutor-reference/validate_accepted_russian_semantic_tutor.py > /tmp/tutor-a.txt
          python3 eksamio-learning-engine/ai-tutor-reference/validate_accepted_russian_semantic_tutor.py > /tmp/tutor-b.txt
          diff -u /tmp/tutor-a.txt /tmp/tutor-b.txt
          cat /tmp/tutor-a.txt
      - name: Prove no provider execution or audio persistence in this gate
        shell: bash
        run: |
          set -euo pipefail
          out="$(python3 eksamio-learning-engine/ai-tutor-reference/validate_accepted_russian_semantic_tutor.py)"
          grep -q '^PROVIDER_NETWORK_REQUESTS=0$' <<<"$out"
          grep -q '^PAID_PROVIDER_REQUESTS=0$' <<<"$out"
          grep -q '^RAW_AUDIO_PERSISTED_BYTES=0$' <<<"$out"
          grep -q '^UNACCEPTED_SEMANTIC_SESSION=DENIED$' <<<"$out"
      - name: Protect public and accepted demo surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | grep -E 'russkiy-knigi|tilda|demo|scor|payments-reference'; then
            echo 'Tutor private-staging allowlist PR changed protected/public/payment surfaces.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
