name: physics-2026-pr-reopen-orchestrator
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  reopen:
    if: github.head_ref == 'chatgpt/physics-2026-source-visual-tools-fix-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
          fetch-depth: 0
      - name: Guard
        id: gate
        shell: bash
        run: |
          if [ -f .physics-2026-orchestrator-trigger ] && grep -qx 'run=yes' .physics-2026-orchestrator-trigger; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'
      - name: Install PDF tooling
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pymupdf pillow >/dev/null
      - name: Inventory every current visual
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed')
          def block(name,bid):
              s=(pkg/name).read_text(encoding='utf-8');m=re.search(r'<script[^>]+id="'+re.escape(bid)+r'"[^>]*>(.*?)</script>',s,re.S);assert m,name;return json.loads(m.group(1))
          objs=[]
          for name,bid in [('ege-fizika-demoversiya-T123-02.txt','ephys-data-1'),('ege-fizika-demoversiya-T123-03.txt','ephys-data-2'),('ege-fizika-demoversiya-T123-04.txt','ephys-data-3')]:
              for t in block(name,bid).get('tasks',[]):objs.append((t['number'],None,name,t))
          for v in block('ege-fizika-demoversiya-T123-05.txt','ephys-data-4').get('variants26',[]):objs.append((26,v['variant'],'ege-fizika-demoversiya-T123-05.txt',v))
          rows=[]
          for task,var,name,obj in objs:
              for field in ('promptHtml','solutionHtml','criteriaHtml','criteriaK1Html','criteriaK2Html'):
                  html=obj.get(field,'') or ''
                  if '<svg' not in html and '<img' not in html:continue
                  srcs=re.findall(r'<img[^>]+src="([^"]+)"',html,re.I)
                  rows.append({'task':task,'variant':var,'file':name,'field':field,'inline_svg_count':len(re.findall(r'<svg\b',html,re.I)),'img_count':len(re.findall(r'<img\b',html,re.I)),'img_sources':srcs,'captions':[re.sub('<[^>]+>','',x).strip() for x in re.findall(r'<figcaption[^>]*>(.*?)</figcaption>',html,re.I|re.S)],'current_source_class':'RECONSTRUCTED_OR_INLINE_SVG' if '<svg' in html else ('EMBEDDED_DATA_IMAGE' if any(x.startswith('data:') for x in srcs) else 'FILE_IMAGE')})
          standalone=[{'file':p.name,'suffix':p.suffix.lower(),'bytes':p.stat().st_size} for p in sorted(pkg.glob('asset-*')) if p.is_file()]
          out={'source_year':2026,'policy':'Every exam and official-solution visual must be an exact crop from the byte-locked FIPI PDF. Reconstructed SVG is forbidden.','rows':rows,'counts':{'visual_fields':len(rows),'inline_svg_fields':sum(bool(r['inline_svg_count']) for r in rows),'embedded_data_image_fields':sum(any(x.startswith('data:') for x in r['img_sources']) for r in rows),'file_image_fields':sum(r['current_source_class']=='FILE_IMAGE' for r in rows)},'standalone_assets':standalone}
          Path('tmp-physics-2026-visual-audit').mkdir(exist_ok=True)
          Path('tmp-physics-2026-visual-audit/current-visual-inventory.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(out['counts'])
          PY
      - name: Split exact official PDF into logical pages
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz,re,json,shutil
          from PIL import Image
          from io import BytesIO
          pdf=Path('ege-fizika-demoversiya-v3-1-fixed/source/ege-2026-fizika-demoversiya.pdf');out=Path('tmp-physics-2026-visual-audit/layout-pages');shutil.rmtree(out,ignore_errors=True);out.mkdir(parents=True)
          doc=fitz.open(pdf);assert len(doc)==21
          parts=[];meta=[];fallback=1
          for physical,page in enumerate(doc,1):
              rot=page.rotation;page.set_rotation(0);r=page.rect;assert r.height>r.width
              halves=[fitz.Rect(r.x0,r.y0,r.x1,r.y0+r.height/2),fitz.Rect(r.x0,r.y0+r.height/2,r.x1,r.y1)]
              for slot,clip in enumerate(halves,1):
                  text=page.get_text('text',clip=clip).replace('\x00','').strip();nums=re.findall(r'\b(\d+)\s*/\s*42\b',text);logical=int(nums[-1]) if nums else fallback;fallback=max(fallback,logical+1)
                  pix=page.get_pixmap(matrix=fitz.Matrix(2,2),clip=clip,alpha=False);im=Image.open(BytesIO(pix.tobytes('png'))).convert('RGB').rotate(-90,expand=True);name=f'logical-{logical:02d}-p{physical:02d}s{slot}.webp';im.save(out/name,'WEBP',quality=90,method=6)
                  drawings=[]
                  for d in page.get_drawings():
                      dr=d.get('rect')
                      if not dr or not dr.intersects(clip):continue
                      inter=dr&clip
                      if inter.width>clip.width*.95 and inter.height>clip.height*.95:continue
                      drawings.append([round(inter.x0-clip.x0,2),round(inter.y0-clip.y0,2),round(inter.x1-clip.x0,2),round(inter.y1-clip.y0,2)])
                  meta.append({'logical_page':logical,'physical_page':physical,'slot':slot,'clip_unrotated':[round(clip.x0,2),round(clip.y0,2),round(clip.x1,2),round(clip.y1,2)],'render':'layout-pages/'+name,'drawing_rects':drawings,'text_length':len(text)})
                  parts.append(f'===== LOGICAL PAGE {logical} | physical {physical} slot {slot} =====\n{text}\n')
              page.set_rotation(rot)
          Path('tmp-physics-2026-visual-audit/OFFICIAL-LAYOUT-TEXT.txt').write_text('\n'.join(parts),encoding='utf-8')
          Path('tmp-physics-2026-visual-audit/logical-pages.json').write_text(json.dumps({'authority':'exact byte-locked FIPI 2026 demo PDF','temporary':True,'pages':sorted(meta,key=lambda x:x['logical_page'])},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Patch physics symbol keyboard and calculator
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('ege-fizika-demoversiya-v3-1-fixed/ege-fizika-demoversiya-T123-06.txt');s=p.read_text(encoding='utf-8')
          if 'function installExamTools()' not in s:
              marker='function installRuntimeStyles(){';assert marker in s
              tools=r'''var PHYSICS_SYMBOLS=["²","³","⁻¹","₀","₁","₂","₃","₄","₅","₆","₇","₈","₉","→","↑","↓","±","≈","√","π","α","β","γ","φ","ω","Δ","Σ","λ","μ","ν","ρ","ε","η","Ω","·","×","≤","≥","v⃗","a⃗","F⃗","p⃗","B⃗","E⃗"];
var calcLastAnswer=0;
function insertAtCursor(el,text){if(!el)return;var st=typeof el.selectionStart==="number"?el.selectionStart:el.value.length,en=typeof el.selectionEnd==="number"?el.selectionEnd:st;el.setRangeText(text,st,en,"end");el.dispatchEvent(new Event("input",{bubbles:true}));el.focus()}
function physicsSymbolKeyboardHtml(targetId){return '<div class="ephys-symbol-keyboard" data-target="'+escapeHtml(targetId)+'" aria-label="Клавиатура физических символов"><div class="ephys-symbol-keyboard__label">Физические знаки</div><div class="ephys-symbol-keyboard__keys">'+PHYSICS_SYMBOLS.map(function(x){return '<button type="button" class="ephys-symbol-key" data-symbol="'+escapeHtml(x)+'">'+escapeHtml(x)+'</button>'}).join("")+'</div></div>'}
function installSymbolKeyboards(container){container.querySelectorAll("textarea").forEach(function(el){if(!el.id||el.getAttribute("data-symbol-keyboard")==="true")return;el.setAttribute("data-symbol-keyboard","true");var h=document.createElement("div");h.innerHTML=physicsSymbolKeyboardHtml(el.id);var kb=h.firstElementChild;el.insertAdjacentElement("afterend",kb);kb.querySelectorAll("button[data-symbol]").forEach(function(b){b.addEventListener("click",function(){insertAtCursor(el,b.getAttribute("data-symbol"))})})})}
function calcTokenize(input){var s=String(input||"").replace(/,/g,".").replace(/π/g,"pi").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s+/g,"");var o=[],i=0;while(i<s.length){var r=s.slice(i),m;if((m=r.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/))){o.push({t:"num",v:Number(m[0])});i+=m[0].length;continue}if((m=r.match(/^[A-Za-z]+/))){o.push({t:"id",v:m[0].toLowerCase()});i+=m[0].length;continue}var c=s[i];if("+-*/^()".indexOf(c)>=0){o.push({t:c,v:c});i++;continue}throw new Error("Недопустимый символ: "+c)}return o}
function calcEvaluate(input){var t=calcTokenize(input),p=0;function q(x){return t[p]&&t[p].t===x}function take(x){if(!q(x))throw new Error("Ожидается "+x);return t[p++]}function ex(){var v=te();while(q("+")||q("-")){var op=t[p++].t,r=te();v=op==="+"?v+r:v-r}return v}function te(){var v=po();while(q("*")||q("/")){var op=t[p++].t,r=po();if(op==="/"&&r===0)throw new Error("Деление на ноль");v=op==="*"?v*r:v/r}return v}function po(){var v=un();if(q("^")){p++;v=Math.pow(v,po())}return v}function un(){if(q("+")){p++;return un()}if(q("-")){p++;return-un()}return pr()}function pr(){if(q("num"))return take("num").v;if(q("(")){p++;var v=ex();take(")");return v}if(q("id")){var id=take("id").v;if(id==="pi")return Math.PI;if(id==="e")return Math.E;if(id==="ans")return calcLastAnswer;if(!q("("))throw new Error("После "+id+" нужны скобки");p++;var a=ex();take(")");if(id==="sin")return Math.sin(a*Math.PI/180);if(id==="cos")return Math.cos(a*Math.PI/180);if(id==="tan")return Math.tan(a*Math.PI/180);if(id==="sqrt")return Math.sqrt(a);if(id==="ln")return Math.log(a);if(id==="log")return Math.log10(a);if(id==="abs")return Math.abs(a);throw new Error("Неизвестная функция: "+id)}throw new Error("Неполное выражение")}var v=ex();if(p!==t.length)throw new Error("Проверьте выражение");if(!Number.isFinite(v))throw new Error("Результат не является конечным числом");return v}
function calculatorHtml(){var k=[['7','7'],['8','8'],['9','9'],['÷','/'],['√','sqrt('],['4','4'],['5','5'],['6','6'],['×','*'],['x²','^2'],['1','1'],['2','2'],['3','3'],['−','-'],['xʸ','^'],['0','0'],[',','.'],['(', '('],[')',')'],['+','+'],['sin','sin('],['cos','cos('],['tan','tan('],['π','pi'],['EXP','E'],['log','log('],['ln','ln('],['Ans','ans']];return '<div class="ephys-calculator"><p class="ephys-mini"><strong>Непрограммируемый мини-калькулятор.</strong> Тригонометрия — в градусах. Без CAS, формульного решателя и программирования.</p><label for="ephys-calc-expression">Выражение</label><input id="ephys-calc-expression" class="ephys-calc-display" autocomplete="off"><div class="ephys-calc-result" id="ephys-calc-result" aria-live="polite">0</div><div class="ephys-calc-grid"><button type="button" data-calc-action="clear">C</button><button type="button" data-calc-action="back">⌫</button>'+k.map(function(x){return '<button type="button" data-calc-insert="'+escapeHtml(x[1])+'">'+x[0]+'</button>'}).join("")+'<button type="button" data-calc-action="recip">1/x</button><button type="button" data-calc-action="sign">±</button><button type="button" class="ephys-calc-equals" data-calc-action="equals">=</button></div></div>'}
function bindCalculator(){var i=byId("ephys-calc-expression"),r=byId("ephys-calc-result");if(!i||!r)return;function eq(){try{var v=calcEvaluate(i.value);calcLastAnswer=v;r.textContent=Number(v.toPrecision(12)).toString();r.removeAttribute("data-error")}catch(e){r.textContent=e.message;r.setAttribute("data-error","true")}}document.querySelectorAll("#ephys-modal-body [data-calc-insert]").forEach(function(b){b.addEventListener("click",function(){insertAtCursor(i,b.getAttribute("data-calc-insert"))})});document.querySelectorAll("#ephys-modal-body [data-calc-action]").forEach(function(b){b.addEventListener("click",function(){var a=b.getAttribute("data-calc-action");if(a==="clear"){i.value="";r.textContent="0";r.removeAttribute("data-error");i.focus()}else if(a==="back"){var st=i.selectionStart||0,en=i.selectionEnd||st;if(st===en&&st>0)st--;i.setRangeText("",st,en,"end");i.focus()}else if(a==="recip"){i.value=i.value?'1/('+i.value+')':'1/(';i.focus()}else if(a==="sign"){i.value=i.value?'-('+i.value+')':'-';i.focus()}else if(a==="equals")eq()})});i.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();eq()}});i.focus()}
function openCalculator(){openModal("Калькулятор",calculatorHtml());bindCalculator()}
function installExamTools(){if(byId("ephys-tools-style"))return;var st=document.createElement("style");st.id="ephys-tools-style";st.textContent="#"+ROOT_ID+" .ephys-toolbar{grid-template-columns:auto 1fr auto auto auto}#"+ROOT_ID+" .ephys-symbol-keyboard{margin:10px 0 4px;padding:10px;border:1px solid #dfe4eb;border-radius:12px;background:#f8fafc}#"+ROOT_ID+" .ephys-symbol-keyboard__label{font-size:13px;font-weight:800;margin-bottom:8px}#"+ROOT_ID+" .ephys-symbol-keyboard__keys{display:flex;gap:6px;flex-wrap:wrap}#"+ROOT_ID+" .ephys-symbol-key{min-width:38px;min-height:36px;padding:6px 8px;border:1px solid #cdd4df;border-radius:9px;background:#fff;color:#17324d;font:inherit;font-weight:800;cursor:pointer}#"+ROOT_ID+" .ephys-calculator{max-width:620px;margin:0 auto}#"+ROOT_ID+" .ephys-calc-display{width:100%;padding:14px;border:1px solid #cdd4df;border-radius:12px;font:600 18px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}#"+ROOT_ID+" .ephys-calc-result{margin:10px 0 14px;padding:12px 14px;border-radius:10px;background:#f3f7ff;font:800 20px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}#"+ROOT_ID+" .ephys-calc-result[data-error=true]{background:#fff0f0;color:#8a2634}#"+ROOT_ID+" .ephys-calc-grid{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));gap:7px}#"+ROOT_ID+" .ephys-calc-grid button{min-height:44px;border:1px solid #cdd4df;border-radius:10px;background:#fff;color:#17324d;font:inherit;font-weight:800;cursor:pointer}#"+ROOT_ID+" .ephys-calc-grid .ephys-calc-equals{background:#315fb5;color:#fff;border-color:#315fb5}@media(max-width:900px){#"+ROOT_ID+" .ephys-toolbar{grid-template-columns:1fr auto auto auto}#"+ROOT_ID+" .ephys-progress{grid-column:1/-1}}@media(max-width:560px){#"+ROOT_ID+" .ephys-toolbar{grid-template-columns:1fr 1fr}#"+ROOT_ID+" .ephys-toolbar .ephys-timer-wrap,#"+ROOT_ID+" .ephys-progress{grid-column:1/-1}#"+ROOT_ID+" .ephys-toolbar button{width:100%}#"+ROOT_ID+" .ephys-symbol-keyboard__keys{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}}";document.head.appendChild(st);var f=byId("ephys-finish-top"),ref=byId("ephys-reference");if(f&&ref&&!byId("ephys-calculator")){var b=document.createElement("button");b.className="ep-button ep-button--small ep-button--secondary";b.id="ephys-calculator";b.type="button";b.textContent="Калькулятор";b.addEventListener("click",openCalculator);f.parentNode.insertBefore(b,f)}}
'''
              s=s.replace(marker,tools+marker,1)
              old='bindZoom(stage);updateNav();updateValidation(t,getAnswer(t.number));';assert old in s;s=s.replace(old,'installSymbolKeyboards(stage);bindZoom(stage);updateNav();updateValidation(t,getAnswer(t.number));',1)
              old='installRuntimeStyles();applyResultSemantics();';assert old in s;s=s.replace(old,'installRuntimeStyles();installExamTools();applyResultSemantics();',1)
              p.write_text(s,encoding='utf-8')
          contract={'source_year':2026,'status':'IMPLEMENTED_PENDING_BROWSER_GATE','symbol_keyboard':{'targets':['extended answer textarea','draft textarea'],'required_capabilities':['square/superscript','vector notation','subscripts/indices','common physics and math symbols'],'does_not_solve':True},'calculator':{'type':'non-programmable mini scientific calculator','operations':['arithmetic','parentheses','powers','sqrt','reciprocal','scientific notation','sin/cos/tan degrees','log10','ln','pi','e','Ans'],'forbidden':['CAS','equation solver','formula solver','programming','symbolic algebra'],'fipi_alignment':'official 2026 instruction permits ruler and non-programmable calculator'},'storage_contract':'unchanged'}
          Path('ege-fizika-demoversiya-v3-1-fixed/PHYSICS-2026-EXAM-TOOLS-CONTRACT.json').write_text(json.dumps(contract,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          m=re.search(r'<script>(.*)</script>\s*$',p.read_text(encoding='utf-8'),re.S);assert m;Path('/tmp/runtime.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/runtime.js
      - name: Commit orchestrated evidence and tools
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'run=no' > .physics-2026-orchestrator-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-physics-2026-visual-audit ege-fizika-demoversiya-v3-1-fixed/ege-fizika-demoversiya-T123-06.txt ege-fizika-demoversiya-v3-1-fixed/PHYSICS-2026-EXAM-TOOLS-CONTRACT.json .physics-2026-orchestrator-trigger
          git commit -m 'Inventory Physics visuals and add exam tools'
          git push origin HEAD:chatgpt/physics-2026-source-visual-tools-fix-20260819
