name: Build history interactive demo package

on:
  pull_request:
    branches:
      - main
    paths:
      - history-build/bootstrap.py
      - .github/workflows/history-demo-package-import.yml

permissions:
  contents: write

jobs:
  build-package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Decide whether generation is needed
        id: gate
        shell: bash
        run: |
          if [ -f ege-istoriya-demoversiya-v1.0.0.zip ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build and browser dependencies
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Extract official images and prepare assets
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEMO="istoriya-source-2026/ege-2026-istoriya-demoversiya.pdf"
          test -f "$DEMO"
          rm -rf /tmp/history-source /tmp/history-images /tmp/history-pages /mnt/data/ege-istoriya-demoversiya-v1
          mkdir -p /tmp/history-source/original /tmp/history-images /tmp/history-pages
          mkdir -p /mnt/data/ege-istoriya-demoversiya-v1/{assets,scripts,tests,source}
          cp istoriya-source-2026/*.pdf /tmp/history-source/original/
          cp istoriya-source-2026/*.pdf /mnt/data/ege-istoriya-demoversiya-v1/source/
          pdfimages -png "$DEMO" /tmp/history-images/img
          pdftoppm -f 6 -singlefile -png -r 300 "$DEMO" /tmp/history-pages/page06 >/dev/null
          pdftoppm -f 8 -singlefile -png -r 300 "$DEMO" /tmp/history-pages/page08 >/dev/null
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          out=Path('/mnt/data/ege-istoriya-demoversiya-v1/assets')
          out.mkdir(parents=True,exist_ok=True)

          def webp(src:Path,dst:str,max_side:int,quality:int,crop=None):
              im=Image.open(src).convert('RGB')
              if crop:
                  im=im.crop(crop)
              im.thumbnail((max_side,max_side),Image.Resampling.LANCZOS)
              im.save(out/dst,'WEBP',quality=quality,method=6)

          required=[Path('/tmp/history-images/img-017.png')]+[Path(f'/tmp/history-images/img-{n:03d}.png') for n in range(39,43)]
          for f in required:
              if not f.exists():
                  raise SystemExit(f'Missing official extracted image: {f}')
          webp(required[0],'task-08-newspaper.webp',800,72)
          webp(Path('/tmp/history-pages/page06.png'),'tasks-09-12-map.webp',1000,80,(242,308,1550,2258))
          webp(Path('/tmp/history-pages/page08.png'),'tasks-15-16-medal.webp',1000,80,(225,342,1575,1025))
          for i,n in enumerate(range(39,43),1):
              webp(Path(f'/tmp/history-images/img-{n:03d}.png'),f'task-16-option-{i}.webp',380,75)
          assert len(list(out.glob('*.webp')))==7
          PY

      - name: Generate package
        if: steps.gate.outputs.build == 'true'
        run: |
          python history-build/bootstrap.py build
          rm -rf ege-istoriya-demoversiya-v1
          cp -a /mnt/data/ege-istoriya-demoversiya-v1 ./ege-istoriya-demoversiya-v1
          python ege-istoriya-demoversiya-v1/tests/test_static.py
          python ege-istoriya-demoversiya-v1/tests/test_browser.py
          test "$(find ege-istoriya-demoversiya-v1 -name 'ege-istoriya-demoversiya-T123-*.txt' | wc -l)" -eq 22
          test "$(find ege-istoriya-demoversiya-v1 -name 'ege-istoriya-demoversiya-T123-*.txt' -printf '%s\n' | sort -nr | head -1)" -lt 55000

      - name: Build and test clean release ZIP
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python history-build/bootstrap.py finalize-pending
          python ege-istoriya-demoversiya-v1/scripts/build_demo_release.py
          rm -rf /tmp/history-clean
          mkdir -p /tmp/history-clean
          unzip -q ege-istoriya-demoversiya-v1.0.0.zip -d /tmp/history-clean
          python /tmp/history-clean/ege-istoriya-demoversiya-v1/tests/test_static.py
          python /tmp/history-clean/ege-istoriya-demoversiya-v1/tests/test_browser.py

          python history-build/bootstrap.py finalize-pass
          python ege-istoriya-demoversiya-v1/scripts/build_demo_release.py
          rm -rf /tmp/history-final-clean
          mkdir -p /tmp/history-final-clean
          unzip -q ege-istoriya-demoversiya-v1.0.0.zip -d /tmp/history-final-clean
          python /tmp/history-final-clean/ege-istoriya-demoversiya-v1/tests/test_static.py
          python /tmp/history-final-clean/ege-istoriya-demoversiya-v1/tests/test_browser.py
          unzip -t ege-istoriya-demoversiya-v1.0.0.zip

      - name: Commit verified package
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ege-istoriya-demoversiya-v1 ege-istoriya-demoversiya-v1.0.0.zip
          git commit -m "Add history interactive demo package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
