name: Russian EGE exact route bridge

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/ege-route-bridge/**'
      - '.github/workflows/russian-ege-exact-route-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/russian-program/ege-route-bridge/**'
      - '.github/workflows/russian-ege-exact-route-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ege-route-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile EGE bridge tools
        run: |
          python -m py_compile \
            eksamio-learning-engine/russian-program/ege-route-bridge/build_ege_exact_route_bridge.py \
            eksamio-learning-engine/russian-program/ege-route-bridge/validate_ege_exact_route_bridge.py \
            eksamio-learning-engine/russian-program/ege-route-bridge/validate_ege_route_bridge_state.py
      - name: Validate exact-only EGE route bridge
        working-directory: eksamio-learning-engine/russian-program/ege-route-bridge
        run: python validate_ege_exact_route_bridge.py
      - name: Validate pinned EGE route bridge blocker state
        working-directory: eksamio-learning-engine/russian-program/ege-route-bridge
        run: python validate_ege_route_bridge_state.py
      - name: Prove bridge determinism and emit candidate artifact
        working-directory: eksamio-learning-engine/russian-program/ege-route-bridge
        shell: bash
        run: |
          python build_ege_exact_route_bridge.py --emit > /tmp/ege-bridge-a.json
          python build_ege_exact_route_bridge.py --emit > /tmp/ege-bridge-b.json
          cmp /tmp/ege-bridge-a.json /tmp/ege-bridge-b.json
          sha256sum /tmp/ege-bridge-a.json /tmp/ege-bridge-b.json
          cp /tmp/ege-bridge-a.json ege-exact-route-bridge.json
      - name: Upload deterministic EGE bridge candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: russian-ege-exact-route-bridge
          path: eksamio-learning-engine/russian-program/ege-route-bridge/ege-exact-route-bridge.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate launch preflight remains fail-closed
        working-directory: eksamio-learning-engine/launch-preflight
        run: python validate_sep1_production_preflight.py
      - name: Enforce bounded scope
        shell: bash
        run: |
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD')"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(eksamio-learning-engine/russian-program/ege-route-bridge/|\.github/workflows/russian-ege-exact-route-bridge\.yml$)' | grep -q .; then
            echo 'EGE route bridge PR changed files outside bounded lane.' >&2
            exit 1
          fi
      - name: Reject whitespace errors
        shell: bash
        run: git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
