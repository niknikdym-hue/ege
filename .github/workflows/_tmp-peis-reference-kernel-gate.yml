name: PEIS Reference Kernel Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/peis-reference-kernel/**'
      - 'eksamio-learning-engine/russian-program/verified-slices/**'
      - 'eksamio-learning-engine/277-EKSAMIO-LEARNER-EVIDENCE-EVENT-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/278-EKSAMIO-LEARNER-STATE-MATERIALIZED-VIEW-SCHEMA-v0.1.json'
      - 'eksamio-learning-engine/282-EKSAMIO-MASTERY-INFERENCE-CONTRACT-v0.1.json'
      - 'eksamio-learning-engine/283-EKSAMIO-PREREQUISITE-READINESS-CONTRACT-v0.1.json'
      - 'eksamio-learning-engine/284-EKSAMIO-RETENTION-SCHEDULE-STATE-CONTRACT-v0.1.json'
      - 'eksamio-learning-engine/285-EKSAMIO-NEXT-BEST-ACTION-CONTRACT-v0.1.json'
      - '.github/workflows/_tmp-peis-reference-kernel-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema
      - name: Execute and schema-validate PEIS reference kernel
        run: python eksamio-learning-engine/peis-reference-kernel/run_reference_kernel_validation.py --write
      - name: Verify durable validation outputs exist
        run: |
          test -f eksamio-learning-engine/peis-reference-kernel/PEIS-REFERENCE-KERNEL-RU-SLICE-001-RUN-v0.1.json
          test -f eksamio-learning-engine/peis-reference-kernel/PEIS-REFERENCE-KERNEL-VALIDATION.txt
      - name: Persist validated reference outputs to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            eksamio-learning-engine/peis-reference-kernel/PEIS-REFERENCE-KERNEL-RU-SLICE-001-RUN-v0.1.json \
            eksamio-learning-engine/peis-reference-kernel/PEIS-REFERENCE-KERNEL-VALIDATION.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize PEIS reference kernel validated run [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
