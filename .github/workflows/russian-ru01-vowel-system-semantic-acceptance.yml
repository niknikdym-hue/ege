name: Russian RU01 vowel system semantic acceptance

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-VOWEL-SYSTEM-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/validate_ru01_vowel_system_bounded_subject_semantics.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_vowel_system_content_adequacy_review.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v21.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v22.py'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-VOWEL-SYSTEM-WAVE-007-v0.1.json'
      - '.github/workflows/russian-ru01-vowel-system-semantic-acceptance.yml'
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-VOWEL-SYSTEM-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/validate_ru01_vowel_system_bounded_subject_semantics.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_vowel_system_content_adequacy_review.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v21.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v22.py'
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-VOWEL-SYSTEM-WAVE-007-v0.1.json'
      - '.github/workflows/russian-ru01-vowel-system-semantic-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru01-vowel-system-semantic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact semantic gate
        run: |
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru01_vowel_system_bounded_subject_semantics.py
          python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v22.py

      - name: Validate bounded vowel-system semantic acceptance
        run: python3 eksamio-learning-engine/russian-program/subject-admission/validate_ru01_vowel_system_bounded_subject_semantics.py

      - name: Build current-v22 A
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v22.py --output /tmp/ru-current-v22-a.json > /tmp/ru-current-v22-a.txt

      - name: Build current-v22 B
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v22.py --output /tmp/ru-current-v22-b.json > /tmp/ru-current-v22-b.txt

      - name: Verify deterministic current-v22 JSON
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/ru-current-v22-a.json /tmp/ru-current-v22-b.json

      - name: Verify deterministic current-v22 stdout
        shell: bash
        run: |
          set -euo pipefail
          diff -u /tmp/ru-current-v22-a.txt /tmp/ru-current-v22-b.txt

      - name: Materialize current-v22 for downstream checks
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/ru-current-v22-a.txt
          cp /tmp/ru-current-v22-a.json RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS-LAUNCH-CURRENT-v22.json

      - name: Verify bounded aggregate delta only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS-LAUNCH-CURRENT-v22.json').read_text(encoding='utf-8'))
          assert data['schema_version']=='0.24.0'
          summary=data['progress_summary']
          assert len(data['accepted_authorities'])==68
          assert summary['accepted_bounded_ru_route_semantics']==9
          assert summary['accepted_bounded_ru_subject_semantics']==72
          assert summary['accepted_bounded_ru_semantics_total']==81
          assert summary['semantic_units_with_accepted_component_sets']==41
          assert summary['semantic_requirements_with_accepted_component_sets']==41
          assert summary['semantic_units_remaining_without_accepted_component_set']==1275
          assert summary['semantic_requirements_remaining_without_accepted_component_set']==1350
          assert summary['subject_disposed_units_total']==42
          assert summary['subject_disposed_requirements_total']==42
          assert summary['subject_review_units_remaining']==1274
          assert summary['subject_review_requirements_remaining']==1349
          assert summary['canonical_component_refs_reused_unique']==122
          assert summary['false_exact_mastery_admissions']==0
          new=data['newly_accepted_bounded_subject_semantic']
          assert new['semantic_id']=='ru-phonetics-vowel-system'
          assert new['independent_verification_item_ids']==[
              'p01-u9-v1','p01-u9-v2','p01-u9-v3','p01-u9-v4','p01-u9-v5'
          ]
          assert new['source_clause_ids']==['EDSOO59-P187-4.1.1','OGE-COD-P020-4.1.1']
          assert new['parent_object_count_requiring_future_complete_component_set_acceptance']==2
          assert new['parent_objects_remain_pending']==[
              {
                  'admission_unit_id':'RAU-5a6511267f156745f93c',
                  'requirement_id':'RSK-EDSOO59-4-1-P187',
                  'vowel_system_clause_id':'EDSOO59-P187-4.1.1',
              },
              {
                  'admission_unit_id':'RAU-3916b5e3da77ed038830',
                  'requirement_id':'RSK-OGE_COD-4-1-P020',
                  'vowel_system_clause_id':'OGE-COD-P020-4.1.1',
              },
          ]
          assert 'ru-phonetics-vowel-consonant-features' in new['adjacent_semantics_remain_separate']
          assert 'ru-phonetics-stress' in new['adjacent_semantics_remain_separate']
          assert 'ru-orthoepy-normative-pronunciation' in new['adjacent_semantics_remain_separate']
          assert new['object_acceptance_effect']=='NONE_UNTIL_ALL_REQUIRED_BROAD_HEADER_CLAUSES_HAVE_EXACT_ACCEPTED_OWNERS_AND_COMPONENT_SPECIFIC_EVIDENCE_AND_SEPARATE_EXACT_HEAD_OBJECT_GATE_PASSES'
          print('RU01_VOWEL_SYSTEM_SEMANTIC_AGGREGATE_DELTA=PASS')
          PY

      - name: Protect public and production surfaces in bounded wave
        shell: bash
        run: |
          set -euo pipefail
          wave_base='711dc4ec4641874a11edadcebc9197c59aa39d3d'
          git merge-base --is-ancestor "$wave_base" HEAD
          recent=$(git diff --name-only "$wave_base"..HEAD)
          allowed=$(cat <<'EOF'
          .github/workflows/russian-ru01-vowel-system-semantic-acceptance.yml
          eksamio-learning-engine/russian-program/subject-admission/RU01-VOWEL-SYSTEM-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v22.py
          eksamio-learning-engine/russian-program/subject-admission/validate_ru01_vowel_system_bounded_subject_semantics.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "$recent" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed '/^$/d' | sort -u))
          if [[ -n "$unexpected" ]]; then
            echo 'Current vowel-system semantic wave touched files outside the exact bounded allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$recent" | grep -E 'russkiy-knigi|(^|/)tilda|demo|scor'; then
            echo 'Current vowel-system semantic wave touched a protected public/production surface.' >&2
            exit 1
          fi

      - name: Diff hygiene for current bounded wave
        run: git diff --check 711dc4ec4641874a11edadcebc9197c59aa39d3d..HEAD

      - name: Upload exact semantic acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-vowel-system-semantic-acceptance
          path: RUSSIAN-SEMANTIC-ACCEPTANCE-PROGRESS-LAUNCH-CURRENT-v22.json
          if-no-files-found: error
          retention-days: 14
