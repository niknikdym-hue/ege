name: Secondary literal validation base mathematics 2026

on:
  push:
    branches: [main]
    paths:
      - ege-matematika-baza-demoversiya-2026/scripts/validate_literal_secondary.py
      - .github/workflows/math-base-2026-literal-secondary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run layout-aware literal validation
        run: python ege-matematika-baza-demoversiya-2026/scripts/validate_literal_secondary.py
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-matematika-baza-demoversiya-2026/ege-matematika-baza-demoversiya-2026-LITERAL-SECONDARY-EVIDENCE.json
          git diff --cached --quiet || { git commit -m 'Record base mathematics secondary literal evidence'; git push origin HEAD:main; }
