name: physics-2026-pr-source-lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  source-lock:
    if: github.head_ref == 'chatgpt/physics-2026-acceptance-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-acceptance-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and byte-compare approved FIPI archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pypdf >/dev/null
          URL='https://doc.fipi.ru/ege/demoversii-specifikacii-kodifikatory/2026/fi_11_2026.zip'
          rm -rf /tmp/fipi26 && mkdir -p /tmp/fipi26/extracted
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 Eksamio source verification' --referer 'https://fipi.ru/ege/demoversii-specifikacii-kodifikatory' "$URL" -o /tmp/fipi26/fi_11_2026.zip
          unzip -q /tmp/fipi26/fi_11_2026.zip -d /tmp/fipi26/extracted
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from pypdf import PdfReader
          import json, shutil
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed/source')
          can=Path('ege-source-fizika/source-fizika-2026')
          ext=Path('/tmp/fipi26/extracted'); z=Path('/tmp/fipi26/fi_11_2026.zip')
          def h(p):
              x=sha256();
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): x.update(b)
              return x.hexdigest()
          pp=sorted(pkg.glob('*.pdf')); op=sorted(ext.rglob('*.pdf'))
          assert len(pp)==3, [str(x) for x in pp]
          assert len(op)==3, [str(x) for x in op]
          ph={h(x):x for x in pp}; oh={h(x):x for x in op}
          assert set(ph)==set(oh), {'package':sorted(ph),'official':sorted(oh)}
          rows=[]
          for digest,p in oh.items():
              reader=PdfReader(str(p)); opening=' '.join((x.extract_text() or '') for x in reader.pages[:4]).upper()
              assert 'ПРОЕКТ' not in opening, str(p)
              package_name=ph[digest].name
              role='demo' if 'demoversiya' in package_name else ('codifier' if 'kodifikator' in package_name else 'specification')
              if role=='demo': assert len(reader.pages)==42, len(reader.pages)
              rows.append({'role':role,'official_filename':str(p.relative_to(ext)),'package_filename':package_name,'bytes':p.stat().st_size,'pages':len(reader.pages),'sha256':digest})
          shutil.rmtree(can/'original',ignore_errors=True); shutil.copytree(ext,can/'original')
          shutil.copy2(z,can/'fi_11_2026.zip'); shutil.rmtree(can/'candidate-from-current-package',ignore_errors=True)
          archive_hash=h(z)
          register={'exam':'ЕГЭ','subject':'физика','source_year':2026,'authority':'ФИПИ','official_page':'https://fipi.ru/ege/demoversii-specifikacii-kodifikatory','official_archive_url':'https://doc.fipi.ru/ege/demoversii-specifikacii-kodifikatory/2026/fi_11_2026.zip','approved_set_publication_date':'2025-11-12','draft_project_is_authority':False,'external_archive_sha256_locked':True,'source_gate':'CLOSED','archive':{'path':'fi_11_2026.zip','bytes':z.stat().st_size,'sha256':archive_hash},'files':sorted(rows,key=lambda x:x['role']),'package_source_byte_identity_with_official_archive':True}
          (can/'SOURCE-REGISTER.json').write_text(json.dumps(register,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          inv=['EKSAMIO PHYSICS 2026 — OFFICIAL SOURCE INVENTORY',f'OFFICIAL_SOURCE_URL={register["official_archive_url"]}','SOURCE_STATUS=APPROVED_FIPI_2026_BYTE_LOCKED','SOURCE_GATE=CLOSED',f'ARCHIVE_BYTES={z.stat().st_size}',f'ARCHIVE_SHA256={archive_hash}','','PDF_FILES:']
          for r in sorted(rows,key=lambda x:x['role']): inv.append(f'{r["role"]}\t{r["official_filename"]}\tbytes={r["bytes"]}\tpages={r["pages"]}\tsha256={r["sha256"]}')
          inv+=['','PACKAGE_SOURCE_BYTE_IDENTITY=PASS','APPROVED_NOT_PROJECT=PASS']
          (can/'SOURCE-INVENTORY.txt').write_text('\n'.join(inv)+'\n',encoding='utf-8')
          (can/'SOURCE-STATUS.txt').write_text(f'''EKSAMIO PHYSICS 2026 — OFFICIAL SOURCE STATUS
YEAR=2026
SUBJECT=physics
AUTHORITY=FIPI
OFFICIAL_SOURCE_PAGE=https://fipi.ru/ege/demoversii-specifikacii-kodifikatory
OFFICIAL_SOURCE_URL={register['official_archive_url']}
APPROVED_SET_PUBLICATION_DATE=2025-11-12
SOURCE_STATUS=APPROVED_FIPI_2026_BYTE_LOCKED
SOURCE_GATE=CLOSED
APPROVED_NOT_PROJECT=PASS
PACKAGE_SOURCE_BYTE_IDENTITY=PASS
ARCHIVE_SHA256={archive_hash}

Untouched approved FIPI archive is preserved as fi_11_2026.zip.
Untouched PDFs extracted from it are preserved under original/.
Hashes and page counts are recorded in SOURCE-INVENTORY.txt.
The three PDFs in ege-fizika-demoversiya-v3-1-fixed/source are byte-identical to the PDFs extracted from the approved FIPI archive.
''',encoding='utf-8')
          print(json.dumps(register,ensure_ascii=False,indent=2))
          PY
      - name: Commit source lock and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/physics-2026-pr-source-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Lock Physics 2026 approved FIPI source bytes'
          git push origin HEAD:chatgpt/physics-2026-acceptance-20260819
