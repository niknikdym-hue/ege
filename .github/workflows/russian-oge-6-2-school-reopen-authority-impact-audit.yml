name: Russian OGE 6.2 school-reopen authority impact audit

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/247-RUSSIAN-SCHOOL-CANONICAL-PRIMARY-COMPLETENESS-WAVE-A1-MATERIALIZATION-v0.1.json"
      - "eksamio-learning-engine/262-RUSSIAN-FIPI-2026-SCHOOL-REOPEN-GAP-AUDIT-v0.1.json"
      - "eksamio-learning-engine/263-RUSSIAN-SCHOOL-FIPI-REOPEN-MATERIALIZATION-v0.1.json"
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/266-RUSSIAN-SCHOOL-FINAL-REFREEZE-AND-FIPI-2026-OVERLAY-CLOSURE-v1.0.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-SCHOOL-REOPEN-AUTHORITY-IMPACT-AUDIT-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_2_school_reopen_authority_impact_audit.py"
      - ".github/workflows/russian-oge-6-2-school-reopen-authority-impact-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oge-6-2-school-reopen-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_2_school_reopen_authority_impact_audit.py
      - name: Validate bounded reopen impact twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_oge_6_2_school_reopen_authority_impact_audit.py" > /tmp/audit-a.txt
          python3 "$root/validate_oge_6_2_school_reopen_authority_impact_audit.py" > /tmp/audit-b.txt
          diff -u /tmp/audit-a.txt /tmp/audit-b.txt
          cat /tmp/audit-a.txt
          grep -Fx 'REOPEN_DECISION=REOPEN_REQUIRED' /tmp/audit-a.txt
          grep -Fx 'CURRENT_SCHOOL_DENOMINATOR=185' /tmp/audit-a.txt
          grep -Fx 'PROJECTED_AFTER_ATOMIC_MATERIALIZATION=186' /tmp/audit-a.txt
          grep -Fx 'COUNT_EFFECT_APPLIED_NOW=0' /tmp/audit-a.txt
          grep -Fx 'SEMANTIC_ADMISSIONS=0' /tmp/audit-a.txt
          grep -Fx 'OBJECT_CLOSURES=0' /tmp/audit-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/audit-a.txt
      - name: Upload bounded reopen impact evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-2-school-reopen-authority-impact-audit
          path: eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-SCHOOL-REOPEN-AUTHORITY-IMPACT-AUDIT-v0.1.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
