name: Russian RU01 sound changes exact owner search

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_exact_owner_resolution.py'
      - '.github/workflows/russian-ru01-sound-changes-exact-owner-search.yml'
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_changes_exact_owner_resolution.py'
      - '.github/workflows/russian-ru01-sound-changes-exact-owner-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-owner-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild sound-changes owner resolution deterministically
        run: |
          set -euo pipefail
          root=eksamio-learning-engine/russian-program/subject-admission
          python -m py_compile "$root/build_ru01_sound_changes_exact_owner_resolution.py"
          python "$root/build_ru01_sound_changes_exact_owner_resolution.py" --output /tmp/sound-changes-owner-a.json
          python "$root/build_ru01_sound_changes_exact_owner_resolution.py" --output /tmp/sound-changes-owner-b.json
          cmp /tmp/sound-changes-owner-a.json /tmp/sound-changes-owner-b.json

      - name: Verify fail-closed owner-search boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('/tmp/sound-changes-owner-a.json',encoding='utf-8'))
          assert d['scope']=='RU01_SOUND_CHANGES_IN_SPEECH_FLOW_EXACT_OWNER_SEARCH'
          assert d['current_launch_progress_v13_normalized_sha256']=='f8c8c1f060eb596fc92c317b38d1c12e572a8827cb56042390ed08b0f681a426'
          assert len(d['targets'])==2
          assert {x['admission_unit_id'] for x in d['targets']}=={
              'RAU-b1ba48cb81e96255122a',
              'RAU-f709f1855bb0b8d104bc',
          }
          assert {x['requirement_id'] for x in d['targets']}=={
              'RSK-EDSOO59-4-1-3-P187',
              'RSK-OGE_COD-4-1-3-P021',
          }
          assert {x['normalized_source_signature'] for x in d['targets']}=={'SOUND_CHANGES_IN_SPEECH_FLOW'}
          assert {x['binding_review_classification'] for x in d['targets']}=={'PENDING'}
          assert {x['binding_review_blocker'] for x in d['targets']}=={'SOUND_CHANGES_SEMANTIC_REQUIRED'}
          b=d['decision_boundary']
          assert b['review_is_semantic_acceptance'] is False
          assert b['review_is_object_acceptance'] is False
          assert b['object_closure_effect']=='NONE'
          assert b['exact_mastery_effect']=='NONE'
          assert b['generic_ru01_attempt_can_emit_exact_component_mastery'] is False
          assert b['shared_future_evidence_can_close_both_source_objects_without_separate_object_acceptance'] is False
          assert b['task_module_route_title_keyword_fuzzy_or_embedding_inference_allowed'] is False
          assert b['false_exact_mastery']==0
          assert d['current_launch_state']=={
              'accepted_authorities':60,
              'subject_review_units_remaining':1277,
              'subject_review_requirements_remaining':1352,
              'accepted_bounded_ru_subject_semantics':67,
              'false_exact_mastery_admissions':0,
          }
          allowed={
              'CENTRAL_BRAIN_RU01_SOUND_CHANGES_EXACT_OWNER_CANDIDATE_FOUND_BINDING_REQUIRED_NOT_ACCEPTED',
              'CENTRAL_BRAIN_RU01_SOUND_CHANGES_NO_EXACT_CURRENT_OWNER_FOUND_SOURCE_BACKED_CANDIDATE_NOT_ACCEPTED',
          }
          assert d['status'] in allowed
          r=d['owner_resolution']
          if d['status'].startswith('CENTRAL_BRAIN_RU01_SOUND_CHANGES_NO_EXACT_CURRENT_OWNER_FOUND'):
              c=r['source_backed_candidate']
              assert c['candidate_semantic_id']=='ru-phonetics-sound-changes-in-speech-flow'
              assert c['status']=='PROPOSED_NOT_CANONICAL'
              assert c['normalized_source_signature']=='SOUND_CHANGES_IN_SPEECH_FLOW'
              assert c['source_object_count']==2
              assert r['next_required_gates']==[
                  'ORIGINAL_LEARNER_CONTENT',
                  'INDEPENDENT_SOUND_CHANGES_SPECIFIC_EVIDENCE',
                  'BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE',
                  'SEPARATE_EXACT_OBJECT_ACCEPTANCE_PER_SOURCE_OBJECT',
              ]
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Upload bounded owner resolution
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-sound-changes-exact-owner-resolution
          path: /tmp/sound-changes-owner-a.json
          if-no-files-found: error
