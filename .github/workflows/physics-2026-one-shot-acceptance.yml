name: physics-2026-one-shot-acceptance

on:
  push:
    branches:
      - chatgpt/physics-2026-acceptance-20260819
    paths:
      - .github/workflows/physics-2026-one-shot-acceptance.yml

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/physics-2026-acceptance-20260819

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch exact extended-criterion item references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          pkg = Path('ege-fizika-demoversiya-v3-1-fixed')

          def load_block(name, block_id):
              p = pkg / name
              text = p.read_text(encoding='utf-8')
              m = re.fullmatch(r'(<script type="application/json" id="'+re.escape(block_id)+r'">)(.*?)(</script>\s*)', text, flags=re.S)
              if not m:
                  raise SystemExit(f'cannot parse {name}')
              return p, m.group(1), json.loads(m.group(2)), m.group(3)

          def save_block(p, pre, obj, post):
              p.write_text(pre + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + post, encoding='utf-8')

          def replace_once(html, old, new, label):
              if old not in html:
                  raise SystemExit(f'missing expected fragment: {label}')
              if html.count(old) != 1:
                  raise SystemExit(f'non-unique fragment inside object: {label}')
              return html.replace(old, new)

          p4, pre4, o4, post4 = load_block('ege-fizika-demoversiya-T123-04.txt', 'ephys-data-3')
          t = {int(x['number']): x for x in o4['tasks']}
          old_new = 'записи, соответствующие пунктам о рисунке и/или новых обозначениях, представлены не в полном объёме или отсутствуют'
          old_plain = 'записи, соответствующие пунктам о рисунке и/или обозначениях, представлены не в полном объёме или отсутствуют'
          t[22]['criteriaHtml'] = replace_once(t[22]['criteriaHtml'], old_new, 'записи, соответствующие пунктам II или III, представлены не в полном объёме или отсутствуют', 'task22')
          t[23]['criteriaHtml'] = replace_once(t[23]['criteriaHtml'], old_new, 'записи, соответствующие пункту II, представлены не в полном объёме или отсутствуют', 'task23')
          t[24]['criteriaHtml'] = replace_once(t[24]['criteriaHtml'], old_plain, 'записи, соответствующие пункту II, представлены не в полном объёме или отсутствуют', 'task24')
          t[25]['criteriaHtml'] = replace_once(t[25]['criteriaHtml'], old_plain, 'записи, соответствующие пунктам II и III, представлены не в полном объёме или отсутствуют', 'task25')
          save_block(p4, pre4, o4, post4)

          p5, pre5, o5, post5 = load_block('ege-fizika-demoversiya-T123-05.txt', 'ephys-data-4')
          v = {int(x['variant']): x for x in o5['variants26']}
          v[1]['criteriaK2Html'] = replace_once(v[1]['criteriaK2Html'], old_plain, 'записи, соответствующие пункту II, представлены не в полном объёме или отсутствуют', 'task26-v1')
          v[2]['criteriaK2Html'] = replace_once(v[2]['criteriaK2Html'], old_plain, 'записи, соответствующие пунктам II или III, представлены не в полном объёме или отсутствуют', 'task26-v2')
          v[3]['criteriaK2Html'] = replace_once(v[3]['criteriaK2Html'], old_plain, 'записи, соответствующие пунктам II и III, представлены не в полном объёме или отсутствуют', 'task26-v3')
          save_block(p5, pre5, o5, post5)

          # Verify the approved final K1 core for the lever variant remains unchanged.
          k1 = v[3]['criteriaK1Html']
          required = ['выбор ИСО', 'модели твёрдого тела и материальной точки', 'условие равновесия твёрдого тела', 'условие равновесия материальной точки']
          for s in required:
              if s not in k1:
                  raise SystemExit(f'task26-v3 K1 core missing: {s}')

          defects = pkg / 'PHYSICS-2026-CONTENT-FIDELITY-DEFECTS.json'
          d = json.loads(defects.read_text(encoding='utf-8'))
          d['status'] = 'RESOLVED_PENDING_RENDERED_RECHECK'
          d['resolved_by'] = 'direct JSON field correction in T123-04/T123-05'
          d['resolved_count'] = 7
          defects.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Static runtime and data-contract checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed')
          runtime=(pkg/'ege-fizika-demoversiya-T123-06.txt').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>\s*$', runtime, flags=re.S)
          assert m
          Path('/tmp/physics-runtime.js').write_text(m.group(1), encoding='utf-8')
          # Contract words prove current control families are present in runtime.
          for token in ('ephys-unordered-check','ephys-ordered-select','Ориентировочная сумма','неофициальная самооценка'):
              assert token.lower() in runtime.lower(), token
          # Ensure stale generic criterion phrase is gone from both data blocks.
          for name in ('ege-fizika-demoversiya-T123-04.txt','ege-fizika-demoversiya-T123-05.txt'):
              text=(pkg/name).read_text(encoding='utf-8')
              assert 'пунктам о рисунке и/или' not in text, name
          PY
          node --check /tmp/physics-runtime.js

      - name: Attempt exact approved FIPI byte lock
        id: sourcelock
        shell: bash
        run: |
          set -u
          python -m pip install --disable-pip-version-check pypdf >/dev/null
          CAN='ege-source-fizika/source-fizika-2026'
          URL='https://doc.fipi.ru/ege/demoversii-specifikacii-kodifikatory/2026/fi_11_2026.zip'
          rm -rf /tmp/fipi-physics-2026
          mkdir -p /tmp/fipi-physics-2026
          if curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 Eksamio source verification' --referer 'https://fipi.ru/ege/demoversii-specifikacii-kodifikatory' "$URL" -o /tmp/fipi-physics-2026/fi_11_2026.zip; then
            mkdir -p /tmp/fipi-physics-2026/extracted
            if unzip -q /tmp/fipi-physics-2026/fi_11_2026.zip -d /tmp/fipi-physics-2026/extracted; then
              if python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from pypdf import PdfReader
          import json, shutil
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed/source')
          can=Path('ege-source-fizika/source-fizika-2026')
          z=Path('/tmp/fipi-physics-2026/fi_11_2026.zip')
          ext=Path('/tmp/fipi-physics-2026/extracted')
          def h(p): return sha256(p.read_bytes()).hexdigest()
          pp=sorted(pkg.glob('*.pdf'))
          op=sorted(ext.rglob('*.pdf'))
          assert len(pp)==3, len(pp)
          assert len(op)==3, [str(x) for x in op]
          ph={h(x):x for x in pp}; oh={h(x):x for x in op}
          assert set(ph)==set(oh), {'package':sorted(ph),'official':sorted(oh)}
          # Approved final demo is 42 pages and none of the official docs may carry PROJECT marker in opening pages.
          rows=[]
          for digest, p in oh.items():
              r=PdfReader(str(p))
              opening=' '.join((page.extract_text() or '') for page in r.pages[:4]).upper()
              assert 'ПРОЕКТ' not in opening, p
              package_name=ph[digest].name
              role='demo' if 'demoversiya' in package_name else ('codifier' if 'kodifikator' in package_name else 'specification')
              if role=='demo': assert len(r.pages)==42, len(r.pages)
              rows.append({'role':role,'official_filename':str(p.relative_to(ext)),'package_filename':package_name,'bytes':p.stat().st_size,'sha256':digest,'pages':len(r.pages)})
          shutil.rmtree(can/'original', ignore_errors=True)
          shutil.copytree(ext, can/'original')
          shutil.copy2(z, can/'fi_11_2026.zip')
          shutil.rmtree(can/'candidate-from-current-package', ignore_errors=True)
          archive_hash=h(z)
          register={
            'exam':'ЕГЭ','subject':'физика','source_year':2026,'authority':'ФИПИ',
            'official_page':'https://fipi.ru/ege/demoversii-specifikacii-kodifikatory',
            'official_archive_url':'https://doc.fipi.ru/ege/demoversii-specifikacii-kodifikatory/2026/fi_11_2026.zip',
            'approved_set_publication_date':'2025-11-12','draft_project_is_authority':False,
            'external_archive_sha256_locked':True,'source_gate':'CLOSED',
            'archive':{'path':'fi_11_2026.zip','bytes':z.stat().st_size,'sha256':archive_hash},
            'files':sorted(rows,key=lambda x:x['role']),
            'package_source_byte_identity_with_official_archive':True
          }
          (can/'SOURCE-REGISTER.json').write_text(json.dumps(register,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          inv=['EKSAMIO PHYSICS 2026 — OFFICIAL SOURCE INVENTORY',f'OFFICIAL_SOURCE_URL={register["official_archive_url"]}','SOURCE_STATUS=APPROVED_FIPI_2026_BYTE_LOCKED','SOURCE_GATE=CLOSED',f'ARCHIVE_BYTES={z.stat().st_size}',f'ARCHIVE_SHA256={archive_hash}','','PDF_FILES:']
          for r in sorted(rows,key=lambda x:x['role']): inv.append(f'{r["role"]}\t{r["official_filename"]}\tbytes={r["bytes"]}\tpages={r["pages"]}\tsha256={r["sha256"]}')
          inv += ['', 'PACKAGE_SOURCE_BYTE_IDENTITY=PASS','APPROVED_NOT_PROJECT=PASS']
          (can/'SOURCE-INVENTORY.txt').write_text('\n'.join(inv)+'\n',encoding='utf-8')
          (can/'SOURCE-STATUS.txt').write_text(f'''EKSAMIO PHYSICS 2026 — OFFICIAL SOURCE STATUS
YEAR=2026
SUBJECT=physics
AUTHORITY=FIPI
OFFICIAL_SOURCE_PAGE=https://fipi.ru/ege/demoversii-specifikacii-kodifikatory
OFFICIAL_SOURCE_URL={register['official_archive_url']}
APPROVED_SET_PUBLICATION_DATE=2025-11-12
SOURCE_STATUS=APPROVED_FIPI_2026_BYTE_LOCKED
SOURCE_GATE=CLOSED
APPROVED_NOT_PROJECT=PASS
PACKAGE_SOURCE_BYTE_IDENTITY=PASS
ARCHIVE_SHA256={archive_hash}

Untouched approved FIPI archive is preserved as fi_11_2026.zip.
Untouched PDFs extracted from it are preserved under original/.
Hashes and page counts are recorded in SOURCE-INVENTORY.txt.
The three PDFs in ege-fizika-demoversiya-v3-1-fixed/source are byte-identical to the PDFs extracted from the approved FIPI archive.
''',encoding='utf-8')
          PY
              then
                echo 'locked=true' >> "$GITHUB_OUTPUT"
              else
                echo 'locked=false' >> "$GITHUB_OUTPUT"
              fi
            else
              echo 'locked=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'locked=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build current preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed')
          head=(pkg/'ege-fizika-demoversiya-HEAD.txt').read_text(encoding='utf-8')
          blocks='\n'.join((pkg/f'ege-fizika-demoversiya-T123-{i:02d}.txt').read_text(encoding='utf-8') for i in range(1,7))
          html='<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Physics 2026 acceptance preview</title>\n'+head+'\n</head>\n<body>\n'+blocks+'\n</body>\n</html>\n'
          (pkg/'ege-fizika-demoversiya-PREVIEW.html').write_text(html,encoding='utf-8')
          PY

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser acceptance through actual controls
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/physics-browser-test.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const server=spawn('python',['-m','http.server','8765','--directory','ege-fizika-demoversiya-v3-1-fixed'],{stdio:'ignore'});
          await new Promise(r=>setTimeout(r,900));
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          page.on('dialog',d=>d.accept());
          await page.goto('http://127.0.0.1:8765/ege-fizika-demoversiya-PREVIEW.html');
          await page.locator('#ephys-start').click();
          const nav=n=>page.locator('#ephys-nav button').nth(n-1);
          // invalid non-empty numeric response must not count as filled
          await page.locator('#ephys-answer-input').fill(' -1');
          if(await nav(1).getAttribute('data-filled')!=='false') throw new Error('invalid non-empty answer counted as filled');
          await page.locator('#ephys-answer-input').fill('-1');
          const answers={1:'-1',2:'16',3:'10',4:'2.25',5:'35',6:'43',7:'4',8:'0.75',9:'35',10:'33',11:'100',12:'2',13:'4',14:'13',15:'12',16:'4',17:'12',18:'234',20:'25'};
          for(let n=2;n<=20;n++){
            await nav(n).click();
            if([5,9,14,18,20].includes(n)){
              for(const d of answers[n]) await page.locator(`.ephys-unordered-check[value="${d}"]`).check();
            }else if([6,10,15,17].includes(n)){
              const sels=page.locator('.ephys-ordered-select');
              for(let i=0;i<answers[n].length;i++) await sels.nth(i).selectOption(answers[n][i]);
            }else if(n===19){
              await page.locator('#ephys-value').fill('136');
              await page.locator('#ephys-error').fill('3');
            }else{
              await page.locator('#ephys-answer-input').fill(answers[n]);
            }
            if(await nav(n).getAttribute('data-filled')!=='true') throw new Error(`task ${n} not filled through current control`);
          }
          // state survives reload; ordered controls restore as separate positions
          await nav(6).click();
          await page.reload();
          if((await page.locator('.ephys-ordered-select').nth(0).inputValue())!=='4') throw new Error('ordered restore failed');
          if((await page.locator('.ephys-ordered-select').nth(1).inputValue())!=='3') throw new Error('ordered restore failed');
          // all 26 positions and required widths: no root/document horizontal overflow
          for(const width of [320,360,390,768,1280]){
            await page.setViewportSize({width,height:900});
            for(let n=1;n<=26;n++){
              await nav(n).click();
              const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)>window.innerWidth+1);
              if(overflow) throw new Error(`overflow task ${n} width ${width}`);
            }
          }
          await page.setViewportSize({width:1280,height:900});
          await page.locator('#ephys-finish-top').click();
          await page.waitForSelector('#ephys-results');
          if((await page.locator('#ephys-short-score').textContent()).trim()!=='28') throw new Error('part1 max is not 28');
          const text=(await page.locator('#ephys-results').innerText()).toLowerCase();
          if(!text.includes('неофициальная самооценка')) throw new Error('unofficial self-evaluation label missing');
          if(!text.includes('ориентировочная сумма')) throw new Error('orientational total label missing');
          if(errors.length) throw new Error('page errors: '+errors.join(' | '));
          await browser.close(); server.kill('SIGTERM');
          console.log('BROWSER_ACCEPTANCE_PASS');
          JS
          node /tmp/physics-browser-test.mjs | tee /tmp/physics-browser-result.txt

      - name: Write acceptance evidence and current manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          pkg=Path('ege-fizika-demoversiya-v3-1-fixed')
          cases=pkg/'ege-fizika-demoversiya-ACCEPTANCE-CASES.json'
          d=json.loads(cases.read_text(encoding='utf-8'))
          d['browser_acceptance_status']='PASS'
          d['browser_result']='BROWSER_ACCEPTANCE_PASS'
          d['responsive_positions_checked']=130
          d['severe_javascript_errors']=0
          d['content_fidelity_rendered_recheck']='PASS'
          d['source_byte_lock_status']='PASS' if '${{ steps.sourcelock.outputs.locked }}'=='true' else 'PENDING_EXTERNAL_ACCESS'
          d['freeze_status']='READY_FOR_FINAL_FREEZE' if '${{ steps.sourcelock.outputs.locked }}'=='true' else 'BLOCKED_ONLY_BY_EXTERNAL_SOURCE_BYTE_LOCK'
          cases.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          defects=pkg/'PHYSICS-2026-CONTENT-FIDELITY-DEFECTS.json'
          x=json.loads(defects.read_text(encoding='utf-8'));x['status']='RESOLVED_AND_RENDERED_RECHECK_PASS';x['rendered_recheck']='PASS';defects.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Current package status remains candidate unless source byte-lock also passed.
          freeze = '${{ steps.sourcelock.outputs.locked }}'=='true'
          report={
            'candidate':'V3.2','source_year':2026,'content_criterion_fidelity':'PASS','input_contracts':'PASS',
            'browser_interaction':'PASS','state_restore':'PASS','responsive_320_360_390_768_1280':'PASS',
            'part1_score_28':'PASS','self_evaluation_semantics':'PASS','severe_js_errors':0,
            'source_external_byte_lock':'PASS' if freeze else 'PENDING',
            'technical_freeze_ready':freeze
          }
          (pkg/'PHYSICS-2026-CURRENT-ACCEPTANCE-EVIDENCE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Manifest last; exclude itself and transient workflow.
          files=[]
          for p in sorted(pkg.rglob('*')):
            if p.is_file() and p.name!='ege-fizika-demoversiya-MANIFEST.txt':
              files.append((str(p.relative_to(pkg)),p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()))
          lines=['EGE ФИЗИКА — ИНТЕРАКТИВНАЯ ДЕМОВЕРСИЯ — V3.2 ACCEPTANCE CANDIDATE',f'PACKAGE_STATUS={"READY_FOR_FINAL_FREEZE" if freeze else "BLOCKED_ONLY_BY_EXTERNAL_SOURCE_BYTE_LOCK"}','PACKAGE_LAYOUT=FLAT_WITH_SOURCE','','FILENAME\tSIZE_BYTES\tSHA256']
          lines += [f'{n}\t{s}\t{h}' for n,s,h in files]
          (pkg/'ege-fizika-demoversiya-MANIFEST.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit verified result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/physics-2026-one-shot-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify and fix Physics 2026 acceptance candidate'
          git push origin HEAD:chatgpt/physics-2026-acceptance-20260819
