name: Owner Control GitHub-first static safety

on:
  pull_request:
    paths:
      - '.github/workflows/owner-agent-task-v2.yml'
      - '.github/workflows/owner-agent-batch-v2.yml'
      - '.github/workflows/owner-agent-native-v3.yml'
      - '.github/workflows/owner-control-v2-static.yml'
      - 'eksamio-learning-engine/project-control/owner_control_budget_proxy.mjs'
      - 'eksamio-learning-engine/project-control/owner_native_executor.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-control-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Budget proxy self-test
        run: node eksamio-learning-engine/project-control/owner_control_budget_proxy.mjs --self-test
      - name: Validate GitHub-first fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast
          ai=Path('.github/workflows/owner-agent-task-v2.yml').read_text()
          batch=Path('.github/workflows/owner-agent-batch-v2.yml').read_text()
          native=Path('.github/workflows/owner-agent-native-v3.yml').read_text()
          executor=Path('eksamio-learning-engine/project-control/owner_native_executor.py').read_text()

          # GitHub-first routing must be explicit, deterministic and capable of $0 packages.
          assert "execution_mode') or '').lower()=='github_native'" in batch
          assert "effective=Decimal('0.00') if ai_count==0 else requested" in batch
          assert "workflow='owner-agent-native-v3.yml'" in batch
          assert "workflow='owner-agent-task-v2.yml'" in batch
          assert "ROUTING_POLICY: github_native_first" in batch
          assert "NO_AUTO_RETRY: true" in batch

          # Native lane must have no OpenAI/model surface.
          lowered=native.lower()
          for token in ('openai_api_key','api.openai.com','openai/codex','gpt-5','gpt-6','astra'):
              assert token not in lowered, token
          assert "owner_native_executor.py" in native
          assert "OPENAI_CALLS=0" in native
          assert "owner-agent-batch-v2.yml" in native

          # Native executor is a strict declarative allowlist, never arbitrary shell/code.
          assert 'ALLOWED_PLAYBOOKS = {"exact_text_replace", "json_set"}' in executor
          assert 'execution_mode") or "").lower() != "github_native"' in executor
          assert "github_native task cannot request Astra" in executor
          tree=ast.parse(executor)
          imports={alias.name for n in tree.body if isinstance(n,(ast.Import,ast.ImportFrom)) for alias in n.names}
          assert 'subprocess' not in imports and 'os' not in imports

          # AI lane keeps existing safety: explicit Astra only, isolated Codex, hard proxy.
          assert "astra_plan=bool(task.get('astra_plan_required') or task.get('astra_required'))" in ai
          assert "astra_accept=bool(task.get('astra_acceptance_required') or task.get('astra_required'))" in ai
          assert "safety-strategy: drop-sudo" in ai
          assert "responses-api-endpoint: http://127.0.0.1:8787/v1/responses" in ai
          assert "owner_control_budget_proxy.mjs" in ai
          assert "gh pr create" not in ai

          # Neither lane may auto-merge/deploy/publish.
          combined=(batch+'\n'+native+'\n'+ai).lower()
          forbidden=['gh pr merge','enable-auto-merge','kubectl apply','yc serverless','markpullrequestreadyforreview','api.tilda.cc','tilda_token','tilda_secret']
          for token in forbidden:
              assert token not in combined, token
          print('OWNER_CONTROL_GITHUB_FIRST_STATIC_ACCEPTANCE=PASS')
          PY
      - name: Syntax-check native executor
        run: python3 -m py_compile eksamio-learning-engine/project-control/owner_native_executor.py
