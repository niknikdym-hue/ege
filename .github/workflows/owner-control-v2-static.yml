name: Owner Control v2 static safety

on:
  pull_request:
    paths:
      - '.github/workflows/owner-agent-task-v2.yml'
      - '.github/workflows/owner-agent-batch-v2.yml'
      - '.github/workflows/owner-control-v2-static.yml'
      - 'eksamio-learning-engine/project-control/owner_control_budget_proxy.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-control-v2-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Budget proxy self-test
        run: node eksamio-learning-engine/project-control/owner_control_budget_proxy.mjs --self-test
      - name: Validate fail-closed v2 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          task=Path('.github/workflows/owner-agent-task-v2.yml').read_text()
          batch=Path('.github/workflows/owner-agent-batch-v2.yml').read_text()
          proxy=Path('eksamio-learning-engine/project-control/owner_control_budget_proxy.mjs').read_text()

          # Economic routing: Astra is explicit opt-in only, never a heuristic route.
          assert "astra=bool(task.get('astra_required') or task.get('astra_acceptance_required'))" in task
          assert "allowed=[model] + (['gpt-6-astra'] if astra else [])" in task
          assert "elif any(w in text" in task and "model='gpt-5.6-sol'" in task
          assert "model='gpt-6-astra'" not in task.split("astra=bool",1)[0]

          # Provider secret is not a job-wide env variable inherited by the agent.
          job_env=task.split('    env:',1)[1].split('    steps:',1)[0]
          assert 'OPENAI_API_KEY' not in job_env
          assert "responses-api-endpoint: http://127.0.0.1:8787/v1/responses" in task
          assert "permission-profile: ':workspace'" in task
          assert 'openai-api-key: ${{ secrets.OPENAI_API_KEY }}' in task

          # Budget is hard-reserved before each provider request and package sum is capped.
          assert "reservation > remainingUsd" in proxy
          assert "hard task budget" in proxy
          assert "totalBudget > 0 && totalBudget <= 3" in proxy
          assert "payload.max_output_tokens = maxOut" in proxy
          assert "payload.store = false" in proxy
          assert "b=Decimal('${{ inputs.package_budget_usd }}')" in batch
          assert "Decimal('3.00')" in batch
          assert "task_cap=min(Decimal('3.00')" in batch

          # Package is cumulative and sequential: one work ref advances after every child PASS.
          assert "work_ref='owner/package-${{ github.run_id }}'" in batch
          assert "expected_work_sha" in batch and "expected_work_sha" in task
          assert "Successful child did not advance cumulative branch" in batch
          assert "PACKAGE_STOPPED" in batch and "NO_AUTO_RETRY: true" in batch
          assert "gh pr create" in batch and "--draft" in batch
          assert "gh pr create" not in task
          assert "Commit PASS task to cumulative package branch" in task

          # No automatic merge/deploy/public Ready action exists in the v2 workflows.
          combined=(task+'\n'+batch).lower()
          forbidden=['gh pr merge','enable-auto-merge','kubectl apply','yc serverless','tilda publish','markpullrequestreadyforreview']
          for token in forbidden:
              assert token not in combined, token
          print('OWNER_CONTROL_V2_STATIC_ACCEPTANCE=PASS')
          PY
      - name: Verify workflow surface is bounded
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Owner task v2' .github/workflows/owner-agent-task-v2.yml
          grep -q 'Owner batch v2' .github/workflows/owner-agent-batch-v2.yml
          grep -q 'explicit_opt_in_only' .github/workflows/owner-agent-batch-v2.yml
          ! grep -q 'gpt-5.3-codex-spark' .github/workflows/owner-agent-task-v2.yml
