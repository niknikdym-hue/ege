name: Social studies 1.0.2 source export

on:
  pull_request:
    branches: [main]
    paths:
      - '.rebuild-obsh-trigger'
      - '.github/workflows/obshchestvoznaniye-v102-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser package
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null
          google-chrome --version
      - name: Export current package and published page
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/obsh-v102-source
          mkdir -p "$OUT/repo" "$OUT/live"
          test -f ege-obshchestvoznaniye-demoversiya.zip
          cp ege-obshchestvoznaniye-demoversiya.zip "$OUT/repo/current-package.zip"
          unzip -q ege-obshchestvoznaniye-demoversiya.zip -d "$OUT/repo/extracted"
          find "$OUT/repo/extracted" -type f -printf '%P\n' | sort > "$OUT/repo/package-files.txt"
          sha256sum ege-obshchestvoznaniye-demoversiya.zip > "$OUT/repo/current-package.sha256"
          cat > export-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/obsh-v102-source/live';
          const browser=await chromium.launch({headless:true,channel:'chrome'});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          await page.goto('https://eksamio.ru/ege/obshchestvoznaniye/demoversiya/',{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(800);
          fs.writeFileSync(out+'/page.html',await page.content());
          fs.writeFileSync(out+'/inline-scripts.json',JSON.stringify(await page.evaluate(()=>[...document.scripts].map((s,i)=>({index:i,src:s.src||'',text:s.src?'':s.textContent}))),null,2));
          fs.writeFileSync(out+'/body-text.txt',(await page.locator('body').innerText()));
          await page.screenshot({path:out+'/published.png',fullPage:true});
          await browser.close();
          JS
          node export-live.mjs
      - name: Upload frozen source
        uses: actions/upload-artifact@v4
        with:
          name: obshchestvoznaniye-v102-source
          path: /tmp/obsh-v102-source/**
          if-no-files-found: error
          retention-days: 30
