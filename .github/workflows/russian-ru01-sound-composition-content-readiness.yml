name: Russian RU01 sound composition content readiness

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-COMPOSITION-WAVE-004-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-OGE-2-1-SOUND-COMPOSITION-OWNER-RESOLUTION-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_composition_content_readiness.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v16.py'
      - '.github/workflows/russian-ru01-sound-composition-content-readiness.yml'
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-COMPOSITION-WAVE-004-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-OGE-2-1-SOUND-COMPOSITION-OWNER-RESOLUTION-v0.1.json'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_composition_content_readiness.py'
      - 'eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v16.py'
      - '.github/workflows/russian-ru01-sound-composition-content-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sound-composition-content-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile readiness builder
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_composition_content_readiness.py

      - name: Build sound-composition readiness twice
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_composition_content_readiness.py --output /tmp/ru01-sound-composition-a.json > /tmp/ru01-sound-composition-a.txt
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_composition_content_readiness.py --output /tmp/ru01-sound-composition-b.json > /tmp/ru01-sound-composition-b.txt
          cmp /tmp/ru01-sound-composition-a.json /tmp/ru01-sound-composition-b.json
          diff -u /tmp/ru01-sound-composition-a.txt /tmp/ru01-sound-composition-b.txt
          cat /tmp/ru01-sound-composition-a.txt
          cp /tmp/ru01-sound-composition-a.json RU01-SOUND-COMPOSITION-CONTENT-READINESS.json

      - name: Verify fail-closed component-specific content readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('RU01-SOUND-COMPOSITION-CONTENT-READINESS.json').read_text(encoding='utf-8'))
          assert data['schema_version']=='0.1.0'
          assert data['status']=='CENTRAL_BRAIN_RU01_SOUND_COMPOSITION_CONTENT_AND_EVIDENCE_READY_NOT_ACCEPTED'
          assert data['module_id']=='RU-PROG-01'
          assert data['candidate_semantic_id']=='ru-phonetics-sound-composition-determination'
          assert data['owner_resolution_exact_head_gate']=={
              'run_id':34248497114,
              'head_sha':'a975713626334adb4c2e459ed66b2235d1dec3b7',
              'conclusion':'SUCCESS',
          }
          assert data['target']=={
              'admission_unit_id':'RAU-b6f5dff93864358672bc',
              'requirement_id':'RSK-OGE_COD-2-1-P010',
              'source_locator':'FIPI-OGE-RU-2026-FINAL/OGE_COD p.10 2.1',
              'already_bound_component_ref_preserved':'ru-phonetics-vowel-consonant-features',
              'remaining_component_candidate':'ru-phonetics-sound-composition-determination',
          }
          learner=data['learner_content']
          assert learner['dedicated_candidate_content_unit_present'] is True
          assert learner['original_eksamio_content'] is True
          assert learner['independent_verification_ids']==[
              'p01-u6-v1','p01-u6-v2','p01-u6-v3','p01-u6-v4','p01-u6-v5','p01-u6-v6'
          ]
          assert learner['independent_verification_count']==6
          assert learner['covered_skills']==[
              'count_sounds_without_counting_letters',
              'determine_ordered_sound_sequence',
              'distinguish_sound_composition_from_adjacent_semantics',
              'distinguish_sound_composition_from_letter_composition',
              'recognize_fail_closed_pronunciation_boundary',
              'separate_composition_from_feature_classification',
          ]
          ev=data['evidence_independence']
          assert ev['overlap']==[]
          assert ev['adjacent_semantic_evidence_reused'] is False
          assert ev['generic_ru01_evidence_can_substitute'] is False
          assert set(ev['sound_composition_evidence_ids'])=={
              'p01-u6-v1','p01-u6-v2','p01-u6-v3','p01-u6-v4','p01-u6-v5','p01-u6-v6'
          }
          pol=data['policy']
          assert pol['content_readiness_is_semantic_acceptance'] is False
          assert pol['content_readiness_is_object_acceptance'] is False
          assert pol['candidate_is_canonical_before_separate_acceptance'] is False
          assert pol['existing_partial_component_is_modified'] is False
          assert pol['normative_pronunciation_or_stress_inferred'] is False
          assert pol['false_exact_mastery_admissions']==0
          assert data['current_launch_aggregate_unchanged']=={
              'accepted_authorities':63,
              'subject_disposed_units_total':41,
              'subject_disposed_requirements_total':41,
              'subject_review_units_remaining':1275,
              'subject_review_requirements_remaining':1350,
              'accepted_bounded_ru_subject_semantics':68,
              'accepted_bounded_ru_semantics_total':77,
              'false_exact_mastery_admissions':0,
          }
          assert data['summary']=={
              'dedicated_candidate_content_units':1,
              'component_specific_independent_verification_items':6,
              'adjacent_semantic_evidence_reused':0,
              'semantic_admissions':0,
              'object_level_admission_units_closed':0,
              'object_level_requirements_closed':0,
              'new_school_canonical_identities':0,
              'false_exact_mastery_admissions':0,
          }
          nxt=data['next_exact_work']
          assert nxt['separate_bounded_subject_semantic_acceptance_required'] is True
          assert nxt['semantic_acceptance_must_bind_only_p01_u6_evidence'] is True
          assert nxt['separate_exact_object_component_set_acceptance_required_after_semantic_acceptance'] is True
          assert nxt['target_remains_pending_until_its_own_acceptance_gate_passes'] is True
          print('RUSSIAN_RU01_SOUND_COMPOSITION_CONTENT_READINESS_FAIL_CLOSED=PASS')
          PY

      - name: Protect public and production surfaces
        shell: bash
        run: |
          set -euo pipefail
          wave_base='a975713626334adb4c2e459ed66b2235d1dec3b7'
          git merge-base --is-ancestor "$wave_base" HEAD
          recent=$(git diff --name-only "$wave_base"..HEAD)
          allowed=$(cat <<'EOF'
          .github/workflows/russian-ru01-sound-composition-content-readiness.yml
          eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-01-SOUND-COMPOSITION-WAVE-004-v0.1.json
          eksamio-learning-engine/russian-program/subject-admission/build_ru01_sound_composition_content_readiness.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "$recent" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed '/^$/d' | sort -u))
          if [[ -n "$unexpected" ]]; then
            echo 'Sound-composition content wave touched files outside the exact bounded allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$recent" | grep -E 'russkiy-knigi|(^|/)tilda|demo|scor'; then
            echo 'Sound-composition content wave touched a protected public/production surface.' >&2
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check a975713626334adb4c2e459ed66b2235d1dec3b7..HEAD

      - name: Upload durable readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-sound-composition-content-readiness
          path: RU01-SOUND-COMPOSITION-CONTENT-READINESS.json
          if-no-files-found: error
          retention-days: 14
