name: Independent Audit Release Profile Mathematics 2026

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/independent-audit-release-profile-math-2026.yml

permissions:
  contents: write

jobs:
  audit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install pymupdf pillow selenium
      - name: Preserve independent build/test sources
        run: |
          mkdir -p profile-math-2026-audit-build
          cp ege-matematika-profil-demoversiya-2026/scripts/build_profile_2026.py profile-math-2026-audit-build/build_profile_2026.py
          cp ege-matematika-profil-demoversiya-2026/tests/test_profile_2026.py profile-math-2026-audit-build/test_profile_2026.py
      - name: Rebuild from official FIPI 2026 PDF
        run: python profile-math-2026-audit-build/build_profile_2026.py
      - name: Restore reproducible sources inside package
        run: |
          cp profile-math-2026-audit-build/build_profile_2026.py ege-matematika-profil-demoversiya-2026/scripts/build_profile_2026.py
          cp profile-math-2026-audit-build/test_profile_2026.py ege-matematika-profil-demoversiya-2026/tests/test_profile_2026.py
      - name: Independent content and criteria audit gate
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path('ege-matematika-profil-demoversiya-2026');p='ege-matematika-profil-demoversiya-2026'
          d=json.loads((root/f'{p}-EXAM-DATA.json').read_text(encoding='utf-8'))
          em=json.loads((root/f'{p}-EXAM-MAP.json').read_text(encoding='utf-8'))
          # Independently re-established from FIPI 2026 demo/specification, not from builder registry.
          expected={
            '1':['61','18','40','5'],'2':['12','13','4'],'3':['1,125','36','104','9'],
            '4':['0,1','0,38','0,3'],'5':['0,657','0,15','0,79','0,78'],'6':['7','7','93','3'],
            '7':['0,75','5','125'],'8':['5','6','1,6'],'9':['45','5','4900'],
            '10':['19','15','8'],'11':['0,1','5','32'],'12':['5','-6','16','-18']}
          actual={str(t['number']):[v['answer'] for v in t['variants']] for t in d['tasks'][:12]}
          assert actual==expected,(actual,expected)
          assert len(d['tasks'])==19 and d['minutes']==235 and d['maxPrimaryScore']==32 and d['autoMax']==12 and d['selfMax']==20
          assert em['extended_max_scores']=={'13':2,'14':3,'15':2,'16':2,'17':3,'18':4,'19':4}
          assert sum(len(t['variants']) for t in d['tasks'][:12])==41 and sum(len(t['variants']) for t in d['tasks'][12:])==14
          # Per-example input contracts: probability only for 4/5; integer point count only for 8.1/8.2.
          for t in d['tasks'][:12]:
              for v in t['variants']:
                  mode=v['input_contract']['mode']; key=(t['number'],v['variant'])
                  want='probability' if t['number'] in (4,5) else ('integer_nonnegative' if key in ((8,1),(8,2)) else 'number')
                  assert mode==want,(key,mode,want)
          vis=json.loads((root/'source-evidence/VISUAL-SOURCE-EVIDENCE.json').read_text(encoding='utf-8'))
          items={x.get('key'):x for x in vis['items'] if x.get('kind')=='official_solution_and_criteria'}
          assert len(items)==14
          expected_segments={
            '13-1':[[20,95,1100]],'13-2':[[21,95,1100]],'14-1':[[22,95,1100]],'14-2':[[23,95,1100],[24,95,950]],
            '15-1':[[25,95,1100]],'15-2':[[26,95,1100]],'16-1':[[27,95,1100]],'16-2':[[28,95,1100]],
            '17-1':[[29,95,1100]],'17-2':[[30,95,1100],[31,95,475]],
            '18-1':[[31,485,1100],[32,95,930]],'18-2':[[33,95,1100],[34,95,930]],
            '19-1':[[35,95,1100],[36,95,380]],'19-2':[[36,385,1100],[37,95,900]]}
          for k,segs in expected_segments.items(): assert items[k]['segments']==segs,(k,items[k]['segments'],segs)
          def bottom_margin(path):
              im=Image.open(path).convert('RGB');bg=Image.new('RGB',im.size,'white');diff=ImageChops.difference(im,bg).convert('L');bbox=diff.point(lambda x:0 if x<16 else 255).getbbox();return im.height-bbox[3]
          # These were the two independently discovered truncations. Both must now have real bottom margin.
          assert bottom_margin(root/'assets/solution-14-2.webp')>=8
          assert bottom_margin(root/'assets/solution-19-1.webp')>=8
          # 19.2 must begin with its own red ИЛИ marker, not the previous criteria table tail.
          im=Image.open(root/'assets/solution-19-2.webp').convert('RGB')
          top=im.crop((0,0,im.width,min(150,im.height)))
          red=sum(1 for r,g,b in top.getdata() if r>140 and r>g*1.35 and r>b*1.35)
          assert red>10,red
          t123=sorted(root.glob(f'{p}-T123-*.txt')); assert t123 and max(x.stat().st_size for x in t123)<42500
          print('INDEPENDENT CONTENT AUDIT PASS: answers 41/41; contracts 41/41; extended criteria 14/14; structure 19/235/32')
          PY
      - name: Serve audited source build
        run: |
          cd ege-matematika-profil-demoversiya-2026
          python -m http.server 8771 >/tmp/profile-independent-http.log 2>&1 &
          sleep 2
      - name: Browser regression — audited source build
        env:
          EKSAMIO_PREVIEW_URL: http://127.0.0.1:8771/ege-matematika-profil-demoversiya-2026-PREVIEW.html
          EKSAMIO_EVIDENCE_OUT: ege-matematika-profil-demoversiya-2026/tests/evidence/profile-2026-independent-audit-browser-evidence.json
        run: python profile-math-2026-audit-build/test_profile_2026.py
      - name: Write independent audit report and PASS metadata
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('ege-matematika-profil-demoversiya-2026');p='ege-matematika-profil-demoversiya-2026'
          t123=sorted(root.glob(f'{p}-T123-*.txt'));count=len(t123);mx=max(x.stat().st_size for x in t123)
          status=root/f'{p}-PAGE-STATUS.txt';s=status.read_text(encoding='utf-8')
          repl={
            'INTERACTION_GATE: PENDING':'INTERACTION_GATE: PASS — 55/55 official examples via real DOM controls',
            'SCORER_GATE: PENDING':'SCORER_GATE: PASS — independent answer audit 41/41; full correct short attempt 12/12',
            'STATE_RESTORE_GATE: PENDING':'STATE_RESTORE_GATE: PASS — assigned variants + short answers + extended solutions',
            'EXTENDED_SELF_EVALUATION_GATE: PENDING':'EXTENDED_SELF_EVALUATION_GATE: PASS — 7/7 tasks; separate /20; automatic /12 unchanged',
            'TILDA_SIZE_GATE: PENDING':f'TILDA_SIZE_GATE: PASS — {count} T123; every block < 42500 bytes',
            'INDEPENDENT_AUDIT_GATE: PENDING':'INDEPENDENT_AUDIT_GATE: PASS — 41/41 answers independently recalculated; 41/41 input contracts; 14/14 extended solution/criteria assets visually re-audited',
            'FINAL_STATUS: BUILT_PENDING_TESTS':'FINAL_STATUS: READY_FOR_TILDA_TEST_AFTER_INDEPENDENT_AUDIT'}
          for a,b in repl.items():s=s.replace(a,b)
          s=s.replace('PUBLISHED_SMOKE_STATUS: NOT_RUN_UNTIL_TILDA_PUBLICATION','CLEAN_ZIP_BROWSER_GATE: PENDING\nPUBLISHED_SMOKE_STATUS: NOT_RUN_UNTIL_TILDA_PUBLICATION')
          status.write_text(s,encoding='utf-8')
          rows=list(csv.DictReader((root/'AUDIT-MATRIX-2026-profile.csv').open(encoding='utf-8-sig')))
          for r in rows:r['interaction_gate']='PASS'
          with (root/'AUDIT-MATRIX-2026-profile.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          report='''# Независимый аудит — ЕГЭ профильная математика 2026\n\n**Статус: PASS после исправлений.**\n\n## Что проверено независимо\n\n- Официальные источники: демоверсия, спецификация и кодификатор ФИПИ 2026.\n- Структура: 19 заданий; 12 кратких + 7 развёрнутых; 235 минут; максимум 32 первичных балла.\n- Ответы №1–12 пересчитаны независимо: 41/41 совпадают с официальной таблицей ФИПИ.\n- Контракты ввода проверены отдельно для 41 официального примера: 41/41 PASS.\n- №13–19: все 14 официальных вариантов заново сверены по полным страницам PDF, включая решения, критерии и максимальные баллы.\n\n## Найденные независимым аудитом дефекты и исправления\n\n1. `solution-14-2.webp`: нижняя часть таблицы критериев была обрезана. Исправлено — таблица критериев и строка «Максимальный балл 3» включены полностью.\n2. `solution-19-1.webp`: нижняя часть критериев была обрезана. Исправлено — таблица и строка «Максимальный балл 4» включены полностью.\n3. `solution-19-2.webp`: начало содержало хвост таблицы критериев предыдущего варианта. Исправлена граница: пример начинается со своего «ИЛИ».\n\n## Контроль после исправлений\n\n- Browser interaction: 55/55 официальных примеров PASS.\n- Автоматическая часть: 12/12 на полностью правильной попытке.\n- Развёрнутая часть: самостоятельная оценка /20 отделена от автоматического /12.\n- State restore: PASS.\n- Widths 1280 / 768 / 390 / 360 / 320: PASS.\n- Severe JavaScript errors: 0.\n- Clean ZIP browser gate выполняется повторно после упаковки.\n'''
          (root/'INDEPENDENT-AUDIT-REPORT-2026-profile.md').write_text(report,encoding='utf-8')
          ev=root/f'{p}-BUILD-EVIDENCE.json';d=json.loads(ev.read_text(encoding='utf-8'));d.update({'status':'PASS_AFTER_INDEPENDENT_AUDIT','independent_answer_audit':'41/41 PASS','independent_input_contract_audit':'41/41 PASS','independent_extended_criteria_audit':'14/14 PASS after fixes to 14-2, 19-1, 19-2 boundary','interaction_gate':'55/55 PASS','full_correct_short_attempt':'12/12 PASS','t123_blocks':count,'t123_max_bytes':mx});ev.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Pack independent-audit candidate
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('profile-math-2026-audit-build/build_profile_2026.py');spec=importlib.util.spec_from_file_location('b',p);b=importlib.util.module_from_spec(spec);spec.loader.exec_module(b);print(b.manifest_zip())
          PY
      - name: Extract clean ZIP
        run: |
          rm -rf /tmp/profile-independent-final && mkdir -p /tmp/profile-independent-final
          unzip -q ege-matematika-profil-demoversiya-2026-v1.0.zip -d /tmp/profile-independent-final
          cd /tmp/profile-independent-final/ege-matematika-profil-demoversiya-2026
          python -m http.server 8772 >/tmp/profile-independent-final-http.log 2>&1 &
          sleep 2
      - name: Browser regression — extracted clean ZIP
        env:
          EKSAMIO_PREVIEW_URL: http://127.0.0.1:8772/ege-matematika-profil-demoversiya-2026-PREVIEW.html
          EKSAMIO_EVIDENCE_OUT: ege-matematika-profil-demoversiya-2026/tests/evidence/profile-2026-independent-final-zip-browser-evidence.json
        run: python profile-math-2026-audit-build/test_profile_2026.py
      - name: Finalize clean ZIP PASS and repack
        run: |
          python - <<'PY'
          import importlib.util,json,zipfile
          from pathlib import Path
          root=Path('ege-matematika-profil-demoversiya-2026');p='ege-matematika-profil-demoversiya-2026'
          status=root/f'{p}-PAGE-STATUS.txt';s=status.read_text(encoding='utf-8').replace('CLEAN_ZIP_BROWSER_GATE: PENDING','CLEAN_ZIP_BROWSER_GATE: PASS — independent audited extracted ZIP repeated full 55/55 browser/scorer/state/width gate');status.write_text(s,encoding='utf-8')
          ev=root/f'{p}-BUILD-EVIDENCE.json';d=json.loads(ev.read_text(encoding='utf-8'));d['clean_zip_browser_gate']='PASS_AFTER_INDEPENDENT_AUDIT';ev.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pth=Path('profile-math-2026-audit-build/build_profile_2026.py');spec=importlib.util.spec_from_file_location('b',pth);b=importlib.util.module_from_spec(spec);spec.loader.exec_module(b);out=b.manifest_zip()
          with zipfile.ZipFile(out) as z:
              base=root.name+'/';names=set(z.namelist())
              assert base+'INDEPENDENT-AUDIT-REPORT-2026-profile.md' in names
              assert base+'tests/evidence/profile-2026-independent-audit-browser-evidence.json' in names
              assert base+'tests/evidence/profile-2026-independent-final-zip-browser-evidence.json' in names
          print('FINAL INDEPENDENT AUDIT ZIP PASS',out)
          PY
      - name: Remove obsolete pre-audit ZIP/build helpers and commit final audited release
        run: |
          rm -rf profile-math-2026-audit-build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release independently audited profile mathematics 2026 v1.0'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: ege-matematika-profil-demoversiya-2026-v1.0-independent-audited
          path: ege-matematika-profil-demoversiya-2026-v1.0.zip
          retention-days: 7
