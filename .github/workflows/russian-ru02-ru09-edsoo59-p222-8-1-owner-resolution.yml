name: Russian EDSOO59 p222 8.1 official-source identity audit

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru02_ru09_edsoo59_p222_8_1_source_identity_audit.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_ru02_ru09_edsoo59_p222_8_1_owner_resolution.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current_v29.py"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU09-SYNTAX-CANDIDATES-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU09-EDSOO59-P222-8-1-SOURCE-BACKED-OWNER-RESOLUTION-v0.1.json"
      - "eksamio-learning-engine/russian-program/source-knowledge/RUSSIAN-OFFICIAL-SOURCE-MANIFEST-v1.0.json"
      - ".github/workflows/russian-ru02-ru09-edsoo59-p222-8-1-owner-resolution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile official-source identity audit
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru02_ru09_edsoo59_p222_8_1_source_identity_audit.py

      - name: Build fail-closed source audit twice
        shell: bash
        run: |
          set -euo pipefail
          BUILDER="eksamio-learning-engine/russian-program/subject-admission/build_ru02_ru09_edsoo59_p222_8_1_source_identity_audit.py"
          OUT="eksamio-learning-engine/russian-program/subject-admission/RU02-RU09-EDSOO59-P222-8-1-SOURCE-IDENTITY-AUDIT.json"
          python3 "$BUILDER" --output /tmp/audit-a.json > /tmp/report-a.txt
          python3 "$BUILDER" --output /tmp/audit-b.json > /tmp/report-b.txt
          cmp /tmp/audit-a.json /tmp/audit-b.json
          diff -u /tmp/report-a.txt /tmp/report-b.txt
          cat /tmp/report-a.txt
          cp /tmp/audit-a.json "$OUT"

      - name: Verify official-source mismatch and owner search remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "eksamio-learning-engine/russian-program/subject-admission/"
              "RU02-RU09-EDSOO59-P222-8-1-SOURCE-IDENTITY-AUDIT.json"
          )
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["schema_version"] == "0.2.0"
          assert data["status"] == (
              "CENTRAL_BRAIN_EDSOO59_P222_8_1_BLOCKED_OFFICIAL_SOURCE_IDENTITY_MISMATCH"
          )

          repo = data["repository_object"]
          assert repo["admission_unit_id"] == "RAU-3ceb45ca22608d520ddf"
          assert repo["requirement_id"] == "RSK-EDSOO59-8-1-P222"
          assert repo["source_id"] == "EDSOO-RU-5-9-2025"
          assert repo["document_id"] == "EDSOO59"
          assert repo["page"] == 222
          assert repo["code"] == "8.1"
          assert repo["normalized_meaning"] == (
              "Применять нормативное произношение и ударение. "
              "Анализировать синтаксическую конструкцию и её нормативность."
          )

          official = data["official_source_observation"]
          assert official["url"] == (
              "https://edsoo.ru/wp-content/uploads/2025/07/"
              "2025_ooo_frp_russkij-yazyk_5-9.pdf"
          )
          assert official["printed_page"] == 222
          assert official["pdf_page_index_zero_based"] == 221
          assert official["code"] == "8.1"
          assert official["text"] == (
              "Средства оформления предложения в устной и письменной речи "
              "(интонация, логическое ударение, знаки препинания). "
              "Нормы использования инверсии"
          )

          rederived = data["official_source_rederivation"]
          assert rederived["status"] == (
              "SOURCE_BACKED_REDERIVATION_COMPLETE_OWNER_BINDING_BLOCKED"
          )
          assert rederived["proposed_exact_source_meaning"] == official["text"]
          correction = rederived["aggregate_correction_candidate"]
          assert correction["status"] == "SOURCE_BACKED_CORRECTION_CANDIDATE_NOT_APPLIED"
          assert correction["aggregate_mutated"] is False
          assert correction["current_v30_created"] is False

          search = rederived["owner_search"]
          assert search["method"] == "EXACT_NORMALIZED_TEXT_EQUALITY_ONLY"
          assert search["keyword_search_used_for_binding"] is False
          assert search["fuzzy_search_used_for_binding"] is False
          assert search["route_module_title_task_number_inference_used"] is False
          assert search["nearby_candidate_selection_used"] is False
          assert search["exact_current_owner_count_total"] == 0
          assert len(search["components"]) == 2
          assert [row["exact_source_text"] for row in search["components"]] == [
              (
                  "Средства оформления предложения в устной и письменной речи "
                  "(интонация, логическое ударение, знаки препинания)"
              ),
              "Нормы использования инверсии",
          ]
          for row in search["components"]:
              assert row["exact_current_canonical_school_owner_matches"] == []
              assert row["exact_current_accepted_ru09_owner_matches"] == []
              assert row["exact_current_owner_count"] == 0
              assert row["owner_resolution_status"] == (
                  "BLOCKED_NO_EXACT_CURRENT_OWNER_BY_EXACT_TEXT_EQUALITY"
              )
              assert row["candidate_is_source_backed"] is True
              assert row["candidate_is_canonical_owner"] is False
              assert row["candidate_is_accepted_semantic"] is False
              assert row["selection_or_admission_performed"] is False

          resolution = data["source_identity_resolution"]
          assert resolution["same_printed_page"] is True
          assert resolution["same_code"] is True
          assert resolution["repository_meaning_matches_official_text"] is False
          assert resolution["repository_object_binding_is_safe_for_semantic_acceptance"] is False
          assert resolution["previous_component_owner_mapping_may_be_reused_for_this_object"] is False
          assert resolution["previous_bounded_candidate_mapping_may_be_selected_for_this_object"] is False
          assert resolution["official_source_rederived_for_exact_owner_search"] is True
          assert resolution["exact_current_owner_binding_complete"] is False

          blocker = data["blocker"]
          assert blocker["kind"] == "OFFICIAL_SOURCE_IDENTITY_MISMATCH"
          assert blocker["secondary_kind"] == (
              "MISSING_EXACT_CURRENT_OWNER_FOR_OFFICIAL_SOURCE_COMPONENTS"
          )
          assert blocker["severity"] == "FAIL_CLOSED"
          assert blocker["object_remains_subject_review_required"] is True
          assert blocker["current_v30_allowed"] is False

          policy = data["policy"]
          assert policy["official_source_overrides_repository_inferred_binding"] is True
          assert policy["source_identity_must_be_exact_before_owner_resolution"] is True
          assert policy["exact_current_owner_search_performed_first"] is True
          assert policy["keyword_or_fuzzy_owner_inference_allowed"] is False
          assert policy["module_route_title_or_task_number_inference_allowed"] is False
          assert policy["nearby_semantic_candidate_auto_selection_allowed"] is False
          assert policy["object_acceptance_allowed_by_this_audit"] is False
          assert policy["semantic_admission_allowed_by_this_audit"] is False
          assert policy["mastery_admission_allowed_by_this_audit"] is False
          assert policy["registered_user_identity_required_for_future_canonical_learner_evidence"] is True
          assert policy["anonymous_or_device_only_canonical_progress_allowed"] is False

          summary = data["summary"]
          assert summary["official_source_components_rederived"] == 2
          assert summary["exact_current_owner_matches"] == 0
          assert summary["source_backed_correction_candidates"] == 1
          assert summary["aggregate_corrections_applied"] == 0
          assert summary["semantic_admissions"] == 0
          assert summary["object_level_closures"] == 0
          assert summary["exact_mastery_admissions"] == 0
          assert summary["false_exact_mastery_admissions"] == 0
          assert summary["current_v29_remainder_units_preserved"] == 1270
          assert summary["current_v29_remainder_requirements_preserved"] == 1345

          print("RUSSIAN_EDSOO59_P222_8_1_SOURCE_IDENTITY_GUARD=PASS")
          PY

      - name: Verify bounded source-backed owner candidates remain no-admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path

          engine = Path("eksamio-learning-engine")
          candidate_path = engine / "russian-program/subject-admission/RU09-EDSOO59-P222-8-1-SOURCE-BACKED-OWNER-RESOLUTION-v0.1.json"
          inventory_path = engine / "273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
          ru09_path = engine / "russian-program/subject-admission/RU09-SYNTAX-CANDIDATES-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
          manifest_path = engine / "russian-program/source-knowledge/RUSSIAN-OFFICIAL-SOURCE-MANIFEST-v1.0.json"

          data = json.loads(candidate_path.read_text(encoding="utf-8"))
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          ru09 = json.loads(ru09_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert data["schema_version"] == "0.1.0"
          assert data["status"] == "BOUNDED_SOURCE_BACKED_EDSOO59_P222_8_1_OWNER_RESOLUTION_NO_ADMISSION"
          target = data["target_object"]
          assert target["admission_unit_id"] == "RAU-3ceb45ca22608d520ddf"
          assert target["requirement_id"] == "RSK-EDSOO59-8-1-P222"
          assert target["review_group_id"] == "RUS-SEM-REVIEW-048"
          assert target["source_id"] == "EDSOO-RU-5-9-2025"
          assert target["document_id"] == "EDSOO59"
          assert target["printed_page"] == 222
          assert target["code"] == "8.1"

          gate = data["source_identity_audit_gate"]
          assert gate["workflow"] == "Russian EDSOO59 p222 8.1 official-source identity audit"
          assert gate["run_id"] == 34650713854
          assert gate["head_sha"] == "02736ebe36a56de73c17b51dfb303ec1e8fcada7"
          assert gate["required_conclusion_before_any_semantic_admission"] == "SUCCESS"
          assert gate["candidate_does_not_treat_in_progress_as_proof"] is True

          docs = [
              row for row in manifest["documents"]
              if row.get("canonical_source_id") == "EDSOO-RU-5-9-2025"
              and row.get("document_id") == "EDSOO59"
          ]
          assert len(docs) == 1
          doc = docs[0]
          official = data["official_source"]
          assert doc["final_status"] == "CURRENT_2025_FEDERAL_PROGRAM"
          assert doc["sha256"] == official["document_sha256"] == (
              "1d2f68b5e77e7b67fccd52ce0fed36d84141dc719e50db7b225f40b1313eeb0d"
          )
          assert doc["public_authority_url"] == official["public_authority_url"]

          def norm(value):
              return " ".join(str(value or "").strip().split())

          accepted_ru09 = [
              row for row in ru09.get("decisions", [])
              if row.get("subject_semantic_status") == "CENTRAL_BRAIN_ACCEPTED_BOUNDED_SUBJECT_SEMANTIC"
          ]
          current_school = [
              row for row in inventory.get("objects", [])
              if row.get("source_system") == "school_canonical"
              and row.get("authority_status") == "current"
              and row.get("audit_classification") == "CANONICAL_SCHOOL_IDENTITY"
          ]
          all_inventory_ids = set()
          for row in inventory.get("objects", []):
              if row.get("source_id"):
                  all_inventory_ids.add(str(row["source_id"]))
              if row.get("candidate_canonical_owner"):
                  all_inventory_ids.add(str(row["candidate_canonical_owner"]))
              for ref in row.get("current_semantic_refs") or []:
                  all_inventory_ids.add(str(ref))

          expected = [
              (
                  "edsoo59-p222-8-1-sentence-formulation-means",
                  "Средства оформления предложения в устной и письменной речи (интонация, логическое ударение, знаки препинания)",
                  "ru-syntax-sentence-formulation-means",
              ),
              (
                  "edsoo59-p222-8-1-inversion-norm",
                  "Нормы использования инверсии",
                  "ru-syntax-inversion-norm",
              ),
          ]
          assert data["existing_owner_search"]["method"] == "EXACT_NORMALIZED_TEXT_EQUALITY_ONLY"
          assert data["existing_owner_search"]["exact_current_owner_count"] == 0
          assert len(data["proposed_owners"]) == 2
          for row, (component_id, exact_text, proposed_id) in zip(data["proposed_owners"], expected, strict=True):
              assert row["source_component_id"] == component_id
              assert row["exact_source_text"] == exact_text
              assert row["label_ru"] == exact_text
              assert row["proposed_semantic_id"] == proposed_id
              assert row["definition_authority"] == "EXACT_OFFICIAL_SOURCE_TEXT_ONLY"
              assert row["status"] == "PROPOSED_NOT_CANONICAL"
              assert row["candidate_is_source_backed"] is True
              assert row["existing_exact_owner_found"] is False
              assert row["original_learner_content_status"] == "MISSING_REQUIRED"
              assert row["independent_component_evidence_status"] == "MISSING_REQUIRED"
              assert row["semantic_admission_effect"] == "NONE"
              assert row["object_closure_effect"] == "NONE"
              assert row["exact_mastery_effect"] == "NONE"

              wanted = norm(exact_text)
              school_matches = [
                  r for r in current_school
                  if norm(r.get("observed_label")) == wanted or norm(r.get("observed_meaning")) == wanted
              ]
              ru09_matches = [r for r in accepted_ru09 if norm(r.get("canonical_label_ru")) == wanted]
              assert school_matches == []
              assert ru09_matches == []
              assert proposed_id not in all_inventory_ids

          boundary = data["acceptance_boundary"]
          assert boundary["candidate_owner_resolution_can_self_admit"] is False
          assert boundary["source_identity_correction_applied"] is False
          assert boundary["aggregate_mutated"] is False
          assert boundary["current_v30_created"] is False
          assert boundary["component_specific_independent_learner_evidence_required"] is True
          assert boundary["original_bounded_learner_content_required"] is True
          assert boundary["registered_user_identity_required_for_future_canonical_learner_evidence"] is True
          assert boundary["anonymous_or_device_only_canonical_progress_allowed"] is False
          assert boundary["false_exact_mastery"] == 0

          effect = data["progress_effect"]
          assert effect["semantic_admissions"] == 0
          assert effect["object_level_closures"] == 0
          assert effect["exact_mastery_admissions"] == 0
          assert effect["current_v29_remainder_units_preserved"] == 1270
          assert effect["current_v29_remainder_requirements_preserved"] == 1345

          expected_sha = data["normalized_sha256"]
          unhashed = copy.deepcopy(data)
          del unhashed["normalized_sha256"]
          canonical = json.dumps(
              unhashed,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == expected_sha

          print("RUSSIAN_EDSOO59_P222_BOUNDED_OWNER_CANDIDATES=PASS")
          PY

      - name: Protect bounded wave and production surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE="cb90377c4ebe00e88e22c39824b7c484651ebcc4"
          OLD_RESOLVER="eksamio-learning-engine/russian-program/subject-admission/build_ru02_ru09_edsoo59_p222_8_1_owner_resolution.py"
          AUDIT="eksamio-learning-engine/russian-program/subject-admission/build_ru02_ru09_edsoo59_p222_8_1_source_identity_audit.py"
          CANDIDATE="eksamio-learning-engine/russian-program/subject-admission/RU09-EDSOO59-P222-8-1-SOURCE-BACKED-OWNER-RESOLUTION-v0.1.json"
          WORKFLOW=".github/workflows/russian-ru02-ru09-edsoo59-p222-8-1-owner-resolution.yml"

          mapfile -t changed < <(git diff --name-only "$BASE...HEAD")
          if [ "${#changed[@]}" -ne 4 ]; then
            printf 'Unexpected bounded-wave path count (%s):\n' "${#changed[@]}" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              "$OLD_RESOLVER"|"$AUDIT"|"$CANDIDATE"|"$WORKFLOW") ;;
              *)
                echo "Unexpected bounded-wave path: $path" >&2
                exit 1
                ;;
            esac
          done

          if git diff --name-only "$BASE...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo "Source-identity audit wave changed protected Russian production surfaces." >&2
            exit 1
          fi

          if git diff --name-only "$BASE...HEAD" | grep -F 'current_v30'; then
            echo "Source-identity mismatch must block current-v30 creation." >&2
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check cb90377c4ebe00e88e22c39824b7c484651ebcc4...HEAD

      - name: Upload source-identity audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: russian-edsoo59-p222-8-1-source-identity-audit
          path: eksamio-learning-engine/russian-program/subject-admission/RU02-RU09-EDSOO59-P222-8-1-SOURCE-IDENTITY-AUDIT.json
          if-no-files-found: error
          retention-days: 14
