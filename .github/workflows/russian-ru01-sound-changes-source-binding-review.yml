name: Russian RU01 sound changes exact source binding review

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-EXACT-SOURCE-BINDING-REVIEW-v0.1.json'
      - '.github/workflows/russian-ru01-sound-changes-source-binding-review.yml'
  pull_request:
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-EXACT-SOURCE-BINDING-REVIEW-v0.1.json'
      - '.github/workflows/russian-ru01-sound-changes-source-binding-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-binding-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact source binding and component evidence boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          root=Path('eksamio-learning-engine/russian-program')
          review=json.loads((root/'subject-admission/RU01-SOUND-CHANGES-EXACT-SOURCE-BINDING-REVIEW-v0.1.json').read_text(encoding='utf-8'))
          authority=json.loads((root/'subject-admission/RU01-PHONETICS-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json').read_text(encoding='utf-8'))
          content=json.loads((root/'production-learning-content/RU-PROG-01-PHONETICS-GRAPHICS-WAVE-001-v0.1.json').read_text(encoding='utf-8'))

          assert review['status']=='CENTRAL_BRAIN_RU01_SOUND_CHANGES_NO_EXACT_CURRENT_OWNER_SOURCE_BACKED_CANDIDATE_NOT_ACCEPTED'
          assert review['scope']=='RU01_SOUND_CHANGES_IN_SPEECH_FLOW_EXACT_SOURCE_BINDING_AND_COMPONENT_EVIDENCE_REVIEW'
          assert review['source_signature']=='SOUND_CHANGES_IN_SPEECH_FLOW'
          assert review['current_exact_owner_search']['workflow_run']==34209909668
          assert review['current_exact_owner_search']['workflow_conclusion']=='SUCCESS'
          assert review['current_exact_owner_search']['artifact_normalized_sha256']=='3856594b8952f73d49bb1ce0f952e9ae408be5d1ee9ea5c19c80baf8ac5bef08'

          targets=review['targets']
          assert len(targets)==2
          assert {t['admission_unit_id'] for t in targets}=={
              'RAU-b1ba48cb81e96255122a',
              'RAU-f709f1855bb0b8d104bc',
          }
          assert {t['requirement_id'] for t in targets}=={
              'RSK-EDSOO59-4-1-3-P187',
              'RSK-OGE_COD-4-1-3-P021',
          }
          assert {t['content_code'] for t in targets}=={'4.1.3'}
          assert {t['binding_review_classification'] for t in targets}=={'PENDING'}
          assert {t['binding_review_blocker'] for t in targets}=={'SOUND_CHANGES_SEMANTIC_REQUIRED'}

          assert authority['status']=='CENTRAL_BRAIN_ACCEPTED_RU01_PHONETICS_BOUNDED_SUBJECT_SEMANTICS'
          decisions={d['accepted_semantic_id']: d for d in authority['decisions']}
          units={u['proposed_semantic_id']: u for u in content['units']}
          expected={
              'ru-phonetics-sound-letter-relation':(['p01-u1-v1','p01-u1-v2'],'NOT_EXACT_OWNER'),
              'ru-phonetics-vowel-consonant-features':(['p01-u2-v1','p01-u2-v2'],'ADJACENT_BUT_INSUFFICIENT_FOR_EXACT_OWNER'),
              'ru-phonetics-word-analysis-sequence':(['p01-u3-v1','p01-u3-v2'],'NOT_EXACT_OWNER'),
          }
          reviews={r['semantic_id']: r for r in review['candidate_reviews']}
          assert set(reviews)==set(expected)
          for semantic_id,(evidence_ids,decision) in expected.items():
              assert semantic_id in decisions
              assert semantic_id in units
              actual=[x['id'] for x in units[semantic_id]['independent_verification']]
              assert actual==evidence_ids
              assert reviews[semantic_id]['independent_evidence_ids']==evidence_ids
              assert reviews[semantic_id]['decision']==decision

          # Nearest existing component mentions positional pronunciation but remains a
          # sound-property classifier; one devoicing example does not prove the
          # standalone official source component.
          u2=units['ru-phonetics-vowel-consonant-features']
          u2_text=json.dumps(u2,ensure_ascii=False)
          assert 'Позиционные изменения звучания' in u2_text
          assert 'дуб' in u2_text
          assert 'характеристика относится к звуку' in u2_text

          resolution=review['resolution']
          assert resolution['exact_current_canonical_owner_with_component_specific_evidence_found'] is False
          assert resolution['candidate_semantic_id']=='ru-phonetics-sound-changes-in-speech-flow'
          assert resolution['candidate_status']=='PROPOSED_NOT_CANONICAL'
          assert resolution['source_object_count']==2
          assert resolution['next_required_gates']==[
              'ORIGINAL_LEARNER_CONTENT',
              'INDEPENDENT_SOUND_CHANGES_SPECIFIC_EVIDENCE',
              'BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE',
              'SEPARATE_EXACT_OBJECT_ACCEPTANCE_EDSOO59_4_1_3_P187',
              'SEPARATE_EXACT_OBJECT_ACCEPTANCE_OGE_COD_4_1_3_P021',
          ]

          boundary=review['decision_boundary']
          assert boundary['review_is_semantic_acceptance'] is False
          assert boundary['review_is_object_acceptance'] is False
          assert boundary['object_closure_effect']=='NONE'
          assert boundary['exact_mastery_effect']=='NONE'
          assert boundary['generic_ru01_attempt_can_emit_exact_component_mastery'] is False
          assert boundary['shared_future_evidence_can_close_both_source_objects_without_separate_object_acceptance'] is False
          assert boundary['title_route_task_keyword_fuzzy_or_embedding_inference_allowed'] is False
          assert boundary['broad_domain_cooccurrence_counts_as_exact_source_binding'] is False
          assert boundary['false_exact_mastery']==0

          current_mod=runpy.run_path(str(root/'subject-admission/build_russian_semantic_acceptance_progress_launch_current_v13.py'))
          current=current_mod['build_progress']()
          assert current['normalized_sha256']=='f8c8c1f060eb596fc92c317b38d1c12e572a8827cb56042390ed08b0f681a426'
          assert len(current['accepted_authorities'])==60
          s=current['progress_summary']
          assert s['subject_disposed_units_total']==39
          assert s['subject_disposed_requirements_total']==39
          assert s['subject_review_units_remaining']==1277
          assert s['subject_review_requirements_remaining']==1352
          assert s['accepted_bounded_ru_subject_semantics']==67
          assert s['accepted_bounded_ru_semantics_total']==76
          assert s['false_exact_mastery_admissions']==0
          assert review['current_launch_state']['false_exact_mastery_admissions']==0

          print('RUSSIAN_RU01_SOUND_CHANGES_EXACT_SOURCE_BINDING_REVIEW=PASS')
          print('EXACT_EXISTING_OWNER=NONE')
          print('SOURCE_BACKED_CANDIDATE=ru-phonetics-sound-changes-in-speech-flow')
          print('OBJECT_CLOSURES=0')
          print('FALSE_EXACT_MASTERY=0')
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Upload durable review
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru01-sound-changes-exact-source-binding-review
          path: eksamio-learning-engine/russian-program/subject-admission/RU01-SOUND-CHANGES-EXACT-SOURCE-BINDING-REVIEW-v0.1.json
          if-no-files-found: error
