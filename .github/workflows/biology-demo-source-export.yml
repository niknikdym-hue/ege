name: Biology demo source export

on:
  pull_request:
    paths:
      - biologiya/biologiya-source-2026/**
      - biologiya/.biology-export-trigger
      - .github/workflows/biology-demo-source-export.yml
  push:
    branches:
      - main
      - build/biology-demo-2026
    paths:
      - biologiya/biologiya-source-2026/**
      - biologiya/.biology-export-trigger
      - .github/workflows/biology-demo-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Export official source package
        shell: bash
        run: |
          set -euo pipefail
          SRC="biologiya/biologiya-source-2026"
          OUT="/tmp/biology-source-export"
          test -d "$SRC"
          mkdir -p "$OUT/original" "$OUT/text" "$OUT/renders" "$OUT/meta"
          cp -a "$SRC"/. "$OUT/original/"
          find "$SRC" -type f -printf '%P\t%s bytes\n' | sort > "$OUT/meta/file-list.txt"
          find "$SRC" -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' pdf; do
            rel="${pdf#$SRC/}"
            stem="${rel%.pdf}"
            safe="${stem//\//__}"
            pdfinfo "$pdf" > "$OUT/meta/${safe}.pdfinfo.txt"
            pdftotext -layout "$pdf" "$OUT/text/${safe}.txt"
            mkdir -p "$OUT/renders/$safe"
            pdftoppm -png -r 144 "$pdf" "$OUT/renders/$safe/page" >/dev/null
          done
          find "$OUT" -type f -printf '%P\t%s bytes\n' | sort > "$OUT/meta/export-file-list.txt"

      - name: Upload biology source export
        uses: actions/upload-artifact@v4
        with:
          name: biology-source-export
          path: /tmp/biology-source-export/**
          if-no-files-found: error
          retention-days: 30
