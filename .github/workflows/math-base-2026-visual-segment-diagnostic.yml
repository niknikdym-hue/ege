name: Diagnose base mathematics 2026 visual segments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/math-base-2026-visual-segment-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install --quiet pymupdf
      - name: Build compact segment diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz

          root=Path('ege-matematika-baza-demoversiya-2026')
          components=json.loads((root/'source-diagnostics/VISUAL-COMPONENTS.json').read_text(encoding='utf-8'))
          pdf=fitz.open('matematika-source-2026/original/МА-11 ЕГЭ 2026 ДЕМО_базовый.pdf')
          pages=[10,11,14,15,16,18,19,20,21,22,25,26,28]
          lines=[]
          for printed in pages:
              physical=(printed+1)//2
              half='left' if printed%2==1 else 'right'
              page=pdf[physical-1]
              visual=page.rect * page.rotation_matrix
              mid=visual.width/2
              lines.append(f'===== PAGE {printed} ({half}) =====')
              markers=[]
              for w in page.get_text('words',sort=False):
                  rr=fitz.Rect(w[0],w[1],w[2],w[3]) * page.rotation_matrix
                  cx=(rr.x0+rr.x1)/2
                  belongs=(cx<mid) if half=='left' else (cx>=mid)
                  if not belongs: continue
                  local_x=rr.x0-(0 if half=='left' else mid)
                  txt=w[4].strip()
                  if txt=='ИЛИ' or txt in {'3','7','9','10','11','12','13','18','19','21'} or txt.startswith('Ответ'):
                      markers.append((rr.y0,local_x,txt))
              for y,x,t in sorted(markers):
                  lines.append(f'MARK y={y*2:.0f}px x={x*2:.0f}px {t}')
              for i,c in enumerate(components[str(printed)]['components'],start=1):
                  lines.append(f'COMP {i}: x={c["x0"]}-{c["x1"]} y={c["y0"]}-{c["y1"]} w={c["w"]} h={c["h"]} ink={c["ink_area"]}')
              lines.append('')
          out=root/'source-diagnostics/VISUAL-SEGMENTS.txt'
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ege-matematika-baza-demoversiya-2026/source-diagnostics/VISUAL-SEGMENTS.txt
          git diff --cached --quiet || { git commit -m 'Add base mathematics visual segment diagnostic'; git push origin HEAD:main; }
