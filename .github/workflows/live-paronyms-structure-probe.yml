name: Live paronyms structure probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-paronyms-structure-probe.yml'
      - 'eksamio-learning-engine/peis-integration-reference/probe_live_paronyms_structure.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only bounded static inspection of live paronym backing construction
        env:
          PROBE_OUT: live-paronyms-structure.json
        run: node eksamio-learning-engine/peis-integration-reference/probe_live_paronyms_structure.mjs
      - name: Upload exact live structure probe result
        uses: actions/upload-artifact@v4
        with:
          name: live-paronyms-structure-probe
          path: live-paronyms-structure.json
          if-no-files-found: error
