name: physics-2026-finalize-v33
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'chatgpt/physics-2026-source-visual-tools-fix-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pymupdf pillow playwright >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Apply exact-source visual patch and static gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp-physics-2026-finalize-v33.py')
          s=p.read_text(encoding='utf-8')
          old="""    expected_images=set(CROPS)\n    joined=''.join((PKG/f'ege-fizika-demoversiya-T123-0{i}.txt').read_text(encoding='utf-8') for i in range(1,6))\n    present=set(re.findall(r'data-source-crop=\"([^\"]+)\"',joined))\n"""
          new="""    expected_images=set(CROPS)\n    html_values=[]\n    for obj in (d1,d2,d3):\n        for row in obj['tasks']:\n            html_values.extend([row.get('promptHtml',''),row.get('solutionHtml','')])\n    for row in d4['variants26']:\n        html_values.extend([row.get('promptHtml',''),row.get('solutionHtml','')])\n    joined=''.join(html_values)\n    present=set(re.findall(r'data-source-crop=\"([^\"]+)\"',joined))\n"""
          if old not in s: raise SystemExit('inventory gate patch target not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python tmp-physics-2026-finalize-v33.py patch
          ! grep -Rni '<svg' ege-fizika-demoversiya-v3-1-fixed/ege-fizika-demoversiya-T123-0{2,3,4,5}.txt
          test "$(find ege-fizika-demoversiya-v3-1-fixed -maxdepth 1 -name 'asset-*.svg' | wc -l)" -eq 0
      - name: Full browser acceptance gate
        shell: bash
        env:
          EVIDENCE_DIR: /tmp/physics-final-evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tmp-physics-2026-browser-gate.py')
          s=p.read_text(encoding='utf-8')
          old="    page.locator('.ephys-symbol-keyboard').first.locator('button[data-symbol=\"²\"]').click()\n"
          new="    key=page.locator('.ephys-symbol-keyboard').first.locator('button.ephys-symbol-key').first\n    if key.get_attribute('data-symbol')!='²': raise AssertionError('first physics symbol key is not superscript two')\n    key.click()\n"
          if old not in s: raise SystemExit('symbol-key test patch target not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          PKG=ege-fizika-demoversiya-v3-1-fixed
          python -m http.server 8765 --bind 127.0.0.1 --directory "$PKG" >/tmp/physics-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ege-fizika-demoversiya-PREVIEW.html >/dev/null && break; sleep 1; done
          python tmp-physics-2026-browser-gate.py http://127.0.0.1:8765/ege-fizika-demoversiya-PREVIEW.html full
          kill $SERVER 2>/dev/null || true
          trap - EXIT
      - name: Write candidate evidence and first clean-unpack regression
        shell: bash
        env:
          EVIDENCE_DIR: /tmp/physics-final-evidence
        run: |
          set -euo pipefail
          python tmp-physics-2026-finalize-v33.py accept /tmp/physics-final-evidence/browser-result.json false
          python tmp-physics-2026-finalize-v33.py manifest
          python tmp-physics-2026-finalize-v33.py zip /tmp/physics-v33-pre-freeze.zip >/tmp/pre-freeze-sha.txt
          rm -rf /tmp/physics-clean-1 && mkdir -p /tmp/physics-clean-1
          unzip -q /tmp/physics-v33-pre-freeze.zip -d /tmp/physics-clean-1
          python -m http.server 8766 --bind 127.0.0.1 --directory /tmp/physics-clean-1/ege-fizika-demoversiya-v3-1-fixed >/tmp/physics-clean1-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8766/ege-fizika-demoversiya-PREVIEW.html >/dev/null && break; sleep 1; done
          python tmp-physics-2026-browser-gate.py http://127.0.0.1:8766/ege-fizika-demoversiya-PREVIEW.html quick
          kill $SERVER 2>/dev/null || true
          trap - EXIT
      - name: Freeze V3.3 and verify final ZIP bytes
        shell: bash
        env:
          EVIDENCE_DIR: /tmp/physics-final-evidence
        run: |
          set -euo pipefail
          python tmp-physics-2026-finalize-v33.py accept /tmp/physics-final-evidence/browser-result.json true
          python tmp-physics-2026-finalize-v33.py manifest
          python tmp-physics-2026-finalize-v33.py zip /tmp/ege-fizika-demoversiya-2026-v3.3.zip >/tmp/final-zip-sha.txt
          printf 'sha256=%s\n' "$(cat /tmp/final-zip-sha.txt)" > /tmp/physics-final-evidence/FINAL-ZIP-SHA256.txt
          rm -rf /tmp/physics-clean-final && mkdir -p /tmp/physics-clean-final
          unzip -q /tmp/ege-fizika-demoversiya-2026-v3.3.zip -d /tmp/physics-clean-final
          python -m http.server 8767 --bind 127.0.0.1 --directory /tmp/physics-clean-final/ege-fizika-demoversiya-v3-1-fixed >/tmp/physics-clean-final-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8767/ege-fizika-demoversiya-PREVIEW.html >/dev/null && break; sleep 1; done
          python tmp-physics-2026-browser-gate.py http://127.0.0.1:8767/ege-fizika-demoversiya-PREVIEW.html quick
          kill $SERVER 2>/dev/null || true
          trap - EXIT
          grep -q 'TECHNICAL_REFERENCE_FROZEN=YES' ege-fizika-demoversiya-v3-1-fixed/ege-fizika-demoversiya-SOURCE-GATE.txt
          grep -q 'CLEAN_UNPACK_BROWSER=PASS' ege-fizika-demoversiya-v3-1-fixed/ege-fizika-demoversiya-SOURCE-GATE.txt
          test -f ege-fizika-demoversiya-v3-1-fixed/ACCEPTED-TECHNICAL-REFERENCE-2026-08-20.txt
      - name: Upload final evidence and clean package
        uses: actions/upload-artifact@v4
        with:
          name: physics-2026-v3.3-final
          path: |
            /tmp/physics-final-evidence
            /tmp/ege-fizika-demoversiya-2026-v3.3.zip
          if-no-files-found: error
      - name: Remove temporary audit machinery and commit accepted V3.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/physics-2026-*.yml 2>/dev/null || true
          git rm -f .physics-2026-* 2>/dev/null || true
          git rm -f tmp-physics-2026-*.py 2>/dev/null || true
          git rm -rf tmp-physics-2026-visual-audit 2>/dev/null || true
          git add -A ege-fizika-demoversiya-v3-1-fixed
          if git diff --cached --quiet; then echo 'No staged finalization changes' >&2; exit 1; fi
          git commit -m 'Accept Physics 2026 V3.3 official-source visuals and tools'
          git push origin HEAD:chatgpt/physics-2026-source-visual-tools-fix-20260819
