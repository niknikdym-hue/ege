name: Temporary freeze Russian v4.2 rules
on:
  push:
    branches: [main]
    paths:
      - tmp-freeze-russian-v42-rules.py
      - .github/workflows/tmp-freeze-russian-v42-rules.yml
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply permanent rule patches
        run: python3 tmp-freeze-russian-v42-rules.py
      - name: Install browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
          PW_CHROMIUM=$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          p=sync_playwright().start();print(p.chromium.executable_path);p.stop()
          PY
          )
          sudo ln -sf "$PW_CHROMIUM" /usr/bin/chromium
      - name: Full Russian v4.2 regression
        working-directory: ege-russkiy-demoversiya-2026-v4.2
        run: |
          node test-russian-data.js
          node test-russian-v4.js
          python3 visual-contract-audit.py
          node test-russian-task27-v4.2.js
          node test-russian-task27-reset-guard.js
          python3 test-russian-task27-browser.py
          python3 test-browser.py
          python3 - <<'PY'
          import hashlib,pathlib,re,json
          for f in ['SUBJECT-PROFILE-RUSSIAN.json','YEAR-PASSPORT-2026.json']:
              json.loads(pathlib.Path(f).read_text(encoding='utf-8'))
          manifest=pathlib.Path('MANIFEST-SHA256.txt').read_text(encoding='utf-8')
          for h,fn in re.findall(r'^([0-9a-f]{64})  (.+)$',manifest,re.M):
              got=hashlib.sha256(pathlib.Path(fn).read_bytes()).hexdigest()
              assert got==h,(fn,h,got)
          for p in sorted(pathlib.Path('.').glob('ege-russkiy-demoversiya-T123-*.txt')):
              assert p.stat().st_size < 42500,(p.name,p.stat().st_size)
          print('PASS JSON + manifest + T123-size gate')
          PY
      - name: Commit permanent rule updates
        run: |
          git config user.name "niknikdym-hue"
          git config user.email "niknikdym@gmail.com"
          git add 00-READ-FIRST-EGE-DEMOVERSII-MASTER.md demo-production-standard/SUBJECT-FEATURE-MODULES.md demo-production-standard/LESSONS-LEARNED.md
          git commit -m "Freeze Russian EGE essay review rules"
          git push origin main
      - name: Build final project ZIP
        run: zip -qr ege-russkiy-demoversiya-2026-v4.2.zip ege-russkiy-demoversiya-2026-v4.2
      - uses: actions/upload-artifact@v4
        with:
          name: ege-russkiy-demoversiya-2026-v4.2-final-freeze
          path: ege-russkiy-demoversiya-2026-v4.2.zip
          if-no-files-found: error
