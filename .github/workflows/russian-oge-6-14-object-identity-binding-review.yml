name: Russian OGE 6.14 object identity binding review

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/265-RUSSIAN-FIPI-2026-OGE-ROUTE-OVERLAY-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_subject_accounting_complete.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_packet.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_russian_semantic_acceptance_progress_launch_current.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_object_identity_binding_review.py"
      - ".github/workflows/russian-oge-6-14-object-identity-binding-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-identity-binding-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive exact 6.14 object identity twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_oge_6_14_object_identity_binding_review.py"
          python3 "$root/build_oge_6_14_object_identity_binding_review.py" --output /tmp/oge614-id-a.json > /tmp/oge614-id-a.txt
          python3 "$root/build_oge_6_14_object_identity_binding_review.py" --output /tmp/oge614-id-b.json > /tmp/oge614-id-b.txt
          cmp /tmp/oge614-id-a.json /tmp/oge614-id-b.json
          diff -u /tmp/oge614-id-a.txt /tmp/oge614-id-b.txt
          cat /tmp/oge614-id-a.txt
      - name: Verify fail-closed no-admission identity result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/oge614-id-a.json').read_text(encoding='utf-8'))
          o=d['official_object']
          dup=d['duplicate_accounting_review']
          boundary=d['acceptance_boundary']
          safety=d['safety']
          assert d['status']=='OGE_6_14_EXACT_OBJECT_IDENTITY_BOUND_NOT_ACCEPTED'
          assert o['source_id']=='FIPI-OGE-RU-2026-FINAL'
          assert o['document_id']=='OGE_COD'
          assert o['content_code']=='6.14'
          assert o['label_ru']=='Орфографический анализ'
          assert o['classification']=='EXAM_ONLY_COMPOSITE'
          assert o['admission_unit_id'].startswith('RAU-')
          assert o['requirement_id'].startswith('RSK-OGE_COD-')
          assert o['packet_group'].startswith('RUS-SEM-REVIEW-')
          assert dup['accepted_rows_with_content_code_6_14']==0
          assert dup['accepted_rows_with_same_admission_unit_or_requirement']==0
          assert dup['historical_or_current_object_already_counted'] is False
          assert dup['aggregate_delta_if_later_exact_acceptance_passes']==1
          assert boundary['semantic_admissions_now']==0
          assert boundary['object_closures_now']==0
          assert boundary['exact_component_mastery_admissions_now']==0
          assert safety['false_exact_mastery_admissions']==0
          assert safety['learner_audio_persistence']==0
          assert safety['accepted_demo_or_scorer_change'] is False
          assert safety['tilda_change'] is False
          assert safety['production_peis_write'] is False
          assert safety['provider_execution'] is False
          assert safety['public_traffic'] is False
          assert safety['real_payment_or_refund'] is False
          assert safety['real_message_delivery'] is False
          print('OGE_6_14_OBJECT_IDENTITY_UNIQUE=1')
          print('OGE_6_14_ALREADY_COUNTED=0')
          print('OGE_6_14_OBJECT_CLOSURES_NOW=0')
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          print('LEARNER_AUDIO_PERSISTENCE=0')
          print('RUSSIAN_OGE_6_14_OBJECT_IDENTITY_BINDING_GUARD=PASS')
          PY
      - name: Upload exact object identity review
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-14-object-identity-binding-review
          path: /tmp/oge614-id-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
