name: Russian OGE 6.14 gap evidence wave 002

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-08-OGE-6.14-GAP-EVIDENCE-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RUSSIAN-OGE-6.2-EXACT-CANONICAL-COMPONENT-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_reuse_first_evidence_audit_v2.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_remaining_6_2_reuse_exhaustion.py"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_oge_6_14_gap_evidence_wave_002.py"
      - "eksamio-learning-engine/russian-program/subject-admission/build_oge_6_14_reuse_first_evidence_audit_v3.py"
      - ".github/workflows/russian-oge-6-14-gap-evidence-wave-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gap-evidence-wave-002:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate final bounded original Eksamio evidence wave
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/validate_oge_6_14_gap_evidence_wave_002.py"
          python3 "$root/validate_oge_6_14_gap_evidence_wave_002.py"
      - name: Build deterministic evidence-complete v3 audit twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 -m py_compile "$root/build_oge_6_14_reuse_first_evidence_audit_v3.py"
          python3 "$root/build_oge_6_14_reuse_first_evidence_audit_v3.py" --output /tmp/oge-6-14-v3-a.json > /tmp/oge-6-14-v3-a.txt
          python3 "$root/build_oge_6_14_reuse_first_evidence_audit_v3.py" --output /tmp/oge-6-14-v3-b.json > /tmp/oge-6-14-v3-b.txt
          cmp /tmp/oge-6-14-v3-a.json /tmp/oge-6-14-v3-b.json
          diff -u /tmp/oge-6-14-v3-a.txt /tmp/oge-6-14-v3-b.txt
          cat /tmp/oge-6-14-v3-a.txt
      - name: Verify evidence-complete frontier and no object admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/oge-6-14-v3-a.json').read_text(encoding='utf-8'))
          s=d['summary']
          assert d['status']=='CENTRAL_BRAIN_OGE_6_14_COMPONENT_EVIDENCE_COMPLETE_READY_FOR_SEPARATE_OBJECT_ACCEPTANCE_NOT_ACCEPTED'
          assert len(d['exact_owner_refs'])==83
          assert len(set(d['exact_owner_refs']))==83
          assert d['missing_owner_refs']==[]
          assert s['exact_owner_frontier']==83
          assert s['owners_with_explicit_component_specific_independent_evidence']==83
          assert s['owners_with_insufficient_exact_evidence']==0
          assert s['owners_with_mixed_semantic_evidence_only']==0
          assert s['owners_with_no_independent_evidence']==0
          assert s['exact_independent_items_reused']==262
          assert s['mixed_semantic_independent_items_not_counted_as_exact']==0
          assert s['ready_without_new_materialization'] is True
          assert s['ready_for_separate_exact_object_acceptance'] is True
          assert s['materialized_new_items_this_audit']==0
          assert s['materialized_gap_items_reused_from_wave_001']==39
          assert s['materialized_gap_items_reused_from_wave_002']==48
          assert s['semantic_admissions']==0
          assert s['object_closures']==0
          assert s['false_exact_mastery_admissions']==0
          safety=d['safety']
          assert safety['accepted_demo_or_scorer_change'] is False
          assert safety['tilda_change'] is False
          assert safety['learner_audio_persistence']==0
          assert safety['production_peis_write'] is False
          assert safety['provider_execution'] is False
          assert safety['public_traffic'] is False
          assert safety['real_payment_or_refund'] is False
          assert safety['real_message_delivery'] is False
          print('OGE_6_14_EXACT_OWNER_FRONTIER=83')
          print('OGE_6_14_EVIDENCE_READY_OWNERS=83')
          print('OGE_6_14_REMAINING_EVIDENCE_GAPS=0')
          print('OGE_6_14_WAVE_002_NEW_ITEMS=48')
          print('OGE_6_14_EXACT_INDEPENDENT_ITEMS=262')
          print('READY_FOR_SEPARATE_EXACT_OBJECT_ACCEPTANCE=1')
          print('OGE_6_14_OBJECT_CLOSURES=0')
          print('FALSE_EXACT_MASTERY_ADMISSIONS=0')
          print('LEARNER_AUDIO_PERSISTENCE=0')
          print('RUSSIAN_OGE_6_14_GAP_EVIDENCE_WAVE_002_POST_AUDIT=PASS')
          PY
      - name: Upload evidence-complete v3 audit
        uses: actions/upload-artifact@v4
        with:
          name: russian-oge-6-14-gap-evidence-wave-002-post-audit
          path: /tmp/oge-6-14-v3-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Ei '(^|/)(russkiy-knigi|tilda|demos?|scor(e|er|ers|ing)?)(/|$|[-_.])'; then
            echo 'Accepted Russian demo/scorer/Tilda surfaces changed.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
