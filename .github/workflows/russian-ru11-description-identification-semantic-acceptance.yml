name: Russian RU11 description identification semantic acceptance

on:
  pull_request:
    paths:
      - "eksamio-learning-engine/russian-program/subject-admission/RU11-DESCRIPTION-IDENTIFICATION-BOUNDED-SUBJECT-SEMANTIC-ACCEPTANCE-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/RU11-DESCRIPTION-IDENTIFICATION-CONTENT-ADEQUACY-REVIEW-v0.1.json"
      - "eksamio-learning-engine/russian-program/subject-admission/validate_ru11_description_identification_bounded_subject_semantics.py"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-DESCRIPTION-IDENTIFICATION-WAVE-007-v0.1.json"
      - "eksamio-learning-engine/russian-program/production-learning-content/RU-PROG-11-TEXT-COHESION-WAVE-002-v0.1.json"
      - "eksamio-learning-engine/russian-program/RUSSIAN-FULL-SUBJECT-PROGRAM-v1.1.json"
      - "eksamio-learning-engine/273-RUSSIAN-SEMANTIC-IDENTITY-INVENTORY-v0.1.json"
      - "eksamio-learning-engine/03-RUSSIAN-SKILL-GRAPH.json"
      - ".github/workflows/russian-ru11-description-identification-semantic-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru11-description-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current PR base
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded validator
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/validate_ru11_description_identification_bounded_subject_semantics.py
      - name: Validate exact source, draft guard, reuse gap, content and mastery boundary twice
        shell: bash
        run: |
          set -euo pipefail
          root="eksamio-learning-engine/russian-program/subject-admission"
          python3 "$root/validate_ru11_description_identification_bounded_subject_semantics.py" > /tmp/ru11-description-a.txt
          python3 "$root/validate_ru11_description_identification_bounded_subject_semantics.py" > /tmp/ru11-description-b.txt
          diff -u /tmp/ru11-description-a.txt /tmp/ru11-description-b.txt
          grep -Fx 'RU11_DESCRIPTION_IDENTIFICATION_BOUNDED_SUBJECT_SEMANTIC_ACCEPTANCE=PASS' /tmp/ru11-description-a.txt
          grep -Fx 'SOURCE_CANDIDATE_REVIEW_STATUS=draft' /tmp/ru11-description-a.txt
          grep -Fx 'ACCEPTED_SEMANTIC=ru-text-description-identification' /tmp/ru11-description-a.txt
          grep -Fx 'BROADER_EXISTING_DIRECT_DESCRIPTION_CHECKS=1' /tmp/ru11-description-a.txt
          grep -Fx 'EXACT_COMPONENT_CHECKS=2' /tmp/ru11-description-a.txt
          grep -Fx 'OBJECT_CLOSURES=0/0' /tmp/ru11-description-a.txt
          grep -Fx 'FALSE_EXACT_MASTERY=0' /tmp/ru11-description-a.txt
          cat /tmp/ru11-description-a.txt
      - name: Protect accepted Russian production surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E 'russkiy-knigi|tilda|demo|scor'; then
            echo 'RU11 description acceptance changed accepted Russian production surfaces.' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
