name: Owner Control Astra Final Review

on:
  push:
    branches: [codex/owner-agent-control-page-v1-api]
    paths:
      - '.github/workflows/owner-control-astra-final-review.yml'

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  astra-final-review:
    if: ${{ github.actor == 'niknikdym-hue' && github.event.head_commit.message == 'ci: bounded Astra final review PR 193' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact bounded candidate and run free checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "niknikdym-hue"
          test "$GITHUB_REF_NAME" = "codex/owner-agent-control-page-v1-api"
          test -f eksamio-learning-engine/project-control/owner-control.html
          test -f .github/workflows/owner-agent-console-control.yml
          test ! -e .github/workflows/api-codex-owner-control-build.yml
          python3 -m unittest eksamio-learning-engine/tests/test_owner_agent_console.py
          python3 -m py_compile eksamio-learning-engine/project-control/owner_agent_console.py
          git diff --check HEAD^
          pr_json="$(gh pr view 193 --repo "$GITHUB_REPOSITORY" --json number,state,isDraft,headRefName,headRefOid,baseRefName,url)"
          python3 - "$GITHUB_SHA" "$pr_json" <<'PY'
          import json,sys
          sha=sys.argv[1]; pr=json.loads(sys.argv[2])
          assert pr['number']==193
          assert pr['state']=='OPEN'
          assert pr['isDraft'] is True
          assert pr['headRefName']=='codex/owner-agent-control-page-v1-api'
          assert pr['headRefOid']==sha,(pr['headRefOid'],sha)
          print('EXACT_PR_DRAFT=PASS')
          PY
          mkdir -p .astra-final-review
          printf '%s\n' "$pr_json" > .astra-final-review/pr.json
          git rev-parse HEAD > .astra-final-review/reviewed-sha.txt
          git diff-tree --no-commit-id --name-only -r HEAD > .astra-final-review/head-changed-paths.txt
          git status --porcelain > .astra-final-review/git-status.txt
          printf '%s\n' 'TARGETED_TESTS=PASS' 'TEMP_BOOTSTRAP_ABSENT=PASS' 'EXACT_PR_DRAFT=PASS' 'NO_CODE_EDIT_BY_REVIEW=PASS' > .astra-final-review/free-evidence.txt

      - name: Build bounded Astra request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          files=[
            'docs/project-control/EKSAMIO-OWNER-CONSOLE-REQUIREMENTS-v0.1.md',
            'eksamio-learning-engine/project-control/operational-board-v1.json',
            'eksamio-learning-engine/project-control/owner_agent_console.py',
            'eksamio-learning-engine/project-control/owner-control.html',
            '.github/workflows/owner-agent-console-control.yml',
            '.github/workflows/owner-agent-console-sync.yml',
            'eksamio-learning-engine/tests/test_owner_agent_console.py',
            'eksamio-learning-engine/results/RESULT-OWNER-AGENT-CONSOLE-REMOTE-SLICE-1.md',
            '.github/workflows/owner-control-astra-final-review.yml',
          ]
          payload={
            'task':'Final read-only acceptance review of Eksamio Owner Control PR #193. Do not propose edits unless rejecting. Decide PASS/FAIL only from exact evidence.',
            'reviewed_sha':Path('.astra-final-review/reviewed-sha.txt').read_text().strip(),
            'pr':json.loads(Path('.astra-final-review/pr.json').read_text()),
            'free_evidence':Path('.astra-final-review/free-evidence.txt').read_text().splitlines(),
            'acceptance':[
              'owner-control.html is tracked in PR #193',
              'owner-agent-console-control.yml is tracked',
              'temporary api-codex-owner-control-build.yml is absent',
              'all 115 operational-board tasks are available/filterable without a second source of truth',
              'required five buttons and six tabs are present',
              'browser HTML contains no API key or GitHub token',
              'panel does not fabricate progress; GitHub live/cache truth is labeled honestly',
              'targeted tests pass',
              'controller requires owner confirmation and start/resume are bounded; pause/stop do not affect unrelated workflows',
              'no automatic merge/deploy/Ready/production/user-data/payment/Tilda/demo mutation',
              'PR remains Draft'
            ],
            'files':{p:(root/p).read_text() for p in files},
          }
          Path('.astra-final-review/request.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2))
          print('REQUEST_SAVED=PASS')
          PY

      - name: Persist request before paid call
        uses: actions/upload-artifact@v4
        with:
          name: owner-control-astra-final-request-${{ github.sha }}
          path: .astra-final-review/
          if-no-files-found: error
          retention-days: 30

      - name: One bounded Astra final review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ASTRA_MODEL: gpt-6-astra
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          ctx=json.loads(Path('.astra-final-review/request.json').read_text())
          sha=ctx['reviewed_sha']
          instructions=(
            'You are the final acceptance reviewer for Eksamio Owner Control PR #193. '
            'Review only the supplied exact candidate and evidence. Do not rewrite code. '
            'Return exactly one JSON object with keys schema_version, decision, reviewed_sha, acceptance, invariants, evidence, reason, next_action. '
            'schema_version must be "0.1". decision must be PASS or FAIL. reviewed_sha must equal '+sha+'. '
            'acceptance must be an object with exactly eleven boolean values corresponding to the supplied acceptance list in order using keys a1 through a11. '
            'invariants must contain exactly: single_source_of_truth, no_browser_secrets, honest_progress, owner_confirmation, bounded_paid_execution, no_auto_retry, draft_only, no_merge_deploy_production; all boolean. '
            'PASS only if every acceptance and invariant value is true and the evidence supports them. '
            'A review harness file may remain in the Draft PR if it is owner-gated, single-shot by exact push message, read-only, and does not create automatic retries. No markdown.'
          )
          payload={
            'model':os.environ['OPENAI_ASTRA_MODEL'],
            'instructions':instructions,
            'input':json.dumps(ctx,ensure_ascii=False,sort_keys=True),
            'reasoning':{'effort':'high'},
            'text':{'verbosity':'low'},
            'max_output_tokens':2600,
            'store':False,
          }
          req=urllib.request.Request('https://api.openai.com/v1/responses',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['OPENAI_API_KEY'],'Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=240) as r:
              body=json.loads(r.read().decode())
          except Exception as exc:
            Path('.astra-final-review/provider-error.txt').write_text(repr(exc))
            raise
          Path('.astra-final-review/provider-response.json').write_text(json.dumps(body,ensure_ascii=False,indent=2))
          out=''.join(x.get('text','') for item in body.get('output',[]) if item.get('type')=='message' for x in item.get('content',[]) if x.get('type')=='output_text')
          review=json.loads(out)
          Path('.astra-final-review/astra-final-review.json').write_text(json.dumps(review,ensure_ascii=False,indent=2))
          assert review.get('schema_version')=='0.1',review
          assert review.get('reviewed_sha')==sha,review
          assert review.get('decision')=='PASS',review
          assert set(review.get('acceptance',{}))=={f'a{i}' for i in range(1,12)},review
          assert all(review['acceptance'].values()),review
          expected={'single_source_of_truth','no_browser_secrets','honest_progress','owner_confirmation','bounded_paid_execution','no_auto_retry','draft_only','no_merge_deploy_production'}
          assert set(review.get('invariants',{}))==expected,review
          assert all(review['invariants'].values()),review
          print('ASTRA_FINAL_REVIEW=PASS')
          PY

      - name: Persist final review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-control-astra-final-review-${{ github.sha }}
          path: .astra-final-review/
          if-no-files-found: error
          retention-days: 30

      - name: Record durable PASS in Issue 194
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          decision="$(python3 -c "import json;print(json.load(open('.astra-final-review/astra-final-review.json'))['decision'])")"
          test "$decision" = PASS
          gh issue comment 194 --repo "$GITHUB_REPOSITORY" --body "DURABLE HANDOFF UPDATE — OWNER CONTROL ASTRA FINAL REVIEW\n\nPR: #193\nReviewed exact HEAD: \`$GITHUB_SHA\`\nAstra model: \`gpt-6-astra\`\nDecision: **PASS**\nTargeted free checks: PASS.\nPaid executions in this review: exactly 1 Astra call; Codex: 0; automatic retries: 0.\nArtifacts: \`owner-control-astra-final-request-$GITHUB_SHA\` and \`owner-control-astra-final-review-$GITHUB_SHA\`.\nPR remains Draft. No merge/deploy/Ready/production/user-data/payment/Tilda/demo changes were performed."
