name: Russian RU02 EDSOO59 p187 4.1.6 exact object binding review

on:
  push:
    branches:
      - brain/sep1-russian-subject-closure
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p187_4_1_6_exact_object_binding_review.py'
      - '.github/workflows/russian-ru02-orthoepy-edsoo59-p187-4-1-6-exact-object-binding-review.yml'
  pull_request:
    branches: [main]
    paths:
      - 'eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p187_4_1_6_exact_object_binding_review.py'
      - '.github/workflows/russian-ru02-orthoepy-edsoo59-p187-4-1-6-exact-object-binding-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru02-edsoo59-p187-4-1-6-exact-object-binding-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact review
        run: python3 -m py_compile eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p187_4_1_6_exact_object_binding_review.py

      - name: Build exact review A
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p187_4_1_6_exact_object_binding_review.py --output /tmp/ru02-p187-review-a.json > /tmp/ru02-p187-review-a.txt

      - name: Build exact review B
        shell: bash
        run: |
          set -euo pipefail
          python3 eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p187_4_1_6_exact_object_binding_review.py --output /tmp/ru02-p187-review-b.json > /tmp/ru02-p187-review-b.txt

      - name: Verify deterministic exact review
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/ru02-p187-review-a.json /tmp/ru02-p187-review-b.json
          diff -u /tmp/ru02-p187-review-a.txt /tmp/ru02-p187-review-b.txt

      - name: Verify fail-closed review boundary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/ru02-p187-review-a.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/ru02-p187-review-a.json').read_text(encoding='utf-8'))
          assert data['status']=='CENTRAL_BRAIN_RU02_EDSOO59_P187_4_1_6_EXACT_OBJECT_BINDING_REVIEW_READY_FOR_SEPARATE_ACCEPTANCE_NOT_ACCEPTED'
          assert data['current_v26_exact_head_gate']=={
              'workflow':'Russian RU01 EDSOO59 P181 4.1 exact component set',
              'run_id':34543590950,
              'head_sha':'4f43c838e83639827a040f1d8a8d75048e19abf2',
              'conclusion':'SUCCESS',
              'normalized_sha256':'2b2ac9e07a98ac6b988e26bacb5b6e1a22394233c4f83a123354f3dcbd9ec402',
          }
          target=data['selected_object']
          assert target['admission_unit_id']=='RAU-da83bb720dea792b3afb'
          assert target['requirement_id']=='RSK-EDSOO59-4-1-6-P187'
          assert target['source_locator']=='EDSOO-RU-5-9-2025/EDSOO59 p.187 4.1.6'
          assert target['normalized_meaning']=='Применять нормативное произношение и ударение.'
          assert target['modules']==['RU-PROG-02']
          assert target['routes']==['school']
          reuse=data['reuse_first_owner_resolution']
          assert reuse['resolution']=='EXACT_CURRENT_BOUNDED_RU02_COMPONENT_OWNERS_EXIST'
          assert reuse['canonical_component_refs']==[
              'ru-orthoepy-normative-pronunciation-selection',
              'ru-orthoepy-normative-stress-selection',
          ]
          assert reuse['independent_evidence_items']==9
          assert reuse['missing_source_components']==[]
          assert reuse['overlapping_component_boundaries']==[]
          sibling=data['sibling_reuse_boundary']
          assert sibling['prior_accepted_sibling_admission_unit_id']=='RAU-a8f2ad0b357c9e369c51'
          assert sibling['prior_sibling_acceptance_auto_closes_target'] is False
          assert sibling['separate_exact_object_acceptance_required'] is True
          readiness=data['acceptance_readiness']
          assert readiness['target_still_in_current_v26_remainder'] is True
          assert readiness['object_accepted_by_this_review'] is False
          policy=data['policy']
          assert policy['review_is_acceptance'] is False
          assert policy['shared_sibling_evidence_can_auto_close_target'] is False
          assert policy['title_route_task_keyword_fuzzy_or_embedding_inference_allowed'] is False
          assert policy['registered_user_identity_required_for_future_canonical_learner_evidence'] is True
          assert policy['anonymous_or_device_only_canonical_progress_allowed'] is False
          summary=data['summary']
          assert summary['semantic_admissions']==0
          assert summary['object_level_admission_units_closed']==0
          assert summary['object_level_requirements_closed']==0
          assert summary['exact_mastery_admissions']==0
          assert summary['false_exact_mastery_admissions']==0
          assert summary['current_subject_review_units_remaining']==1273
          assert summary['current_subject_review_requirements_remaining']==1348
          print('RU02_EDSOO59_P187_EXACT_REVIEW_BOUNDARY=PASS')
          PY

      - name: Protect public and production surfaces in bounded wave
        shell: bash
        run: |
          set -euo pipefail
          wave_base='4f43c838e83639827a040f1d8a8d75048e19abf2'
          git merge-base --is-ancestor "$wave_base" HEAD
          recent=$(git diff --name-only "$wave_base"..HEAD)
          allowed=$(cat <<'EOF'
          .github/workflows/russian-ru02-orthoepy-edsoo59-p187-4-1-6-exact-object-binding-review.yml
          eksamio-learning-engine/russian-program/subject-admission/build_ru02_orthoepy_edsoo59_p187_4_1_6_exact_object_binding_review.py
          EOF
          )
          unexpected=$(comm -23 <(printf '%s\n' "$recent" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed '/^$/d' | sort -u))
          if [[ -n "$unexpected" ]]; then
            echo 'RU02 p187 review wave touched files outside exact bounded allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$recent" | grep -E 'russkiy-knigi|(^|/)tilda|demo|scor'; then
            echo 'RU02 p187 review wave touched a protected public/production surface.' >&2
            exit 1
          fi

      - name: Diff hygiene for exact bounded wave
        run: git diff --check 4f43c838e83639827a040f1d8a8d75048e19abf2..HEAD

      - name: Upload exact review evidence
        uses: actions/upload-artifact@v4
        with:
          name: russian-ru02-edsoo59-p187-4-1-6-exact-object-binding-review
          path: |
            /tmp/ru02-p187-review-a.json
            /tmp/ru02-p187-review-a.txt
