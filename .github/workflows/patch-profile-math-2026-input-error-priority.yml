name: Patch Profile Math 2026 Input Error Priority
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-profile-math-2026-input-error-priority.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch error-priority order and retrigger full release
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('profile-math-2026-build/build_profile_2026.py')
          s=p.read_text(encoding='utf-8')
          old="if(/\\s/.test(s))return{valid:false,reason:'space',value:s};if(s.includes('+'))return{valid:false,reason:'plus',value:s};if(s.includes('%'))return{valid:false,reason:'percent',value:s};if(/[A-Za-zА-Яа-яЁё°²³]/.test(s))return{valid:false,reason:'unit',value:s};if(s.includes('/'))return{valid:false,reason:'fraction',value:s};"
          new="if(s.includes('%'))return{valid:false,reason:'percent',value:s};if(/[A-Za-zА-Яа-яЁё°²³]/.test(s))return{valid:false,reason:'unit',value:s};if(s.includes('/'))return{valid:false,reason:'fraction',value:s};if(s.includes('+'))return{valid:false,reason:'plus',value:s};if(/\\s/.test(s))return{valid:false,reason:'space',value:s};"
          assert old in s,'validation sequence not found'
          p.write_text(s.replace(old,new),encoding='utf-8')
          wf=Path('.github/workflows/build-profile-math-2026-v1-0.yml')
          t=wf.read_text(encoding='utf-8')
          if '# retry-r2' not in t:t+='\n# retry-r2\n'
          wf.write_text(t,encoding='utf-8')
          Path('.github/workflows/patch-profile-math-2026-input-error-priority.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix profile math 2026 input feedback priority'
          git pull --rebase origin main
          git push origin main
