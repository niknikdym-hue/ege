name: FIPI 2026 thematic source authority probe

on:
  pull_request:
    paths:
      - 'eksamio-learning-engine/peis-integration-reference/probe_fipi_2026_thematic_source_authority.py'
      - 'eksamio-learning-engine/peis-integration-reference/FIPI-2026-THEMATIC-SOURCE-AUTHORITY-v0.1.json'
      - '.github/workflows/fipi-2026-thematic-source-authority-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Probe official FIPI 2026 thematic sources
        id: probe
        shell: bash
        run: |
          set +e
          python eksamio-learning-engine/peis-integration-reference/probe_fipi_2026_thematic_source_authority.py > fipi-2026-thematic-source-authority-probe.json 2> fipi-2026-thematic-source-authority-probe.stderr.txt
          code=$?
          echo "$code" > fipi-2026-thematic-source-authority-probe.exitcode.txt
          if [ "$code" -ne 0 ]; then
            cat fipi-2026-thematic-source-authority-probe.stderr.txt
            exit "$code"
          fi
          python - <<'PY'
          import json
          observed=json.load(open('fipi-2026-thematic-source-authority-probe.json', encoding='utf-8'))
          pinned=json.load(open('eksamio-learning-engine/peis-integration-reference/FIPI-2026-THEMATIC-SOURCE-AUTHORITY-v0.1.json', encoding='utf-8'))
          assert observed == pinned, 'official FIPI 2026 thematic source authority drifted from pinned exact snapshot'
          assert observed['dictionary_words']['total'] == 308
          assert observed['phraseology']['total'] == 285
          assert observed['paronyms']['official_group_count'] == 144
          assert observed['paronyms']['live_exam_bank_row_count'] == 30
          assert observed['orthoepy']['scope_markers_present'] is True
          assert observed['semantic_admissions'] == 0
          assert observed['object_closures'] == 0
          assert observed['mastery_admissions'] == 0
          assert observed['false_exact_mastery'] == 0
          assert observed['registered_user_identity_required_for_future_canonical_evidence'] is True
          print('FIPI 2026 thematic source authority exact-drift gate PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fipi-2026-thematic-source-authority-probe
          path: |
            fipi-2026-thematic-source-authority-probe.json
            fipi-2026-thematic-source-authority-probe.stderr.txt
            fipi-2026-thematic-source-authority-probe.exitcode.txt
          if-no-files-found: warn
