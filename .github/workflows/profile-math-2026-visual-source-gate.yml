name: Profile Math 2026 Visual Source Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-math-2026-visual-source-gate.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: pip install pymupdf pillow
      - name: Render printed pages and dump coordinates
        run: |
          python - <<'PY'
          import fitz, json, os
          from pathlib import Path
          src=Path('matematika-source-2026/original/МА-11 ЕГЭ 2026 ДЕМО_профильный.pdf')
          out=Path('/tmp/profile-source-gate'); out.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(src)
          manifest=[]
          # physical page 2 -> printed pages 3/4, etc. Render printed pages 3-38.
          for physical_idx in range(1,len(doc)):
              page=doc[physical_idx]
              rect=page.rect
              mid=rect.x0+rect.width/2
              for half_idx,(x0,x1,half) in enumerate([(rect.x0,mid,'left'),(mid,rect.x1,'right')]):
                  printed=physical_idx*2+half_idx+1
                  clip=fitz.Rect(x0,rect.y0,x1,rect.y1)
                  pix=page.get_pixmap(matrix=fitz.Matrix(2,2),clip=clip,alpha=False)
                  png=out/f'page-{printed:02d}.png'; pix.save(png)
                  blocks=[]
                  for b in page.get_text('blocks',clip=clip):
                      bx0,by0,bx1,by1,text,*rest=b
                      # coordinates relative to printed half
                      blocks.append({'x0':round(bx0-x0,2),'y0':round(by0,2),'x1':round(bx1-x0,2),'y1':round(by1,2),'text':text.strip()})
                  blocks.sort(key=lambda z:(z['y0'],z['x0']))
                  (out/f'page-{printed:02d}-blocks.json').write_text(json.dumps(blocks,ensure_ascii=False,indent=2),encoding='utf-8')
                  manifest.append({'printed_page':printed,'physical_pdf_page':physical_idx+1,'half':half,'width':clip.width,'height':clip.height,'blocks':len(blocks)})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Make contact sheets
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          src=Path('/tmp/profile-source-gate')
          for start,end,name in [(3,14,'part1'),(15,18,'part2-conditions'),(19,38,'solutions')]:
              imgs=[]
              for n in range(start,end+1):
                  p=src/f'page-{n:02d}.png'
                  if p.exists():
                      im=Image.open(p).convert('RGB'); im.thumbnail((500,720)); imgs.append((n,im.copy()))
              cols=4; cellw=520; cellh=760; rows=(len(imgs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*cellw,rows*cellh),'white'); d=ImageDraw.Draw(sheet)
              for i,(n,im) in enumerate(imgs):
                  x=(i%cols)*cellw; y=(i//cols)*cellh
                  d.text((x+8,y+8),f'printed page {n}',fill='black'); sheet.paste(im,(x+8,y+32))
              sheet.save(src/f'contact-{name}.jpg',quality=88)
          PY
      - name: Record run id
        run: |
          echo "${{ github.run_id }}" > profile-math-2026-visual-source-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-math-2026-visual-source-run.txt
          git commit -m 'Record profile math 2026 visual source run id'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: profile-math-2026-visual-source-gate
          path: /tmp/profile-source-gate
          retention-days: 7
