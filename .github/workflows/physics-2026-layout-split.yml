name: physics-2026-layout-split
on:
  push:
    branches:
      - chatgpt/physics-2026-source-visual-tools-fix-20260819
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/physics-2026-source-visual-tools-fix-20260819
          fetch-depth: 0
      - name: Guard
        id: gate
        shell: bash
        run: |
          if [ -f .physics-2026-layout-split-trigger ] && grep -qx 'run=yes' .physics-2026-layout-split-trigger; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Split official imposed PDF into logical source pages
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pymupdf pillow >/dev/null
          python - <<'PY'
          from pathlib import Path
          import fitz,re,json,shutil
          from PIL import Image
          from io import BytesIO
          pdf=Path('ege-fizika-demoversiya-v3-1-fixed/source/ege-2026-fizika-demoversiya.pdf')
          out=Path('tmp-physics-2026-visual-audit/layout-pages'); shutil.rmtree(out,ignore_errors=True); out.mkdir(parents=True)
          doc=fitz.open(pdf); assert len(doc)==21
          text_parts=[]; meta=[]; fallback=1
          for physical,page in enumerate(doc,1):
              rot=page.rotation
              page.set_rotation(0)
              r=page.rect
              assert r.height>r.width,(physical,r)
              halves=[fitz.Rect(r.x0,r.y0,r.x1,r.y0+r.height/2),fitz.Rect(r.x0,r.y0+r.height/2,r.x1,r.y1)]
              for slot,clip in enumerate(halves,1):
                  text=page.get_text('text',clip=clip).replace('\x00','').strip()
                  m=re.findall(r'\b(\d+)\s*/\s*42\b',text)
                  logical=int(m[-1]) if m else fallback
                  fallback=max(fallback,logical+1)
                  pix=page.get_pixmap(matrix=fitz.Matrix(2,2),clip=clip,alpha=False)
                  im=Image.open(BytesIO(pix.tobytes('png'))).convert('RGB').rotate(-90,expand=True)
                  name=f'logical-{logical:02d}-p{physical:02d}s{slot}.webp'; im.save(out/name,'WEBP',quality=90,method=6)
                  words=page.get_text('words',clip=clip)
                  drawings=[]
                  for d in page.get_drawings():
                      dr=d.get('rect')
                      if not dr or not dr.intersects(clip): continue
                      inter=dr & clip
                      # exclude the imposed-page border rectangle
                      if inter.width>clip.width*.95 and inter.height>clip.height*.95: continue
                      drawings.append([round(inter.x0-clip.x0,2),round(inter.y0-clip.y0,2),round(inter.x1-clip.x0,2),round(inter.y1-clip.y0,2)])
                  meta.append({'logical_page':logical,'physical_page':physical,'slot':slot,'clip_unrotated':[round(clip.x0,2),round(clip.y0,2),round(clip.x1,2),round(clip.y1,2)],'render':'layout-pages/'+name,'drawing_rects':drawings,'text_length':len(text)})
                  text_parts.append(f'===== LOGICAL PAGE {logical} | physical {physical} slot {slot} =====\n{text}\n')
              page.set_rotation(rot)
          Path('tmp-physics-2026-visual-audit/OFFICIAL-LAYOUT-TEXT.txt').write_text('\n'.join(text_parts),encoding='utf-8')
          Path('tmp-physics-2026-visual-audit/logical-pages.json').write_text(json.dumps({'authority':'exact byte-locked FIPI 2026 demo PDF','temporary':True,'pages':sorted(meta,key=lambda x:x['logical_page'])},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit logical-page audit map
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'run=no' > .physics-2026-layout-split-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-physics-2026-visual-audit/OFFICIAL-LAYOUT-TEXT.txt tmp-physics-2026-visual-audit/logical-pages.json tmp-physics-2026-visual-audit/layout-pages .physics-2026-layout-split-trigger
          git commit -m 'Map Physics 2026 logical source pages'
          git push origin HEAD:chatgpt/physics-2026-source-visual-tools-fix-20260819
