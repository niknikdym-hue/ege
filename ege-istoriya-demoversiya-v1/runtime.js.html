<script>window.EKSAMIO_HISTORY_EXAM=Object.assign({},window.EKSAMIO_HISTORY_EXAM_META,{tasks:window.EKSAMIO_HISTORY_TASKS||[]});</script>

<script>
(function(){'use strict';
const root=document.getElementById('eksamio-history-demo');if(!root)return;
const exam=window.EKSAMIO_HISTORY_EXAM;if(!exam)return;
const assets={};Object.keys(window.EKSAMIO_HISTORY_ASSET_CHUNKS||{}).forEach(k=>assets[k]='data:image/webp;base64,'+window.EKSAMIO_HISTORY_ASSET_CHUNKS[k].join(''));
const $=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];
const KEY=exam.storage_key,DURATION=exam.duration_minutes*60*1000;
const blank=()=>({started:false,finished:false,current:1,startedAt:null,endsAt:null,answers:{},flags:[],selfScores:{},finishedAt:null,autoScore:null});
let state=blank(),timerId=null;
const safe={get(){try{const s=window.__EH_STORAGE||localStorage;return s.getItem(KEY)}catch(e){return null}},set(v){try{const s=window.__EH_STORAGE||localStorage;s.setItem(KEY,v);return true}catch(e){return false}},remove(){try{const s=window.__EH_STORAGE||localStorage;s.removeItem(KEY)}catch(e){}}};
function load(){const raw=safe.get();if(!raw)return;try{const x=JSON.parse(raw);if(x&&typeof x==='object')state=Object.assign(blank(),x)}catch(e){state=blank()}}
function save(){safe.set(JSON.stringify(state));const el=$('#eh-save');if(el){el.textContent='Сохранено';clearTimeout(save._t);save._t=setTimeout(()=>el.textContent='Ответы сохраняются',1200)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normText(v){return String(v??'').toLowerCase().replace(/ё/g,'е').replace(/[.,;:!?"«»()]/g,' ').replace(/\s+/g,' ').trim()}
function task(n){return exam.tasks.find(t=>t.number===Number(n))}
function isMatching(t){return t&&t.interaction&&t.interaction.type==='matching_selects'}
function isAnswered(n){const t=task(n),v=String(state.answers[n]??'');if(isMatching(t))return new RegExp('^[1-9]{'+t.interaction.labels.length+'}$').test(v);return v.trim()!==''}
function scoreShort(t,value){const v=String(value??'').trim(),a=t.answer.canonical,typ=t.answer.type;if(!v)return 0;
 if(typ==='text_exact'||typ==='text_alternatives'){const nv=normText(v),alts=(t.answer.alternatives||[a]).map(normText);return alts.includes(nv)?t.max_score:0}
 if(!/^\d+$/.test(v))return 0;
 if(typ==='exact')return v===a?t.max_score:0;
 if(typ==='position_partial'){if(v.length>a.length)return 0;if(v.length!==a.length)return 0;let wrong=0;for(let i=0;i<a.length;i++)if(v[i]!==a[i])wrong++;return wrong===0?2:wrong===1?1:0}
 if(typ==='position_partial_3'){if(v.length>a.length)return 0;if(v.length!==a.length)return 0;let wrong=0;for(let i=0;i<a.length;i++)if(v[i]!==a[i])wrong++;return wrong===0?3:wrong===1?2:wrong<=3?1:0}
 if(typ==='unordered_partial'){const sv=[...v],sa=[...a];if(new Set(sv).size!==sv.length)return 0;const common=sv.filter(x=>sa.includes(x)).length;const missing=sa.length-common,extra=sv.length-common;if(missing===0&&extra===0)return 2;if(v.length===a.length&&common===a.length-1)return 1;if(v.length===a.length-1&&common===a.length-1)return 1;if(v.length===a.length+1&&common===a.length)return 1;return 0}
 return 0}
function autoTotal(){return exam.tasks.filter(t=>t.kind==='short').reduce((s,t)=>s+scoreShort(t,state.answers[t.number]),0)}
function selfTotal(){return exam.tasks.filter(t=>t.kind==='extended').reduce((s,t)=>s+(Number(state.selfScores[t.number])||0),0)}
function setAssets(scope){scope.querySelectorAll('[data-eh-asset]').forEach(img=>{const key=img.dataset.ehAsset;if(assets[key])img.src=assets[key]})}
function start(){state=blank();state.started=true;state.startedAt=Date.now();state.endsAt=Date.now()+DURATION;save();showExam();render();startTimer()}
function resume(){load();if(state.finished)renderResults();else if(state.started){showExam();render();startTimer()}else start()}
function showExam(){$('#eh-start').classList.add('eh-hidden');$('#eh-results').classList.add('eh-hidden');$('#eh-exam').classList.remove('eh-hidden')}
function showStart(){$('#eh-start').classList.remove('eh-hidden');$('#eh-exam').classList.add('eh-hidden');$('#eh-results').classList.add('eh-hidden')}
function startTimer(){clearInterval(timerId);tick();timerId=setInterval(tick,1000)}
function tick(){if(!state.started||state.finished)return;const left=Math.max(0,state.endsAt-Date.now()),h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);$('#eh-timer').textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');if(left<=0)finish(true)}
function renderNav(){const nav=$('#eh-nav');nav.innerHTML='';for(let n=1;n<=exam.task_count;n++){const b=document.createElement('button');b.type='button';b.className='eh-nav-btn';b.textContent=n;if(isAnswered(n))b.classList.add('is-answered');if(state.flags.includes(n))b.classList.add('is-flagged');if(state.current===n)b.classList.add('is-current');b.onclick=()=>{state.current=n;save();render();window.scrollTo({top:0,behavior:'smooth'})};nav.appendChild(b)}}
function matchingField(t,val){const m=t.interaction,raw=String(val||'').padEnd(m.labels.length,'-').slice(0,m.labels.length);const options=Array.from({length:m.option_count},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');const rows=m.labels.map((label,i)=>{const selected=/^[1-9]$/.test(raw[i])?raw[i]:'';return `<label class="eh-match-row"><span class="eh-match-letter">${esc(label)}</span><span class="eh-match-select-wrap"><span class="eh-visually-hidden">Позиция ${esc(label)}: выберите номер ${esc(m.option_noun||'варианта')}</span><select class="eh-match-select" data-index="${i}" aria-label="Позиция ${esc(label)}: выберите номер ${esc(m.option_noun||'варианта')}"><option value="">Не выбрано</option>${options}</select></span></label>`}).join('');const code=raw.replace(/-/g,'—');return `<div class="eh-answer eh-match-answer"><div class="eh-label">Установите соответствия</div><div class="eh-match-grid">${rows}</div><div class="eh-match-code"><span>Ответ для бланка</span><output id="eh-match-output" aria-live="polite">${esc(code)}</output></div><div class="eh-hint">${esc(t.input_hint||'')}</div></div>`}
function answerField(t,val){if(isMatching(t))return matchingField(t,val);if(t.kind==='short')return `<div class="eh-answer"><label class="eh-label" for="eh-answer">Ответ</label><input id="eh-answer" class="eh-input" autocomplete="off" value="${esc(val)}"><div class="eh-hint">${esc(t.input_hint||'')}</div></div>`;return `<div class="eh-answer"><label class="eh-label" for="eh-answer">Развёрнутый ответ</label><textarea id="eh-answer" class="eh-textarea" placeholder="Запишите ответ так, как записывали бы его в бланке № 2.">${esc(val)}</textarea><div class="eh-hint">Критерии и учебная самооценка откроются только после завершения попытки.</div></div>`}
function bindAnswer(t,val){if(isMatching(t)){const m=t.interaction,raw=String(val||'').padEnd(m.labels.length,'-').slice(0,m.labels.length).split('');$$('.eh-match-select').forEach((select,i)=>{if(/^[1-9]$/.test(raw[i]))select.value=raw[i];select.addEventListener('change',()=>{const chars=$$('.eh-match-select').map(s=>s.value||'-');state.answers[t.number]=chars.join('');save();renderNav();$('#eh-match-output').textContent=chars.join('').replace(/-/g,'—')})});return}const inp=$('#eh-answer');inp.addEventListener('input',e=>{state.answers[t.number]=e.target.value;if(!e.target.value.trim())delete state.selfScores[t.number];save();renderNav()})}
function render(){if(state.finished){renderResults();return}const t=task(state.current);$('#eh-progress').textContent=`Задание ${t.number} из ${exam.task_count}`;$('#eh-part').textContent=t.kind==='short'?`Часть 1 · максимум ${t.max_score} ${t.max_score===1?'балл':'балла'}`:`Часть 2 · максимум ${t.max_score} баллов · проверяет эксперт`;renderNav();const val=state.answers[t.number]||'';const field=answerField(t,val);
 $('#eh-question').innerHTML=`<div class="eh-qhead"><div class="eh-qnum">Задание ${t.number}</div><div class="eh-qmeta">Демоверсия ФИПИ 2026<br>печатная страница ${t.source_page||'—'}</div></div><div class="eh-prompt">${t.prompt_html}</div>${field}<div class="eh-qactions"><div class="eh-action-group"><button class="eh-btn" id="eh-prev" ${t.number===1?'disabled':''}>Предыдущее</button><button class="eh-btn eh-btn-primary" id="eh-next" ${t.number===exam.task_count?'disabled':''}>Следующее</button></div><div class="eh-action-group"><button class="eh-btn" id="eh-flag">${state.flags.includes(t.number)?'Снять отметку':'Отметить для возврата'}</button><button class="eh-btn eh-btn-danger" id="eh-clear">Сбросить ответ</button></div></div>`;
 setAssets($('#eh-question'));bindAnswer(t,val);$('#eh-prev').onclick=()=>go(-1);$('#eh-next').onclick=()=>go(1);$('#eh-flag').onclick=toggleFlag;$('#eh-clear').onclick=()=>{delete state.answers[t.number];delete state.selfScores[t.number];save();render()};}
function go(d){state.current=Math.max(1,Math.min(exam.task_count,state.current+d));save();render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleFlag(){const n=state.current;state.flags=state.flags.includes(n)?state.flags.filter(x=>x!==n):[...state.flags,n];save();render()}
function openFinish(){const unanswered=exam.tasks.filter(t=>!isAnswered(t.number)).length;$('#eh-modal-title').textContent='Завершить попытку?';$('#eh-modal-text').textContent=unanswered?`Без ответа осталось заданий: ${unanswered}. После завершения изменить ответы нельзя.`:'Все задания имеют ответы. После завершения изменить их нельзя.';$('#eh-modal').classList.remove('eh-hidden')}
function closeModal(){$('#eh-modal').classList.add('eh-hidden')}
function finish(byTimer){clearInterval(timerId);state.finished=true;state.finishedAt=Date.now();state.autoScore=autoTotal();save();closeModal();renderResults();if(byTimer)alert('Время истекло. Попытка завершена автоматически.')}
function resetAll(){if(!confirm('Удалить сохранённую попытку и начать заново?'))return;safe.remove();state=blank();clearInterval(timerId);showStart();updateResume()}
function updateResume(){load();const b=$('#eh-resume-btn');b.style.display=state.started?'inline-flex':'none';b.textContent=state.finished?'Открыть результаты':'Продолжить сохранённую попытку'}
function answerLabel(t){const v=String(state.answers[t.number]??'').trim();if(!v)return 'Ответ не дан';if(isMatching(t)&&v.includes('-'))return v.replace(/-/g,'—')+' (не завершено)';return v}
function renderResults(){clearInterval(timerId);$('#eh-start').classList.add('eh-hidden');$('#eh-exam').classList.add('eh-hidden');const box=$('#eh-results');box.classList.remove('eh-hidden');const auto=Number.isFinite(state.autoScore)?state.autoScore:autoTotal(),self=selfTotal();const shortItems=exam.tasks.filter(t=>t.kind==='short').map(t=>{const s=scoreShort(t,state.answers[t.number]),statusClass=s===t.max_score?'eh-result-ok':s>0?'eh-result-partial':'eh-result-bad';return `<details class="eh-result-task"><summary><span>Задание ${t.number}</span><span class="${statusClass}">${s} / ${t.max_score}</span></summary><div class="eh-result-task-body"><p><strong>Ваш ответ:</strong> ${esc(answerLabel(t))}</p><p><strong>Эталон:</strong> ${esc(t.answer.canonical)}</p><p class="eh-self-warning">Баллы рассчитаны автоматически по правилам частичного оценивания ФИПИ.</p></div></details>`}).join('');
 const extItems=exam.tasks.filter(t=>t.kind==='extended').map(t=>{const ans=String(state.answers[t.number]??'').trim(),disabled=!ans;const selected=Number(state.selfScores[t.number])||0;const criteria=t.criteria_html?`<div class="eh-official-criteria">${t.criteria_html}</div>`:'';const rub=t.rubric.map(r=>`<label><input type="radio" name="eh-self-${t.number}" value="${r.score}" ${selected===r.score?'checked':''}><span><strong>${r.score} из ${t.max_score}</strong> — ${esc(r.text)}</span></label>`).join('');return `<details class="eh-result-task"><summary><span>Задание ${t.number}</span><span>${disabled?'нет ответа':`самооценка ${selected} / ${t.max_score}`}</span></summary><div class="eh-result-task-body"><div class="eh-answer-review">${esc(ans||'Ответ не дан')}</div><p><strong>Официальные критерии ФИПИ</strong></p>${criteria}<p class="eh-self-warning">После чтения полного критерия выберите балл для учебной самооценки.</p><div class="eh-rubric ${disabled?'is-disabled':''}" data-task="${t.number}">${rub}</div><p class="eh-self-warning">${disabled?'Пустой ответ не может получить баллы.':'Выберите уровень, которому соответствует ответ. Это учебная самооценка, а не официальный балл эксперта.'}</p></div></details>`}).join('');
 box.innerHTML=`<h2>Результаты попытки</h2><div class="eh-score-grid"><div class="eh-score-card"><small>Автоматически проверено</small><strong>${auto} / ${exam.short_max}</strong><small>задания 1–12</small></div><div class="eh-score-card official"><small>Официальный итог до экспертной проверки</small><strong>— / ${exam.max_primary}</strong><small>задания 13–21 проверяет эксперт</small></div><div class="eh-score-card self"><small>Учебная самооценка второй части</small><strong id="eh-self-total">${self} / ${exam.extended_max}</strong><small>не является официальным результатом</small></div></div><div class="eh-breakdown"><h3>Часть 1</h3>${shortItems}<h3 style="margin-top:26px">Часть 2: критерии и самооценка</h3>${extItems}</div><div class="eh-result-footer"><div class="eh-notice">Официальный первичный балл за всю работу может быть определён только после проверки развёрнутых ответов предметной комиссией.</div><div class="eh-actions"><button class="eh-btn eh-btn-primary" id="eh-new-attempt">Начать новую попытку</button><button class="eh-btn" id="eh-print">Распечатать результаты</button></div></div>`;
 $$('.eh-rubric input').forEach(i=>i.addEventListener('change',e=>{const n=Number(e.target.closest('.eh-rubric').dataset.task);if(!String(state.answers[n]||'').trim())return;state.selfScores[n]=Number(e.target.value);save();$('#eh-self-total').textContent=`${selfTotal()} / ${exam.extended_max}`;renderResults()}));$('#eh-new-attempt').onclick=resetAll;$('#eh-print').onclick=()=>window.print();window.scrollTo({top:0,behavior:'smooth'});}
load();updateResume();$('#eh-start-btn').onclick=start;$('#eh-resume-btn').onclick=resume;$('#eh-finish-side').onclick=openFinish;$('#eh-modal-cancel').onclick=closeModal;$('#eh-modal-confirm').onclick=()=>finish(false);$('#eh-reset').onclick=resetAll;$('#eh-modal').addEventListener('click',e=>{if(e.target===$('#eh-modal'))closeModal()});if(state.finished)renderResults();
window.EKSAMIO_HISTORY_TEST={scoreShort,normText,exam};
})();
</script>
