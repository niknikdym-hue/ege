<section id="rex-trainer" class="rex-app" aria-labelledby="rex-title">
  <div class="rex-shell">
    <div class="rex-boot" data-rex-screen="boot">
      <p class="rex-eyebrow">Русский язык · тренажёр</p>
      <h1 id="rex-title">Тренажёр исключений</h1>
      <p class="rex-lead">Загружаем проверенные задания…</p>
    </div>
  </div>
  <div class="rex-live" aria-live="polite" aria-atomic="true"></div>
  <dialog class="rex-dialog" data-rex-dialog aria-labelledby="rex-dialog-title">
    <form method="dialog" class="rex-dialog-card">
      <div class="rex-dialog-head">
        <h2 id="rex-dialog-title">Правило и пример</h2>
        <button class="rex-icon-button" value="close" aria-label="Закрыть">×</button>
      </div>
      <div class="rex-dialog-body" data-rex-dialog-body></div>
      <button class="rex-button rex-button-secondary" value="close">Закрыть</button>
    </form>
  </dialog>
</section>
