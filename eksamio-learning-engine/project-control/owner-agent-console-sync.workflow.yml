name: owner-agent-console-sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - 'eksamio-learning-engine/project-control/**'
      - 'eksamio-learning-engine/00B-PROJECT-PRIORITIES-CURRENT.md'
      - 'docs/project-control/**'
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python eksamio-learning-engine/project-control/owner_agent_console.py sync --board eksamio-learning-engine/project-control/operational-board-v1.json --repository niknikdym-hue/ege --issue-title 'Eksamio — Owner Control'
