name: owner-agent-console-sync
on:
  workflow_dispatch:
  repository_dispatch:
    types: [control-plan]
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python eksamio-learning-engine/project-control/owner_agent_console.py sync --board eksamio-learning-engine/project-control/operational-board-v1.json --repository niknikdym-hue/ege --issue-title 'Eksamio — Owner Control'
